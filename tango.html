位を取得しているでしょう。",[[26,32]],"D"],["delay","We should have allowed for a delay at the airport.","空港での遅れを、見込んでおくべきでした。",[[29,34]],"D"],["delete","The message seems to have been deleted by mistake.","そのメッセージは、誤って削除されたようです。",[[31,38]],"D"],["delicate","You should handle these delicate glasses with care.","この繊細なグラスは、丁寧に扱うべきです。",[[24,32]],"D"],["delight","To our delight, the missing cat had been found.","うれしいことに、行方不明だった猫が見つかっていました。",[[7,14]],"D"],["deliver","I'll have the flowers delivered before she gets home.","彼女が帰宅する前に、花を届けてもらいます。",[[22,31]],"D"],["demand","The workers demanded that their wages should be paid.","労働者たちは、賃金を支払うよう要求しました。",[[12,20]],"D"],["demonstrate","Would you please demonstrate how to use this machine?","この機械の使い方を、実演してもらえますか。",[[17,28]],"D"],["deny","He denied taking the money from my desk.","彼は、私の机のお金を取ったことを否定しました。",[[3,9]],"D"],["department","Would you please put me through to the sales department?","営業部につないでいただけますか。",[[45,55]],"D"],["departure","Our departure has been put off until tomorrow.","私たちの出発は、明日まで延期されました。",[[4,13]],"D"],["depend","We should depend less on cars for short journeys.","近くへ行くときは、車に頼りすぎないほうがよいでしょう。",[[10,16]],"D"],["deposit","The deposit should have been returned when we left.","退去時に、敷金は返してもらえるはずでした。",[[4,11]],"D"],["deprive","Nobody should be deprived of the chance to learn.","誰も、学ぶ機会を奪われるべきではありません。",[[17,25]],"D"],["depth","I'd never realized the depth of her knowledge before.","それまで、彼女の知識の深さに気付いていませんでした。",[[23,28]],"D"],["derive","Its name is believed to have been derived from Latin.","その名前は、ラテン語に由来すると考えられています。",[[34,41]],"D"],["describe","Would you please describe the bag that you lost?","なくしたかばんがどのようなものか、説明できますか。",[[17,25]],"D"],["deserve","She deserves to have her hard work properly recognized.","彼女の努力は、きちんと評価されてしかるべきです。",[[4,12]],"D"],["design","I prefer a less complicated design than this one.","これより、もっと単純なデザインのほうが好きです。",[[28,34]],"D"],["desire","His desire to help wasn't always understood by others.","助けたいという彼の気持ちは、いつも理解されたわけではありません。",[[4,10]],"D"],["despite","Despite the rain, we had already decided to go.","雨にもかかわらず、私たちはすでに出かけると決めていました。",[[0,7]],"D"],["destination","Our destination, which lay beyond the mountains, seemed distant.","山の向こうにある目的地は、遠く感じられました。",[[4,15]],"D"],["destroy","The storm might have destroyed the old wooden bridge.","嵐で、古い木の橋が壊れたのかもしれません。",[[21,30]],"D"],["detail","Would you please explain that last detail once more?","最後の細かい点を、もう一度説明してもらえますか。",[[35,41]],"D"],["detect","The fault appears to have been detected in time.","不具合は、手遅れになる前に発見されたようです。",[[31,39]],"D"],["determine","The cause is being determined through a series of tests.","一連の検査を通じて、原因を究明しています。",[[19,29]],"D"],["develop","We've been trying to develop a better teaching method.","もっと良い指導方法を、開発しようとし続けています。",[[21,28]],"D"],["device","The device, which fits in your pocket, records sound.","ポケットに収まるその機器は、音声を録音します。",[[4,10]],"D"],["devote","She regrets having devoted so little time to painting.","彼女は、絵を描く時間をほとんど取らなかったことを後悔しています。",[[19,26]],"D"],["Did you take a look at ~?","Did you take a look at what's being built?","建設中のものを、見てみましたか。",[[0,3],[4,7],[8,12],[13,14],[15,19],[20,22]],"D"],["die out","The tradition appears to have died out long ago.","その伝統は、ずっと前に廃れたようです。",[[30,34],[35,38]],"D"],["diet","I'm trying to include more vegetables in my diet.","食生活にもっと野菜を取り入れようとしています。",[[44,48]],"D"],["dinosaur","My son wants to see the dinosaur exhibit.","息子は恐竜の展示を見たがっています。",[[24,32]],"D"],["direct","A direct flight would save us several hours.","直行便なら、数時間を節約できるでしょう。",[[2,8]],"D"],["direction","I wish I'd checked which direction we should take.","どちらへ進むべきか、確認しておけばよかったです。",[[25,34]],"D"],["director","The director had everyone rehearse the scene again.","監督は全員に、もう一度その場面を練習させました。",[[4,12]],"D"],["disabled","Not all disabled people need the same kind of support.","障害のある人全員に、同じ支援が必要なわけではありません。",[[8,16]],"D"],["disadvantage","Without transport, we'd be at a serious disadvantage.","交通手段がなければ、私たちはかなり不利になるでしょう。",[[40,52]],"D"],["disagree","Rarely have we disagreed so strongly about anything.","私たちが何かでこれほど意見を異にすることは、めったにありません。",[[15,24]],"D"],["disagree on ~","Not everyone who disagrees on this issue is unreasonable.","この問題で意見が違う人が皆、理不尽なわけではありません。",[[17,26],[27,29]],"D"],["disappoint","I didn't want to disappoint my parents.","両親をがっかりさせたくありませんでした。",[[17,27]],"D"],["disaster","It was the disaster that brought our community together.","地域が一つになるきっかけは、その災害でした。",[[11,19]],"D"],["discount","You should have asked about the student discount.","学生割引について、尋ねておくべきでした。",[[40,48]],"D"],["discovery","The discovery made us rethink what we knew.","その発見で、知っていたことを考え直しました。",[[4,13]],"D"],["discrimination","She complained of being subjected to discrimination at work.","彼女は、職場で差別を受けていると訴えました。",[[37,51]],"D"],["discuss","We need to discuss the plans for Friday.","金曜日の予定について、話し合う必要があります。",[[11,18]],"D"],["dismiss","He resented being dismissed without any explanation at all.","何の説明もなく解雇されて、彼は不満を抱きました。",[[18,27]],"D"],["display","Would you please put these books on the front display?","これらの本を、店の前の陳列場所に置いてもらえますか。",[[46,53]],"D"],["distance","The distance would be manageable if we took turns driving.","交代で運転すれば、その距離でも無理なく行けるでしょう。",[[4,12]],"D"],["distinction","The distinction wasn't clear until it had been explained.","説明を受けるまで、その違いははっきり分かりませんでした。",[[4,15]],"D"],["distinguish","I'd have distinguished them easily if I'd worn my glasses.","眼鏡をかけていたら、簡単に見分けられたのに。",[[9,22]],"D"],["distribute","The food is being distributed among the waiting families.","待っている家族たちに、食料を配っています。",[[18,29]],"D"],["disturb","She dislikes being disturbed when she's reading quietly.","彼女は、静かに読書をしているときに邪魔されるのが嫌いです。",[[19,28]],"D"],["divide","We should divide the work according to everyone's strengths.","それぞれの得意分野に応じて、仕事を分担するとよいでしょう。",[[10,16]],"D"],["Do [Would] you mind if I ~?","Would you mind if I opened the window?","窓を開けても、よろしいでしょうか。",[[6,9],[10,14],[15,17],[18,19]],"D"],["do A a favor","Would you do me a favor and lock up?","お願いですが、戸締まりをしてもらえますか。",[[10,12],[16,17],[18,23]],"D"],["do A good","A short walk would do you good after all that work.","あれだけ働いた後は、少し歩くと気分がよくなるでしょう。",[[19,21],[26,30]],"D"],["do A harm","You might have done yourself harm by lifting that.","それを持ち上げて、体を傷めていたかもしれません。",[[15,19],[29,33]],"D"],["do away with ~","The old system has been done away with.","古い制度は、廃止されました。",[[24,28],[29,33],[34,38]],"D"],["do without ~","Had we packed carefully, we could have done without that bag.","注意深く荷造りしていたら、あのかばんは不要だったでしょう。",[[39,43],[44,51]],"D"],["Do you have any rooms available?","Do you have any rooms available whose windows face south?","窓が南向きの部屋で、空いているものはありますか。",[[0,2],[3,6],[7,11],[12,15],[16,21],[22,31]],"D"],["Do you want to do ~ with me?","Do you want to try whatever they've prepared with me?","用意してくれたものを、一緒に食べてみませんか。",[[0,2],[3,6],[7,11],[12,14],[45,49],[50,52]],"D"],["document","The documents appear to have been left on the train.","書類を、電車に置き忘れたようです。",[[4,13]],"D"],["domestic","Not all domestic flights leave from this terminal.","国内線がすべて、このターミナルから出るわけではありません。",[[8,16]],"D"],["Don't mention it.","Don't mention it; I'd be happy to help again.","どういたしまして。また喜んでお手伝いします。",[[0,5],[6,13],[14,16]],"D"],["Don't worry (about it).","Don't worry about it; everything has already been arranged.","心配しないでください。すべて、もう手配してあります。",[[0,5],[6,11]],"D"],["donate","The books have been donated to the village library.","その本は、村の図書館に寄贈されました。",[[20,27]],"D"],["doubt","Had there been any doubt, I wouldn't have signed.","少しでも疑問があったら、署名しなかったでしょう。",[[19,24]],"D"],["downtown","The downtown library, which closed last year, is reopening.","昨年閉館した街の中心部の図書館が、再開します。",[[4,12]],"D"],["dramatic","The lighting had a less dramatic effect than we'd hoped.","照明の効果は、期待していたほど劇的ではありませんでした。",[[24,32]],"D"],["draw up ~","A new contract is being drawn up this week.","今週、新しい契約書を作成しています。",[[24,29],[30,32]],"D"],["drawing","Her drawing has been chosen for the exhibition poster.","彼女の絵が、展覧会のポスターに選ばれました。",[[4,11]],"D"],["drive","I'd been driving for hours before I noticed the warning light.","警告灯に気付くまで、何時間も運転していました。",[[9,16]],"D"],["drop A a line","You should drop her a line before you arrive.","到着前に、彼女に一筆知らせたほうがいいです。",[[11,15],[20,21],[22,26]],"D"],["drop in at ~","We should drop in at the bakery before leaving.","出発前に、パン屋へちょっと寄るとよいでしょう。",[[10,14],[15,17],[18,20]],"D"],["drop out","He seems to have dropped out without telling anyone.","彼は、誰にも言わずに辞めてしまったようです。",[[17,24],[25,28]],"D"],["due","The payment was due yesterday, but nothing has been received.","支払期限は昨日でしたが、何も届いていません。",[[16,19]],"D"],["due to ~","The flight had been delayed due to fog.","霧のために、飛行機は遅れていました。",[[28,31],[32,34]],"D"],["dull","Not every part of the job is dull.","その仕事のすべてが、退屈なわけではありません。",[[29,33]],"D"],["dump","Waste has been dumped illegally behind the abandoned factory.","廃工場の裏に、ごみが不法投棄されています。",[[15,21]],"D"],["duty","He was accused of having neglected his duty.","彼は、職務を怠ったとして非難されました。",[[39,43]],"D"],["eagerly","They'd been eagerly awaiting the letter before it finally arrived.","手紙がようやく届くまで、彼らは心待ちにしていました。",[[12,19]],"E"],["earn","By Friday, I'll have earned enough to buy the ticket.","金曜日までには、チケット代を稼げているでしょう。",[[21,27]],"E"],["economical","Not all small cars are economical to run.","小さな車ならどれでも、維持費が安いとは限りません。",[[23,33]],"E"],["economy","The local economy would improve if more tourists visited.","観光客が増えれば、地元の経済は良くなるでしょう。",[[10,17]],"E"],["ecosystem","The ecosystem is being monitored by a local research group.","その生態系は、地元の研究グループが継続的に観察しています。",[[4,13]],"E"],["edge","You should keep hot drinks away from the table's edge.","熱い飲み物は、テーブルの端から離しておくべきです。",[[49,53]],"E"],["edit","The interview is being edited before tomorrow's broadcast.","明日の放送に向けて、インタビューを編集しています。",[[23,29]],"E"],["edition","This edition, which includes new photographs, costs slightly more.","新しい写真を含むこの版は、少し値段が高いです。",[[5,12]],"E"],["effect","The medicine should have taken effect by now.","その薬は、もう効いているはずです。",[[31,37]],"E"],["efficient","The new system seems to have made deliveries more efficient.","新しい仕組みで、配送の効率が上がったようです。",[[50,59]],"E"],["effort","It was your effort that made the event successful.","行事が成功したのは、あなたの尽力のおかげでした。",[[12,18]],"E"],["either","Neither route is suitable, so we shouldn't take either.","どちらの経路も適切ではないので、使わないほうがいいです。",[[48,54]],"E"],["electricity","Without electricity, we would have to close the shop.","電気がなければ、店を閉めなければならないでしょう。",[[8,19]],"E"],["electronics","The electronics department, which is upstairs, closes at six.","上の階にある電化製品売り場は、6時に閉まります。",[[4,15]],"E"],["eliminate","Several possible causes have already been eliminated from our list.","考えられる原因のいくつかは、すでにリストから除外されました。",[[42,52]],"E"],["embarrass","I didn't mean to embarrass you in front of everyone.","みんなの前で、あなたに恥をかかせるつもりはありませんでした。",[[17,26]],"E"],["emergency","We should agree on what to do in an emergency.","緊急時に何をするか、決めておくべきです。",[[36,45]],"E"],["emotion","It was the emotion in her voice that moved me.","心を動かされたのは、彼女の声にこもった感情でした。",[[11,18]],"E"],["emphasize","She emphasized that all visitors should sign in.","彼女は、来訪者全員が受付で記名するよう強調しました。",[[4,14]],"E"],["employ","The shop had employed fifty people before it closed.","その店は、閉店前には50人を雇っていました。",[[13,21]],"E"],["employee","Ask whichever employee is free to help you.","手の空いている店員なら、誰にでも助けを頼んでください。",[[14,22]],"E"],["encounter","I don't remember having encountered this problem before.","以前にこの問題に遭遇した覚えは、ありません。",[[24,35]],"E"],["encourage","I dislike being encouraged to buy things I don't need.","必要のない物を買うよう勧められるのは、嫌です。",[[16,26]],"E"],["end up doing","We might end up staying another night.","結局、もう1泊することになるかもしれません。",[[9,12],[13,15],[16,23]],"E"],["end up with ~","Had we ordered less, we wouldn't have ended up with leftovers.","注文を少なくしていたら、食べ残しは出なかったでしょう。",[[38,43],[44,46],[47,51]],"E"],["endangered","The endangered birds are being protected by local volunteers.","絶滅の危機にある鳥たちは、地元のボランティアが保護しています。",[[4,14]],"E"],["endlessly","We would talk endlessly about our plans after school.","放課後には、計画についていつまでも話したものでした。",[[14,23]],"E"],["endure","Without her encouragement, I couldn't have endured the wait.","彼女の励ましがなければ、待つことに耐えられなかったでしょう。",[[43,50]],"E"],["enemy","The game's rules let you escape without fighting an enemy.","そのゲームでは、敵と戦わずに逃げることもできます。",[[52,57]],"E"],["enforce","The new parking rules are being strictly enforced.","新しい駐車規則は、厳格に適用されています。",[[41,49]],"E"],["engine","The engine must have stopped while we were inside.","私たちが中にいる間に、エンジンが止まったのでしょう。",[[4,10]],"E"],["enormous","With an enormous crowd waiting, the doors finally opened.","大勢の人が待つ中、ようやく扉が開きました。",[[8,16]],"E"],["enroll","Had I enrolled earlier, I might have secured a place.","もっと早く申し込んでいたら、定員に入れたかもしれません。",[[6,14]],"E"],["ensure","It is essential that everyone should ensure their own safety.","各自が、自分の安全を確保することが不可欠です。",[[37,43]],"E"],["entertain","This game should entertain the children during the journey.","このゲームなら、移動中に子どもたちが楽しめるでしょう。",[[17,26]],"E"],["enthusiastic","Not everyone was enthusiastic about camping in the rain.","雨の中でのキャンプに、全員が乗り気だったわけではありません。",[[17,29]],"E"],["entire","The entire building is being repainted this month.","今月、その建物全体を塗り直しています。",[[4,10]],"E"],["entry","The winning entry, which arrived late, nearly missed the deadline.","優勝した作品は到着が遅く、締切ぎりぎりでした。",[[12,17]],"E"],["environment","We've been trying to create a quieter environment for studying.","もっと静かに勉強できる環境を作ろうと、取り組んでいます。",[[38,49]],"E"],["equally","I'll let you decide how to divide the work equally.","仕事を均等に分ける方法は、あなたに決めてもらいます。",[[43,50]],"E"],["equip A with B","The classroom has been equipped with new computers.","教室には、新しいコンピューターが設置されました。",[[23,31],[32,36]],"E"],["equipment","Do we need to bring our own equipment?","用具は、自分たちで持ってくる必要がありますか。",[[28,37]],"E"],["escape","I watched the cat escape through the open window.","猫が開いた窓から逃げるのを、見ていました。",[[18,24]],"E"],["especially","I wish I'd visited the coast, especially that little village.","海岸、特にあの小さな村を訪ねておけばよかったです。",[[30,40]],"E"],["essay","She denied having copied any part of the essay.","彼女は、作文の一部でも写したことを否定しました。",[[41,46]],"E"],["essential","Without these essential tools, we couldn't have repaired it.","この必須の工具がなければ、修理できなかったでしょう。",[[14,23]],"E"],["establish","The charity has been established to support local families.","その慈善団体は、地域の家族を支援するために設立されました。",[[21,32]],"E"],["estimate","The cost is estimated to have doubled since last year.","費用は、昨年から2倍になったと推定されています。",[[12,21]],"E"],["even if ...","I'd still go even if the weather were bad.","天気が悪くても、私ならやはり行きます。",[[13,17],[18,20]],"E"],["eventually","Having asked for directions, we eventually found our hotel.","道を尋ねて、私たちはようやくホテルを見つけました。",[[32,42]],"E"],["ever since ...","I've been looking for my keys ever since breakfast.","朝食のときから、ずっと鍵を探しています。",[[30,34],[35,40]],"E"],["every other day","I've been watering the plants every other day.","一日おきに、植物に水をやっています。",[[30,35],[36,41],[42,45]],"E"],["evidence","Not all the evidence supports the original explanation.","証拠のすべてが、最初の説明を裏付けているわけではありません。",[[12,20]],"E"],["evolution","The exhibition, which traces fashion's evolution, opens next week.","ファッションの変遷をたどるその展覧会は、来週開幕します。",[[39,48]],"E"],["exactly","That's exactly what I was going to say.","まさに、それを言おうとしていたところです。",[[7,14]],"E"],["exaggerate","He admitted having exaggerated how much work he'd done.","彼は、自分の仕事量を大げさに言ったと認めました。",[[19,30]],"E"],["examine","I'll have a doctor examine your ankle this afternoon.","今日の午後、医師にあなたの足首を診てもらいます。",[[19,26]],"E"],["exceed","The limit appears to have been exceeded several times.","制限を、何度か超えてしまったようです。",[[31,39]],"E"],["exception","No exceptions have been made to the new rule.","その新しい規則には、例外が一切認められていません。",[[3,13]],"E"],["exchange","You should exchange the shoes before wearing them outside.","外で履く前に、その靴を交換するとよいでしょう。",[[11,19]],"E"],["exercise","I try to get some exercise every day.","毎日、少しは運動するようにしています。",[[18,26]],"E"],["exhaust","We'd been walking all day and felt completely exhausted.","一日中歩き続けていて、すっかり疲れ果てていました。",[[46,55]],"E"],["exhibit","We've been preparing a new exhibit since last month.","先月から、新しい展示の準備を続けています。",[[27,34]],"E"],["exist","I wish that little bookshop still existed today.","あの小さな本屋が、今もあればいいのに。",[[34,41]],"E"],["expand","They plan to expand the shop next year.","彼らは来年、店を拡張する予定です。",[[13,19]],"E"],["expect","I hadn't expected the room to be so large.","部屋がこんなに広いとは、思っていませんでした。",[[9,17]],"E"],["expense","The expenses should have been approved before we booked.","予約する前に、経費の承認を得ておくべきでした。",[[4,12]],"E"],["experience","It was that experience that inspired me to teach.","教える仕事に就きたいと思ったきっかけは、あの経験でした。",[[12,22]],"E"],["experiment","By lunchtime, we'll have finished the experiment.","昼食の時間までには、実験を終えているでしょう。",[[38,48]],"E"],["expert","You should ask an expert about that old painting.","その古い絵については、専門家に聞くとよいでしょう。",[[18,24]],"E"],["explore","I'd explore the old town if we had more time.","もっと時間があれば、旧市街を見て回るのですが。",[[4,11]],"E"],["explosion","The explosion, which shattered nearby windows, happened before dawn.","近くの窓を割ったその爆発は、夜明け前に起きました。",[[4,13]],"E"],["export","These products have been exported to more than thirty countries.","これらの製品は、30か国以上に輸出されてきました。",[[25,33]],"E"],["expose","She objected to being exposed to unnecessary risks.","彼女は、不必要な危険にさらされることに反対しました。",[[22,29]],"E"],["express","I wish I could express my feelings more clearly.","自分の気持ちを、もっとはっきり表せたらいいのに。",[[15,22]],"E"],["extend","The deadline has been extended until the end of June.","締切は、6月末まで延長されました。",[[22,30]],"E"],["extensive","The damage seems to have been more extensive than expected.","被害は、予想していたより広範囲に及んでいたようです。",[[35,44]],"E"],["extinct","The species is believed to have become extinct centuries ago.","その種は、何世紀も前に絶滅したと考えられています。",[[39,46]],"E"],["extinction","Several species have been saved from extinction through this project.","この事業で、いくつかの種が絶滅を免れました。",[[37,47]],"E"],["extreme","Not everyone enjoys sports that involve such extreme conditions.","そんな極端な環境でのスポーツを、誰もが好むわけではありません。",[[45,52]],"E"],["extremely","We'd left early, knowing the roads would be extremely busy.","道路が大変混むと分かっていたので、早く出ていました。",[[44,53]],"E"],["eyesight","Had my eyesight been better, I'd have recognized you.","視力がもっと良かったら、あなたに気付いたでしょう。",[[7,15]],"E"],["face","It was your face that I recognized in the photograph.","その写真で見覚えがあったのは、あなたの顔でした。",[[12,16]],"F"],["facility","The new facility is being built beside the station.","その新しい施設は、駅の隣に建設中です。",[[8,16]],"F"],["fact","The facts made us change our minds about the plan.","事実を知って、私たちはその計画への考えを変えました。",[[4,9]],"F"],["factor","Cost should be one factor in choosing your course.","講座を選ぶ際には、費用も判断材料にするべきです。",[[19,25]],"F"],["fade","The photograph appears to have faded in the sunlight.","その写真は、日光で色あせたようです。",[[31,36]],"F"],["fairly","I'd expected the walk to be fairly short.","その散歩道は、かなり短いと思っていました。",[[28,34]],"F"],["faithful","Her faithful dog, which followed her everywhere, lived for years.","どこへでも付いてきた忠実な犬は、長生きしました。",[[4,12]],"F"],["fake","The painting turned out to have been a fake.","その絵は、偽物だったことが分かりました。",[[39,43]],"F"],["fall on [upon] ~","Responsibility would fall on me if anything went wrong.","何か問題が起きたら、責任は私にかかるでしょう。",[[21,25],[26,28]],"F"],["false","Not all the information in the article was false.","記事の情報がすべて、誤りだったわけではありません。",[[43,48]],"F"],["fame","Not every performer dreams of worldwide fame.","すべての出演者が、世界的な名声を夢見ているわけではありません。",[[40,44]],"F"],["famine","Emergency supplies are being sent to areas affected by famine.","飢饉に見舞われた地域に、緊急物資を送っています。",[[55,61]],"F"],["far from ~","Having lost our way, we were far from relaxed.","道に迷ってしまい、私たちは全く落ち着けませんでした。",[[29,32],[33,37]],"F"],["fare","The fare should have included your return journey.","その運賃には、帰りの分も含まれているはずでした。",[[4,8]],"F"],["farewell","Having said our farewells, we walked to the station.","別れのあいさつを済ませ、駅まで歩きました。",[[16,25]],"F"],["fascinate","I'd been fascinated by astronomy before I could even read.","字が読めるようになる前から、天文学に魅了されていました。",[[9,19]],"F"],["fashion","She wants to work in the fashion industry.","彼女はファッション業界で働きたいと思っています。",[[25,32]],"F"],["fasten","The gate should have been fastened before we left.","出発前に、門をしっかり閉めておくべきでした。",[[26,34]],"F"],["fault","It was my fault that we had left too late.","出発が遅すぎたのは、私の責任でした。",[[10,15]],"F"],["favor","Would you please do me a small favor?","ちょっとお願いしてもよいですか。",[[31,36]],"F"],["feature","You should compare this feature with the cheaper model's.","この機能を、安い機種のものと比べるとよいでしょう。",[[24,31]],"F"],["fee","By Monday, we'll have paid the registration fee.","月曜日までには、登録料を払い終えているでしょう。",[[44,47]],"F"],["feed","I had fed the cat before leaving for work.","仕事に出かける前に、猫に餌をやっていました。",[[6,9]],"F"],["feedback","The feedback, which arrived yesterday, has been mostly positive.","昨日届いた意見は、おおむね好意的です。",[[4,12]],"F"],["feel like doing","I've been working all day, so I feel like going out.","一日中働いていたので、出かけたい気分です。",[[32,36],[37,41],[42,47]],"F"],["fellow","My fellow travelers, who'd arrived early, had saved me a seat.","早く着いていた旅仲間が、私の席を取っておいてくれました。",[[3,9]],"F"],["fiber","This coat, which contains natural fiber, needs gentle washing.","天然繊維を含むこのコートは、優しく洗う必要があります。",[[34,39]],"F"],["fiction","Not all fiction has to end happily.","すべての小説が、幸せな結末になる必要はありません。",[[8,15]],"F"],["figure","I saw a figure move behind the curtain.","カーテンの後ろで、人影が動くのを見ました。",[[8,14]],"F"],["figure out ~","I wish I could figure out what you meant.","あなたの言ったことの意味が、分かったらいいのに。",[[15,21],[22,25]],"F"],["fill","Would you please fill this bottle with water?","このボトルに水を入れてもらえますか。",[[17,21]],"F"],["fill out ~","You should have filled out the form before arriving.","到着する前に、用紙に記入しておくべきでした。",[[16,22],[23,26]],"F"],["financial","Without financial support, the project would have failed.","資金面の支援がなければ、事業は失敗していたでしょう。",[[8,17]],"F"],["find fault(s) with ~","I dislike being with people who always find fault with others.","いつも人のあら探しをする人と、一緒にいるのは嫌です。",[[39,43],[44,49],[50,54]],"F"],["find out ~","I asked around, only to find out nobody knew.","聞いて回りましたが、誰も知らないことが分かりました。",[[24,28],[29,32]],"F"],["fingerprint","He denied having left fingerprints on the window.","彼は、窓に指紋を残したことを否定しました。",[[22,34]],"F"],["firefighter","The firefighter, whose hands were burned, stayed remarkably calm.","手にやけどをしたその消防士は、驚くほど冷静でした。",[[4,15]],"F"],["firework","We watched the fireworks light up the sky.","花火が夜空を照らすのを、見ていました。",[[15,24]],"F"],["fit","I'd buy this jacket if it fit me better.","もっと体に合えば、このジャケットを買うのですが。",[[26,29]],"F"],["fitness","Her fitness seems to have improved since she started swimming.","水泳を始めてから、彼女の体力は向上したようです。",[[4,11]],"F"],["fix","I'll have someone fix the lamp this afternoon.","今日の午後、誰かにランプを直してもらいます。",[[18,21]],"F"],["flatter","I don't enjoy being flattered just to win my approval.","賛成を得るためだけに、お世辞を言われるのは好きではありません。",[[20,29]],"F"],["flavor","Which ice cream flavor would you like?","アイスクリームは、どの味がよいですか。",[[16,22]],"F"],["flesh","The peach, whose flesh was bruised, went into a smoothie.","果肉が傷んだその桃は、スムージーに使いました。",[[17,22]],"F"],["flexible","Had our schedule been flexible, we could have stayed longer.","予定に融通が利いたら、もっと長く滞在できたのに。",[[22,30]],"F"],["flight","Our flight had already left when we reached the airport.","空港に着いたとき、私たちの便はもう出発していました。",[[4,10]],"F"],["float","The children watched their paper boats float downstream.","子どもたちは、紙の船が川下へ浮かんでいくのを見ました。",[[39,44]],"F"],["flood","Several homes have been flooded after days of heavy rain.","何日も続いた大雨で、何軒かの家が浸水しました。",[[24,31]],"F"],["flour","Not all the flour needs to be added now.","小麦粉を全部、今加える必要はありません。",[[12,17]],"F"],["fluent","She appears to have become fluent while living abroad.","海外に住んでいる間に、流暢に話せるようになったようです。",[[27,33]],"F"],["focus","With everyone's attention focused on her, she began speaking.","全員の注目が集まる中、彼女は話し始めました。",[[26,33]],"F"],["fold","I found the towels folded neatly on my bed.","タオルが、ベッドの上にきちんと畳まれていました。",[[19,25]],"F"],["fold up ~","The chairs have been folded up and put away.","椅子は折り畳まれ、片付けてあります。",[[21,27],[28,30]],"F"],["follow","You should have followed the instructions more carefully.","説明書には、もっと注意深く従うべきでした。",[[16,24]],"F"],["for a change","I'd like to eat somewhere different for a change.","たまには気分を変えて、別の所で食事したいです。",[[36,39],[40,41],[42,48]],"F"],["for ages","I'd been waiting for ages before someone finally answered.","ようやく誰かが応答するまで、長い間待っていました。",[[17,20],[21,25]],"F"],["for all ~","For all his experience, he should have known better.","あれほど経験があるのだから、もっと分別があるべきでした。",[[0,3],[4,7]],"F"],["for certain","Had I known for certain, I'd have told you.","確実に知っていたら、あなたに伝えていたでしょう。",[[12,15],[16,23]],"F"],["for fear that ...","I stayed quiet for fear that the baby would wake.","赤ちゃんが目を覚ますといけないので、静かにしていました。",[[15,18],[19,23],[24,28]],"F"],["for free","I signed up, only to find it wasn't for free.","申し込みましたが、無料ではないことが分かりました。",[[36,39],[40,44]],"F"],["for good (and all)","The shop, which closed for good, had served us for years.","長年利用していたその店は、完全に閉店しました。",[[23,26],[27,31]],"F"],["for instance","You should try something new, for instance learning guitar.","例えばギターなど、新しいことを始めるとよいでしょう。",[[30,33],[34,42]],"F"],["for long","We shouldn't have to wait outside for long.","外で長く待つ必要は、ないはずです。",[[34,37],[38,42]],"F"],["for short","Elizabeth, whose friends call her Liz for short, teaches English.","英語教師のエリザベスは、友達から略してリズと呼ばれています。",[[38,41],[42,47]],"F"],["for sure","I should have checked so I'd know for sure.","確実に分かるよう、確認するべきでした。",[[34,37],[38,42]],"F"],["for the sake of ~","We should cooperate for the sake of the children.","子どもたちのために、私たちは協力すべきです。",[[20,23],[24,27],[28,32],[33,35]],"F"],["for the time being","I'd suggest staying here for the time being.","当分はここにいることを、お勧めします。",[[25,28],[29,32],[33,37],[38,43]],"F"],["force","He disliked being forced to choose between his friends.","友達のどちらかを選ぶよう強いられて、彼は嫌がりました。",[[18,24]],"F"],["forecast","You should have checked the forecast before setting off.","出発する前に、天気予報を確認するべきでした。",[[28,36]],"F"],["forgive","You should forgive yourself for making one small mistake.","小さな間違い一つで、自分を責めすぎないほうがよいですよ。",[[11,18]],"F"],["form","By tomorrow, I'll have completed every section of the form.","明日までには、用紙の全項目に記入し終えているでしょう。",[[54,58]],"F"],["formation","The formation of the new team has been announced.","新しいチームの結成が ss.","そのパン屋は、廃業してしまったようです。",[[25,29],[30,33],[34,36],[37,45]],"G"],["go over ~","The figures should have been gone over before submission.","提出前に、その数値を見直しておくべきでした。",[[29,33],[34,38]],"G"],["go through with ~","Had she gone through with it, she'd have regretted it.","最後まで実行していたら、彼女は後悔していたでしょう。",[[8,12],[13,20],[21,25]],"G"],["go through ~","We should have gone through the instructions together.","一緒に、説明書を確認するべきでした。",[[15,19],[20,27]],"G"],["go with ~","I'd choose the shoes that go with your coat.","私なら、あなたのコートに合う靴を選びます。",[[26,28],[29,33]],"G"],["Good idea.","Good idea! We should leave before the traffic builds.","いい考えですね。道が混む前に出発しましょう。",[[0,4],[5,9]],"G"],["Good luck.","Good luck with whatever you decide to do next!","次に何をするにしても、うまくいくことを願っています。",[[0,4],[5,9]],"G"],["gradually","I've been gradually getting used to the new schedule.","新しい予定に、少しずつ慣れてきています。",[[10,19]],"G"],["graduate","My sister had graduated before we moved to this town.","この町に引っ越す前に、姉は卒業していました。",[[14,23]],"G"],["gravity","Without gravity, objects wouldn't fall toward the ground.","重力がなければ、物は地面に向かって落ちないでしょう。",[[8,15]],"G"],["greenhouse","The greenhouse, which we built ourselves, survived the storm.","自分たちで建てたその温室は、嵐に耐えました。",[[4,14]],"G"],["guarantee","All work has been guaranteed for at least twelve months.","すべての作業には、少なくとも12か月の保証が付いています。",[[18,28]],"G"],["guess","I'd never have guessed that this painting was yours.","この絵があなたのものとは、とても思い付かなかったでしょう。",[[15,22]],"G"],["Guess what!","Guess what! I've been learning to play the guitar!","聞いてください。ギターを習っているんです。",[[0,5],[6,10]],"G"],["guest","Our guest was surprised at how early we eat.","お客さんは、私たちの食事の早さに驚いていました。",[[4,9]],"G"],["guideline","These guidelines are being revised after staff raised concerns.","職員から懸念が示され、この指針を改訂しています。",[[6,16]],"G"],["habit","Reading before bed had become a habit by then.","その頃には、寝る前の読書が習慣になっていました。",[[32,37]],"H"],["habitat","Their natural habitat is being threatened by new construction.","その動物たちの自然の生息地は、新たな建設で脅かされています。",[[14,21]],"H" d be an honor to work with you.","あなたと働ければ、光栄です。",[[15,20]],"H"],["horizontal","The shelf has been adjusted to keep it horizontal.","棚は、水平になるように調整されました。",[[39,49]],"H"],["horror","I don't like watching horror films alone.","一人でホラー映画を見るのは好きではありません。",[[22,28]],"H"],["household","Not every household has enough space for a garden.","どの家庭にも、庭を造る十分な場所があるわけではありません。",[[10,19]],"H"],["housework","We should divide the housework more equally.","家事を、もっと平等に分担するべきです。",[[21,30]],"H"],["How come?","How come you had already left when I called?","電話したとき、どうしてもう出発していたのですか。",[[0,3],[4,8]],"H"],["How do you like ~?","How do you like the room where we're staying?","泊まっている部屋は、気に入りましたか。",[[0,3],[4,6],[7,10],[11,15]],"H"],["How was ~?","How was the trip you had planned so carefully?","あんなに念入りに計画していた旅行は、どうでしたか。",[[0,3],[4,7]],"H"],["hug","I saw her hug the child who'd been crying.","泣いていた子を彼女が抱き締めるのを、見ました。",[[10,13]],"H"],["huge","If I had a huge garden, I'd grow my own vegetables.","大きな庭があったら、自分で野菜を育てます。",[[11,15]],"H"],["humid","Had it been less humid, we'd have walked home.","もっと蒸し暑くなかったら、歩いて帰ったでしょう。",[[17,22]],"H"],["I appreciate it.","I appreciate it; I couldn't have managed without you.","感謝しています。あなたがいなければ、できなかったでしょう。",[[0,1],[2,12],[13,15]],"I"],["I can make it.","I can make it if you don't mind waiting.","待ってもらってもよければ、行けます。",[[0,1],[2,5],[6,10],[11,13]],"I"],["I can't [don't] follow ~","I can't follow what's being said over the noise.","騒音のせいで、話している内容が理解できません。",[[0,1],[2,7],[8,14]],"I"],["I didn't mean it.","I didn't mean it; I shouldn't have said that.","本心ではありません。あんなことを言うべきではありませんでした。",[[0,1],[2,8],[9,13],[14,16]],"I"],["I doubt it.","I doubt it; the tickets must have sold out.","そうは思いません。チケットは、もう売り切れたはずです。",[[0,1],[2,7],[8,10]],"I"],["I have no idea.","I have no idea why he'd left before we arrived.","私たちが着く前に、なぜ彼が帰ったのか全く分かりません。",[[0,1],[2,6],[7,9],[10,14]],"I"],["I haven't seen you since ...","I haven't seen you since that bridge was being built.","あの橋が建設中だった頃から、お会いしていませんね。",[[0,1 ,22],[23,25]],"O"],["once and for all","We should settle this question once and for all.","この問題には、きっぱり決着をつけるべきです。",[[31,35],[36,39],[40,43],[44,47]],"O"],["(every) once in a while","We would visit that beach once in a while.","私たちはときどき、あの浜辺を訪れたものでした。",[[26,30],[31,33],[34,35],[36,41]],"O"],["once upon a time","Once upon a time, there lived a king whose daughter loved music.","昔々、音楽が大好きな娘のいる王様がいました。",[[0,4],[5,9],[10,11],[12,16]],"O"],["one (~) after another [the other]","The guests have been arriving one after another since noon.","正午から、お客さんが次々に到着しています。",[[30,33],[34,39],[40,47]],"O"],["one by one","We watched the students enter the room one by one.","生徒が一人ずつ部屋に入るのを、見ていました。",[[39,42],[43,45],[46,49]],"O"],["only to do","We rushed back, only to find you'd already left.","急いで戻りましたが、あなたはもう出発していました。",[[16,20],[21,23]],"O"],["open one's heart","I wish she'd opened her heart to me earlier.","もっと早く、彼女が心の内を話してくれていたらよかったのに。",[[13,19],[20,23],[24,29]],"O"],["operate","The machine is being operated by a trained technician.","その機械は、訓練を受けた技術者が操作しています。",[[21,29]],"O"],["opinion","I'd like to know what your opinion is on this.","これについて、あなたがどう考えているか知りたいです。",[[27,34]],"O"],["opponent","My opponent, whom I'd never beaten, smiled confidently.","一度も勝ったことのない対戦相手は、自信たっぷりにほほ笑みました。",[[3,11]],"O"],["opportunity","I wish I'd taken the opportunity to study abroad.","留学の機会を、活かせばよかったです。",[[21,32]],"O"],["oppose","She opposed being moved to a different department.","彼女は、別の部署へ移されることに反対しました。",[[4,11]],"O"],["opposite","That's the cafe where we sat opposite each other.","あれが、私たちが向かい合って座ったカフェです。",[[29,37]],"O"],["option","Not every option on the menu is available today.","メニューのすべてを、今日注文できるわけではありません。",[[10,16]],"O"],["order","I should have ordered the tickets much earlier.","チケットは、もっと早く注文するべきでした。",[[14,21]],"O"],["ordinary","It was an ordinary conversation that changed my mind.","私の考えが変わったきっかけは、何気ない会話でした。",[[10,18]],"O"],["organic","These organic vegetables have been grown without artificial fertilizers.","これらの有機野菜は、化学肥料を使わずに育てられました。",[[6,13]],"O"],["organize","I've been organizing the party since last week.","先週から、パーティーの準備を続けています。",[[10,20]],"O"],["origin","I wish I knew the origin of this festival.","この祭りの起源を、知っていればいいのに。",[[18,24]],"O"],["other","I found my other shoe hidden behind the sofa.","もう片方の靴が、ソファーの後ろに隠れていました。",[[11,16]],"O"],["otherwise","We should leave now; otherwise, we'll miss the train.","今出発しないと、電車に乗り遅れます。",[[21,30]],"O"],["out of control","The fire seems to have got out of control.","火の手は、抑えられなくなったようです。",[[27,30],[31,33],[34,41]],"O"],["out of date","I hadn't realized the map was out of date.","地図が古くなっているとは、気付いていませんでした。",[[30,33],[34,36],[37,41]],"O"],["out of order","You should have told us the lift was out of order.","エレベーターが故障中だと、教えてくれるべきでした。",[[37,40],[41,43],[44,49]],"O"],["out of shape","I'd be out of shape if I stopped swimming.","泳ぐのをやめたら、体がなまってしまうでしょう。",[[7,10],[11,13],[14,19]],"O"],["out of stock","The item, which is out of stock, should arrive tomorrow.","品切れのその商品は、明日入荷するはずです。",[[19,22],[23,25],[26,31]],"O"],["out of the question","Traveling tonight would be out of the question.","今夜出発するのは、とても無理でしょう。",[[27,30],[31,33],[34,37],[38,46]],"O"],["outcome","Had you intervened, the outcome might have been different.","あなたが間に入っていたら、結果は違ったかもしれません。",[[24,31]],"O"],["overall","The overall cost seems to have been underestimated.","全体の費用は、低く見積もられていたようです。",[[4,11]],"O"],["overcome","I've been trying to overcome my fear of speaking English.","英語を話すことへの恐怖を、克服しようとしています。",[[20,28]],"O"],["overdo","I regret having overdone the exercise yesterday morning.","昨日の朝、運動をやりすぎたことを後悔しています。",[[16,24]],"O"],["overturn","The decision has been overturned after new evidence emerged.","新たな証拠が出て、その決定は覆されました。",[[22,32]],"O"],["owe","Had I remembered, I'd have paid what I owed.","覚えていたら、借りていた分を払っていたのに。",[[39,43]],"O"],["owe A to B","I owe my recovery to whoever found me that night.","回復できたのは、あの夜私を見つけてくれた人のおかげです。",[[2,5],[18,20]],"O"],["owing to ~","Owing to what happen e, won the award.","作品を高く評価している私のライバルが、受賞しました。",[[3,8]],"R"],["roast","The vegetables have been roasted with garlic and herbs.","野菜は、ニンニクとハーブと一緒にローストしてあります。",[[25,32]],"R"],["rob","He was terrified of being robbed on his way home.","彼は、帰宅途中に強盗に遭うことを恐れていました。",[[26,32]],"R"],["role","You should choose whichever role suits your experience.","経験に合う役割なら、どれを選んでもよいでしょう。",[[28,32]],"R"],["room","There would be more room if we moved this.","これを動かせば、もっと場所が空くでしょう。",[[20,24]],"R"],["rotate","The tires should have been rotated during the service.","整備の際に、タイヤの位置を交換しておくべきでした。",[[27,34]],"R"],["rough","The flight must have been rough in that storm.","あの嵐では、飛行機がずいぶん揺れたのでしょう。",[[26,31]],"R"],["route","Which route would you recommend for walking to school?","学校まで歩くには、どの経路がおすすめですか。",[[6,11]],"R"],["routine","Not everyone enjoys following the same routine every morning.","毎朝同じことをするのが、誰もが好きとは限りません。",[[39,46]],"R"],["rub","I watched him rub the stain with a cloth.","彼が布で染みをこするのを、見ていました。",[[14,17]],"R"],["rude","I didn't mean to be rude to you.","あなたに失礼な態度を取るつもりはありませんでした。",[[20,24]],"R"],["ruin","Had we ignored the warning, our trip would've been ruined.","警告を無視していたら、旅行は台無しになっていたでしょう。",[[51,57]],"R"],["rumor","The rumor had spread before anyone checked the facts.","事実を確認する前に、うわさは広がっていました。",[[4,9]],"R"],["run","I saw the children run towards the bus stop.","子どもたちがバス停へ走るのを、見ました。",[[19,22]],"R"],["run into [across] ~","I've been running into old friends wherever I go.","行く先々で、昔の友達に偶然会っています。",[[10,17],[18,22]],"R"],["run out of ~","We must have run out of milk yesterday.","昨日、牛乳が切れてしまったのでしょう。",[[13,16],[17,20],[21,23]],"R"],["run over ~","I could have run over that cat in the dark.","暗い中で、あの猫を車でひいていたかもしれません。",[[13,16],[17,21]],"R"],["run through ~","We should run through the instructions before we begin.","始める前に、手順を一通り確認すべきです。",[[10,13],[14,21]],"R"],["rural","The rural school, which serves several villages, needs more teachers.","いくつかの村の子が通うその学校では、教員が不足しています。",[[4,9]],"R"],["rush","I regret having rushed through the final questions.","最後の問題を、急いで済ませたことを後悔しています。",[[16,22]],"R"],["sacrifice","Without her sacrifice, we couldn't have continued our studies.","彼女の犠牲がなければ、私たちは学業を続けられなかったでしょう。",[[12,21]],"S"],["safe and sound","The missing child has been found safe and sound.","行方不明だった子は、無事に見つかりました。",[[33,37],[38,41],[42,47]],"S"],["sail","We watched a little boat sail across the lake.","小さな船が湖を渡るのを、見ていました。",[[25,29]],"S"],["salary","Her salary has been increased to reflect her new responsibilities.","新たな責任に見合うよう、彼女の給与は引き上げられました。",[[4,10]],"S"],["salesperson","The salesperson, who recognized me, offered to help.","私に気付いたその販売員は、手伝いを申し出てくれました。",[[4,15]],"S"],["satellite","The satellite is being tracked from a remote station.","遠隔地の観測所から、その衛星を追跡しています。",[[4,13]],"S"],["satisfy","Not every solution will satisfy everyone involved.","どんな解決策も、関係者全員を満足させるとは限りません。",[[24,31]],"S"],["scan","The documents are being scanned before they're sent.","書類は、送信する前にスキャンしています。",[[24,31]],"S"],["scar","The scar, which he'd hidden, was finally beginning to fade.","彼が隠していた傷痕は、ようやく薄くなり始めていました。",[[4,8]],"S"],["scarce","Had fuel been less scarce, we could have driven farther.","燃料がもっとあれば、さらに遠くまで運転できたでしょう。",[[19,25]],"S"],["scene","The final scene was what made me cry.","私が泣いたのは、最後の場面を見たからでした。",[[10,15]],"S"],["scenery","The scenery made us stop and take photographs.","景色が素晴らしくて、私たちは足を止めて写真を撮りました。",[[4,11]],"S"],["scent","With the scent of bread filling the room, we waited.","パンの香りが部屋に満ちる中、私たちは待っていました。",[[9,14]],"S"],["scholar","The scholar, whose books I'd read, answered my question.","著書を読んだことのあるその学者が、質問に答えてくれました。",[[4,11]],"S"],["scholarship","She appears to have been awarded a full scholarship.","彼女は、全額給付の奨学金を得たようです。",[[40,51]],"S"],["scold","He disliked being scolded in front of everyone.","彼は、みんなの前で叱られるのを嫌がりました。",[[18,25]],"S"],["scratch","The table seems to have been scratched during delivery.","テーブルは、配達の際に傷が付いたようです。",[[29,38]],"S"],["seal","The envelope should have been sealed before ool! I'd love to try that sometime.","いいですね。いつかぜひ、試してみたいです。",[[0,6],[7,11]],"T"],["That's exactly what ...","That's exactly what should have been done yesterday.","それこそ、昨日しておくべきだったことです。",[[0,6],[7,14],[15,19]],"T"],["That's none of my business.","That's none of my business, whatever you decide.","あなたが何を決めても、私の口を挟むことではありません。",[[0,6],[7,11],[12,14],[15,17],[18,26]],"T"],["That's too bad.","That's too bad; I'd hoped you could join us.","残念です。一緒に来てもらえると、思っていたのですが。",[[0,6],[7,10],[11,14]],"T"],["That's very kind of you.","That's very kind of you, but I should pay.","ご親切にありがとうございます。でも、私が払うべきです。",[[0,6],[7,11],[12,16],[17,19],[20,23]],"T"],["The chances are that ...","The chances are that they've already been told.","おそらく、彼らはもう知らされているでしょう。",[[0,3],[4,11],[12,15],[16,20]],"T"],["the last ~ ...","She'd be the last person to break a promise.","彼女は、決して約束を破るような人ではないでしょう。",[[9,12],[13,17]],"T"],["The line is busy.","The line is busy; we should try again later.","話し中です。後で、もう一度かけましょう。",[[0,3],[4,8],[9,11],[12,16]],"T"],["theory","Not every theory can be tested through simple experiments.","どんな理論も、簡単な実験で検証できるとは限りません。",[[10,16]],"T"],["There is little doubt that ...","There's little doubt that she should have been informed.","彼女に知らせるべきだったことは、ほぼ間違いありません。",[[0,7],[8,14],[15,20],[21,25]],"T"],["There is no doing ~","There's no knowing what will happen next.","次に何が起きるかは、分かりません。",[[0,7],[8,10],[11,18]],"T"],["There is no point in doing","There's no point in blaming whoever happens to be nearby.","たまたま近くにいる人を責めても、意味がありません。",[[0,7],[8,10],[11,16],[17,19],[20,27]],"T"],["thief","The thief appears to have escaped through the kitchen window.","泥棒は、台所の窓から逃げたようです。",[[4,9]],"T"],["think over ~","You should think over whatever she suggested.","彼女の提案は、何でもよく考えてみるべきです。",[[11,16],[17,21]],"T"],["This is A speaking.","Hello, this is Ken speaking about what you ordered.","もしもし、ケンです。ご注文の件でお電話しています。",[[7,11],[12,14],[19,27]],"T"],["though","Though we'd booked early, we couldn't get seats together.","早く予約 h I'd stayed home.","正直に言うと、家にいればよかったと思います。",[[0,2],[3,7],[8,11],[12,15],[16,21]],"T"],["to the contrary","I'd have helped, despite any claims to the contrary.","反対のことを言う人がいても、私は手伝っていたでしょう。",[[36,38],[39,42],[43,51]],"T"],["to the point","Your answer should be brief and to the point.","答えは、簡潔で要領を得たものにするべきです。",[[32,34],[35,38],[39,44]],"T"],["tornado","The tornado, which struck overnight, damaged several farm buildings.","夜中に襲ったその竜巻で、農場の建物が何棟か壊れました。",[[4,11]],"T"],["touch and go","It would've been touch and go without your help.","あなたの助けがなければ、危ういところだったでしょう。",[[17,22],[23,26],[27,29]],"T"],["tour","The tour has been called off because of bad weather.","そのツアーは、悪天候のため中止になりました。",[[4,8]],"T"],["tourism","Not every local business benefits equally from tourism.","地元の商売すべてが、観光で同じだけ潤うわけではありません。",[[47,54]],"T"],["tournament","I've been practicing hard for the tournament held every summer.","毎年夏に開かれる大会に向けて、一生懸命練習しています。",[[34,44]],"T"],["toxic","The toxic waste is being removed by a specialist team.","その有害な廃棄物は、専門チームが撤去しています。",[[4,9]],"T"],["trace","The source of the problem appears to have been traced.","問題の発生源は、突き止められたようです。",[[47,53]],"T"],["trade","The two countries agreed to increase trade.","両国は、貿易を増やすことで合意しました。",[[37,42]],"T"],["tradition","It was a family tradition that brought us together.","私たちが集まるきっかけは、家族の伝統行事でした。",[[16,25]],"T"],["traffic","The earlier we leave, the less traffic we'll face.","早く出発すればするほど、渋滞は少なくなります。",[[31,38]],"T"],["transfer","Had I transferred earlier, I wouldn't have missed the connection.","もっと早く乗り換えていたら、接続便に乗り遅れなかったでしょう。",[[6,17]],"T"],["transform","The empty shop has been transformed into a welcoming cafe.","空き店舗は、居心地のよいカフェに生まれ変わりました。",[[24,35]],"T"],["translate","Would you please translate this message into Japanese?","このメッセージを、日本語に訳してもらえますか。",[[17,26]],"T"],["translate A into B","Would you please translate this letter into English?","この手紙を、英語に訳してもらえますか。",[[17,26],[39,43]],"T"],["transportation","The price should have included transportation to ance, I'd have nobody to turn to for help.","あなたの導きがなければ、助けを求める相手がいないでしょう。",[[42,46],[47,49],[50,53]],"T"],["turn up (~)","The missing ring seems to have turned up at last.","なくしていた指輪は、ようやく見つかったようです。",[[31,37],[38,40]],"T"],["typical","A typical day here is less busy than you'd imagine.","ここでの普段の一日は、想像されるほど忙しくありません。",[[2,9]],"T"],["undertake","No major repairs have been undertaken since we moved in.","入居して以来、大がかりな修理は一切行われていません。",[[27,37]],"U"],["unfortunately","Unfortunately, the shop you wanted to visit has closed.","残念ながら、行きたがっていたお店は閉店してしまいました。",[[0,13]],"U"],["unique","Each child should be allowed to learn in their unique way.","どの子も、その子独自の方法で学べるようにすべきです。",[[47,53]],"U"],["united","Rarely have our neighbors been so united over anything.","近所の人たちが、何かについてこれほど一致団結するのは珍しいです。",[[34,40]],"U"],["unless","I wouldn't go unless you came with me.","あなたが一緒に来なければ、私なら行きません。",[[14,20]],"U"],["(It's) up to you.","It's up to you where we should go next.","どこへ行くのがよいかは、あなたに任せます。",[[5,7],[8,10],[11,14]],"U"],["up to ~","The room, which seats up to twenty, is available.","最大20人が座れるその部屋は、空いています。",[[22,24],[25,27]],"U"],["upset","She was upset about what had happened to her dog.","犬に起きたことについて、彼女は悲しんでいました。",[[8,13]],"U"],["upside down","I found the picture hanging upside down.","絵が、上下逆さまに掛かっていました。",[[28,34],[35,39]],"U"],["urban","The urban park, which opened recently, has become very popular.","最近開園したその都市公園は、大変人気になっています。",[[4,9]],"U"],["urge","She urged that the matter should be discussed privately.","彼女は、その件を内々で話し合うよう強く求めました。",[[4,9]],"U"],["use up ~","All the paint appears to have been used up.","ペンキは、全部使い切ってしまったようです。",[[35,39],[40,42]],"U"],["utilize","The empty rooms are being utilized as temporary classrooms.","その空き部屋は、仮の教室として活用されています。",[[26,34]],"U"],["vacant","Not every vacant building can be converted into housing.","どの空き家も、住宅に転用できるわけではありません。",[[10,16]],"V"],["vague","His vague reply seems to have confused everyone.","彼の曖昧な返答で、みんなが混乱したようです。",[[4,9]],"V"],["valley","The valley, function highlight(en, spans){
  const sp=[...spans].sort((a,b)=>a[0]-b[0]), merged=[];
  for(const [a,b] of sp){ const last=merged[merged.length-1];
    if(last && a>=last[1] && /^\s*$/.test(en.slice(last[1],a))) last[1]=Math.max(last[1],b);
    else if(!last || a>=last[1]) merged.push([a,b]); }
  let out='', pos=0;
  for(const [a,b] of merged){ out+=esc(en.slice(pos,a))+'<mark>'+esc(en.slice(a,b))+'</mark>'; pos=b; }
  return out+esc(en.slice(pos));
}

let slow=false, voice=null, enVoices=[];
// 自然な音声（Edge の Natural/Online、Chrome の Google、Apple の Premium/Enhanced）を優先
const NOVELTY=/\b(Albert|Bad News|Bahh|Bells|Boing|Bubbles|Cellos|Good News|Jester|Organ|Superstar|Trinoids|Whisper|Wobble|Zarvox|Fred|Junior|Ralph|Kathy|Grandma|Grandpa|Eddy|Flo|Reed|Rocko|Sandy|Shelley)\b/;
function vRank(v){
  const n=v.name, us=/^en[-_]US/i.test(v.lang)?0:0.5;
  if(NOVELTY.test(n)) return 9;
  if(/Natural|Online/i.test(n)) return 0+us;
  if(/^Google/i.test(n)) return (/US English/i.test(n)?1:1.2)+us;
  if(/Premium|Enhanced|Siri/i.test(n)) return 2+us;
  if(/Samantha|Ava|Allison|Aria|Jenny|Alex|Daniel|Karen|Moira/i.test(n)) return 3+us;
  return 5+us;
}
const isNatural=v=>vRank(v)<3;
function pickVoice(){
  enVoices=speechSynthesis.getVoices().filter(v=>/^en/i.test(v.lang)).sort((a,b)=>vRank(a)-vRank(b)||a.name.localeCompare(b.name));
  const chosen=store.get('goi-voice');
  voice=(chosen&&enVoices.find(v=>v.voiceURI===chosen))||enVoices[0]||null;
  fillVoices();
}
function fillVoices(){
  const chosen=store.get('goi-voice')||'';
  const nat=enVoices.filter(isNatural), rest=enVoices.filter(v=>!isNatural(v));
  const opt=(v,star)=>`<option value="${esc(v.voiceURI)}">${star?'★ ':''}${esc(v.name+' ('+v.lang+')')}</option>`;
  const html='<option value="">（自動：'+esc(voice?voice.name:'既定')+'）</option>'+
    (nat.length?'<optgroup label="自然な音声">'+nat.map(v=>opt(v,1)).join('')+'</optgroup>':'')+
    (rest.length?'<optgroup label="その他の音声">'+rest.map(v=>opt(v,0)).join('')+'</optgroup>':'');
  document.querySelectorAll('select.vpick').forEach(sel=>{
    sel.innerHTML=html;
    sel.value=enVoices.some(v=>v.voiceURI===chosen)?chosen:'';
    sel.onchange=()=>{store.set('goi-voice',sel.value); pickVoice(); stop(); speak('Hello. This is my voice.');};
  });
}
if('speechSynthesis' in window){pickVoice(); speechSynthesis.onvoiceschanged=pickVoice; setTimeout(pickVoice,500); setTimeout(pickVoice,1500);}
$('vtest').onclick=()=>{stop(); speak('Hello. Nice to meet you.');};
function speak(text,card,done){
  if(!('speechSynthesis' in window)){alert('このブラウザは読み上げに対応していません');return;}
  document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing'));
  const u=new SpeechSynthesisUtterance(text.replace(/[’‘]/g,"'").replace(/[“”]/g,'"'));
  u.lang='en-US'; if(voice) u.voice=voice; u.rate=slow?0.7:0.95;
  card&&card.classList.add('playing');
  u.onend=u.onerror=()=>{card&&card.classList.remove('playing'); done&&done();};
  speechSynthesis.speak(u);
}
function stop(){ if('speechSynthesis' in window) speechSynthesis.cancel(); document.querySelectorAll('.card.playing').forEach(c=>c.classList.remove('playing')); }
// routing: #g5/A  #g5/w=12  #g5/q=xxx
// 英検４択テスト（２級・準２級・３級）
let tset=0;
const TT={
  t2:{sets:T2, gl:T2G, g:'2', key:'tango-t2', np:'(1)〜(17)', lead:`英検２級レベルの単語・熟語の例文から作った4択問題です。1セット17問（(1)〜(10) 単語、(11)〜(17) 熟語）× ${T2.length} セット。`},
  tp2:{sets:TP2, gl:TP2G, g:'p2', key:'tango-tp2', np:'(1)〜(15)', lead:`英検準２級レベルの単語・熟語の例文から作った4択問題です。1セット15問（(1)〜(10) 単語、(11)〜(15) 熟語）× ${TP2.length} セット。`},
  t3:{sets:TP3, gl:TP3G, g:'3', key:'tango-t3', np:'(1)〜(15)', lead:`英検３級レベルの単語の例文から作った4択問題です。1セット15問（すべて単語）× ${TP3.length} セット。`}
};
const tScores=m=>{try{return JSON.parse(store.get(TT[m].key)||'{}')}catch(e){return {}}};
function renderTests(m){
  const T=TT[m], sc=tScores(m), N=T.sets[0].length;
  $('main').innerHTML = `<div class="tsets">${T.sets.map((_,k)=>{const r=sc[k+1], d=r!=null;
    return `<button class="tset${d?' done':''}" type="button" data-n="${k+1}">第${k+1}回<small>${d?r+' / '+N:N+'問'}</small></button>`;}).join('')}</div>`;
  $('main').querySelectorAll('.tset').forEach(b=>b.onclick=()=>{location.hash='#'+m+'/'+b.dataset.n;});
}
function renderTest(m,n){
  const T=TT[m], E=G[T.g];
  const Q=T.sets[n-1].map(([k,a,b,idx,txt])=>({en:E[k].en, ja:E[k].ja, a, b, ans:k, idx, txt})), sel=new Array(Q.length).fill(-1);
  const hw=x=>E[x].h;
  $('main').innerHTML = `
    <button class="back" type="button" id="back">← セット一覧へ</button>
    <div class="thead"><h2>第${n}回</h2><span class="tscore" id="tscore"></span></div>
    <p class="tnote">次の${T.np.replace('〜','から')}までの(　)に入れるのに最も適切なものを1, 2, 3, 4の中から一つ選びなさい。</p>
    <div class="bar">
      <button class="btn primary" type="button" id="grade">採点する</button>
      <button class="btn" type="button" id="allans" aria-pressed="false">答えと解説をすべて表示</button>
      <button class="btn" type="button" id="reset">やり直す</button>
    </div>
    ${Q.map((q,k)=>{const c=q.idx.indexOf(q.ans); return `
    <div class="tq" data-k="${k}">
      <div class="qs" lang="en"><b>(${k+1})</b><span>${esc(q.en.slice(0,q.a))}<span class="blank">(<i></i>)</span>${esc(q.en.slice(q.b))}</span></div>
      <div class="opts${q.txt.some(x=>x.length>14)?' long':''}">${q.txt.map((x,j)=>`<button class="opt" type="button" data-j="${j}" aria-pressed="false" lang="en"><i>${j+1}</i>${esc(x)}</button>`).join('')}</div>
      <div class="acts"><button class="btn ex" type="button" aria-pressed="false">答えと解説</button><span class="mark"></span></div>
      <div class="expl" hidden>
        <div class="ans">正解 ${c+1}　<span lang="en">${esc(q.txt[c])}</span></div>
        <div class="en" lang="en">${highlight(q.en,[[q.a,q.b]])}</div>
        <div class="ja">${esc(q.ja)}</div>
        <ul>${q.idx.map((x,j)=>`<li class="${x===q.ans?'c':''}">${j+1}　<b lang="en">${esc(q.txt[j])}</b>${q.txt[j].toLowerCase()!==hw(x).replace(/\s*\(?~\)?$/,'').toLowerCase()?` <span class="hw">（${esc(hw(x))}）</span>`:''}：${esc(T.gl[x]||'')}${x===q.ans?'　← 正解':''}</li>`).join('')}</ul>
        <div class="acts" style="margin:8px 0 0"><button class="btn say" type="button">🔊 例文を読み上げ</button></div>
      </div>
    </div>`;}).join('')}
    <div class="bar" style="justify-content:center;margin-top:16px"><button class="btn primary" type="button" id="grade2">採点する</button></div>
    <div class="wnav">
      ${n>1?`<button class="btn" type="button" data-n="${n-1}">◀ 第${n-1}回</button>`:'<span></span>'}
      ${n<T.sets.length?`<button class="btn" type="button" data-n="${n+1}">第${n+1}回 ▶</button>`:'<span></span>'}
    </div>`;
  const cards=[...$('main').querySelectorAll('.tq')];
  const show=(k,on)=>{const c=cards[k], a=Q[k].idx.indexOf(Q[k].ans);
    c.querySelector('.expl').hidden=!on; const b=c.querySelector('.ex'); b.setAttribute('aria-pressed',on); b.textContent=on?'解説を隠す':'答えと解説';
    c.querySelectorAll('.opt').forEach((o,j)=>{o.classList.toggle('ok',on&&j===a); o.classList.toggle('ng',on&&j===sel[k]&&j!==a);});
    const mk=c.querySelector('.mark'); mk.className='mark'; mk.textContent='';
    if(on&&sel[k]>=0){ const r=sel[k]===a; mk.classList.add(r?'ok':'ng'); mk.textContent=r?'○ 正解':'× 不正解'; } };
  cards.forEach((c,k)=>{
    c.querySelectorAll('.opt').forEach(o=>o.onclick=()=>{ sel[k]=+o.dataset.j;
      c.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed',String(x===o)));
      if(!c.querySelector('.expl').hidden) show(k,true); });
    c.querySelector('.ex').onclick=e=>show(k,e.currentTarget.getAttribute('aria-pressed')!=='true');
    c.querySelector('.say').onclick=()=>{stop(); speak(Q[k].en,c);};
  });
  const gradeIt=()=>{ const left=sel.filter(x=>x<0).length;
    if(left && !confirm(`まだ ${left} 問が未回答です。採点しますか？`)) return;
    let ok=0; Q.forEach((q,k)=>{ if(sel[k]===q.idx.indexOf(q.ans)) ok++; show(k,true); });
    $('tscore').textContent=`${ok} / ${Q.length} 問正解`;
    const sc=tScores(m); sc[n]=ok; store.set(T.key,JSON.stringify(sc));
    $('allans').setAttribute('aria-pressed','true'); $('allans').textContent='答えと解説をすべて隠す';
    toTop(); };
  $('grade').onclick=gradeIt; $('grade2').onclick=gradeIt;
  $('allans').onclick=e=>{const on=e.currentTarget.getAttribute('aria-pressed')!=='true';
    e.currentTarget.setAttribute('aria-pressed',on); e.currentTarget.textContent=on?'答えと解説をすべて隠す':'答えと解説をすべて表示';
    cards.forEach((_,k)=>show(k,on));};
  $('reset').onclick=()=>{ sel.fill(-1); $('tscore').textContent='';
    cards.forEach((c,k)=>{ c.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-pressed','false')); show(k,false); });
    $('allans').setAttribute('aria-pressed','false'); $('allans').textContent='答えと解説をすべて表示'; toTop(); };
  $('back').onclick=()=>{location.hash='#'+m;};
  $('main').querySelectorAll('.wnav .btn').forEach(b=>b.onclick=()=>{location.hash='#'+m+'/'+b.dataset.n;});
  toTop();
}
function route(){
  stop();
  const h=decodeURIComponent(location.hash.slice(1));
  const m=h.match(/^g(5|4|3|p2|2)(?:\/(.*))?$/);
  cur=null; tset=0;
  const mt=h.match(/^(t2|tp2|t3)(?:\/(\d+))?$/);
  if(mt){ const m=mt[1], T=TT[m]; grade=m; store.set('tango-pos', h);
    $('grades').querySelectorAll('.grade').forEach(b=>b.setAttribute('aria-pressed', String(b.dataset.g===m)));
    $('gtools').hidden = false; $('aznav').hidden = true;
    $('gtools').querySelector('.tools').style.display='none';
    $('lead').textContent = T.lead;
    const n=+(mt[2]||0); if(n>=1&&n<=T.sets.length){ tset=n; renderTest(m,n); } else renderTests(m); return; }
  $('gtools').querySelector('.tools').style.display='';
  if(!m){ grade=null; renderGrades(); $('main').innerHTML='<p class="hint">上のボタンでレベルを選んでください。</p>'; store.set('tango-pos',''); return; }
  grade=m[1]; const rest=m[2]||'A';
  store.set('tango-pos', h);
  if(rest.startsWith('w=')){ const w=W()[Number(rest.slice(2))]; if(w){ cur=w; if(!query) letter=w.L; renderGrades(); renderAZ(); renderDetail(w); return; } }
  else if(rest.startsWith('q=')){ query=rest.slice(2); $('q').value=query; }
  else if(/^[A-Z]$/.test(rest)){ letter=rest; query=''; $('q').value=''; }
  renderGrades(); renderAZ(); renderList();
}
let qt;
$('q').addEventListener('input',e=>{clearTimeout(qt); qt=setTimeout(()=>{query=e.target.value.trim(); history.replaceState(null,'','#g'+grade+'/'+(query?'q='+encodeURIComponent(query):letter)); route();},150);});
window.addEventListener('hashchange',route);
function toTop(){ if (EMBED) parent.postMessage({ sub: true, t: "top" }, "*"); else window.scrollTo(0,0); }
if (EMBED) {
  const post = () => parent.postMessage({ sub: true, t: "h", h: Math.ceil(document.documentElement.getBoundingClientRect().height) }, "*");
  new ResizeObserver(post).observe(document.body); window.addEventListener("load", post);
  window.addEventListener("message", e => {
    const d = e.data || {};
    if (d.t === "theme") document.documentElement.dataset.theme = d.dark ? "dark" : "light";
    if (d.t === "stop") { try { stop(); } catch (er) {} }
  });
}
if (!location.hash) { const p=store.get('tango-pos'); if (p) history.replaceState(null,'','#'+p); }
route();
if (EMBED) parent.postMessage({ sub: true, t: "ready" }, "*");
</script>
</body>
