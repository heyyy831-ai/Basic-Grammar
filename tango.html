<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
  --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
  --violet:#6B5BA8; --violet-soft:#ECE8F6; --hl:#FFF0B8; --hl-line:#E9C46A;
  --en:"Crimson Pro","Georgia","Times New Roman",serif;
  --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
  --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
  --violet:#B3A6E8; --violet-soft:#2A2540; --hl:#4A3F17; --hl-line:#C9A443;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.8;-webkit-font-smoothing:antialiased}
.wrap{max-width:900px;margin:0 auto;padding:0 16px 80px}
button{font:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}

header{padding:28px 0 10px}
.kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px}
.badge{background:var(--navy);color:var(--paper);border-radius:6px;padding:5px 11px;line-height:1.15;font-weight:700;font-size:13px}
.theme{margin-left:auto;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}
h1{font-size:clamp(22px,5vw,30px);line-height:1.35;margin:12px 0 4px;letter-spacing:.01em}
.lead{color:var(--ink-2);margin:0;font-size:14px}

.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:16px 0 4px}
.search{flex:1 1 220px;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:9px 12px;font:inherit;font-family:var(--en);font-size:17px;color:var(--ink)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--ink-3)}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--ink-3);background:var(--soft)}
.chip i{font-style:normal;display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px;vertical-align:1px}

.az{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule);margin:10px -16px 0;padding:8px 16px}
.az-in{display:grid;grid-template-columns:repeat(13,1fr);gap:4px;max-width:900px;margin:0 auto}
.az button{border:0;background:transparent;border-radius:8px;padding:5px 0;font-family:var(--en);font-weight:700;font-size:18px;color:var(--ink-2)}
.az button:hover{background:var(--soft)}
.az button.on{background:var(--navy);color:var(--paper)}
.az button:disabled{opacity:.3;cursor:default}

.lettertitle{display:flex;align-items:baseline;gap:12px;margin:22px 0 10px}
.lettertitle b{font-family:var(--en);font-size:44px;line-height:1;color:var(--navy)}
.lettertitle span{color:var(--ink-3);font-size:13px}
.words{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px}
.w{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:7px 10px;min-width:0}
.w:hover{border-color:var(--ink-3)}
.w .hw{font-family:var(--en);font-size:18px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.w .n{font-size:11.5px;color:var(--ink-3)}
.lv{flex:none;font-size:10.5px;font-weight:700;border-radius:5px;padding:1px 6px;line-height:1.5;letter-spacing:.02em}
.lv.B1{background:var(--green-soft);color:var(--green)}
.lv.B2{background:var(--orange-soft);color:var(--orange)}
.lv.C1,.lv.C2,.lv.C1p{background:var(--violet-soft);color:var(--violet)}
.empty{color:var(--ink-3);padding:30px 0;text-align:center}

/* detail */
.back{border:1px solid var(--rule);background:var(--paper);border-radius:99px;padding:5px 14px;font-size:13px;font-weight:700;color:var(--ink-2);margin-top:20px}
.dhead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:14px 0 6px}
.dhead h2{font-family:var(--en);font-size:clamp(32px,8vw,44px);margin:0;line-height:1.1}
.dhead .lv{font-size:12px;padding:3px 9px}
.dsub{color:var(--ink-3);font-size:13px}
.bar{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 16px}
.btn{border:1px solid var(--rule);background:var(--paper);border-radius:8px;padding:6px 12px;font-size:13px;font-weight:700;color:var(--ink-2)}
.btn:hover{border-color:var(--ink-3);color:var(--ink)}
.btn.primary{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.btn[aria-pressed="true"]{background:var(--soft);color:var(--ink);border-color:var(--ink-3)}
.vsel{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;color:var(--ink-2)}
.vsel select{max-width:220px;border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:8px;padding:5px 8px;font:inherit;font-weight:500}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px 12px}
.card.playing{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.loc{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--ink-3);font-weight:500}
.loc .tag{background:var(--soft);border:1px solid var(--rule);border-radius:5px;padding:0 7px}
.loc .adv{background:var(--orange-soft);color:var(--orange);border-radius:5px;padding:0 7px;font-weight:700}
.loc .src{background:var(--green-soft);color:var(--green);border-radius:5px;padding:0 7px;font-weight:700}
.w.ph .hw{font-style:italic;white-space:normal;overflow:visible;line-height:1.3}
.w.wide{grid-column:span 2}
.loc .app{background:var(--navy);color:var(--paper);border-radius:5px;padding:0 7px;font-weight:700}
.en{font-family:var(--en);font-size:21px;line-height:1.45;margin:6px 0 8px;overflow-wrap:anywhere}
.en mark{background:linear-gradient(transparent 58%,var(--hl) 58%);color:inherit;font-weight:700;padding:0 1px}
.ja{color:var(--ink-2);font-size:14.5px;border-left:3px solid var(--hl-line);padding:2px 0 2px 10px;margin:0 0 8px}
.ja[hidden]{display:none}
.acts{display:flex;gap:6px}
.embed header{padding-top:6px}
.embed .kicker{display:none}
.embed .az{position:static;backdrop-filter:none;background:transparent}
.foot{margin-top:48px;color:var(--ink-3);font-size:12px;line-height:1.7;border-top:1px solid var(--rule);padding-top:14px}
.foot a{color:var(--ink-2)}
@media (max-width:560px){
  .az-in{grid-template-columns:repeat(9,1fr)}
  .az button{font-size:16px}
  .words{grid-template-columns:repeat(auto-fill,minmax(135px,1fr))}
  .en{font-size:19.5px}
}

.vbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin:10px 0 2px}.vbar .vnote{font-size:12px;color:var(--ink-3)}.vbar .vpick{max-width:280px}
.grades{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px;margin:14px 0 4px}
.grades .grade .lv{font-size:inherit;font-weight:inherit;color:inherit;letter-spacing:inherit;margin:0;padding:0;background:none}
@media (max-width:560px){.grades{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.grades .grade{padding:8px 2px;font-size:14px;min-width:0}.grades .lv{display:none}}
.grade{border:2px solid var(--rule);background:var(--paper);border-radius:12px;padding:10px 6px;font-size:15px;white-space:nowrap;font-weight:700;color:var(--ink-2)}
.grade:hover{border-color:var(--ink-3);color:var(--ink)}
.grade[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.grade small{display:block;font-size:11.5px;font-weight:500;opacity:.8}
.wnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
.wnav .btn{max-width:48%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tsets{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px;margin:18px 0}
.tset{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 6px;text-align:center;font-weight:700;color:var(--ink-2);line-height:1.35}
.tset:hover{border-color:var(--ink-3);color:var(--ink)}
.tset small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-3)}
.tset.done small{color:var(--green);font-weight:700}
.thead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 14px;margin:14px 0 4px}
.thead h2{margin:0;font-size:clamp(22px,5vw,28px)}
.tscore{font-weight:700;color:var(--green);font-size:15px}
.tnote{color:var(--ink-3);font-size:13px;margin:0 0 10px}
.tq{background:var(--paper);border:1px solid var(--rule);border-radius:12px;padding:12px 16px;margin:0 0 10px}
.tq.playing{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.tq .qs{display:flex;gap:10px;font-family:var(--en);font-size:20px;line-height:1.5}
.tq .qs b{flex:none;font-style:italic;color:var(--navy);min-width:2.2em}
.tq .qs span{overflow-wrap:anywhere}
.tq .blank{white-space:nowrap}.tq .blank i{display:inline-block;width:5em}
.opts{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0 8px 2.6em}
.opts.long{grid-template-columns:repeat(2,1fr)}
.opt{display:flex;gap:8px;align-items:baseline;text-align:left;border:1px solid var(--rule);background:var(--soft);border-radius:8px;padding:6px 10px;font-family:var(--en);font-size:17.5px;line-height:1.3;min-width:0}
.opt i{font-style:normal;font-weight:700;font-family:var(--jp);font-size:13px;color:var(--ink-3)}
.opt:hover{border-color:var(--ink-3)}
.opt[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
.opt[aria-pressed="true"] i{color:var(--paper)}
.opt.ok{background:var(--green-soft);border-color:var(--green);color:var(--ink)}
.opt.ok i{color:var(--green)}
.opt.ng{background:var(--orange-soft);border-color:var(--orange);color:var(--ink);text-decoration:line-through}
.opt.ng i{color:var(--orange)}
.tq .acts{margin-left:2.6em}
.mark{font-weight:700;font-size:14px;margin-left:6px}
.mark.ok{color:var(--green)}.mark.ng{color:var(--orange)}
.expl{margin:10px 0 2px 2.6em;padding:10px 14px;background:var(--soft);border-radius:10px;border-left:4px solid var(--green);font-size:14px;line-height:1.75}
.expl[hidden]{display:none}
.expl .ans{font-weight:700;color:var(--green);margin-bottom:4px}
.expl .ans span{font-family:var(--en);font-size:18px}
.expl .en{font-size:18.5px;margin:2px 0 4px}
.expl .ja{margin:0 0 8px}
.expl ul{margin:0;padding:0;list-style:none}
.expl li{padding:1px 0}
.expl li b{font-family:var(--en);font-size:16.5px}
.expl li .hw{color:var(--ink-3);font-family:var(--en);font-size:14.5px}
.expl li.c b{color:var(--green)}
@media (max-width:560px){.opts,.opts.long{grid-template-columns:1fr 1fr;margin-left:0}.tq .acts,.expl{margin-left:0}.tq .qs{font-size:18.5px}}
@media (max-width:380px){.opts,.opts.long{grid-template-columns:1fr}}
.grade.tq2{white-space:normal;line-height:1.3}
.hint{color:var(--ink-3);font-size:14px;padding:26px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="kicker"><span class="badge">単語帳</span><span>英検レベル別 単語・熟語</span>
      <button class="theme" id="theme" type="button">表示切替</button></div>
    <h1>単語帳</h1>
    <div class="grades" id="grades">
      <button class="grade" type="button" data-g="5" aria-pressed="false">英検５級<span class="lv">レベル</span><small id="n5"></small></button>
      <button class="grade" type="button" data-g="4" aria-pressed="false">英検４級<span class="lv">レベル</span><small id="n4"></small></button>
      <button class="grade" type="button" data-g="3" aria-pressed="false">英検３級<span class="lv">レベル</span><small id="n3"></small></button>
      <button class="grade tq2" type="button" data-g="t3" aria-pressed="false">英検３級４択テスト<small id="nt3"></small></button>
      <button class="grade" type="button" data-g="p2" aria-pressed="false">英検準２級<span class="lv">レベル</span><small id="np2"></small></button>
      <button class="grade tq2" type="button" data-g="tp2" aria-pressed="false">英検準２級４択テスト<small id="ntp2"></small></button>
      <button class="grade" type="button" data-g="2" aria-pressed="false">英検２級<span class="lv">レベル</span><small id="n2"></small></button>
      <button class="grade tq2" type="button" data-g="t2" aria-pressed="false">英検２級４択テスト<small id="nt2"></small></button>
    </div>
    <div class="vbar">
      <label class="vsel">声<select class="vpick" aria-label="読み上げの声"></select></label>
      <button class="btn" type="button" id="vtest">試聴</button>
      <span class="vnote">★ は自然な音声（Google・Microsoft Natural など）</span>
    </div>
    <div id="gtools" hidden>
      <p class="lead" id="lead"></p>
      <div class="tools">
        <input class="search" id="q" type="search" placeholder="語・句を検索（例：apple, get up）" autocomplete="off" autocapitalize="off" spellcheck="false">
        <div class="chips" id="tychips"></div>
      </div>
    </div>
  </header>
  <nav class="az" aria-label="アルファベット索引" id="aznav" hidden><div class="az-in" id="az"></div></nav>
  <main id="main"><p class="hint">上のボタンでレベルを選んでください。</p></main>
</div>
<script>
const EMBED = window.parent !== window;
if (EMBED) document.documentElement.classList.add('embed');

ed to wear uniforms?","制服を着る必要はありますか。",[[19,27]],"U"],["until","Please wait here until five because I'm still at work.","まだ仕事中なので、5時までここで待っていてください。",[[17,22]],"U"],["useful","That's really useful, so I'll write it down for later.","とても役立つので、後のために書き留めておきます。",[[14,20]],"U"],["usual","Let's meet at the usual place.","いつもの場所で会いましょう。",[[18,23]],"U"],["usually","I usually get up at seven.","私はたいてい7時に起きます。",[[2,9]],"U"],["vacation","My summer vacation starts tomorrow, so I'll visit my aunt.","明日から夏休みなので、おばを訪ねます。",[[10,18]],"V"],["vegetable","Do you want vegetables with that?","それに野菜も付けますか。",[[12,22]],"V"],["video","Let's watch this video to learn how to make pizza.","この動画を見て、ピザの作り方を学びましょう。",[[17,22]],"V"],["visit","I visit my grandmother on Sundays.","私は日曜日に祖母を訪ねます。",[[2,7]],"V"],["volleyball","We play volleyball at school during the lunch break.","学校では、昼休みにバレーボールをします。",[[8,18]],"V"],["volunteer","I'd like to work as a volunteer.","ボランティアとして働きたいです。",[[22,31]],"V"],["wait","Can you wait a minute while I finish this e-mail?","このメールを書き終えるまで、ちょっと待ってもらえますか。",[[8,12]],"W"],["wait for ~","Please wait for me near the front door after class.","授業の後、玄関のドアの近くで待っていてください。",[[7,11],[12,15]],"W"],["waiter","Let's ask the waiter if we can pay by card.","カードで払えるか、ウエーターに聞きましょう。",[[14,20]],"W"],["waitress","Let's ask the waitress if the soup contains any milk.","スープに牛乳が入っているか、ウエートレスに聞きましょう。",[[14,22]],"W"],["wake","Please wake me at seven because I have an early train.","朝早い電車に乗るので、7時に起こしてください。",[[7,11]],"W"],["wake up","What time do you wake up?","何時に目を覚ましますか。",[[17,21],[22,24]],"W"],["walk to ~","I walk to school every day.","私は毎日歩いて学校に行きます。",[[2,6],[7,9]],"W"],["want to do","I want to play soccer after I finish my homework.","宿題が終わったら、サッカーをしたいです。",[[2,6],[7,9]],"W"],["warm","It's warm today, so we can eat lunch in the garden.","今日は暖かいので、庭で昼食を食べられます。",[[5,9]],"W"],["wash","Please wash your hands before you sit down to eat.","食事のために席に着く前に、手を洗ってください。",[[7,11]],"W"],["watch","Is your watch right, or is it running fast?","あなたの時計は合っていますか、それとも進んでいますか。",[[8,13]],"W"],["water","Can I have some water, please?","お水をいただけますか。",[[16,21]],"W"],["watermelon","Would you like some watermelon after we finish eating lunch?","昼食が終わったら、スイカはいかがですか。",[[20,30]],"W"],["way","Is this the way to the station?","駅へはこの道で合っていますか。",[[12,15]],"W"],["wear","What do you want to wear?","何を着たいですか。",[[20,24]],"W"],["weather","What's the weather like there at the moment?","今、そちらの天気はどうですか。",[[11,18]],"W"],["weekend","What do you do on weekends?","あなたは週末に何をしますか。",[[18,26]],"W"],["welcome","You're always welcome here, even if you don't call first.","先に電話をしなくても、いつでも来てくださいね。",[[14,21]],"W"],["well","You sing really well, so why not join our band?","歌がとても上手なので、私たちのバンドに入りませんか。",[[16,20]],"W"],["whale","We saw a whale from the boat.","船からクジラが見えました。",[[9,14]],"W"],["wife","How is your wife, and is she enjoying her new job?","奥さんはお元気ですか。新しい仕事は楽しんでいますか。",[[12,16]],"W"],["will","I will call you tomorrow after I finish work.","明日、仕事が終わったら電話します。",[[2,6]],"W"],["win","I hope we win this game.","この試合に勝てるといいですね。",[[10,13]],"W"],["window","Please open the window because the kitchen is getting hot.","台所が暑くなってきたので、窓を開けてください。",[[16,22]],"W"],["windy","It's windy today, so be careful with your umbrella.","今日は風が強いので、傘に気をつけてください。",[[5,10]],"W"],["with","I play tennis with my father.","私は父とテニスをします。",[[14,18]],"W"],["wonderful","Have a wonderful time, and tell us about it afterward.","楽しんできて、後で話を聞かせてくださいね。",[[7,16]],"W"],["word","What does this word mean in the sentence on the board?","黒板の文では、この単語はどんな意味ですか。",[[15,19]],"W"],["work","My father works at a bank.","父は銀行で働いています。",[[10,15]],"W"],["world","I want to travel around the world.","私は世界中を旅行したいです。",[[28,33]],"W"],["worry","Don't worry about me because I can get home by myself.","一人で帰れるので、私のことは心配しないでください。",[[6,11]],"W"],["worry about ~","Don't worry about the test because there's still time to study.","まだ勉強する時間があるので、テストのことは心配しないでください。",[[6,11],[12,17]],"W"],["wou arted walking.","いつものようにバスが遅れているので、歩き始めました。",[[16,18],[19,24]],"A"],["as you know","As you know, I've been working here for a year.","ご存じのように、ここで働いて1年になります。",[[0,2],[3,6],[7,11]],"A"],["ask A to do","I've asked Ken to bring the book you wanted.","欲しがっていた本を持ってくるよう、ケンに頼みました。",[[5,10],[15,17]],"A"],["ask (A) for ～","I've asked the staff for a map of this area.","この辺りの地図を、係の人にお願いしました。",[[5,10],[21,24]],"A"],["asleep","I found my son asleep on the sofa again.","また息子がソファで寝ているのを見つけました。",[[15,21]],"A"],["at a time","Please send the photos one at a time.","写真は1枚ずつ送ってください。",[[27,29],[30,31],[32,36]],"A"],["at first","I was shy at first, but I've made some friends.","最初は人見知りしていましたが、友達が何人かできました。",[[10,12],[13,18]],"A"],["at last","At last, we've found a place that's big enough.","やっと、十分な広さのある場所が見つかりました。",[[0,2],[3,7]],"A"],["at least","I've reminded him at least three times about the meeting.","会議のことは、少なくとも3回は彼に念を押しました。",[[18,20],[21,26]],"A"],["at once","The teacher told us to leave the room at once.","先生は私たちに、すぐ部屋を出るように言いました。",[[38,40],[41,45]],"A"],["at school","I've left my jacket at school, so I'm going back.","学校に上着を忘れたので、取りに戻ります。",[[20,22],[23,29]],"A"],["at the age of ～","I learned to swim at the age of seven.","7歳のときに、泳げるようになりました。",[[18,20],[21,24],[25,28],[29,31]],"A"],["at the end of ～","I've written my phone number at the end of the letter.","手紙の最後に、電話番号を書いておきました。",[[29,31],[32,35],[36,39],[40,42]],"A"],["at the foot of ～","We've booked a cabin at the foot of the mountain.","山のふもとにある小屋を、予約しました。",[[21,23],[24,27],[28,32],[33,35]],"A"],["athlete","She's an athlete who has competed in several countries.","彼女はいくつもの国で試合に出てきた選手です。",[[9,16]],"A"],["attack","My dog was attacked by another dog at the park.","公園で、うちの犬が別の犬に襲われました。",[[11,19]],"A"],["attend","I've never attended a wedding held outside before.","屋外で行われる結婚式に出席するのは初めてです。",[[11,19]],"A"],["aunt","My aunt is a teacher.","おばは先生です。",[[3,7]],"A"],["award","That's the award my brother won for his photograph.","それは兄が写真で受賞 kery you recommended.","勧めてくれたパン屋さんで、焼きたてのパンを買いました。",[[17,22]],"F"],["fridge","I've put the milk you bought in the fridge.","買ってきてくれた牛乳は、冷蔵庫に入れました。",[[36,42]],"F"],["friendly","Everyone I've met in this town has been friendly.","この町で出会った人は、みんな親しみやすい人ばかりです。",[[40,48]],"F"],["friendship","Our friendship has grown stronger since we started working together.","一緒に働き始めてから、友情が深まりました。",[[4,14]],"F"],["from A to B","I've walked from the station to the beach today.","今日は、駅から海岸まで歩きました。",[[12,16],[29,31]],"F"],["from abroad","A friend from abroad has asked us to show him around.","海外から来た友達に、案内を頼まれました。",[[9,13],[14,20]],"F"],["from beginning to end","I've read your report from beginning to end twice.","あなたの報告書を、最初から最後まで2回読みました。",[[22,26],[27,36],[37,39],[40,43]],"F"],["fruit","Would you like some fruit?","果物はいかがですか。",[[20,25]],"F"],["full","I'm full, thank you.","もうおなかいっぱいです。ありがとう。",[[4,8]],"F"],["fun","Have fun at the party!","パーティーを楽しんできてね！",[[5,8]],"F"],["funny","The story was so funny that everyone started laughing.","その話がとてもおかしくて、みんな笑い始めました。",[[17,22]],"F"],["furniture","We've bought some furniture that was made in this town.","この町で作られた家具を、いくつか買いました。",[[18,27]],"F"],["future","I've been thinking about what I'd like to do in the future.","将来何をしたいか、ずっと考えています。",[[52,58]],"F"],["garbage","I've taken out the garbage, so you don't need to.","ごみは出しておいたので、あなたは出さなくて大丈夫です。",[[19,26]],"G"],["garden","Let's have lunch in the garden.","庭で昼食を食べましょう。",[[24,30]],"G"],["gate","The gate has been locked, and I don't have a key.","門に鍵が掛かっていて、私は鍵を持っていません。",[[4,8]],"G"],["generation","My grandmother's generation didn't have the phones we use today.","祖母の世代には、今私たちが使っている電話はありませんでした。",[[17,27]],"G"],["German","The song we've been listening to is in German.","今まで聴いていた曲は、ドイツ語の歌です。",[[39,45]],"G"],["gesture","I didn't understand the gesture he made with his hand.","彼が手でした身ぶりの意味が分かりませんでした。",[[24,31]],"G"],["get a good grade","I've worked hard because I want to get a good grade.","いい成績を取りたいので、一生懸命取り組んできました。",[[35,38],[39,40],[41,45],[46,51]],"G"],["get a perfect score","I've never gotten a perfect score on this quiz.","このクイズで満点を取ったことは、まだありません。",[[11,17],[18,19],[20,27],[28,33]],"G"],["get angry","I get angry when people leave the door standing open.","ドアを開けたままにされると、腹が立ちます。",[[2,5],[6,11]],"G"],["get away from ～","I'd like to get away from the city for a while.","しばらく、都会を離れて過ごしたいです。",[[12,15],[16,20],[21,25]],"G"],["get back (from ～)","I've just got back from the trip I told you about.","話していた旅行から、今帰ってきたところです。",[[10,13],[14,18]],"G"],["get better","My ankle has got better, so I can walk again.","足首がよくなって、また歩けるようになりました。",[[13,16],[17,23]],"G"],["get cold","It's got cold, so I've brought the plants inside.","寒くなったので、植物を中に入れました。",[[5,8],[9,13]],"G"],["get dark","It's getting dark, and we still haven't found the path.","暗くなってきましたが、まだ道が見つかりません。",[[5,12],[13,17]],"G"],["get excited","The children get excited when they see the presents I've bought.","買ってきたプレゼントを見ると、子どもたちは大喜びします。",[[13,16],[17,24]],"G"],["get home","I'll call you when I've got home safely.","無事に家に着いたら、電話します。",[[24,27],[28,32]],"G"],["get hungry","I've been getting hungry earlier since I started swimming.","水泳を始めてから、早い時間におなかがすくようになりました。",[[10,17],[18,24]],"G"],["get in ～","We got in the car that was waiting outside.","外で待っていた車に、乗り込みました。",[[3,6],[7,9]],"G"],["get off (～)","Could you tell me where to get off the bus?","バスをどこで降りればいいか、教えてもらえますか。",[[27,30],[31,34]],"G"],["get on (～)","We've got on the wrong train, so let's get off.","電車を間違えたので、降りましょう。",[[6,9],[10,12]],"G"],["get out of ～","I heard someone get out of the car outside.","外で、誰かが車から降りる音が聞こえました。",[[16,19],[20,23],[24,26]],"G"],["get to ～","Could you explain how to get to the place you've booked?","予約してくれた場所への行き方を、説明してもらえますか。",[[25,28],[29,31]],"G"],["get well","I hope you get well before the trip we've planned.","計画している旅行までに、元気になるといいですね。",[[11,14],[15,19]],"G"],["gift","Thanks for the lovely gift!","すてきな贈り物をありがとう！",[[22,26]],"G"],["give","Can you give me a hand?","ちょっと手伝ってくれますか。",[[8,12]],"G"],["give A a ride","I'd give you a ride if my car weren't being repaired.","車が修理中でなければ、乗せていってあげるのですが。",[[4,8],[13,14],[15,19]],"G"],["give back ～","I've given back all the books I borrowed from Ken.","ケンから借りた本は、全部返しました。",[[5,10],[11,15]],"G"],["give up doing","I've given up trying to fix this old printer.","この古いプリンターを直そうとするのは、諦めました。",[[5,10],[11,13],[14,20]],"G"],["glad","I'm glad you've found a job you really like.","本当に好きな仕事が見つかって、よかったですね。",[[4,8]],"G"],["glass","Can I have a clean glass?","きれいなコップをもらえますか。",[[19,24]],"G"],["glove","Have you seen the glove I dropped near the bench?","ベンチの近くに落とした手袋を見ませんでしたか。",[[18,23]],"G"],["go [walk] straight","Go straight until you reach the bridge shown on this map.","この地図の橋に着くまで、まっすぐ進んでください。",[[0,2],[3,11]],"G"],["go abroad","I've always wanted to go abroad with my best friend.","親友と海外へ行きたいと、ずっと思っています。",[[22,24],[25,31]],"G"],["go and do","Could you go and check which windows are still open?","まだ開いている窓がどれか、見てきてもらえますか。",[[10,12],[13,16]],"G"],["go away","The pain hasn't gone away, so I've called the doctor.","痛みが治まらないので、医師に電話しました。",[[16,20],[21,25]],"G"],["go back home","I've decided to go back home after I graduate.","卒業したら、故郷に帰ることにしました。",[[16,18],[19,23],[24,28]],"G"],["go by","A year has gone by since we moved here.","ここに引っ越してから、1年がたちました。",[[11,15],[16,18]],"G"],["go fishing","Have you ever gone fishing with the people from work?","職場の人たちと、釣りに行ったことはありますか。",[[14,18],[19,26]],"G"],["go for a walk","I'd go for a walk if it weren't raining.","雨が降っていなければ、散歩に行くのですが。",[[4,6],[7,10],[11,12],[13,17]],"G"],["go home","I've told Ken to go home before it gets dark.","暗くなる前に帰るよう、ケンに言いました。",[[17,19],[20,24]],"G"],["go into ～","I saw someone go into the room you've just cleaned.","今掃除したばかりの部屋に、誰かが入るのを見ました。",[[14,16],[17,21]],"G"],["go on a tour","We've decided to go on a tour of the castle.","お城を見学するツアーに、参加することにしました。",[[17,19],[20,22],[23,24],[25,29]],"G"],["go on a trip","I've never gone on a trip without taking my camera.","カメラを持たずに旅行したことは、一度もありません。",[[11,15],[16,18],[19,20],[21,25]],"G"],["go out (for ～)","We've decided to go out for dinner after the meeting.","会議の後は、夕食を食べに出かけることにしました。",[[17,19],[20,23]],"G"],["go shopping","I've made a list, so we're ready to go shopping.","リストを作ったので、買い物に行けます。",[[36,38],[39,47]],"G"],["go to bed","I've finished everything, so I'm going to bed now.","全部終わったので、もう寝ます。",[[33,38],[39,41],[42,45]],"G"],["go to see a movie","I've asked Ken to go to see a movie with us.","私たちと映画を見に行かないか、ケンを誘いました。",[[18,20],[21,23],[24,27],[28,29],[30,35]],"G"],["go to sleep","The baby has gone to sleep, so please speak quietly.","赤ちゃんが眠ったので、静かに話してください。",[[13,17],[18,20],[21,26]],"G"],["go to the doctor","I've decided to go to the doctor about this cough.","このせきを診てもらいに、病院へ行くことにしました。",[[16,18],[19,21],[22,25],[26,32]],"G"],["go to work","I've been going to work by bike since last month.","先月から、自転車で通勤しています。",[[10,15],[16,18],[19,23]],"G"],["goal","I've finally reached the goal I set last year.","去年決めた目標を、ようやく達成しました。",[[25,29]],"G"],["god","Do you know which god the people here pray to?","この土地の人々がどの神様に祈るか知っていますか。",[[18,21]],"G"],["goldfish","The goldfish we bought last summer has grown a lot.","去年の夏に買った金魚が、ずいぶん大きくなりました。",[[4,12]],"G"],["government","The government has announced a plan to repair this road.","政府は、この道路を修理する計画を発表しました。",[[4,14]],"G"],["grade","What grade are you in?","何年生ですか。",[[5,10]],"G"],["graduate","I've kept in touch with my friends since we graduated.","卒業してからも、友達とはずっと連絡を取り合っています。",[[44,53]],"G"],["graduate from ～","It's been three years since I graduated from this school.","この学校を卒業してから、3年になります。",[[30,39],[40,44]],"G"],["gram","Add ten grams of sugar.","砂糖を10グラム加えてください。",[[8,13]],"G"],["grandfather","My grandfather is very kind.","祖父はとても親切です。",[[3,14]],"G"],["grandmother","My grandmother likes flowers.","祖母は花が好きです。",[[3,14]],"G"],["grandparent","I've learned how to make the bread my grandparents used to bake.","祖父母がよく焼いていたパンの作り方を、覚え ]],"H"],["have a cold","I've had a cold since I got back from the trip.","旅行から帰ってきてから、ずっと風邪をひいています。",[[5,8],[9,10],[11,15]],"H"],["have a dream","I've had the same dream about missing a train twice.","電車に乗り遅れる同じ夢を、2回見ました。",[[0,4],[5,8],[18,23]],"H"],["have a fight","I've had a fight with Ken, and I'm still upset.","ケンとけんかして、まだ気持ちが落ち着きません。",[[5,8],[9,10],[11,16]],"H"],["have a good memory","You have a good memory for names you've heard only once.","一度聞いただけの名前を、よく覚えていますね。",[[4,8],[9,10],[11,15],[16,22]],"H"],["have a good sleep","I had a good sleep, so I feel much better now.","ぐっすり眠ったので、ずっと気分がよくなりました。",[[2,5],[6,7],[8,12],[13,18]],"H"],["have a great time","We've had a great time staying with your family.","ご家族の所に泊めていただいて、とても楽しかったです。",[[6,9],[10,11],[12,17],[18,22]],"H"],["have a stomachache","I've had a stomachache since I finished my lunch.","昼食を食べ終えてから、ずっとおなかが痛いです。",[[5,8],[9,10],[11,22]],"H"],["have a talk","I'd like to have a talk about what's happened.","起きたことについて、話し合いたいです。",[[12,16],[17,18],[19,23]],"H"],["have been to ～","I've been to the café you told me about.","教えてくれたカフェに、行ってきました。",[[0,4],[5,9],[10,12]],"H"],["have enough（名詞）to do","I've checked, and we have enough money to buy it.","確認したところ、それを買うだけのお金はあります。",[[21,25],[26,32],[39,41]],"H"],["have fun","We've had fun making the decorations for your party.","あなたのパーティーの飾り作りを、楽しみました。",[[6,9],[10,13]],"H"],["have lunch","I've already had lunch, but I'd love some coffee.","お昼はもう食べましたが、コーヒーはいただきたいです。",[[13,16],[17,22]],"H"],["have never been to ～","I've never been to a place as quiet as this.","こんなに静かな所に来たのは、初めてです。",[[0,4],[5,10],[11,15],[16,18]],"H"],["have no idea","I have no idea why the lights have gone out.","なぜ明かりが消えたのか、さっぱり分かりません。",[[2,6],[7,9],[10,14]],"H"],["have time to do","I'd help you if I had time to stay.","ここにいられる時間があれば、手伝うのですが。",[[18,21],[22,26],[27,29]],"H"],["have to do","I've lost my key, so I have to wait outside.","鍵をなくしたので、外で待たなければなりません。",[[23,27],[28,30]],"H"],["headache","I've had a heada を聴いています。",[[29,34]],"W"],["whole","I've spent the whole afternoon trying to fix this chair.","この椅子を直そうとして、午後を丸ごと使ってしまいました。",[[15,20]],"W"],["wide","The river was so wide that we couldn't cross it.","川幅がとても広くて、渡れませんでした。",[[17,21]],"W"],["wife","How's your wife?","奥さんはお元気ですか。",[[11,15]],"W"],["wild","Have you ever seen a wild deer near your house?","家の近くで、野生の鹿を見たことはありますか。",[[21,25]],"W"],["win","I've never won a prize, but I'll keep trying.","賞を取ったことはありませんが、これからも挑戦します。",[[11,14]],"W"],["wine","I've brought some wine that my friend recommended.","友達が勧めてくれたワインを、持ってきました。",[[18,22]],"W"],["wing","The bird with the broken wing has started flying again.","翼を折っていた鳥が、また飛び始めました。",[[25,29]],"W"],["winner","The winner will be announced after everyone has finished.","全員が終わった後に、優勝者が発表されます。",[[4,10]],"W"],["wish","I wish I knew how to fix this computer.","このパソコンの直し方が分かればいいのに。",[[2,6]],"W"],["without","I've never traveled without taking a book to read.","読む本を持たずに旅行したことは、ありません。",[[20,27]],"W"],["wonder","I wonder why the shop hasn't opened yet.","どうして店がまだ開いていないのでしょうか。",[[2,8]],"W"],["wonderful","Have a wonderful time!","楽しい時間を過ごしてね！",[[7,16]],"W"],["wood","The table made from this wood was built by my father.","この木材を使ったテーブルは、父が作りました。",[[25,29]],"W"],["word","I've written down the words I want to learn.","覚えたい単語を、書き出しておきました。",[[22,27]],"W"],["work","I've worked at this shop since I left school.","学校を卒業してから、ずっとこの店で働いています。",[[5,11]],"W"],["work well","The plan you've suggested has worked well for our class.","提案してくれた方法は、うちのクラスでうまくいっています。",[[30,36],[37,41]],"W"],["worker","We need two workers.","働く人が2人必要です。",[[12,19]],"W"],["worry","Don't worry about me.","私のことは心配しないでください。",[[6,11]],"W"],["would love to do","I'd love to see the garden you've been working on.","ずっと手入れしているお庭を、ぜひ拝見したいです。",[[0,3],[4,8],[9,11]],"W"],["write down ～","I've written down the address so we won't forget it.","忘れないように、住所を書き留めておきました。",[[5,12],[13,17]],"W"],["write to ～","I've written to the friend who helped me move.","引っ越しを手伝ってくれた友達に、手紙を書きました。",[[5,12],[13,15]],"W"],["writer","I've read every book this writer has published.","この作家が出版した本は、全部読みました。",[[26,32]],"W"],["wrong","Sorry, you have the wrong number.","すみません、番号をお間違えですよ。",[[20,25]],"W"],["～ year(s) old","I've known Ken since we were five years old.","ケンとは、5歳のころからの知り合いです。",[[34,39],[40,43]],"Y"],["yet","The bus we've been waiting for hasn't arrived yet.","ずっと待っているバスが、まだ来ません。",[[46,49]],"Y"],["zoo","Let's go to the zoo tomorrow.","明日、動物園に行きましょう。",[[16,19]],"Z"]],"p2":[["A and so on [forth]","We should have brought cups, plates, napkins, and so on.","カップや皿、ナプキンなどを持ってくるべきでした。",[[46,49],[50,52],[53,55]],"A"],["A as well as B","By Friday, I'll have invited Ken as well as Sue.","金曜日までには、スーだけでなくケンも招待しているでしょう。",[[33,35],[36,40],[41,43]],"A"],["a bunch of ~","I saw her carry a bunch of flowers upstairs.","彼女が花束を持って上の階へ行くのを、見ました。",[[16,17],[18,23],[24,26]],"A"],["a couple of ~","I've been waiting for a couple of hours.","2時間ほど、ずっと待っています。",[[22,23],[24,30],[31,33]],"A"],["a great [good] deal of ~","We've been spending a great deal of time on this.","これに、ずっと多くの時間をかけています。",[[20,21],[22,27],[28,32],[33,35]],"A"],["a number of ~","A number of students have been waiting since noon.","かなりの数の生徒が、正午から待っています。",[[0,1],[2,8],[9,11]],"A"],["(This is) A speaking.","Hello, this is Ken speaking about what you ordered.","もしもし、ケンです。ご注文の件でお電話しています。",[[19,27]],"A"],["a variety of ~","The box was filled with a variety of sweets.","箱には、いろいろなお菓子が詰まっていました。",[[24,25],[26,33],[34,36]],"A"],["ability","I wish I had your ability to explain things clearly.","あなたのように分かりやすく説明する力があればいいのに。",[[18,25]],"A"],["above all","Above all, remember to enjoy your time here.","何よりも、ここでの時間を楽しむことを忘れないでください。",[[0,5],[6,9]],"A"],["abroad","I've been thinking about studying abroad since last spring.","去年の春から、留学について考えています。",[[34,40]],"A"],["absent","Ken must have been absent when we discussed this.","これを話し合ったとき、ケンは欠席していたのでしょう。",[[19,25]],"A"],["accept","If I'd known, I would have accepted the invitation.","知っていたら、その招待を受けていたのに。",[[27,35]],"A"],["access","This is the room where students can access computers.","ここが、生徒たちがパソコンを利用できる部屋です。",[[36,42]],"A"],["accident","The accident had happened before we reached the bridge.","私たちが橋に着く前に、事故は起きていました。",[[4,12]],"A"],["accidentally","I might have accidentally deleted the message you sent.","送ってくれたメッセージを、うっかり削除したかもしれません。",[[13,25]],"A"],["according to ~","According to the map, we should be near the station.","地図によれば、私たちは駅の近くにいるはずです。",[[0,9],[10,12]],"A"],["achieve","What do you hope to achieve this year?","今年は何を達成したいですか。",[[20,27]],"A"],["achievement","It was her achievement that inspired me to try.","挑戦する気にさせてくれたのは、彼女の功績でした。",[[11,22]],"A"],["across from ~","I'd choose the hotel across from the station.","私なら、駅の向かいのホテルを選びます。",[[21,27],[28,32]],"A"],["act","I've never acted in a play, but I'd like to.","劇に出たことはありませんが、出てみたいです。",[[11,16]],"A"],["active","I'd be more active if I had more time.","もっと時間があれば、活動的に過ごせるのですが。",[[12,18]],"A"],["activity","What's an activity you've always wanted to try?","ずっとやってみたかった活動は何ですか。",[[10,18]],"A"],["actor","I met an actor whose daughter teaches English.","娘さんが英語を教えている俳優に、会いました。",[[9,14]],"A"],["actually","Actually, we had already met before the wedding.","実は私たちは、その結婚式の前に会っていました。",[[0,8]],"A"],["add","By lunchtime, I'll have added everyone's name to the list.","昼までには、全員の名前を名簿に加えておきます。",[[24,29]],"A"],["address","Please use whatever address is most convenient for you.","あなたに一番都合のよい住所を、使ってください。",[[20,27]],"A"],["admission","Admission should have been included in the ticket price.","入館料は、チケット代に含まれているはずでした。",[[0,9]],"A"],["admit","He admitted taking the money from my bag.","彼は、私のかばんからお金を取ったことを認めました。",[[3,11]],"A"],["adult","As an adult, I wish I'd studied harder.","大人になった今、もっと勉強しておけばよかったと思います。",[[6,11]],"A"],["advantage","Living nearby would give you an advantage over other applicants.","近くに住んでいれば、ほかの応募者より有利になるでしょう。",[[32,41]],"A"],["adventure","That's an adventure I'd love to share with my friends.","それは友達と一緒に体験してみたい冒険です。",[[10,19]],"A"],["advertise","Where should we advertise our new cooking classes?","新しい料理教室はどこで宣伝すればよいでしょうか。",[[16,25]],"A"],["advertisement","It was your advertisement that brought me to this shop.","この店に来るきっかけは、そちらの広告でした。",[[12,25]],"A"],["advice","Your advice made me reconsider what I really wanted.","あなたの助言で、本当に望むことを考え直しました。",[[5,11]],"A"],["advise","You should ask someone to advise you before signing.","署名する前に、誰かに助言を求めるとよいでしょう。",[[26,32]],"A"],["afford","I can't afford to buy a new car.","新しい車を買う余裕がありません。",[[8,14]],"A"],["afraid","I was afraid you might have missed the train.","あなたが電車に乗り遅れたのではないかと、心配しました。",[[6,12]],"A"],["after a while","After a while, I realized I'd lost my way.","しばらくして、道に迷っていたことに気付きました。",[[0,5],[6,7],[8,13]],"A"],["after all","We decided to go to the party after all.","私たちは結局、そのパーティーに行くことにしました。",[[30,35],[36,39]],"A"],["afterward","Having missed the train, we got a taxi shortly afterward.","電車に乗り遅れたので、その少し後にタクシーを拾いました。",[[47,56]],"A"],["against","I found my bike leaning against the wrong wall.","自転車が、別の壁に立て掛けられているのを見つけました。",[[24,31]],"A"],["agree","I agree with what you said about the school trip.","修学旅行についてあなたが言ったことに賛成です。",[[2,7]],"A"],["agreement","We had reached an agreement before the meeting ended.","会議が終わる前に、私たちは合意に達していました。",[[18,27]],"A"],["ahead","I wish I'd known what lay ahead of us.","この先のことが、前もって分かっていたらよかったのに。",[[26,31]],"A"],["ahead of ~","We should have arrived ahead of the other guests.","ほかのお客さんより、先に着いているべきでした。",[[23,28],[29,31]],"A"],["aim","Our aim should be to finish before lunch.","私たちの目標は、昼食前に終えることにすべきです。",[[4,7]],"A"],["aisle","Would you prefer an aisle seat or a window seat?","通路側と窓側のどちらの席がよろしいですか。",[[20,25]],"A"],["alike","I'd never realized how much alike you two were.","お二人がこんなに似ているとは、それまで気付きませんでした。",[[28,33]],"A"],["all at once","You shouldn't ask all your questions all at once.","質問を、一度に全部するべきではありません。",[[18,21],[41,43],[44,48]],"A"],["all of a sudden","All of a sudden, I felt someone grab my arm.","突然、誰かに腕をつかまれるのを感じました。",[[0,3],[4,6],[7,8],[9,15]],"A"],["all the time","I've been feeling tired all the time since I started work.","働き始めてから、いつも疲れを感じています。",[[24,27],[28,31],[32,36]],"A"],["all the way","We had walked all the way before noticing the sign.","標識に気付くまで、ずっと歩いてきていました。",[[14,17],[18,21],[22,25]],"A"],["all (the) year round [around]","I'd live here all year round if I could.","できることなら、私なら一年中ここに住みます。",[[14,17],[18,22],[23,28]],"A"],["allergic","You should tell the waiter that you're allergic to peanuts.","ピーナッツアレルギーがあることを、店員に伝えてください。",[[39,47]],"A"],["allow","Would your parents allow you to stay another night?","ご両親は、もう1泊することを許してくれるでしょうか。",[[19,24]],"A"],["almost","I had almost finished cooking when you called.","あなたから電話があったとき、料理はほぼできていました。",[[6,12]],"A"],["along with ~","You should send the photo along with your application.","申込書と一緒に、写真を送るべきです。",[[26,31],[32,36]],"A"],["although","Although we'd booked early, we couldn't get seats together.","早く予約していたのに、隣同士の席は取れませんでした。",[[0,8]],"A"],["amateur","An amateur painter made what became my favorite picture.","アマチュアの画家の作品が、私の一番好きな絵になりました。",[[3,10]],"A"],["amazing","You should see the amazing view from the roof.","屋上からの素晴らしい眺めを、ぜひ見てください。",[[19,26]],"A"],["amount","This recipe uses twice the amount of sugar I expected.","このレシピでは、予想した2倍の量の砂糖を使います。",[[27,33]],"A"],["ancestor","I found the village where my ancestor had lived.","先祖が暮らしていた村を、見つけました。",[[29,37]],"A"],["ancient","I'd love to visit the ancient city someday.","いつかその古代都市を訪ねてみたいです。",[[22,29]],"A"],["anniversary","We had forgotten our anniversary until our daughter called.","娘から電話が来るまで、結婚記念日を忘れていました。",[[21,32]],"A"],["announce","They should have announced the cancellation much earlier.","中止の発表は、もっと早くするべきでした。",[[17,26]],"A"],["another","If I had another chance, I'd do things differently.","もう一度機会があれば、違うやり方をするでしょう。",[[9,16]],"A"],["anymore","I wouldn't use that old charger anymore.","私なら、その古い充電器はもう使いません。",[[32,39]],"A"],["Anything [Either] will do.","Either will do, so choose whichever costs less.","どちらでも構わないので、安いほうを選んでください。",[[0,6],[7,11]],"A"],["Anything else?","Is there anything else you'd like us to bring?","ほかに私たちに持ってきてほしい物は、ありますか。",[[9,17],[18,22]],"A"],["anyway","I'd go anyway, even if the weather were terrible.","たとえひどい天気でも、私なら行きます。",[[7,13]],"A"],["apart","The twins had never lived apart before university.","その双子は、大学に入るまで離れて暮らしたことがありませんでした。",[[26,31]],"A"],["apart from ~","Apart from the price, it was better than I'd expected.","値段を除けば、予想していたよりよかったです。",[[0,5],[6,10]],"A"],["apartment","I'd choose whichever apartment gets more sunlight.","私なら、日当たりのよいほうのアパートを選びます。",[[21,30]],"A"],["apologize","I want to apologize for being late today.","今日は遅刻したことをおわびしたいです。",[[10,19]],"A"],["apparently","Apparently, they had sold the house before moving abroad.","どうやら、海外へ移る前に家を売っていたようです。",[[0,10]],"A"],["appear","I saw a strange message appear on the screen.","画面に、見慣れないメッセージが出るのを見ました。",[[24,30]],"A"],["apply","You should apply before the end of this month.","今月末までに、応募するとよいでしょう。",[[11,16]],"A"],["apply for ~","You should have applied for the job sooner.","その仕事には、もっと早く応募するべきでした。",[[16,23],[24,27]],"A"],["appointment","I'd like to make an appointment for Friday.","金曜日の予約を取りたいのですが。",[[20,31]],"A"],["appreciate","I'd appreciate having a little more time to decide.","決める時間をもう少しいただけると、ありがたいです。",[[4,14]],"A"],["appreciation","It was your letter that showed her your appreciation.","感謝の気持ちが彼女に伝わったのは、あなたの手紙のおかげでした。",[[40,52]],"A"],["approach","We should consider a less expensive approach to the problem.","その問題には、費用の少ない方法を検討すべきです。",[[36,44]],"A"],["aquarium","This is the aquarium where we first met.","ここが、私たちが初めて出会った水族館です。",[[12,20]],"A"],["arctic","I wish I could see arctic wildlife myself.","北極の野生生物を、自分の目で見られたらいいのに。",[[19,25]],"A"],["area","This is the area where my grandparents grew up.","ここは、祖父母が育った地域です。",[[12,16]],"A"],["argue","I heard my neighbors argue about their parking space.","近所の人たちが、駐車場所について言い争うのを聞きました。",[[21,26]],"A"],["argument","We had an argument about whose turn it was.","誰の順番かということで、私たちは口論になりました。",[[10,18]],"A"],["army","He had served in the army before becoming a teacher.","彼は教師になる前に、陸軍で勤務していました。",[[21,25]],"A"],["arrange","I'll have my assistant arrange a taxi for you.","助手に頼んで、タクシーを手配します。",[[23,30]],"A"],["arrest","I saw the police arrest someone outside the station.","駅の外で、警察が誰かを逮捕するのを見ました。",[[17,23]],"A"],["arrival","We had prepared everything before the guests' arrival.","お客さんが到着する前に、準備はすべて済んでいました。",[[46,53]],"A"],["arrive","The package I've been waiting for has finally arrived.","ずっと待っていた荷物が、ようやく届きました。",[[46,53]],"A"],["article","I've been writing an article about our local school.","地元の学校についての記事を、ずっと書いています。",[[21,28]],"A"],["as a result of ~","We had moved as a result of the flooding.","洪水のため、私たちは転居していました。",[[13,15],[16,17],[18,24],[25,27]],"A"],["as far as I know, ...","As far as I know, she had already left.","私の知る限り、彼女はもう出発していました。",[[0,2],[3,6],[7,9],[10,11],[12,16]],"A"],["as if [though] ...","He talks as if he were the manager.","彼は、まるで自分が責任者であるかのように話します。",[[9,11],[12,14]],"A"],["as long as ...","I'd lend you my bike as long as you're careful.","気を付けてくれるなら、自転車を貸してもよいですよ。",[[21,23],[24,28],[29,31]],"A"],["as usual","As usual, we had arrived before anyone else.","いつもどおり、誰よりも先に着いていました。",[[0,2],[3,8]],"A"],["as well","Would you like some bread as well?","パンも、いかがですか。",[[26,28],[29,33]],"A"],["as ~ as ever","Your grandmother looks as cheerful as ever.","おばあさまは、相変わらずお元気そうですね。",[[23,25],[35,37],[38,42]],"A"],["as ~ as possible","You should have called me as soon as possible.","できるだけ早く、電話をしてくれるべきでした。",[[26,28],[34,36],[37,45]],"A"],["ask for ~","You should ask for whatever help you need.","必要な助けは、何でも求めるべきです。",[[11,14],[15,18]],"A"],["asleep","He must have fallen asleep during the film.","彼は、映画の途中で眠ってしまったのでしょう。",[[20,26]],"A"],["assistant","I'll have my assistant send you the details.","助手に、詳しい内容を送らせます。",[[13,22]],"A"],["at first","At first, I wished I'd stayed at home.","最初は、家にいればよかったと思いました。",[[0,2],[3,8]],"A"],["at least","You should have called at least once.","少なくとも一度は、電話をしてくれるべきでした。",[[23,25],[26,31]],"A"],["at (the) most","It would take twenty minutes at most.","かかっても、せいぜい20分でしょう。",[[29,31],[32,36]],"A"],["at the sight of ~","I couldn't help smiling at the sight of her.","彼女の姿を見て、思わずほほ笑みました。",[[24,26],[27,30],[31,36],[37,39]],"A"],["athlete","She's an athlete whose determination I really admire.","彼女は、その強い意志を私がとても尊敬している選手です。",[[9,16]],"A"],["atmosphere","The friendly atmosphere made me feel welcome immediately.","親しみやすい雰囲気のおかげで、すぐにくつろげました。",[[13,23]],"A"],["attack","We should never attack someone for asking questions.","質問したことで人を責めるようなことは、決してすべきではありません。",[[16,22]],"A"],["attend","I'd have attended if you had invited me.","招待してくれていたら、出席していたのに。",[[9,17]],"A"],["attendant","You should ask the attendant where to leave your bags.","荷物の置き場所は、係の人に聞くとよいでしょう。",[[19,28]],"A"],["attention","It was her calm voice that caught everyone's attention.","みんなの注意を引いたのは、彼女の落ち着いた声でした。",[[45,54]],"A"],["attitude","Your positive attitude makes everyone feel more confident.","あなたの前向きな姿勢は、みんなに自信を与えます。",[[14,22]],"A"],["attract","We watched the bright flowers attract several butterflies.","鮮やかな花に、チョウが何匹も集まるのを見ました。",[[30,37]],"A"],["attraction","The attraction was less crowded than we'd expected.","その観光名所は、予想していたほど混んでいませんでした。",[[4,14]],"A"],["audience","I heard the audience laugh before I reached the stage.","舞台に出る前に、観客が笑うのが聞こえました。",[[12,20]],"A"],["author","She's the author whose books helped me enjoy reading.","彼女は、私が読書を楽しむきっかけになった本の著者です。",[[10,16]],"A"],["available","You should take whichever room is available tonight.","今夜空いている部屋なら、どの部屋でも取るべきでしょう。",[[34,43]],"A"],["avenue","This is the avenue where we used to live.","ここは、私たちが以前住んでいた大通りです。",[[12,18]],"A"],["average","Our average bill is twice what it was last year.","平均の請求額は、去年の2倍です。",[[4,11]],"A"],["avoid","I wish we had left earlier to avoid traffic.","渋滞を避けるために、もっと早く出ればよかったです。",[[30,35 enter","We had a carpenter repair the broken stairs.","大工さんに、壊れた階段を直してもらいました。",[[9,18]],"C"],["carry","I'll let you carry whichever bag is lighter.","軽いほうのかばんを、あなたに持ってもらいます。",[[13,18]],"C"],["carry out ~","We need to carry out a few safety checks.","いくつか、安全確認を行う必要があります。",[[11,16],[17,20]],"C"],["cash","I'd rather pay cash than use my card.","カードを使うより、現金で払いたいです。",[[15,19]],"C"],["catch up with ~","I wish I could catch up with you.","あなたに、追い付けたらいいのに。",[[15,20],[21,23],[24,28]],"C"],["cattle","We watched the cattle move slowly across the field.","牛たちがゆっくりと草地を横切るのを、見ていました。",[[15,21]],"C"],["cause","A loose cable may have caused the problem.","緩んだケーブルが、問題を起こしたのかもしれません。",[[23,29]],"C"],["celebrate","If you were here, we could celebrate together.","あなたがここにいれば、一緒にお祝いできるのに。",[[27,36]],"C"],["celebration","Having finished our exams, we went out for a celebration.","試験を終えて、私たちはお祝いに出かけました。",[[45,56]],"C"],["center","It was at the shopping center that we met.","私たちが会ったのは、ショッピングセンターでした。",[[23,29]],"C"],["central","Our central location makes travelling around the city easier.","中心部にあるおかげで、市内の移動が便利です。",[[4,11]],"C"],["century","The bakery had existed for a century before closing.","そのパン屋は、閉店するまで100年続いていました。",[[29,36]],"C"],["ceremony","The ceremony had already started when we arrived.","私たちが着いたとき、式はすでに始まっていました。",[[4,12]],"C"],["certain","You should be certain before you accuse someone.","人を責める前には、確信を持つべきです。",[[14,21]],"C"],["Certainly, sir [ma'am].","Certainly, sir, I'll have your breakfast brought upstairs.","かしこまりました。朝食を上の階へお持ちする手配をします。",[[0,9],[11,14]],"C"],["chance","If I'd had the chance, I would have gone.","機会があったなら、私も行っていたのに。",[[15,21]],"C"],["change","Returning home, I noticed how much the town had changed.","帰省して、町がずいぶん変わったことに気付きました。",[[48,55]],"C"],["change A into B","Would you please change these dollars into Japanese yen?","このドルを、日本円に両替してもらえますか。",[[17,23],[38,42]],"C"],["change one's mind","I'd change my mind if the price were lower.","値段がもっと安ければ、考えを変えるのですが。",[[4,10],[
