                { id: 5, jp: "友人の家に泊まることになった。猫アレルギーのあなたは少し心配で、ネコを飼っているか聞きなさい。", en: "Do you have any cats?" },
                { id: 6, jp: "知り合いの家でランチをごちそうになり、その家のだんなさんの手料理がおいしかった。(彼は)料理がお上手ですねと言いなさい。", en: "He is a good cook." },
                { id: 7, jp: "パーティーで、あなたたちは立ちっぱなしで疲れてきた。ホストに椅子が(複数)必要だと言いなさい。", en: "I need chairs." },
                { id: 8, jp: "パーティーで、参加者たちが立って談笑している中、ホストに椅子が必要ではないかと聞かれた。私たちには椅子は要らないと答えなさい。", en: "We don't need any chairs." },
                { id: 9, jp: "彼の部屋は狭苦しく感じられるね、と友人が言った。彼はたくさん本を持っているからねと言いなさい。", en: "He has a lot of books." },
                { id: 10, jp: "友人があなたに、セーラは授業をいくつ履修しているか聞いた。(彼女は)毎日6つの授業を履修していると伝えなさい。", en: "She has six classes every day." },
                { id: 11, jp: "友人があなたに、よくトマトを食べているね、と言った。トマトにはビタミンが豊富だ(から)と答えなさい。", en: "Tomatoes are rich in vitamins." },
                { id: 12, jp: "出産直後の女性たちへ向けた赤ちゃん同伴セミナーがあった。あの赤ちゃんたちはとてもかわいいねとコメントしなさい。", en: "Those babies are very cute." },
                { id: 13, jp: "部屋の中が息苦しく感じられた。(私たちには)新鮮な空気が必要だねと言いなさい。", en: "We need some fresh air." },
                { id: 14, jp: "あなたの知り合いは、喫茶店でいつもコーヒーを飲んでいる。紅茶も飲むか聞きなさい。", en: "Do you drink tea?" },
                { id: 15, jp: "知り合いに、食べ物で何が好きかを聞かれた。天ぷらが好きな食べ物だと答えなさい。", en: "Tempura is my favorite food." },
                { id: 16, jp: "スミス家の人たちがあなたの家を訪ねてくるので、彼らに夕飯を振る舞うことになった。すし料理を考えていて、スミス家の人たちをよく知っている友人に、彼らはすしが好きかどうかを聞きなさい。", en: "Do they like sushi?" },
                { id: 17, jp: "あなたはジョンソンさんにケーキを出した。このケーキを食べてくださいねと言いなさい。", en: "Eat some cake, please." },
                { id: 18, jp: "ルームメートのリーが、おなかが空いたと言い、クッキーはまだあるかと聞いてきた。(私たちは)クッキーはないよと答えなさい。", en: "I don't have any cookies." },
                { id: 19, jp: "あなたのルームメートは忙しそうだね、とルイーズが言った。(彼女には)たくさんの宿題があるんだと答えなさい。", en: "She has a lot of homework." },
                { id: 20, jp: "あなたのお姉さんは読書が好きだから、たくさん本を持っているんでしょうね、とキムがあなたに言った。(彼女は)本をたくさんは持っていないよと答えなさい。", en: "She doesn't have many books." },
                { id: 21, jp: "トムは授業料の高額な某私立大学に行くつもりだ、と友人が言った。(彼は)お金をたくさん持っているのか聞きなさい。", en: "Does he have much money?" },
                { id: 22, jp: "ホセがあなたに、新たに同じクラスになった生徒たちはどんな感じか聞いてきた。このクラスの全ての生徒は頭が良いよと答えなさい。", en: "Every student in this class is smart." },
                { id: 23, jp: "あなたは、ある授業でプレゼンテーションを終えた。何か質問があるか聞きなさい。", en: "Do you have any questions?" },
                { id: 24, jp: "トムの家に行き、何か飲み物はいらないかと尋ねられた。コーラを1杯頼みなさい。", en: "A glass of cola, please." },
                { id: 25, jp: "友人たちと喫茶店に行った。コーヒーを3杯オーダーしなさい。", en: "Three cups of coffee, please." },
                { id: 26, jp: "あなたたちは喫茶店にいる。紅茶を2杯オーダーしなさい。", en: "Two teas, please." },
                { id: 27, jp: "イヤリングをしているあなたに、きれいなイヤリングだけど、高かったの? と友人が聞いてきた。このイヤリングはとても安いんだと答えなさい。", en: "These earrings are very cheap." },
                { id: 28, jp: "友人がしゃれたズボンを履いていた。そのズボン、いいねとコメントしなさい。", en: "Those pants are nice!" }
            ],
            "Lesson 1-5": [
                { id: 1, jp: "ルームメートがあなたの知人の田中さん(男性)にあいさつした。意外に思ったので、ルームメートに田中さんを知っているのか聞きなさい。", en: "Do you know Mr. Tanaka?" },
                { id: 2, jp: "ジェフは最近かなり暮らし向きが良い、と友人が私に言った。(彼が)何の仕事をしているのか聞きなさい。", en: "What does he do?" },
                { id: 3, jp: "図書館にトルストイの全集があり、それを見たサリーがトルストイの小説が好きだと言った。どの小説が好きか聞きなさい。", en: "Which novel do you like?" },
                { id: 4, jp: "ジェイソンが、大学内の寮から出てアパートに住み、バスで学校に通っている。ジェイソンの友人に(彼が)どこに住んでいるか聞きなさい。", en: "Where does he live?" },
                { id: 5, jp: "友人が、自分のクラスの数学の先生は教え方がうまい、と言った。誰が数学の先生か聞きなさい。", en: "Who is your math teacher?" },
                { id: 6, jp: "フランス語のクラスを履修している友人がフランス語の上手な学生がいる、と言った(。あなたのフランス語のクラスで)誰がフランス語を上手に話すのか聞きなさい。", en: "Who speaks French well in your French class?" },
                { id: 7, jp: "友人が、自分は古くからの『スター・ウォーズ』ファンだと言った。その映画に出ている俳優で誰が好きか聞きなさい。", en: "Who do you like in the movie?" },
                { id: 8, jp: "ルームメートが小さな機械のようなものを買ってきた。それは何かと尋ねなさい。", en: "What's that?" },
                { id: 9, jp: "友人のスーツケースが異様に重そうだった。スーツケースに何が入っているのか聞きなさい。", en: "What's in your suitcase?" },
                { id: 10, jp: "大学のカフェテリアで友人のジョンがギョーザを食べていた。ふと英語でギョーザを何と言うのだろうな、と思ったが分からない。ジョンにそれは英語で何と言うのか聞きなさい。", en: "What's the English word for that?" },
                { id: 11, jp: "文化祭の催しもので、カフェを開く案が出た。一緒にいる友人にそのプランについてどう思うか聞きなさい。", en: "What do you think about the plan?" },
                { id: 12, jp: "友人が、午前中は家にいて、午後から学校に行っている、と言った。午前中は何をしているか聞きなさい。", en: "What do you do in the morning?" },
                { id: 13, jp: "友人らとのパーティーが終わり、帰りぎわに、掛けてあった自分のコートを取った。ついでに友人のコートも取ってあげようと思った。どれが友人のコートかその友人に聞きなさい。", en: "Which is your coat?" },
                { id: 14, jp: "あなたとあなたの友人がランチを共にする事になった。候補として中華料理店と天ぷらのレストランが挙がった。昼食にどちらがいいか聞きなさい。", en: "Which do you want for lunch?" },
                { id: 15, jp: "パーティーが盛り上がり、ダンスミュージックが鳴り響き出した。踊ろうよとナタリーを誘いなさい。", en: "Let's dance." },
                { id: 16, jp: "ジョンがあなたのルームメートに、明日の引っ越しを手伝ってくれと頼んできた。ルームメートのミックは躊躇している。ミックに、どうか彼のためにそれをやってあげてと言いなさい。", en: "Please do that for him." },
                { id: 17, jp: "友人があなたに、あなたの田舎の祖父母が高齢になって大変でしょ、と聞いた。ときどき彼らの手伝いをしているんだと言いなさい。", en: "I help them sometimes." },
                { id: 18, jp: "友人があなたに、アーロンの仕事は何か、と聞いた。アーロンは学校で英語を教えていると言いなさい。", en: "Aron teaches English at school." },
                { id: 19, jp: "友人があなたに、ニュージーランドは今頃どんな気候か、と聞いた。ニュージーランドは今は暑いと答えなさい。", en: "New Zealand is hot now." },
                { id: 20, jp: "友人があなたのためにある情報を持ってきてくれた。それを聞いて、それは素晴らしい情報だとコメントしなさい。", en: "That is wonderful information." },
                { id: 21, jp: "友人があなたに、あなたのお母さんはいつ出勤するのか、と聞いた。(母は)午後に出勤すると答えなさい。", en: "Mom goes to work in the afternoon." },
                { id: 22, jp: "友人があなたに、あなたのルームメートのメアリーに買い物につきあってもらえないか、と聞いてきた。(彼女は)今日はあまり時間がないと答えなさい。", en: "She doesn't have much time today." },
                { id: 23, jp: "友人があなたに、アンソニーはいつも忙しそうにしているね、と言った。(彼は)毎日たくさんの宿題があるんだよと答えなさい。", en: "He has a lot of homework every day." },
                { id: 24, jp: "久しぶりに旧友のキースと電話で話し、木曜日にランチに行かないかと誘ったが、キースは学校生活が結構忙しいと答えた。キースに毎日学校に行っているの、と聞きなさい。", en: "Do you go to school every day?" },
                { id: 25, jp: "キースが、大学進学についてよくお姉さんからアドバイスをもらっていると言った。お姉さんは大学に通っているのか聞きなさい。", en: "Does your sister go to college?" },
                { id: 26, jp: "友人があなたに、あなたのお母さんは買い物を週に1回ぐらいしているのか、と聞いてきた。母は毎日買い物に行くと答えなさい。", en: "My mother goes to the store every day." },
                { id: 27, jp: "友人があなたに、ジーンのアパートは図書館が近いから勉強するのに便利だね、と言った。彼女は図書館にはあまり行かないよと答えなさい。", en: "She doesn't go to the library much." },
                { id: 28, jp: "友人が、ホワイトハウスはニューヨークにあるのか、とあなたに聞いた。ホワイトハウスはワシントン DC にあると答えなさい。", en: "The White House is in Washington DC." },
                { id: 29, jp: "あなたはガールフレンドのノゾミへの誕生日プレゼントを買ってきた。ルームメートに誰へのプレゼントか、と聞かれたので、これはノゾミへのプレゼントだよと言いなさい。", en: "This is the present for Nozomi." },
                { id: 30, jp: "あなたとサラとアンはシェアハウスに住んでいる。アンがあなたに、サラは最近、家に帰るのが遅いけどどうかしたの、と聞いた。彼女はクラブに所属しているんだと答えなさい。", en: "She is in a club." },
                { id: 31, jp: "友人があなたに、ダスティンは今サッカーのチームに属しているのか、と聞いた。彼はそのチームに所属していると答えなさい。", en: "He is on the team." },
                { id: 32, jp: "友人があなたに、フォード氏は今どこに住んでいるのか、と聞いた。(彼は)その島に住んでいると答えなさい。", en: "He lives on the island." }
            ],
            "Lesson 1-6": [
                { id: 1, jp: "夏休み前、友人に、友人のルームメートのジョージが夏休みに向けてどんな計画を立てているか聞きなさい。", en: "What plans does he have for his summer vacations?" },
                { id: 2, jp: "あなたの友人のトムは雑誌をよく読みます。彼に、どんな雑誌を読むのか聞きなさい。", en: "What magazines do you read?" },
                { id: 3, jp: "2人の女の子が、少し離れたところで話している。友人がそれを見て妹がいると言った。どちらの女の子が妹か聞きなさい。", en: "Which girl is your sister?" },
                { id: 4, jp: "大きなプロジェクトが立ち上がった。これは誰のプロジェクトか聞きなさい。", en: "Whose project is this?" },
                { id: 5, jp: "あなたの友人がメアリーは絵が好きで、よく美術館に行くと言った。彼女は誰の絵画が好きか聞きなさい。", en: "Whose paintings does she like?" },
                { id: 6, jp: "友人の家に遊びに行ったら、棚の上に最新型のカメラが置いてあった。あれは誰のものか聞きなさい。", en: "Whose is that?" },
                { id: 7, jp: "ルームメイトの机の上に見慣れないメガネが置いてあった。それは誰のものか聞きなさい。", en: "Whose are those?" },
                { id: 8, jp: "ヨーコは頼まれると断れないタイプ。ルームメートのリリーはそのヨーコによく頼み事をする。リリーにあまりに多くのことを彼女に頼まないでと言いなさい。", en: "Don't ask a lot of things of her." },
                { id: 9, jp: "友人が、ある島がどこにあるのかと聞いた。(それは)インドネシアの北の方にあると言いなさい。", en: "It's to the north of Indonesia." },
                { id: 10, jp: "あなたは、どんな食べ物が好きかを聞かれた。すしが好きな食べ物の一つだと答えなさい。", en: "Sushi is one of my favorite foods." },
                { id: 11, jp: "イギリスにいる友人が、日本の酒が好きだと言った。どんな酒が好きか聞きなさい。", en: "What kind of sake do you like?" },
                { id: 12, jp: "ルームメートがカップ麺を1個買って来た。その食べ物は健康に良くないよと言いなさい。", en: "That food isn't good for your health." },
                { id: 13, jp: "春先なのに外は暑く感じられた。今日は春にしては暑いねとコメントしなさい。", en: "Today is hot for spring." },
                { id: 14, jp: "あなたの落とし物が見つかった、とメールで友人が知らせてくれた。eメールをありがとうとお礼を言いなさい。", en: "Thank you for your email." },
                { id: 15, jp: "ジョージのお父さんが亡くなったと聞いた。彼が気の毒ですと言いなさい。", en: "I'm sorry for him." },
                { id: 16, jp: "いつ会おうか、とナンシーが聞いてきた。金曜日に私と会って、と言いなさい。", en: "Meet me on Friday." },
                { id: 17, jp: "知り合いが、ジェニーは東京に行くことがあるかと聞いてきた。彼女はときどき仕事で東京に行っているよと答えなさい。", en: "She sometimes goes to Tokyo on business." },
                { id: 18, jp: "パットがカフェテリアでランチを少ししか食べないのを見た友人が、彼女は気分でも悪いのか、とあなたに聞いた。彼女はダイエット中なんだよと答えなさい。", en: "She is on a diet." },
                { id: 19, jp: "ルームメートのジョンは車で学校に行っているのか、とあなたは友人に聞かれた。彼は歩いて学校に行っていると答えなさい。", en: "He goes to school on foot." },
                { id: 20, jp: "キムの両親は引っ越して、キムと離れて暮らしている。彼女の両親が今どこにいるのか、ミックが聞いてきた。彼女の両親はカナダに住んでいると答えなさい。", en: "Her parents live in Canada." },
                { id: 21, jp: "メイが見当たらないんだけど、とトムがあなたに言った。メイは車の中にいるよと答えなさい。", en: "Mei is in the car." },
                { id: 22, jp: "マリオがあなたのルームメートのサリーが病気だと聞き、サリーは病院にいるのか、と聞いた。彼女はベッドにいると答えなさい。", en: "She is in bed." },
                { id: 23, jp: "テストを受けようとしている生徒が、ボールペンで答案を書いてもいいか、と教員のあなたに聞いた。鉛筆で書いてと言いなさい。", en: "Write in pencil." },
                { id: 24, jp: "トンプソンさんにコーヒーを入れてあげた。コーヒーに砂糖を入れるか聞きなさい。", en: "Do you take sugar in your coffee?" },
                { id: 25, jp: "トムが、その歌手をあなたが知っているのは意外だと言った。彼はアジアではとても有名だと言いなさい。", en: "He is very famous in Asia." },
                { id: 26, jp: "あなたは、リズが眼鏡をかけているのを初めて見た。あなたと一緒にいる友人に、彼女は眼鏡が似合うねとコメントしなさい。", en: "She looks nice in glasses." },
                { id: 27, jp: "ホセが、あなたの両親は今、外出中なのかと聞いた。母と父は今、家にいるよと言いなさい。", en: "Mom and Dad are at home now." },
                { id: 28, jp: "ミンがあなたの家に遊びに来ている。夕食の支度ができたので、リビングにいるミンに、どうぞ来て食べてくださいと言いなさい。", en: "Please come and eat." },
                { id: 29, jp: "リチャードの部屋に入ったら快適だった。あなた(リチャード)の部屋は心地よくて暖かいねとコメントしなさい。", en: "Your room is nice and warm." },
                { id: 30, jp: "中国から来た留学生のリンさんと、入浴の話になった。あなた(リン)はお風呂とシャワーのどちらを使うの?と聞きなさい。", en: "Which do you take, a bath or a shower?" }
            ],
            "Lesson 1-7": [
                { id: 1, jp: "サリーから電話がかかってきた。今どこにいるか聞きなさい。", en: "Where are you now?" },
                { id: 2, jp: "リーは、自分のお兄さんが遠くから大学に通って来ていると言った。(彼は)どこに住んでいるのか聞きなさい。", en: "Where does he live?" },
                { id: 3, jp: "ジェイソンが近くに図書館がオープンしたとあなたに言った。彼に、その図書館は何時に開館するのか聞きなさい。", en: "When does the library open?" },
                { id: 4, jp: "通学中、交通渋滞で乗っているバスがなかなか進まなくなった。授業に間に合うか心配になり、隣に座って時計を見ている友人に、今、何時か聞きなさい。", en: "What time is it now?" },
                { id: 5, jp: "今、何時か、と友人に聞かれた。10時だと答えなさい。", en: "It's ten o'clock." },
                { id: 6, jp: "普段はよく話すナオミが今日はおとなしくしている。ナオミのルームメートになぜ今日、彼女はとても静かなのか聞きなさい。", en: "Why is she so quiet today?" },
                { id: 7, jp: "トムは最近、図書館で過ごす時間が長い。彼のルームメートに、なぜ彼がよく図書館に行っているのか聞きなさい。", en: "Why does he go to the library often?" },
                { id: 8, jp: "友人たちと話していると、トムが離れたところにポツンと一人でいるのに気がついた。こっちに来なよと言いなさい。", en: "Why don't you come here?" },
                { id: 9, jp: "マリアは、自分のお父さんにとても遠慮している感じで、お母さんにばかり聞いている。お父さんに聞いてみたらと言いなさい。", en: "Why don't you ask your father?" },
                { id: 10, jp: "陽が傾いて寒くなってきた。家の外にいるメイに、入って紅茶を飲んだらと言いなさい。", en: "Why don't you come in and have some tea?" },
                { id: 11, jp: "ポールが先週けがをして病院に行った、と聞いた。ポールの友人に、彼は今どんな様子か聞きなさい。", en: "How's he now?" },
                { id: 12, jp: "あなたの友人のルームメート(女性)が替わった。その友だちに、彼女がどんな感じか(どんな感じで気に入っているか)聞きなさい。", en: "How do you like her?" },
                { id: 13, jp: "あなたのルームメートが、気分が悪くなってしばらくベッドに横になっている。今どんな気分か聞きなさい。", en: "How do you feel now?" },
                { id: 14, jp: "リサがあなたに、自分の妹は頭が良く、飛び級で大学に入ったと言った。彼女が何歳か聞きなさい。", en: "How old is she?" },
                { id: 15, jp: "クラスメートが、数学の問題の答えを教えてくれ、と頼んできた。しかし、難しくて解けそうもない。これは自分には難しいようだと言いなさい。", en: "This seems difficult to me." },
                { id: 16, jp: "朝食の支度ができたので、ルームメートに座って朝食を食べましょうと言いなさい。", en: "Let's sit down to breakfast." },
                { id: 17, jp: "少しなまりのある英語を話す生徒がいて、友人に彼はどこの出身か聞かれた。ドイツの出身だと答えなさい。", en: "He is from Germany." },
                { id: 18, jp: "メグの家を訪ねたとき、家の周囲の景色が美しいと思った。友人に、彼女の家から見た景色はきれいだと言いなさい。", en: "The view from her house is beautiful." },
                { id: 19, jp: "ヨンにジェイソンは今どこにいるのか、と聞かれた。ジェイソンはドアのところにいるよと答えなさい。", en: "Jason is at the door." },
                { id: 20, jp: "友人に、ボブの新しい住所を聞かれた。彼はサードストリートの200番地に住んでいると答えなさい。", en: "He lives at 200 Third St." },
                { id: 21, jp: "友人に、電車の乗り換えなしで学校に来ているのか聞かれた。渋谷で電車を乗り換えていると答えなさい。", en: "I change trains at Shibuya." },
                { id: 22, jp: "リーに、学校は何時に終わるのか聞かれた。(私の)学校は5時に終わると答えなさい。", en: "School is over at 5:00." },
                { id: 23, jp: "子犬が飼い主に連れられて公園を散歩していて、あなたの目の前を通り過ぎた。一緒にいるナタリーに、あのかわいい犬を見てと言いなさい。", en: "Look at that cute dog!" },
                { id: 24, jp: "トムとマリーは今、何をしているのか、と友人に聞かれた。彼らは夕食の最中だよと答えなさい。", en: "They are at dinner." },
                { id: 25, jp: "友人が、自分はいつも遅くまで起きている、と言った。何時に寝るのか聞きなさい。", en: "What time do you go to bed?" },
                { id: 26, jp: "学校が終わった。チャールズを、川のほとりのレストランに行こうと誘いなさい。", en: "Let's go to the restaurant by the river." },
                { id: 27, jp: "ジーンと道ですれ違った。彼女の家族が元気にしているか聞きなさい。", en: "How is your family?" },
                { id: 28, jp: "ヤンに、あなたの家族は元気にしているかと聞かれた。私の家族はみなとても元気だと答えなさい。", en: "My family are all very well." },
                { id: 29, jp: "昼食が終わりかけた。一緒に食事をしているベネットを、昼食の後に果物を食べようと誘いなさい。", en: "Let's eat fruit after lunch." }
            ],
            "Lesson 1-8": [
                { id: 1, jp: "友人があなたに、ミックはマーガレットを知っているかと聞いた。彼は彼女の友人だと答えなさい。", en: "He is friends with her." },
                { id: 2, jp: "ジュンが、ジェフはアリソンには何でもしてあげるようだね、と言った。ジェフはアリソンに恋しているからねと答えなさい。", en: "Jeff is in love with Allison." },
                { id: 3, jp: "ガラスのコップを床に落として割ってしまった。近くに来た友人に、それに気をつけるように言いなさい。", en: "Be careful with those." },
                { id: 4, jp: "友人があなたに、あなたのルームメートのヨシが今日学校に来なかったが、どうしたのか、と聞いた。彼は風邪をひいて寝ていると答えなさい。", en: "He is in bed with a cold." },
                { id: 5, jp: "昨日のパーティーはとても面白かった、とジョージが言った。それについて話してとジョージに言いなさい。", en: "Tell me about it." },
                { id: 6, jp: "クラスで問題が起こった。それについて話しましょうとクラスの皆に言いなさい。", en: "Let's talk about it." },
                { id: 7, jp: "ジュンがあなたに、あなたの友人のマシューは何歳ぐらいだろうか、と聞いた。彼は私と同じくらいの年齢だと答えなさい。", en: "He is about my age." },
                { id: 8, jp: "友人とアパレルショップに行った。気に入ったジャケットがあったので、その友人にこのジャケットをどう思うか聞きなさい。", en: "How about this jacket?" },
                { id: 9, jp: "友人があなたに、ジャネットは授業が終わってからいつもどこに行っているのか、と聞いた。彼女は放課後には図書館に行っていると言いなさい。", en: "She goes to the library after school." },
                { id: 10, jp: "今日ボウリングに行こう、とキムが誘ってきた。5時以降なら時間が空くと言いなさい。", en: "I'm free after 5:00." },
                { id: 11, jp: "ソンが、あなたの夫が何時ごろに家に帰ってくるか聞いた。(彼は)いつも8時前に帰ってくると言いなさい。", en: "Usually, he comes home before 8:00." },
                { id: 12, jp: "客が店員のあなたに、向こうに飾られているTシャツはいくらか、と聞いた。あれは100ドルを超えると答えなさい。", en: "That costs over $100." },
                { id: 13, jp: "ナタリーが、あなたの両親はどこに住んでいるのか、と聞いた。(彼らは)ファーストストリートの230番地に住んでいると答えなさい。", en: "They live at 230 First Street." },
                { id: 14, jp: "リズが、あなたはどこに住んでいるのか、と聞いた。明治通り沿いに住んでいると答えなさい。", en: "I live on Meiji Street." },
                { id: 15, jp: "マリアがあなたに、毎年、夏はどんなふうに過ごすのか、と聞いた。夏には海や山によく行くんだと答えなさい。", en: "I often go to the sea and the mountains in summer." },
                { id: 16, jp: "ヨンがあなたに、このドイツ製の高価なペンは、あなたのか、あなたのルームメートのトムのか、と聞いた。このペンは彼のだよと答えなさい。", en: "This pen is his." },
                { id: 17, jp: "ルームメートが、自分の今学期の成績がオールAだった、と言った。わー、それは素晴らしい! と言いなさい。", en: "Wow, it's great!" },
                { id: 18, jp: "金づちを使いながら、誤って指をたたいてしまった。痛い!と言いなさい。", en: "Ouch!" },
                { id: 19, jp: "カフェテリアで肘が他の生徒の体に当たった。あ、ごめん!と言いなさい。", en: "Oops, I'm sorry!" },
                { id: 20, jp: "ロナルドが断りもなくあなたのスマホを使っている。おい、俺のスマホを使うなよと言いなさい。", en: "Hey! Don't use my smartphone." },
                { id: 21, jp: "サリーがあなたに、果物を食べるか聞いた。どんな果物があるか聞きなさい。", en: "What fruit do you have?" },
                { id: 22, jp: "久しぶりにパンケーキを作ろうと、材料を買ってきた。ルームメートのジョンに、パンケーキが好きか聞きなさい。", en: "Do you like pancakes?" },
                { id: 23, jp: "新しいルームメートは、芸術については何でも知っているようだ。君は芸術に対して良い目を持っているんだねと言いなさい。", en: "You have a good eye for art." },
                { id: 24, jp: "春になり、キャンパス内にたくさんの花が咲いている。目の前に何とも美しい花が咲き誇っている。この花はとてもきれいだねとコメントしなさい。", en: "These flowers are very beautiful." },
                { id: 25, jp: "友人があなたに、何点取れば成績にAが付くか聞いた。80点以上がAだと答えなさい。", en: "Eighty points or over is A." },
                { id: 26, jp: "サリーに一人っ子の雰囲気を感じた。たぶん、きょうだいはいないだろうと予想しつつ、彼女のクラスメートに(彼女に)きょうだいがいるか聞きなさい。", en: "Does she have any brothers or sisters?" },
                { id: 27, jp: "トムがあなたに、調子が悪そうだね、と声をかけてきた。腹痛と熱があるんだと答えなさい。", en: "I have a stomachache and a fever." },
                { id: 28, jp: "ジャネットがあなたに、自宅ではどんな服装か聞いた。自宅では、いつもTシャツとジーンズを着ていると答えなさい。", en: "I usually wear a T-shirt and jeans at home." },
                { id: 29, jp: "ポールがあなたに、良いズボンをはいているね、と言った。このズボンはとても(値段が)高いんだよと言いなさい。", en: "These pants are very expensive." }
            ],
            "Lesson 1-9": [
                { id: 1, jp: "友人があなたに、あなたの弟は大学に通っているのか、と聞いた。弟は高校生だと言いなさい。", en: "My brother is a high school student." },
                { id: 2, jp: "ヨンが、ヨンのお姉さんは東京で仕事をしている、と言った。お姉さんは仕事は何をしているのか聞きなさい。", en: "What does your sister do?" },
                { id: 3, jp: "フランシスが、あなたのおじいさんとおばあさんは犬好きだねと言った。祖父母は犬を5匹飼っていると言いなさい。", en: "My grandparents have five dogs." },
                { id: 4, jp: "最近、カフェテリアで朝食を食べているジョンを見かけない。クラスでジョンに会ったとき、君は朝食は食べているの、と聞きなさい。", en: "Do you have breakfast?" },
                { id: 5, jp: "メイの犬好きは有名だね、と友人が言った。彼女は自分の犬を(複数)とてもかわいがっているよと言いなさい。", en: "She loves her dogs very much." },
                { id: 6, jp: "友人があなたに、いつもいつ宿題をやるのか聞いた。いつも夕食前に宿題をやると答えなさい。", en: "I do my homework before dinner." },
                { id: 7, jp: "あなたは、大学に進学したアンナに、久しぶりに会った。大学生活を楽しんでいるか聞きなさい。", en: "Do you enjoy college life?" },
                { id: 8, jp: "サリーが、自分は料理が好きだと言った。どのくらいの頻度で家で料理をするのか聞きなさい。", en: "How often do you cook at home?" },
                { id: 9, jp: "友人が、金曜日は履修科目が多く、前夜に行う予習が大変だと言った。金曜日には何クラス履修しているか聞きなさい。", en: "How many classes do you take on Friday?" },
                { id: 10, jp: "友人が、今日ジョージに会うと言った。なぜ、彼に会うのか聞きなさい。", en: "Why do you meet him?" },
                { id: 11, jp: "友人が、ボーイフレンドの英語が最近ずいぶん上達したと思う、と言った。(彼は)英語を猛勉強しているのかと聞きなさい。", en: "Does he study English very hard?" },
                { id: 12, jp: "あなたは、マリアが去年パリに行ったことを思い出した。マリアの友人に、彼女が今もパリに住んでいるのか聞きなさい。", en: "Is she living in Paris now." },
                { id: 13, jp: "マリアは今、パリには住んでいないのだという。では、彼女は今どこに住んでいるのか聞きなさい。", en: "Where is she living now?" },
                { id: 14, jp: "トムがあなたに、マリーはまだ来ていないのかと聞いた。(彼女は)今まさに来るところだと答えなさい。", en: "She is coming right now." },
                { id: 15, jp: "リッチがあなたに、マギーは今どこにいるのかと聞いた。(彼女は)自分の部屋で音楽を聞いているよと答えなさい。", en: "She is listening to music in her room." },
                { id: 16, jp: "映画に誘おうと思い、ポールに電話をしたら、今忙しいという返事だった。君は今勉強しているの? と彼に聞きなさい。", en: "Are you studying now?" },
                { id: 17, jp: "パトリシアと出かけるために、ドアを出たところで彼女が来るのを待っていた。なかなか来ないので、彼女は何をもたもたしているのだろうか、と自分自身につぶやきなさい。", en: "What is taking her so long?" },
                { id: 18, jp: "郵便局への道が分からなくなった。近くを歩いていた人に、すみません、郵便局を探しているんですがと言いなさい。", en: "Excuse me. I'm looking for the post office." },
                { id: 19, jp: "あなたは自分の自転車を使いたかった。しかし、またあなたの妹が勝手にあなたの自転車で買い物に行ってしまった。友人に、彼女はいつも私の自転車を使うんだよねと、不満顔で言いなさい。", en: "She is always using my bike." },
                { id: 20, jp: "ルームメートのミンからの電話で、今どこにいるかあなたに聞いてきた。今、家に帰るところだと答えなさい。", en: "I'm on my way home." },
                { id: 21, jp: "チェリーが、珍しくあなたに親切にしてくれている。友人に、今日、彼女は(どういうわけか)親切なんだよねと言いなさい。", en: "She is being kind today." },
                { id: 22, jp: "友人があなたに、キムの病気はどんな具合か聞いた。(彼女は)今日は気分が良いよと答えなさい。", en: "She is feeling good today." },
                { id: 23, jp: "友人があなたに、ボブは寮から引っ越して一人で住んでいるのか、と聞いた。(彼は)今、彼の祖父母と住んでいるよ、と答えなさい。", en: "He is living with his grandparents now." },
                { id: 24, jp: "サリーが夕飯の準備ができたよ、と言った。すぐにそちらへ行くよと答えなさい。", en: "I'm coming!" },
                { id: 25, jp: "ペンを使いたいのに、自分のペンが見当たらない。メアリーのペンがテーブルの上に置いてある。メアリーにあなたのペンを使うよと言いなさい。", en: "I'm using your pen!" },
                { id: 26, jp: "サリーに道で会った。今あなたはどこに行くところ?と聞かれた。今、仕事に行くところだと答えなさい。", en: "I'm going to work now." },
                { id: 27, jp: "どうやって通勤しているのか、とジンに聞かれた。歩いて通勤しているよと答えなさい。", en: "I go to work on foot." }
            ],
            "Lesson 1-10": [
                { id: 1, jp: "友人があなたに、あなたのお母さんは英語が上手だねと言った。母は英語の先生だったんだよと言いなさい。", en: "My mother was an English teacher." },
                { id: 2, jp: "昨日なぜラマはパーティーに来なかったのかと友人が言った。彼は昨日、仕事がとても忙しかったと言いなさい。", en: "He was very busy at work yesterday." },
                { id: 3, jp: "友人が、シェリーはとてもバスケットボールが上手だと言った。彼女はそのバスケットボールのチームに属していたのか聞きなさい。", en: "Was she on the basketball team?" },
                { id: 4, jp: "友人が物価が高くなったね〜と言った。うなずいて、去年はあまり高くなかったと言いなさい。", en: "Those weren't very expensive last year." },
                { id: 5, jp: "キムが先週末に初めて東京に行って来た、とあなたに言った。東京への旅行は楽しかったか聞きなさい。", en: "Was your trip to Tokyo fun?" },
                { id: 6, jp: "トムは珍しく宿題をしていない、と教室にいるあなたに言った。トムに昨日は忙しかったのか聞きなさい。", en: "Were you busy yesterday?" },
                { id: 7, jp: "友人が、高校では理科の授業が面白かったと言った。高校では誰が理科の先生だったか聞きなさい。", en: "Who was your science teacher in high school?" },
                { id: 8, jp: "友人が、高校ではよく勉強したと言った。その友人に高校ではどの授業が好きだったか聞きなさい。", en: "Which class was your favorite in high school?" },
                { id: 9, jp: "ルームメートのトムが早朝に帰ってきた。昨夜はどこにいたのか聞きなさい。", en: "Where were you last night?" },
                { id: 10, jp: "友人があなたに、自分の犬を見なかったかと聞いた。裏庭にいたことを伝えなさい。", en: "It was in the backyard." },
                { id: 11, jp: "電話であなたの友人が、大阪で行われる予定の野球の試合が中止になった、と言った。友人に大阪は昨日は雨だったのか聞きなさい。", en: "Was it rainy in Osaka yesterday?" },
                { id: 12, jp: "ソンの家に夜遅くまで滞在したあと、帰ろうと思って外に出たら、月明かりもなく真っ暗だった。なんて暗いんだと友人に言いなさい。", en: "How dark it is!" },
                { id: 13, jp: "起きて学校に行く準備をしなければならない時刻なのに、ルームメートがベッドに寝そべったままグズグズしている。外は明るいよ、目を覚ませと言いなさい。", en: "It is light outside. Wake up!" },
                { id: 14, jp: "友人の新居を訪ねている。その友人に、ここから大学までどのくらい時間がかかるか聞きなさい。", en: "How long does it take from here to your college?" },
                { id: 15, jp: "田舎に引っ越してからの生活はどんな具合? とリンゴが電話であなたに聞いた。自然が好きなあなたは、ここ、気に入っているよと答えなさい。", en: "I like it here." },
                { id: 16, jp: "友人があなたに、あなたの両親と祖父母はどこに住んでいるか聞いた。彼らはみな、京都に住んでいると答えなさい。", en: "They all are living in Kyoto." },
                { id: 17, jp: "あなたはギア氏に弟を紹介しようとしている。こちらはショウで、弟ですと紹介しなさい。", en: "This is Sho, my brother." },
                { id: 18, jp: "ナンシーがあなたに、あなたの妹は大学でうまくやっているか、と聞いた。彼女はとてもうまくやっているよと答えなさい。", en: "She is doing very well." },
                { id: 19, jp: "ルームメートが、あなたがどこで何をしているか電話で聞いてきた。今、カフェで勉強していると伝えなさい。", en: "I'm studying at the café right now." },
                { id: 20, jp: "トムがあなたに、ある情報がウェブサイトのどこにあるのか聞いた。スマホの画面にウェブサイトを表示して見せながら、そのサイトの、まさにここにあると答えなさい。", en: "It is right here on the website." },
                { id: 21, jp: "知り合いがあなたに、大阪の郊外に住んでいるのかと聞いた。大阪のど真ん中に住んでいると答えなさい。", en: "I live right in the center of Osaka." },
                { id: 22, jp: "体育館に入ったら寒くて震えるほどだ。ここはかなり寒いねと言いなさい。", en: "It is pretty cold here." },
                { id: 23, jp: "友人が、あなたのルームメートのキョウコは就寝が早いね、と言った。彼女は朝起きるのが早いんだよと言いなさい。", en: "She gets up early in the morning." },
                { id: 24, jp: "友人があなたに何時に夕食を食べているかと聞いた。あなたは毎晩7時に夕食を食べていると答えなさい。", en: "I eat dinner at seven every evening." },
                { id: 25, jp: "チェンが、あなたに会いたいと言ってきた。明日の午前に私のオフィスに来てと言いなさい。", en: "Come to my office tomorrow morning." },
                { id: 26, jp: "知人が、体の調子が悪いので医者に診てもらわなければ、と言った。君は酒を飲み過ぎるんだよと言いなさい。", en: "You drink too much." },
                { id: 27, jp: "ミックが、あのパソコンがとても安いので買おうかな、と言った。あれは安すぎるよとコメントしなさい。", en: "That is too cheap." },
                { id: 28, jp: "友人が、あなたの顔色が悪いと言った。あまり気分が良くないと言いなさい。", en: "I don't feel too well." }
            ],
            "Lesson 1-11": [
                { id: 1, jp: "友人の獣医師に、ペットを飼った経験があるか聞かれた。以前、犬を2匹飼っていたと答えなさい。", en: "I had two dogs before." },
                { id: 2, jp: "友人があなたに、おなかが空いているようだね、と言った。今朝、朝食を食べなかったと言いなさい。", en: "I didn't have breakfast this morning." },
                { id: 3, jp: "同僚があなたに、見かけない男性が働いているねと言った。彼は昨年は在宅勤務だったと答えなさい。", en: "He worked from home last year." },
                { id: 4, jp: "中国語が流暢な女子学生がいて、大学で学んだにしては中国語が上手だね、と友人が言った。彼女は去年、中国で中国語を勉強したんだよと答えなさい。", en: "She studied Chinese in China last year." },
                { id: 5, jp: "あなたは高校時代、バス通学だったの? と友人に聞かれた。高校には自転車で行っていたと伝えなさい。", en: "I went to high school by bike." },
                { id: 6, jp: "友人が、ジュンの英語はとても流暢だね、と言った。彼女は高校で英語を一生懸命に勉強したからねと言いなさい。", en: "She studied English hard at high school." },
                { id: 7, jp: "新たに男性社員が入社してきた。同僚があなたに、彼の以前の仕事は何だったのか、と聞いた。彼は学校で数学を5年間教えていたんだと言いなさい。", en: "He taught math for five years at a school." },
                { id: 8, jp: "あなたの友人が、先週神戸に行ったと言った。電車で神戸に行ったのか聞きなさい。", en: "Did you go to Kobe by train?" },
                { id: 9, jp: "友人が、ゆうべはオリンピックの試合を午前4時に見終わり、それから寝た、と言った。今朝は何時に起きたのか聞きなさい。", en: "What time did you get up this morning?" },
                { id: 10, jp: "友人が、あなたとルームメートのミックは昨日のパーティーに行ったか、と聞いた。彼は昨夜のパーティーには行っていないと答えなさい。", en: "He didn't go to the party last night." },
                { id: 11, jp: "友人が、ロサンゼルスに行ってきた、と言った。どうやってロサンゼルスに行ったのか聞きなさい。", en: "How did you go to Los Angeles?" },
                { id: 12, jp: "ルームメートが早朝に帰ってきた。昨夜どこに行っていたのか聞きなさい。", en: "Where did you go yesterday?" },
                { id: 13, jp: "友人があなたに、週末どこに行ったのか聞いた。金沢に行ったと答えなさい。", en: "I went to Kanazawa." },
                { id: 14, jp: "日曜日に自宅の庭でバーベキューパーティーを行う予定だ。知り合いのトムに、日曜日にここに来られるか聞きなさい。", en: "Can you come here on Sunday?" },
                { id: 15, jp: "あなたの隣の田中さんのところにオーストラリアから女子高生がホームステイに来た。彼女は日本語がしゃべれるか聞きなさい。", en: "Does she speak Japanese?" },
                { id: 16, jp: "友だちが自分の母親に電話したいが、自宅にスマホを忘れてしまったという。あなたのスマホを使っていいと言いなさい。", en: "You can use my smartphone." },
                { id: 17, jp: "インターナショナルスクールの教員のあなたは、子供たちが廊下を走っているのを見た。ここで走っちゃだめだよと言いなさい。", en: "You can't run here." },
                { id: 18, jp: "この地域は夏に暑いのか、と聞かれた。このエリアは夏はとても暑くなる可能性があるよと言いなさい。", en: "Summer can be very hot in this area." },
                { id: 19, jp: "あなたは医者として患者さんとその人の病気について話している。その患者さんに一般的にこの病気はシリアスになる(重症化する)可能性があると言いなさい。", en: "This illness can be serious." },
                { id: 20, jp: "あなたと友人は、ジェイソンが出場するアメリカンフットボールの試合を見に行った。その友人が、あれがジェイソン? と聞いた。ジェイソンはもっと小柄なので、ジェイソンであるはずはないよと答えなさい。", en: "That can't be Jason." },
                { id: 21, jp: "友人に相談があり、その友人に今夜会えるか、丁寧に聞きなさい。", en: "Could I see you tonight?" },
                { id: 22, jp: "あなたには、明日はたくさん買い物をする必要がある。車を持っている友人に、明日お店に一緒に行ってくれる? と丁寧に聞きなさい。", en: "Could you come with me to the store tomorrow?" },
                { id: 23, jp: "友人があなたに、午後にジムに行ったのかと聞いた。午後にそこに行くことはできなかったと答えなさい。", en: "I couldn't go there this afternoon." },
                { id: 24, jp: "友人から、あなたの祖父はお金持ちなんだってね、と言われた。祖父の家は大きくてプールがあると言いなさい。", en: "My grandpa's house is large and has a pool." },
                { id: 25, jp: "ルームメートのマリアが、あなたの机の上にある時計を指でさして、誰の時計?と聞いた。これは弟の時計だと答えなさい。", en: "This is my brother's watch." },
                { id: 26, jp: "友人に道でばったり会い、今どこに行くところか聞かれた。歯医者に行くところだと言いなさい。", en: "I'm going to the dentist's." },
                { id: 27, jp: "知り合いに、こちらは友人のジェイソンですと紹介しなさい。", en: "This is my friend, Jason." },
                { id: 28, jp: "友人があなたに、ジェリーと知り合いなのかと聞いた。ジェリーは知っているよ。(彼は)友人の一人だよと答えなさい。", en: "I know Jerry. He is a friend of mine." },
                { id: 29, jp: "ジュリアが怪我をしたと聞いたけど、とあなたの友人が言った。彼女は父親の車で事故を起こしてしまったと答えなさい。", en: "She had an accident with her father's car." }
            ],
            "Lesson 2-1": [
                { id: 1, jp: "友人があなたの家を訪ねてきて、車をどこに止めればいいかと聞いてきた。車庫の前に止めていいよと答えなさい。", en: "You may park in front of the garage." },
                { id: 2, jp: "あなたは担当教授のオフィスの、開いたドアの前にいる。入ってよろしいですかと聞きなさい。", en: "May I come in?" },
                { id: 3, jp: "あなたは寮に住む友人を訪ね、彼の部屋の開いたドアの前にいる。入っていいかと聞きなさい。", en: "Can I come in?" },
                { id: 4, jp: "急に雨が降り出した。ソンさんに、あの傘をお借りしてもいいですかと聞きなさい。", en: "May I borrow that umbrella?" },
                { id: 5, jp: "スミス家でのクリスマスパーティーに招かれた。スミス家の人に、お手洗いをお借りできますかと聞きなさい。", en: "May I use your bathroom, please?" },
                { id: 6, jp: "あなたのスタディーグループが、図書館に集まることになっている。ジョンは来るのか、とメンバーの一人に聞かれた。ジョンは遅れるかもしれないと答えなさい。", en: "John may be late." },
                { id: 7, jp: "友人があなたに、あなたのルームメートのサリーは今日学校に来るのか、と聞いた。(彼女は)今日はたぶん来ないだろうと答えなさい。", en: "She may not come today." },
                { id: 8, jp: "最近、急に寒くなってきた。ルームメートに(ひょっとすると)今夜は雪が降るかもしれないとコメントしなさい。", en: "It might snow tonight." },
                { id: 9, jp: "ルームメートが、チェンが自分から教科書を借りたまま、まだ返してくれていない、と言った。彼は(ひょっとすると返却しに)明日来るかもしれないと言いなさい。", en: "He might come tomorrow." },
                { id: 10, jp: "ルームメートが、夜に図書館に行くけれど傘を持って行ったほうがいいかな、とあなたに聞いた。うなずいて今夜は雪が降るよと言いなさい。", en: "It will snow tonight." },
                { id: 11, jp: "ルームメートがあなたに、図書館に行くけれど、夜には雪が降るかなと聞いた。いや、今夜、雪は降らないよと答えなさい。", en: "No, it won't snow tonight." },
                { id: 12, jp: "友人があなたに、仕事で車で遠出する予定だが、明日は雪が降るかなと聞いた。明日、雪は降らないかもしれないと答えなさい。", en: "It may not snow tomorrow." },
                { id: 13, jp: "ルームメートが、部屋をなるべく清潔にしておこうよ、と言ってきた。分かった、そうするよと答えなさい。", en: "OK. I will do so." },
                { id: 14, jp: "初めて行ったレストランで、サービスが悪くて嫌な思いをした。一緒に行った友人に、あのレストランには二度と行かないと言いなさい。", en: "I won't go to that restaurant again." },
                { id: 15, jp: "あなたはルームメートのナタリーと一緒に、寮の部屋に帰ってきた。ところが、どうしても部屋のドアが開かない。このドアの鍵どうしても開かないよ!とナタリーに言いなさい。", en: "This door won't unlock!" },
                { id: 16, jp: "家具を動かすのに助けが必要になった。ルームメートに、来て私を手伝ってくれと頼みなさい。", en: "Will you come and help me?" },
                { id: 17, jp: "友人が、あなたの飛行機は何時に出発するのか聞いた。飛行機は今夜9時発だと答えなさい。", en: "My plane leaves at nine tonight." },
                { id: 18, jp: "ルームメートがあなたに、明日は何コマ授業があるのか聞いた。明日は授業が6コマあると答えなさい。", en: "I have six classes tomorrow." },
                { id: 19, jp: "友人があなたに、ヨンは彼女といつ結婚するんだろうと聞いた。彼は彼女と来月に結婚するつもりだと言いなさい。", en: "He is going to marry her next month." },
                { id: 20, jp: "マリアがあなたに、来月のミーティングについて、いつカルロスに連絡するのか聞いた。昼食の後に彼に電話するつもりだと答えなさい。", en: "I'm going to call him after lunch." },
                { id: 21, jp: "急に黒い雲が出てきて、遠くで雷が鳴り出した。一緒にいる友人に、雨になりそうだねと言いなさい。", en: "It's going to rain." },
                { id: 22, jp: "ヨンがあなたに、マリーの赤ちゃんはいつ生まれるのか聞いた。彼女の赤ちゃんは今週にも生まれそうだねと答えなさい。", en: "She is going to have a baby this week." },
                { id: 23, jp: "マイケルがあなたに、今夜はどんな予定なのか聞いた。今夜は友人たちと一緒にお酒を飲む予定だと言いなさい。", en: "I'm drinking with my friends tonight." },
                { id: 24, jp: "朝は出かけるつもりだと、あなたのルームメートが言った。今朝のいつごろ出かける予定なのか聞きなさい。", en: "When are you going out this morning?" },
                { id: 25, jp: "あなたはホテルのフロントにいる。担当者に、チェックアウトをお願いしますと言いなさい。", en: "I'm checking out." },
                { id: 26, jp: "友人に、あなたのお父さんは若そうに見えるが何歳なのか、と聞かれた。父は来月60歳になると答えなさい。", en: "My father will be sixty next month." },
                { id: 27, jp: "ルームメートのビルとあなたは、共通の知人から明日のバーベキューパーティーに誘われた。(ひょっとすると)私と彼は明日ボストンに行くかもしれない、とその誘いを断りなさい。", en: "He and I might go to Boston tomorrow." },
                { id: 28, jp: "レストランでウェートレスに、ご注文は何にするか、と聞かれた。パスタにします、と答えなさい。", en: "I will have pasta." },
                { id: 29, jp: "ルームメートのカレンがサッカーで足を捻挫した。友人のビルが心配してカレンの様子を聞いてきた。彼女は大丈夫だと言いなさい。", en: "She will be OK." },
                { id: 30, jp: "あなたのルームメートは悲観主義者で、いつも俺はだめだと言っている。自分のことをそんなふうに言うものではないよと言いなさい。", en: "Don't talk about yourself like that." },
                { id: 31, jp: "大きなプロジェクトをやり終えた。友人に、誰と組んでやったのか聞かれた。自分一人でやったと答えなさい。", en: "I did it by myself." },
                { id: 32, jp: "友人が遠くからあなたを訪ねてやって来た。くつろいでくれと言いなさい。", en: "Please make yourself at home." }
            ],
            "Lesson 2-2": [
                { id: 1, jp: "勝手に私の自転車を使わないで、と友人に言ってあったのに、その友人がまた自転車を無断で使った。それについて言ってなかったっけ?と言いなさい。", en: "Didn't I tell you about it?" },
                { id: 2, jp: "あなたは今日、ルームメートと外で昼食を取るつもりでいた。しかし、昼時になってもルームメートは出かける素ぶりを見せない。(私たちは)昼食に出かけるんじゃないの?と聞きなさい。", en: "Aren't we going out for lunch?" },
                { id: 3, jp: "友人に新しく日本から来たリサを紹介したい。その友人に、あなたはリサを知らないよね? と確かめなさい。", en: "You don't know Lisa, do you?" },
                { id: 4, jp: "部屋のベッドを動かしたい。ジョゼフに来て手伝ってくれる?と頼みなさい。", en: "Come and help me, won't you?" },
                { id: 5, jp: "友人が最近、非常に忙しそうにしている。テストがあるの? 違う? と聞きなさい。", en: "You have a test, no?" },
                { id: 6, jp: "大学で上映される映画を見に行く予定にしている。ルームメートのジェニーも一緒に行ってほしいが、どうも彼女は映画が好きでないようだ。ジェニーに一応、あなたは行く予定ではないよね、正しい? と聞きなさい。", en: "You aren't going, right?" },
                { id: 7, jp: "お客さんに飲み物を出したい。コーヒーがいいか紅茶がいいか聞きなさい。", en: "Would you like coffee or tea?" },
                { id: 8, jp: "暑い日に、お客さんに冷たい飲み物を出したい。どれがいいですか? 炭酸飲料、ジュース、それとも水がいいですか? と聞きなさい。", en: "Which would you like, soda, juice, or water." },
                { id: 9, jp: "パーティーに参加し、だいぶ遅くなってきた。あなたと一緒に来ていたマリアに、行きましょうか、と帰宅をうながしなさい。", en: "Shall we go?" },
                { id: 10, jp: "部屋にたくさんの人が入ってきて、息苦しく感じられ始めた。窓を開けましょうかと提案しなさい。", en: "Shall I open the window?" },
                { id: 11, jp: "次の日曜日に買い物に行きたいと思っている。ルームメートのメグに、ショッピングセンターに行かないかと誘いなさい。", en: "Let's go to the mall, shall we?" },
                { id: 12, jp: "あなたは財布をなくしてしまった。友人に財布をなくした! どうしよう? と言いなさい。", en: "I lost my wallet! What shall I do?" },
                { id: 13, jp: "ルームメートの机の上に返却期限を過ぎた図書館の本があった。その本を、大学の図書館に返すべきだよと言いなさい。", en: "You should return the book to the college's library." },
                { id: 14, jp: "図書館で静かに勉強していたら、2人の生徒が大きな声で話しながら入ってきた。そんなに大声で話さないほうがいいよと言いなさい。", en: "You shouldn't speak so loudly." },
                { id: 15, jp: "ホセとジェイミーを、友人と待っている。なかなか来ないね、と友人が言った。彼らは5時までには来るはずだと答えなさい。", en: "They should come by five." },
                { id: 16, jp: "トムはしょっちゅう、あなたたち夫妻に何かを頼んでくる。しかし、あなたたちが彼に何かを頼むと、いつも断られる。今日、また彼があなたたちに頼み事を持ってきた。どうして私たちがあなたを手伝わなければならないのよと言いなさい。", en: "Why should we help you?" },
                { id: 17, jp: "キムがあなたに、マイクって良い人だと思うけど、どう?と聞いた。まあ、そう思うと答えなさい。", en: "I should think so." },
                { id: 18, jp: "ポールはよく学校の規則を破って先生にしかられている。彼はそのルールを守るべきだと言いなさい。", en: "He must follow the rule." },
                { id: 19, jp: "あなたはテレビで天気予報を見ている。明日以降冷え込むという予想が出ている。あなたのルームメートのマリオに、明日は雪かもしれないと言いなさい。", en: "It may snow tomorrow." },
                { id: 20, jp: "ロザンナがあなたに、日本では何歳から運転免許が取れるの? 16歳から? と聞いた。運転免許は18歳以上でないと取れないと答えなさい。", en: "You must be eighteen or over for this license." },
                { id: 21, jp: "トムが、マリーと婚約したと言った。うそでしょう! と言って驚きを伝えなさい。", en: "You must be joking!" },
                { id: 22, jp: "メリルが、ケンとあなたはなかなか英語が上手だ、と褒めてくれた。私たちは中学と高校で英語を猛勉強しなければならなかったと答えなさい。", en: "We had to study English very hard in junior high school and high school." },
                { id: 23, jp: "トムがあるテストを受けるつもりだ、とスザンナが言った。彼はいつそのテストを受けなければならないのか聞きなさい。", en: "When does he have to take the test?" },
                { id: 24, jp: "リサがあなたに、あなたのおばあさんが昨日あなたのアパートに来たんだってね、と聞いた。うなずいて、祖母は私に誕生日のプレゼントをくれたんだと言いなさい。", en: "My grandmother gave me a birthday present." },
                { id: 25, jp: "昨日どうしてジョーが来たのか、とマリーがあなたに聞いた。私の誕生日で、彼はお花を持って来てくれたんだと答えなさい。", en: "He brought me some flowers." },
                { id: 26, jp: "友人があなたに、スミスさんはあなたに写真を見せていたよね。何の写真だったの?と聞いた。スミスさんは娘さんの写真を見せてくれたと答えなさい。", en: "Mr. Smith showed me his daughter's picture." },
                { id: 27, jp: "あなたが、ある女性にあいさつした。後で、キムがあなたにあの人はどういう人なの、と聞いた。彼女は私に英語を教えてくれたと言いなさい。", en: "She taught me English." },
                { id: 28, jp: "友人が、自分はとても歌が得意で、中学ではコーラス部にいた、と言った。私たちに1曲歌って聞かせてと頼みなさい。", en: "Please sing us a song." }
            ],
            "Lesson 2-3": [
                { id: 1, jp: "医学部の学生は大学生活が長いね、と友人が言った。医者になるには長い時間がかかるんだよと言いなさい。", en: "To become a doctor takes a lot of time." },
                { id: 2, jp: "友人があなたに、来るべきプレゼンテーションの準備についての話し合いはいつがいいか、と聞いた。今夜それをやりたいと言いなさい。", en: "I want to do it tonight." },
                { id: 3, jp: "あなたの友人がロサンゼルスに行くことになり、どこを観光すればいいか聞いて来た。まず、ロサンゼルスには見所がたくさんあるよと言いなさい。", en: "There are a lot of things to see in Los Angeles." },
                { id: 4, jp: "友人が、リズはおっちょこちょいで、それでいつも失敗していると言った。彼女は立ち止まって考えることをしないからねと答えなさい。", en: "She never stops to think." },
                { id: 5, jp: "学校に待望のCALL 教室ができることになった。とても喜んだあなたは、それを聞いてとても幸せだ、とコメントしなさい。", en: "I'm very happy to hear that news." },
                { id: 6, jp: "キャンプに出かけ、あなたの友人が歩いて川を渡ろうとした。急に深くなる場所があることを知っているあなたは、その川を渡るのは危険だよと警告しなさい。", en: "The river is dangerous to cross." },
                { id: 7, jp: "ルームメートのジョゼフがあなたとあなたのガールフレンドに、出かける準備はできているか、と聞いた。私たちは出かける準備ができていると答えなさい。", en: "We are ready to go." },
                { id: 8, jp: "近所の女の子が先週、交通事故で足を怪我した。友人があなたに、もうその子は歩いて学校に行っているのか聞いた。その女の子はまだ歩けないよと言いなさい。", en: "The girl can't walk yet." },
                { id: 9, jp: "先週末あなたはコロラドに行く予定だったが大雪のために中止した。友人かあなたに、コロラド旅行はどうだったか聞いた。そこには行くことができなかったんだと答えなさい。", en: "I wasn't able to go there." },
                { id: 10, jp: "あなたは駅で友人と電車を待っている。ほどなく電車が近づいてきた。自分たちが乗ろうとしている電車らしい。あれは自分たちの電車に違いないと言いなさい。", en: "That must be our train." },
                { id: 11, jp: "チェリーが、お姉さん夫婦が子育てで大変だと言った。子供たちは気難しくなることがあるからねと言いなさい。", en: "Kids can be difficult." },
                { id: 12, jp: "女性が歩いている。リリアンが、あれはあなたのお母さんだよ、と言った。しかし、あなたのお母さんは今、この付近にはいないはずだ。私の母であるはずはないよと言いなさい。", en: "That can't be my mother." },
                { id: 13, jp: "天気予報によると雪が降るとのことで、ルームメートとあなたは傘を持って出た。空模様を見ると、降らないようにも思える。(ひょっとすると)雪は降らないかもしれないねと言いなさい。", en: "It might not snow." },
                { id: 14, jp: "先週あなたは、気分がすぐれず学校を休んだ。友人があなたを見て、元気になったか聞いてきた。気分はいいよと答えなさい。", en: "I feel good." },
                { id: 15, jp: "ロックコンサートに友人と行った。あるダンサーの踊りが素晴らしい。友人にあのダンサーはとても格好いいねと言いなさい。", en: "The dancer looks very cool." },
                { id: 16, jp: "ジェニファーに授業で会ったら、ニコニコしている。他のクラスメートに彼女は今日、幸せそうねと言いなさい。", en: "She looks happy today." },
                { id: 17, jp: "タイ料理のレストランで、友人の注文したスープが運ばれてきた。そのスープはおいしそうな匂いがするねとコメントしなさい。", en: "The soup smells delicious." },
                { id: 18, jp: "久しぶりに会ったトムが、元気のない声で話している。疲れているようだねとコメントしなさい。", en: "You sound tired." },
                { id: 19, jp: "ルームメートがあなたに、今朝はソワソワしているねと言った。テストの前は緊張するんだと言いなさい。", en: "I get nervous before tests." },
                { id: 20, jp: "ルームメートのヨンが、夜遅くなってからおなかが空いたと言い、何か食べるものはあるかなと冷蔵庫を見た。冷蔵庫にケーキがあるよと言いなさい。", en: "There's some cake in the fridge." },
                { id: 21, jp: "ホセと一緒に歩いていると、スーザンが歩いている姿が見えた。スーザンがあそこを歩いているよと言いなさい。", en: "There goes Susan!" },
                { id: 22, jp: "遠くに学校が見える。マリアは通う学校を決めたのだろうかと、とウェイが言った。彼女はたぶん、あの学校に行くよと答えなさい。", en: "Maybe she will go to that school." },
                { id: 23, jp: "サラは時間にルーズな生徒。キムがあなたに、サラが学校に来たか聞いた。彼女はいつものとおり、学校に遅れて来たよと答えなさい。", en: "As usual, she came to school late." },
                { id: 24, jp: "オーストラリアのスーパーマーケットで醤油が売られているのを見かけた。オーストラリアの友人に、あれ(醤油)は英語で何と呼ばれているのか聞きなさい。", en: "What do you call that in English?" },
                { id: 25, jp: "友人に、明日少し手伝ってほしいことがあると言ったのだが、明日はあまり時間がないとの返事。手間は取らせないからと言いなさい。", en: "I won't keep you long." },
                { id: 26, jp: "マリオがあなたに、来週どこかへ出かけようかと誘ってきた。来週はやることがたくさんあると答えなさい。", en: "I have many things to do next week." },
                { id: 27, jp: "マリーが、あなたは将来何になりたいか聞いた。私はエンジニアになりたいと答えなさい。", en: "I want to be an engineer." }
            ],
            "Lesson 2-4": [
                { id: 1, jp: "友人が遊びに来て、あなたが野球のカードを整理しているところを見た。野球のカードの収集は楽しいと言いなさい。", en: "Collecting baseball cards is fun." },
                { id: 2, jp: "トーマスが、庭の木が大きくなり過ぎたので、切り倒すつもりだと言った。素人が木を切るのはちょっと心配なので、木を切るのは危険だよとコメントしなさい。", en: "Cutting down trees is dangerous." },
                { id: 3, jp: "文化祭でミックのクラスはダンスを披露するということだった。友人があなたに、ミックはダンスがうまいのか、と聞いた。彼のダンスは素晴らしいと言いなさい。", en: "His dancing is great." },
                { id: 4, jp: "知り合いがあなたに、ルームメートのジョニーはどんな趣味を持っているか聞いた。彼の趣味の一つは読書だよと答えなさい。", en: "One of his hobbies is reading books." },
                { id: 5, jp: "あなたは健康そのもの。ホセがあなたに、健康を保つ秘訣は何だろうか、と聞いた。重要なことは健康的な食事と運動だよと答えさない。", en: "The important thing is eating healthily and exercising." },
                { id: 6, jp: "ヨンが、あなたたちはよく外食しているね、と言った。私たちは家で食事をするのが好きではないんだと答えなさい。", en: "We don't like eating at home." },
                { id: 7, jp: "久しぶりにミンに会ったら、髪を伸ばし放題で、どこかむさ苦しい感じになっていた。隣にいたあなたの友人に、彼の髪は切る必要があるねと言いなさい。", en: "His hair needs cutting." },
                { id: 8, jp: "どうして、寒いのに窓を開けて外を見ていたの、とルームメートが聞いた。木で(1羽の)鳥が鳴いているのを聞いていたんだと言いなさい。", en: "I heard the singing of a bird in a tree." },
                { id: 9, jp: "はるばる友人が手伝いに来てくれた。今日は来て手伝ってくれてありがとうと言いなさい。", en: "Thank you for coming and helping me today." },
                { id: 10, jp: "ボブがある本の話をした。(私は)その本を買おうとしていることを思い出したと言いなさい。", en: "I remembered to buy the book." },
                { id: 11, jp: "あなたは大学院に入学後、あなたのアカデミックアドバイザーに初めて会った。初めましてと言いなさい。", en: "Nice to meet you." },
                { id: 12, jp: "大学院のあなたのアカデミックアドバイザーとの話が終わり、別れ際に、お会いできて良かったですと言いなさい。", en: "Nice meeting you." },
                { id: 13, jp: "久しぶりに友人から電話があった。あなたはその友人が懐かしくなって、また会いたいと言いなさい。", en: "I hope to see you again." },
                { id: 14, jp: "友人があなたに、向こうにいる男性を知っているか、と聞いた。以前、会ったことを覚えていると言いなさい。", en: "I remember seeing him before." },
                { id: 15, jp: "海外から日本へ来たお客さんが、箸を使って日本料理を食べている。日本料理を楽しんでいるか聞きなさい。", en: "Do you enjoy eating Japanese food?" },
                { id: 16, jp: "クラスメートのトムが、スミス教授のクラスのリサーチペーパーの進み具合はどう? と聞いた。それは昨日終わらせた、と言いなさい。", en: "I finished doing it yesterday." },
                { id: 17, jp: "友人があなたに、最近タナカ氏は顔色がいいねと言った。うなずいて、彼は禁煙したんだよと言いなさい。", en: "He gave up smoking." },
                { id: 18, jp: "授業中に、クラスメートの2人がおしゃべりをやめない。授業中にはおしゃべりをやめてと言いなさい。", en: "Stop talking in the class!" },
                { id: 19, jp: "キムがあなたに、トヨタ家の人たちは映画を見るのが好きみたいだね、と言った。うなずいて、トヨタさん一家は映画に行くのが好きなんだと答えなさい。", en: "The Toyotas love to go / going to the movies." },
                { id: 20, jp: "ナタリーと寮に帰ろうとして、外に出たら雪が降り始めた。雪が降り始めたよとナタリーに言いなさい。", en: "It started to snow / snowing." },
                { id: 21, jp: "友人があなたに、寮を出て今ホームステイしているんだって? ホストマザーとファーザーはどんな人?と聞いた。ご主人は(彼)は小学校の先生で奥さんもそうだよと答えなさい。", en: "He is an elementary school teacher, and his wife is too." },
                { id: 22, jp: "友人があなたに、あなたのお兄さんとお姉さんはどこに住んでいるのか、と聞いた。兄は神戸在住で、姉は奈良在住だと答えなさい。", en: "My brother lives in Kobe and my sister in Nara." },
                { id: 23, jp: "ジョージが、転校生のサラの印象を聞いてきた。彼女は良い人だね、もしくはそう見えるだけなのかと答えなさい。", en: "She is a nice person, or she seems to be." },
                { id: 24, jp: "ルームメートと映画館に出かけようとしているが、そのルームメートが支度に手間取っている。急いで、じゃないと(私たち)遅れるよと言いなさい。", en: "Hurry up, or we will be late." },
                { id: 25, jp: "今日ジェリーと彼女のアパートでクラスのグループワークについて話すんじゃなかったのかと友人が聞いてきた。彼女と話したかったんだけど、そこにいなかったんだと言いなさい。", en: "I wanted to talk to her, but she wasn't there." },
                { id: 26, jp: "友人があなたに、とうとう宿題が全部は終わらなかったのか、と聞いた。一生懸命やったけど、終えられなかったと言いなさい。", en: "I tried hard, but I couldn't finish it." },
                { id: 27, jp: "友人があなたに、その数学の宿題を終わらせないといけないよ、と言った。でも、多すぎるからと言いなさい。", en: "But it's too much." },
                { id: 28, jp: "あなたはバス停を探しているが、なかなか見つからない。通りかかった親切そうな女性にすみませんが、バス停への道順を教えてくださいと頼みなさい。", en: "Excuse me, but could you tell me the way to the bus stop?" }
            ],
            "Lesson 2-5": [
                { id: 1, jp: "落胆した様子であなたは寮に帰った。あなたのルームメートがそれを見てどうしたのかとあなたに聞いた。図書館で誰かが私のコンピューターを盗んだんだ、と言いなさい。", en: "Someone stole my computer at the library." },
                { id: 2, jp: "落胆した様子であなたは寮に帰った。あなたのルームメートがそれを見てどうしたのかとあなたに聞いた。図書館で私のコンピューターが盗まれた、と言いなさい。", en: "My computer was stolen by someone at the library." },
                { id: 3, jp: "大入りの会議の場で、やっと1つ誰も座っていない椅子を見つけた。この席には誰か座るのかとその横に座っている人に聞きなさい。", en: "Is this seat taken?" },
                { id: 4, jp: "あなたの知り合いがあなたにこの国は留学生が多いね、と言った。この国では大学で英語が広く使われているんだよと答えなさい。", en: "English is widely used at colleges in this country." },
                { id: 5, jp: "友人があなたに、おじいさんは入学祝いに何かくれたのか、と聞いた。祖父はこの時計をくれたんだと答えなさい。", en: "My grandfather gave me the watch." },
                { id: 6, jp: "友人があなたに、おじいさんは入学祝いに何かくれたのか、と聞いた。私は祖父にこの時計をもらったんだと答えなさい。", en: "I was given the watch by my grandfather." },
                { id: 7, jp: "あなたの新しい時計を見た友人が、「その時計どうしたの? 買ったの?」と聞いてきた。この時計は祖父からもらったものだと答えなさい。", en: "The watch was given to me by my grandfather." },
                { id: 8, jp: "あなたの車のドアに少しへこみがある。それを見た友人が、どうしたのか、と聞いた。今朝、自転車に当てられちゃったと答えなさい。", en: "I got hit by a bike this morning." },
                { id: 9, jp: "あなたたちはローズをどう思うか、とトムが聞いてきた。私たちは彼女をとても親切だと思っていると答えなさい。", en: "We consider her very kind." },
                { id: 10, jp: "マリアがあなたに、彼女はクラブでどう思われているか聞いてきた。彼女はとても親切だと思われていると答えなさい。", en: "She is considered very kind." },
                { id: 11, jp: "あなたの会社の新製品の売れ行きはどう、と友人が聞いた。この製品はよく売れているよと答えなさい。", en: "This product is selling well." },
                { id: 12, jp: "友人があなたに、いつもそのタブレットを使っているね、と言った。このタブレットはとても役に立つからねと答えなさい。", en: "This tablet works well." },
                { id: 13, jp: "ビーチからジョンが帰ってきた。1日で彼の白い肌がかなり日焼けをしていた。友人に、彼の肌は日焼けしやすいねと言いなさい。", en: "His skin burns easily." },
                { id: 14, jp: "友人が、あなたが手に持っている薄いテキストブックを指差して、そのテキストを使うクラスは週に何回あるのか、と聞いた。このクラスは週に3回だよと答えなさい。", en: "This class meets three times a week." },
                { id: 15, jp: "メイが果物を買ってきた。早く食べたほうがいいよ、という意味で、この果物は長くは持たないよと言いなさい。", en: "This fruit won't keep long." },
                { id: 16, jp: "トムが、リンダは今どうしているか電話で聞いてきた。リンダは今図書館で勉強しているよと答えなさい。", en: "Linda is studying at the library now." },
                { id: 17, jp: "友人があなたに、リリーは口下手だし人付き合いが悪いのに、どうしてあなたはリリーのことが好きなのか、と聞いた。(自分にとって)リリーはとても面白いと答えなさい。", en: "Lilly is very interesting to me." },
                { id: 18, jp: "友人があなたに、あなたのルームメートのサリーはどの学問に興味があるのか聞いた。サリーは数学に興味があると答えなさい。", en: "Sally is interested in math." },
                { id: 19, jp: "新しい女子生徒の印象をトムに聞かれた。私にはとてもチャーミングな女の子のように見えたと答えなさい。", en: "She seemed a very charming girl to me." },
                { id: 20, jp: "車の事故があった。原因は何だったのだろうかと友人が言った。あなたはニュースを見て事故原因を知っていた。車を運転していた女性は疲れていたんだよと言いなさい。", en: "The woman driving the car was tired." },
                { id: 21, jp: "不思議な話を友人から聞いた。それはとても興味深い話だとコメントしなさい。", en: "That is a very interesting story." },
                { id: 22, jp: "友人が、日本語を履修したいが、難しいだろうかと聞いてきた。書き言葉としての日本語は難しいよと答えなさい。", en: "Written Japanese is difficult." },
                { id: 23, jp: "新しい映画を見た翌日、どうだった? と友人が聞いてきた。その映画はちょっとつまらないよと答えなさい。", en: "The movie is a little boring." },
                { id: 24, jp: "あなたは、知り合いが若くして急に亡くなったという知らせを聞いた。友人に、それには本当に驚いたと言いなさい。", en: "That was really surprising to me." },
                { id: 25, jp: "彼女のおしゃべりは度を越している。友人に彼女には疲れると言いなさい。", en: "She is tiring." },
                { id: 26, jp: "ローリーは夏休みを終え、別人のようになっていた。以前はフレンドリーだったのに、今朝会った彼女は陰鬱な雰囲気だった。彼女の変化はショックだったと言いなさい。", en: "The change in her was shocking." },
                { id: 27, jp: "あなたは初めてボクシングの試合を観戦している。この試合はとっても興奮するねと言いなさい。", en: "The match is very exciting." },
                { id: 28, jp: "友人があなたに、どうして図書館で勉強しないのか聞いた。図書館は今日、閉館していると答えなさい。", en: "The library is closed today." },
                { id: 29, jp: "友人があなたに、そのデパートは昨日は何時に閉まったか聞いた。そのデパートは5時に閉まったと答えなさい。", en: "The department store closed at five." }
            ],
            "Lesson 2-6": [
                { id: 1, jp: "ジョージが入院した。そのことを知らなかったの? と友人に聞かれた。彼が病気であることは知っていたよと答えなさい。", en: "I knew that he was sick." },
                { id: 2, jp: "日本人会のミーティングがキャンセルになった。帰りに会ったサヤカのルームメートのリズに、サヤカが帰ってきたら、それについてサヤカに言っておいてと頼みなさい。", en: "Tell Sayaka about it when she comes back." },
                { id: 3, jp: "友人が、シェリーは今日、機嫌が悪いと言った。昨夜遅くまで彼女が勉強していたことを知っているあなたは、その友人に、彼女はとても疲れていると思うと言いなさい。", en: "I think (that) she is very tired." },
                { id: 4, jp: "学園祭で日本人留学生組が出し物をすることになった。あなたはメイに忍者役を頼んだ。友人があなたに、どうだった? と聞いた。彼女はそれは(どうしても)やらないと言ったと答えなさい。", en: "She said that she wouldn't do that." },
                { id: 5, jp: "友人があなたに、今日はケンが来ないね。パーティーの準備を手伝ってくれると思っていたのに、と言った。彼は来るつもりだと思ったと言いなさい。", en: "I thought that he was going to come." },
                { id: 6, jp: "リッチが難しい資格試験を受験した。リッチの友人に、彼はそのテストに受かると思うか聞きなさい。", en: "Do you think that he will pass the test?" },
                { id: 7, jp: "友人があなたに、「家族に問題があるんだって? どんな問題?」と聞いた。問題は母が病気で寝ていることだと言いなさい。", en: "The trouble is that my mother is sick in bed." },
                { id: 8, jp: "タイ人の留学生のアパートに行ったら、台所に見慣れないソースがある。一緒に行った中国人の友人に、あれが何か知っているか聞きなさい。", en: "Do you know what that is?" },
                { id: 9, jp: "ルームメイトがあなたに、今朝、お兄さんがあなたに会いに来たよ、と言った。いつ兄が会いにきたのか教えてと聞きなさい。", en: "Can you tell me when my brother came to see me?" },
                { id: 10, jp: "クラスメートが、グループリサーチのやり方が分からないと言った。あなたもよく分からない。そのグループリサーチをどうやるべきか、私がジョンに聞くよと言いなさい。", en: "I will ask John how we should do our group research." },
                { id: 11, jp: "ローズが何かマシューに失礼なことを言ったらしい。そんなことを言う人ではないのに、と思いながら、彼女がそんなことを言うのは変だねとコメントしなさい。", en: "It's strange that she says so." },
                { id: 12, jp: "あなたのほうがお父さんより少し背が高いようだね、と友人が言った。父は私と同じくらい背が高いよと言いなさい。", en: "Dad is as tall as me." },
                { id: 13, jp: "タローは英語が流ちょうだね、とキムが言った。彼はできるだけ頑張って勉強していたからねと答えなさい。", en: "He studied as hard as he could." },
                { id: 14, jp: "友人があなたに、寮の隣室のセーラはどんな人?と聞いた。知っている限りでは彼女は良い人だよと答えなさい。", en: "She is a nice person as far as I know." },
                { id: 15, jp: "友人があなたに、あなたのルームメートのリズは持ち物が多いねと言った。(彼女は)必要以上に物を買っていると答えなさい。", en: "She buys more things than she needs." },
                { id: 16, jp: "友人があなたに、フランス語を履修する学生数と中国語を履修する学生数の、どちらが多いかを聞いた。中国語を履修する学生のほうがフランス語のそれより多いと答えなさい。", en: "There are more students in the Chinese class than in the French class." },
                { id: 17, jp: "ジェーンは非常に背が高い。あなたは、ジェーンのお姉さんも背が高いことを知っている。あなたはお姉さんより背が高いの? とジェーンに聞きなさい。", en: "Are you taller than your big sister?" },
                { id: 18, jp: "友人に頭がいいね、と言われて恐縮した。その友人のほうが自分よりも頭がいいと思っていたので、あなたのほうが私より頭がいいと思うよと言いなさい。", en: "I think you're smarter than me." },
                { id: 19, jp: "ハナはだんなさんと同い年くらいかな、と友人があなたに聞いた。(彼女は) だんなさんより 2歳年下だよ、と答えなさい。", en: "She is two years younger than her husband." },
                { id: 20, jp: "友人は最近よくお酒を飲む。もっと酒量を減らすべきだとアドバイスしなさい。", en: "You should drink less." },
                { id: 21, jp: "友人が、中国とアメリカは国土面積で世界のベスト4に入ると言った。どちらが大きいの? 中国? アメリカ? と聞きなさい。", en: "Which is larger, China or America?" },
                { id: 22, jp: "友人があなたに、日本で一番高い山は何か聞いた。日本では富士山が最も高い山だと答えなさい。", en: "Mt. Fuji is the highest mountain in Japan." },
                { id: 23, jp: "友人とトミーの3人で買い物に行く約束をしているが、トミーは時間にルーズだ。友人に、(彼は)かなりの確率で遅れて来るよと言いなさい。", en: "Most likely he will come late." },
                { id: 24, jp: "友人が、あなたのクラスのヨウコはみんなから頼りにされているみたいだね、と言った。ヨウコはクラスで最も頭のいい生徒だよと言いなさい。", en: "Yoko is the smartest student in her class." },
                { id: 25, jp: "ソラは背が低いね、と友人が言った。ソラは学校の全ての男の子たちの中で最も背が低いよと言いなさい。", en: "Sora is the shortest of all the boys in his school." },
                { id: 26, jp: "あなたの中間テストの結果があまり良くなかったので、ルームメートがなぐさめてくれた。次はもっとうまくやるよと言いなさい。", en: "I will do better next time." },
                { id: 27, jp: "秋に、グループで美しい山にハイキングに行った。空気が澄んでいて気分が良い。ここは秋に来るには最高の場所だねと言いなさい。", en: "This is the best place to visit in autumn." }
            ],
            "Lesson 2-7": [
                { id: 1, jp: "ジェリーが後で電話すると言っていた。ルームメートが、ジェリーはいつ電話してくれるんだろう、とあなたに聞いた。彼が(今日の)いつ電話を折り返しかけてくるか知らないと言いなさい。", en: "I don't know when he will call me back today." },
                { id: 2, jp: "ジェームズが、あなたがボストンに旅行すると知って、MITには行ってみるべきだと勧めた。ボストンに行ったらそこに行くつもりでいると言いなさい。", en: "I'm going to go there when I go to Boston." },
                { id: 3, jp: "友人があなたに、キムがあなたに電話すると言っていた、と教えてくれた。夕食を食べているときに彼女が電話をくれたとその友人に言いなさい。", en: "When I was eating dinner, she gave me a call." },
                { id: 4, jp: "あなたの友人が、「夏休み中にニュージーランドでホームステイするんだって?」と聞いてきた。うなずいて、ニュージーランドに行く前に英語を一生懸命勉強したいと言いなさい。", en: "I want to study English very hard before I go to New Zealand." },
                { id: 5, jp: "ルームメートのキムが疲れている様子だ。今日の皿洗いはキムの担当だけれど、食べ終わったら私が皿洗いをすると言いなさい。", en: "I will do the dishes after we eat." },
                { id: 6, jp: "あなたはシェアハウスに住んでいる。同じシェアハウスの友人がリズはいつ帰ってくるんだろうね、と聞いてきた。(ひょっとすると)彼女は6時前に家に帰ってくるかもしれないと言いなさい。", en: "She might come home before six." },
                { id: 7, jp: "ジェイミーがあなたに、いつ就寝するのか聞いた。いつも11時以降に寝ると言いなさい。", en: "I usually go to bed after eleven." },
                { id: 8, jp: "あなたの家にベンがやって来た。料理の最中なのでリビングで待ってもらうことにした。彼に、料理をしている間そのビデオを見ていていいよと言いなさい。", en: "You can watch the video while I'm cooking." },
                { id: 9, jp: "マリアがあなたに、昨日どこかに出かけたの、と聞いた。雨が降っていたので昨日は出かけなかったと答えなさい。", en: "I didn't go out yesterday because it was raining." },
                { id: 10, jp: "ジェニファーは、フランス語の他に韓国語も勉強していると言った。彼女に、どうして韓国語を勉強しているのか聞きなさい。", en: "Why are you learning Korean?" },
                { id: 11, jp: "友人が、あなたがなぜ韓国語を勉強しているのか聞いた。それはいつか韓国に行ってみたいからだと答えなさい。", en: "It is because I want to go to Korea someday." },
                { id: 12, jp: "ジェリーがあなたに、サッカーの試合に行くつもりかどうか聞いてきた。もう一人のあなたの友人ベンが行くかどうかは分からない。彼が行くなら私も行くよと言いなさい。", en: "If he goes, I will go." },
                { id: 13, jp: "あなたは、アルバイトの関係で友人との約束の時間に遅れるかもしれない。もし遅れるなら電話するよとその友人に言いなさい。", en: "If I'm late, I'll call you." },
                { id: 14, jp: "友人が、あなたはよく散歩してるよね、と言った。あまり忙しくないときは約30分散歩していると言いなさい。", en: "I take a walk of about 30 minutes if I'm not too busy." },
                { id: 15, jp: "持ち寄りパーティーを催すことになった。友人に、(君が)もし飲み物を持っていくなら、私はスナックを持っていくと言いなさい。", en: "If you bring drinks, I will bring snacks." },
                { id: 16, jp: "あなたは、友人を明日のコンサートに誘った。そこに行くことができるかどうか教えてと言いなさい。", en: "Let me know if / whether you can go there." },
                { id: 17, jp: "午後にショッピングセンターには行けないかもしれない、とスージーが言った。たとえ彼が行かなくても私は行くと言いなさい。", en: "I'll go even if he doesn't." },
                { id: 18, jp: "友人が、あなた方ご夫妻はスパイシーな食べ物が好きか、と聞いた。彼はそうではないけど私は好きです、と答えなさい。", en: "I like it even though he doesn't." },
                { id: 19, jp: "友人があなたに、キムとあなたは週末にどこに行くのか聞いた。キムと私は日曜日にスキーに行く予定だと答えなさい。", en: "Kim and I are going skiing on Sunday." },
                { id: 20, jp: "ジャネットが、日本に行くつもりだ、とあなたに言った。いつ日本に到着するのか聞きなさい。", en: "What day will you arrive in Japan?" },
                { id: 21, jp: "キムとカフェで会う約束をしていた。カフェに行ったらキムが先に来ていた。いつここに着いたのか聞きなさい。", en: "When did you arrive here?" },
                { id: 22, jp: "ソンがあなたに、学校には徒歩で来ているのかと聞いた。ここには毎日自転車で来ていると答えなさい。", en: "I come here by bike every day." },
                { id: 23, jp: "トムがあなたに、いつディズニーワールドに行くのか聞いた。そこには明日行きたいんだと答えなさい。", en: "I want to go there tomorrow." },
                { id: 24, jp: "友人があなたに、昨日、風邪をひいていたそうだね。学校には行けたの? と聞いた。一日中自宅にいたと答えなさい。", en: "I stayed at home all day." },
                { id: 25, jp: "友人が、夜7時からの映画に行かないか、と誘ってきた。夜は外には出たくないと答えなさい。", en: "I don't want to go out in the evening." },
                { id: 26, jp: "友人が、最近とても忙しくて眠る暇もないくらいだ、と言った。夜、何時に寝ているのか聞きなさい。", en: "At what time do you go to sleep at night?" }
            ],
            "Lesson 3-1": [
                { id: 1, jp: "ジョンがあなたに、ヨーロッパに行ったことがあるか聞いた。ヨーロッパには一度行ったことがあると答えなさい。", en: "I have been to Europe once." },
                { id: 2, jp: "友人があなたのアパートに来た。あなたのバスケットボールシューズを見て、意外そうな顔をした。以前バスケットボールをしていたんだと言いなさい。", en: "I have played basketball before." },
                { id: 3, jp: "ルームメートのジョージが帰ってきて、ソファーでテレビを見てくつろいでいるあなたを見た。あなたは明日提出の宿題をやっているとばかり思っていた、とジョージはけげんそうな顔をした宿題は終わったよと彼に言いなさい。", en: "I have finished my homework." },
                { id: 4, jp: "ミンがインターネットでメキシコの風景を見ている。彼にメキシコに行ったことがあるか聞きなさい。", en: "Have you ever been to Mexico?" },
                { id: 5, jp: "友人がスティーブとは長い付き合いだ、と言った。どのくらいの期間、スティープを知っているか聞きなさい。", en: "How long have you known Steve?" },
                { id: 6, jp: "友人があなたに、去年、海外旅行をしたの? と聞いた。昨秋にタイに行ったんだと答えなさい。", en: "I went to Thailand last fall." },
                { id: 7, jp: "友人が、ジョギングを続けているか? と聞いてきた。うなずいて、今朝、公園の周りを走ってきたと言いなさい。", en: "I ran around the park this morning." },
                { id: 8, jp: "サリーが電話をかけてきて、今何をしているのか聞いた。ちょうど夕食を終えたところだと答えなさい。", en: "I've just finished my dinner." },
                { id: 9, jp: "新聞をルームメートが読んでいる。その新聞もう来たの? と言いなさい。", en: "Has the newspaper come already?" },
                { id: 10, jp: "朝起きて居間に行くと妻が先に起きていた新聞はもう来ているか聞きなさい。", en: "Has the newspaper come yet?" },
                { id: 11, jp: "あなたはシェアハウスに住んでいて、朝起きて居間に行ったらスティーブがテレビを見ていた。もう朝食を食べたか聞きなさい。", en: "Have you finished eating breakfast yet?" },
                { id: 12, jp: "キムがあなたに、イギリス住まいがずいぶん長いんだね、と言った。イギリスには15年住んでいると言いなさい。", en: "I have lived in England for fifteen years." },
                { id: 13, jp: "メグがあなたの友人のデイブと話していた後で彼女に聞いたところ、デイブのことをよく知っている、という。彼をどのくらい前から知っているのか聞きなさい。", en: "How long have you known him?" },
                { id: 14, jp: "遠くに住んでいる友人から電話があった。こちらの天候を聞かれたので、日曜日以来とても暑いんだと答えなさい。", en: "It's been very hot since Sunday." },
                { id: 15, jp: "トムがトルストイの『戦争と平和』を読んでいた。以前その小説を読んだことがあるよと言いなさい。", en: "I've read the novel before." },
                { id: 16, jp: "友人と歩いていて、授業があるのでそろそろ学内に戻ろうかと時計を見たら止まっていた。あつ、(自分の)時計が止まっていると言いなさい。", en: "Oh, my watch has stopped!" },
                { id: 17, jp: "友人が、あなたのルームメートのトムはまだ家にいるか聞いた。ニュージーランドに行ったよ、と答えなさい。", en: "He has gone to New Zealand." },
                { id: 18, jp: "友人があなたに、ケイコはまだ受けるべきテストが残っているのかと聞いた。ケイコのテストは終わったよと答えなさい。", en: "Keiko has finished her tests." },
                { id: 19, jp: "友人があなたに、ケイコはまだ受けるべきテストが残っているのかと聞いた。ケイコはテストが終わっているよと答えなさい。", en: "Keiko is finished with her tests." },
                { id: 20, jp: "友人が机上のパソコンを見て、あなたが買ったのか、それともあなたのルームメートのヨシコが買ったのか、と聞いた。これは彼女が昨日買ったパソコンだよと答えなさい。", en: "This is the PC that she bought yesterday." },
                { id: 21, jp: "あなたの従姉妹たち、バイオリンが上手だね、と友人が言った。私にはバイオリンのとても上手なおばがいると言いなさい。", en: "I have an aunt who plays the violin very well." },
                { id: 22, jp: "今夜はすしを食べたい気分。友人に、おいしいすしを食べられる店を知っているか聞きなさい。", en: "Do you know anywhere that I can get nice sushi?" },
                { id: 23, jp: "あなたは友人に昔の写真を見せている。その中に古い家の写真が出てきた。これはかつて住んでいた家だよと友人に言いなさい。", en: "This is the house that I once lived in." },
                { id: 24, jp: "友人があなたに、なぜ田中さんにスペイン人のマリアを紹介したのか、と聞いた。彼にはスペイン語を話す人が必要なんだよと答えなさい。", en: "He needs a person who speaks Spanish." },
                { id: 25, jp: "ボールがあなたに、日本は年功序列社会だったそうだね、と言った。うなずいて、よく働く人はもっとお金をもらうべきだよねと言いなさい。", en: "Those who work hard should be paid more." },
                { id: 26, jp: "メアリーがあなたに、日本では何歳から中学校に通わなければならないのか、と聞いた。12歳から子供はみな中学に行かなければならないと答えなさい。", en: "Any child who is 12 or older has to go to junior high school." },
                { id: 27, jp: "友人があなたに、お兄さんは動物が好きなようだねと言った。(彼は)野生の動物を見るのが好きだと言いなさい。", en: "He likes to see animals which are in the wild." },
                { id: 28, jp: "ルームメートのシンシアが、何かを探している。あなたが図書館から借りたCDはテーブルの上にあるよと言いなさい。", en: "The CD which you borrowed from the library is on the table." },
                { id: 29, jp: "友人があなたに、君のお兄さんの部屋にはずいぶん物が多いね、と言った。彼は捨てたくない古い物をたくさん持っているからねと答えなさい。", en: "He has a lot of old things that he doesn't want to throw away." },
                { id: 30, jp: "ルームメートがあなたに、皿を洗ってくれないかと聞いた。前回洗ったのはあなたなので、あなたは少し腹を立ててそれをすべきなのは君だよと言いなさい。", en: "It's you that should do it." }
            ],
            "Lesson 3-2": [
                { id: 1, jp: "あなたはフレッドが早めに帰っていくのを怪訝に思っている。彼の同僚に、なぜフレッドはいつも早く帰っていくのか聞きなさい。", en: "Why does Fred always leave early?" },
                { id: 2, jp: "メルは今日、早めに帰ろうとしている。同僚に、なぜ彼は早めに帰ろうとしているのか聞きなさい。", en: "Why is he leaving early?" },
                { id: 3, jp: "クラスメートに、(いつも)クリスマスイブには何をしているのか聞きなさい。", en: "What do you do on Christmas Eve?" },
                { id: 4, jp: "冬休み前。クラスメートに、クリスマスイブに何をする予定か聞きなさい。", en: "What are you doing on Christmas Eve?" },
                { id: 5, jp: "友人が、あなたのお兄さんはどうして自分の会社をたたんでしまったのか聞いた。(彼は)自分のビジネスへの興味を失ったんだと答えなさい。", en: "He lost interest in his business." },
                { id: 6, jp: "あなたはメルを最近、見ていない。メルの友人に、彼は最近ここに来ているか聞きなさい。", en: "Has he been here lately?" },
                { id: 7, jp: "あなたのクラスのアグネスは、成績が飛び抜けて良い。他のクラスメートに、彼女ほど頭の良い人に会ったことがないと言いなさい。", en: "I have never met any person as smart as her." },
                { id: 8, jp: "友人が、あなたのお兄さんは海外で働いていたんだって? と聞いた。(彼は) ドイツで5年間働いたと答えなさい。", en: "He worked in Germany for five years." },
                { id: 9, jp: "友人が、あなたのお兄さんは海外で働いているんだって? と聞いた。(彼は)ドイツで5年間働いていると答えなさい。", en: "He has worked in Germany for five years." },
                { id: 10, jp: "友人があなたに、キムはまだ学校に通っているのか聞いた。彼女は学校生活を終えたよと答えなさい。", en: "She finished school." },
                { id: 11, jp: "友人が、先週のパーティーではあなたを見かけなかった、と言った。(私は)その夜7時に出たんだと言いなさい。", en: "I left at seven that night." },
                { id: 12, jp: "あなたは、ルームメートのリチャードにどうしても電話をかけなければならない。しかし、彼の電話番号が思い出せない。友人に彼の電話番号を忘れてしまったと言いなさい。", en: "I forget his phone number." },
                { id: 13, jp: "クラスメートのロナルドがあなたに、来週のテストの内容について聞いてきた10分ほどかけて説明したが、彼が理解したようには見えない。分かった?と聞きなさい。", en: "Do you understand?" },
                { id: 14, jp: "クラスメートのカルロスが、あなたに来週のテストの内容について詳しく説明してくれた彼が、理解できたか聞いてきたので、うん、分かったと答えなさい。", en: "Yes, I understand." },
                { id: 15, jp: "みながミーティング室に集まった。あなたは司会者役を務める。ミーティングを始めますと言いなさい。", en: "We start our meeting." },
                { id: 16, jp: "あなたはスーザンに、クリスマスパーティーに誘われた。スーザンの手料理が振る舞われるとのこと。彼女は料理が上手だと聞いていると友人に言いなさい。", en: "I hear she is good at cooking." },
                { id: 17, jp: "友人があなたに、どうしてジムはあんなに科学が得意なんだろう、と言った。おじいさんが科学の先生だったと彼が言っていたよと答えなさい。", en: "He says his grandfather was a science teacher." },
                { id: 18, jp: "あなたの友人が帰ろうとしていて、友人のルームメートのシェリーを見なかったかあなたは聞かれた。彼女は向こうに座っているよと答えなさい。", en: "She is sitting over there." },
                { id: 19, jp: "ナンシーは今日とても良いイヤリングを着けている。彼女に今日はきれいなイヤリングを着けているねと言いなさい。", en: "You are wearing pretty earrings today." },
                { id: 20, jp: "あなたはランチを食べなかった。ルームメートが何も欲しくないのか、とあなたに聞いた。うん、それほどおなかが空いてないからと答えなさい。", en: "No, I'm not so hungry." },
                { id: 21, jp: "ルームメートのトムに、今日は学校に行かなかったんだね、と聞かれた。うん、腹痛だったからねと答えなさい。", en: "No. I had a stomachache." },
                { id: 22, jp: "友人があなたに、最近ジムとジェニファーは、よく一緒にいるね、と言った。彼は彼女と付き合っているんだと答えなさい。", en: "He is going out with her." },
                { id: 23, jp: "あなたは今夜、仕事でお客さんとお酒を飲むことになっている。アシスタントのキムに、今夜、車を運転できないか聞きなさい。", en: "Can't you drive tonight?" },
                { id: 24, jp: "ビリーは、早く大学の課程を終わろうとしている。そのビリーに、夏休み中にもクラスを履修しているよね、違う?と聞きなさい。", en: "You have some classes during the summer vacation, no?" },
                { id: 25, jp: "スーザンがあなたに、マイケルは引っ越しを手伝ってくれるだろうか、と聞いてきた。どうかなと答えなさい。", en: "I doubt it." },
                { id: 26, jp: "あなたの部屋に遊びに来ていたマギーが、のどがかわいたと言った。ああ、そう? 冷蔵庫に炭酸飲料があるよと言いなさい。", en: "Are you? I have soda in the fridge." },
                { id: 27, jp: "新しい製品をプロモートするにあたり、営業の皆で良い方法を考えているが、なかなかいいアイディアが浮かばない。それをどうやるのかは難しい問題だねと言いなさい。", en: "How to do it is a difficult question." },
                { id: 28, jp: "トムがあなたに、お酒を飲みたくないのに友だちに飲み会に誘われるんだ、と言った。あなたは、問題はそれをどう避けるかだねと言いなさい。", en: "The problem is how to avoid it." }
            ],
            "Lesson 3-3": [
                { id: 1, jp: "外は雨。この辺ではよく雨が降るのか、とマイケルが聞いた。この季節には雨はあまり降らないよと答えなさい。", en: "We don't get much rain during this season." },
                { id: 2, jp: "友人があなたに、ウィリアムはロだけは達者だけど何もしないね、と言った。一番よくしゃべる人が一番何もしないものだよと答えなさい。", en: "They do least who talk most." },
                { id: 3, jp: "友人があなたに、コロンビアではどんな農産物が生産されるんだろう、と聞いた。コロンビアではコーヒーが栽培されていると答えなさい。", en: "They grow coffee in Colombia." },
                { id: 4, jp: "スーザンがあなたに、イギリスと日本は同じくらいの面積か、と聞いた。日本の面積はイギリスのそれより大きいと答えなさい。", en: "The size of Japan is larger than that of the UK." },
                { id: 5, jp: "友人があなたに、来年はまたインフルエンザがはやるだろうね、と言った。そうは思わないと答えなさい。", en: "I don't think so." },
                { id: 6, jp: "カレンがあなたに、今年こそ物価が安定すればいいけど、と言った。そう望むよと答えなさい。", en: "I hope so." },
                { id: 7, jp: "大教室での授業に初めて出たら、中学生くらいの年の男の子がいた。一緒にいた友人に、あの大学生は13歳かそこらにちがいないねと言いなさい。", en: "The college student must be thirteen or so." },
                { id: 8, jp: "ネットショッピング中、あなたのルームメートが、そのサイトでの買い物は危ないよ、と言った。どういうふうに(危ないの)? と聞きなさい。", en: "How so?" },
                { id: 9, jp: "久しぶりにミンに会った。そこで、あなたは「どう? 元気?」と聞かれた。今のところは順調だよと答えなさい。", en: "So far, so good." },
                { id: 10, jp: "友人があなたに、あなたの露出は多すぎるよ。男性たちがジロジロ見るよ、と言った。それがどうしたっていうの? と答えなさい。", en: "So what?" },
                { id: 11, jp: "あなたとルームメートがレストランに行った。ルームメートはスパゲッティを頼み、ウェーターがあなたに、何になさいますか?と聞いた同じものにしますと答えなさい。", en: "I'll have the same." },
                { id: 12, jp: "リズがあなたに、あの国の大統領は森林破壊を奨励するような発言をしてひどい、と言った私も妻もあなたと同じように感じると答えなさい。", en: "My wife and I feel the same as you." },
                { id: 13, jp: "夜道で、あなたは自宅に帰ろうとしている友人に会った。良い夜を! と言いなさい。", en: "Have a good night!" },
                { id: 14, jp: "金曜日の夜、別れ際に友人から「良い週末を!」と言われた。あなたもねと返事をしなさい。", en: "The same to you!" },
                { id: 15, jp: "友人があなたに、ナタリーには双子の姉がいるんだってね、と言った。うなずいて、どちらがどちらか見分けがつかないよと言いなさい。", en: "It is difficult to tell one from the other." },
                { id: 16, jp: "あなたは長年同じブランドの車に乗り続けている。あなたの友人が前の車も同じ車種だったね、とあなたに聞いた。私は他のどのブランドよりこのブランドが好きだ、と答えなさい。", en: "I prefer this brand to any other." },
                { id: 17, jp: "友人があなたに、マイケルは背が高いね、と言った。彼はクラスではどの男の子よりも背が高いよと言いなさい。", en: "He is taller than any other male student in the class." },
                { id: 18, jp: "友人があなたに、料理をしているか聞いた1日おきに料理をしているよと答えなさい。", en: "I cook every other day." },
                { id: 19, jp: "あなたの同僚が、ある問題についてのミーティングを開きたい、と言った。あなたは忙しいので、いつかそれについて議論しましょうと言いなさい。", en: "Let's discuss it some other day." },
                { id: 20, jp: "友人があなたに、女子高の元クラスメートと仲がいいね、と言った。女子生徒たちはみな助け合っていたからねと答えなさい。", en: "All female students helped each other." },
                { id: 21, jp: "あなたは、ロブにケーキをごちそうした。彼のアイスティーのグラスが空になっている。もう一杯どうぞ、と言いなさい。", en: "Have another cup." },
                { id: 22, jp: "転校生の女の子はどんな人?と友人があなたに聞いてきた。彼女はすごい人だと思うと答えなさい。", en: "I think she's somebody." },
                { id: 23, jp: "彼女との初デートどうだった? 親切にしてくれた?とあなたの友人が聞いた。あなたはデート相手が気が利かなくて、腹立たしく思っている。彼女は大したことないよと答えなさい。", en: "She is nothing." },
                { id: 24, jp: "友人があなたに、あなたの妹さんはとてもおしゃべりだね、と言った。うちの妹のおしゃべり好きは今に始まったことではないからねと答えなさい。", en: "My sister's love of chatting is nothing new." },
                { id: 25, jp: "友人が、家へ帰る途中であなたのアパートに立ち寄っている。用事で10分ほど出かけなければならない。コーヒーか何か飲んでおいて、いい? と言いなさい。", en: "Drink coffee or something, OK?" },
                { id: 26, jp: "あなたの友人があなたのアパートに来た。飲み物か何かいる? と聞きなさい。", en: "Do you want a drink or something?" },
                { id: 27, jp: "あなたが寮に帰ったら、ルームメートが毛布にくるまっていた。寒いか何かなの? と聞きなさい。", en: "Do you feel cold or something?" }
            ],
            "Lesson 3-4": [
                { id: 1, jp: "友人があなたに、アキラとあなたはよく海外に行くのか?と聞いた。彼はたくさんの国に行っているけれど、私はたくさんは行っていないと答えなさい。", en: "He has visited a lot of countries, but I haven't been to many." },
                { id: 2, jp: "友人が、1月の北海道はとても寒かった、と言った。1月にそこにたくさん雪が降ったか聞きなさい。", en: "Was there much snow in January?" },
                { id: 3, jp: "あなたは風邪をひいて外に出られず、友人が夕食を買って持ってきてくれた。本当にありがとうと言いなさい。", en: "Thank you so much." },
                { id: 4, jp: "友人があなたに、あなたの実家の近くにあるビーチは人気があるのか、と聞いた。夏になると、そのビーチには人が多過ぎるくらいいると答えなさい。", en: "There are too many people on the beach in summer." },
                { id: 5, jp: "リッチが科学のある問題につまずいていて、どうも科学の才能がないみたい、と言った。このパズルはわずかな人しか解けないよと言いなさい。", en: "Few people can solve this puzzle." },
                { id: 6, jp: "友人があなたに、来年ドジャースに優勝の可能性はあるか聞いた。来年は彼らに少しは希望があるねと言いなさい。", en: "There is a little hope for them next year." },
                { id: 7, jp: "メイがあなたに、あなたのお姉さんの病気の具合はどうか、と聞いた。彼女は今、少し気分は良いと答えなさい。", en: "She feels a little better now." },
                { id: 8, jp: "友人があなたに、昨日あなたが行ったパーティーはどうだった、と聞いた。そのパーティーには人がたくさんいたよと答えなさい。", en: "There were quite a few people at the party." },
                { id: 9, jp: "友人があなたに、UFOなんてあるはずないよね、と言った。UFOを見たって言っている人はいるけどねと答えなさい。", en: "Some say they have seen UFOs." },
                { id: 10, jp: "ジャンが、気分がすぐれず学校を休んだ。彼のルームメートに、彼の具合がいくらかよくなっているか聞きなさい。", en: "Is he feeling any better?" },
                { id: 11, jp: "あなたは料理をしようとしている。砂糖がなくなっているのに気がついた。砂糖ある?とルームメートに聞きなさい。", en: "Is there any sugar?" },
                { id: 12, jp: "友人があなたに、眠そうだけれど、どうしたの?と聞いた。遅くまで隣家てパーティーをやっていて、昨夜はなかなか寝つけなかったと答えなさい。", en: "It was very difficult to get any sleep last night." },
                { id: 13, jp: "友人があなたの庭の植物を見て、栽培するのは難しいか、と聞いた。それらの植物は問題なくすぐに成長するよと答えなさい。", en: "Those plants grow quickly without any problems." },
                { id: 14, jp: "あなたは、新入生のメンター(相談者)役を引き受けることになった。その新入生に、どんな質問でもあれば、電話してと言いなさい。", en: "If you have any questions, please call me." },
                { id: 15, jp: "あなたのお父さんの友人のハインズさんがあなたの家に来てお父さんと談笑している。紅茶はいかがですか?と聞きなさい。", en: "Would you like some tea?" },
                { id: 16, jp: "友人があなたに、あれだけフランスの小説が好きなのにフランスに行ったことがないのか、と言った。いつかフランスに行きたいと言いなさい。", en: "I want to go to France someday." },
                { id: 17, jp: "友人があなたに、ユウタさんは娘さんの中学受験の準備にずいぶん出費しているね、と言った。彼はどんな犠牲を払ってでも成功したいんだよと言いなさい。", en: "He wants to succeed at any cost." },
                { id: 18, jp: "ポールがあなたに、日本は地震大国なんだってね、と言った。大地震は今すぐにでも起こるかもしれないと言いなさい。", en: "A big earthquake may occur at any moment." },
                { id: 19, jp: "ある国にショートステイした友人が、スーパーマーケットに豚肉がほとんど売っていなかった、と言った。あの国の人々は豚肉をあまり食べないよと言いなさい。", en: "People in that country don't eat much pork." },
                { id: 20, jp: "久しぶりにジェニスに会ったら、性格も外見もずいぶん変わっていた。友人に、彼女の変化にはとても驚かされると言いなさい。", en: "The change in her is very surprising." },
                { id: 21, jp: "友人があなたにヨーコは去年ボランティアで難民の子供たちに日本語を教えたらしいね、と聞いた。うなずいて、彼女の親切はすごく感謝されたよと言いなさい。", en: "Her kindness was much appreciated." },
                { id: 22, jp: "友人があなたに、外国人一家が隣に引っ越してきたんだってね、と言った。新しい隣人のジョンソン一家はカナダの出身だよと言いなさい。", en: "The Johnsons, our new neighbors, are from Canada." },
                { id: 23, jp: "サラがあなたに、弟が遊びに来ているんだってね、と言った。あそこに立っている男の子が(私の)弟だと言いなさい。", en: "The boy standing over there is my brother." },
                { id: 24, jp: "友人があなたに、どうしてボーイフレンドと別れたのか、と聞いた。私にはその理由を説明するのはとても難しいと言いなさい。", en: "The reason is very difficult for me to explain." },
                { id: 25, jp: "毎日ジョージはお酒を飲んでいるけど、やめないと学校が続かないよ、と友人があなたに言った。彼が禁酒するのは難しいよと言いなさい。", en: "It will be difficult for him to stop drinking." },
                { id: 26, jp: "友人があなたに、タカが起業するのは難しくないか、と聞いてきた。彼が自分のビジネスを始めるのは簡単かもしれないと言いなさい。", en: "It may be easy for him to start his own business." },
                { id: 27, jp: "タケシがサリーにひどいことをした。サリーに、彼がそれをしたのは間違っていたと言いなさい。", en: "It was wrong of him to do it." },
                { id: 28, jp: "友人があなたを自宅まで車で送ってくれることになった。その友人に、家まで車で送ってくれるなんて親切だねと言いなさい。", en: "It is kind of you to drive me home." }
            ],
            "Lesson 3-5": [
                { id: 1, jp: "あなたは大きなピアノをリビングに移動させたい。友人のヨンに、このピアノを動かすのを手伝ってと頼みなさい。", en: "Will you help me (to) move this piano?" },
                { id: 2, jp: "ジェイミーがあなたに、あなたのお父さんが料理することはあるのか、と聞いた。父はときどき料理で母を手伝うことがあると言いなさい。", en: "Dad sometimes helps Mom (to) do the cooking." },
                { id: 3, jp: "ミンとメイがあなたの家に遊びに来ている。あなたは2人のための昼食を作り終えた。昼食の準備ができたよ。来て食べてと言いなさい。", en: "Your lunch is ready. Come eat." },
                { id: 4, jp: "同僚のサリーがあなたをランチに誘ってきた。顧客の一人に会いに行かなきゃならないと言って断りなさい。", en: "I have to go see my client." },
                { id: 5, jp: "あなたはルームメートのトムと出かけようとしている。彼の服装はTシャツ一枚だ。外は寒いよ。ジャケットを取りに行ったほうがいいよと言いなさい。", en: "It's cold outside. You should go get your jacket." },
                { id: 6, jp: "ルームメートのマシューが、図書館から借りた返却期限切れの本をテーブルに置いたままにしている。それは図書館に返すべきだよと言いなさい。", en: "You'd better return it to the library." },
                { id: 7, jp: "メイがロンドン旅行から戻ってきた。イギリスで英語が通じた?と聞きなさい。", en: "Could you make yourself understood in English in England?" },
                { id: 8, jp: "ジョディーは中間試験があるのに、今夜も出かけて行った。成績が悪いので、このままでは退学の可能性がある。彼女のルームメートのメイにもっと彼女に(強制的に)勉強させなさいと言いなさい。", en: "Make her study harder!" },
                { id: 9, jp: "友人があなたに、前より英語が上達しているね、と言った。オーストラリア人の学生がホームステイしているんだと答えなさい。", en: "We have an Australian student staying with us." },
                { id: 10, jp: "あなたの知り合いに、ヨウコという美容師がいる。ジャネットがあなたに、誰に髪の毛を切ってもらったのか聞いた。ヨウコに切ってもらったと言いなさい。", en: "I had Yoko cut my hair." },
                { id: 11, jp: "ある大事な事業を進めるのに、あなたの部下のヤンは本来午後の出勤だけど、彼女に早く来てもらわないといけない状況。彼女に(指示して)早く来てもらって、とあなたの秘書に言いなさい。", en: "Have her come early." },
                { id: 12, jp: "友人があなたに、盗まれたスマホはどうなったのかと聞いた。(私は)後でそれを取り戻したと言いなさい。", en: "I got it back later." },
                { id: 13, jp: "友人が、マリー娘はダイエットに夢中で朝食を食べないらしいと言った。彼女はやっと娘に(説得して)朝食を食べさせたと答えなさい。", en: "Finally, she got her daughter to eat breakfast." },
                { id: 14, jp: "あなたの友人が芝刈りをサボっている。この地域では芝生を伸ばしっぱなしにしていると近所からクレームが来る。芝生を伸ばしっぱなしにしてはいけないと言いなさい。", en: "Don't let the grass grow too long." },
                { id: 15, jp: "友人があなたに、トムはとても社交的な人だね、と言った。私は彼が1人でいるところを見たことがないと言いなさい。", en: "I've never seen him alone." },
                { id: 16, jp: "友人があなたに、泥棒がすぐに捕まってよかったが、警察はどうやって犯人を突き止めたのだろう、と言った。ジェニスが、その男が部屋に入る瞬間を見たんだと言いなさい。", en: "Jennice saw the man entering the room." },
                { id: 17, jp: "友人があなたに、泥棒がすぐに捕まってよかったが、警察はどうやって犯人を突き止めたのだろう、と言った。ジェニスが、その男が部屋に入る一部始終を見たんだと答えなさい。", en: "Jennice saw the man enter the room." },
                { id: 18, jp: "友人があなたに、チェン先生(女性)の講義はどう、と聞いた。(彼女の)講義は分かりやすいよと答えなさい。", en: "Her lectures are easy to understand." },
                { id: 19, jp: "あなたはルームメートと一緒に夕食に出かけるつもりでいる。ルームメートに、出かける準備ができたか聞きなさい。", en: "Are you ready to go?" },
                { id: 20, jp: "サリーは業務についてよく知っており、あなたは彼女からいろいろなことを学んだ。友人に彼女と一緒に働けてとても幸運だったと言いなさい。", en: "I was very fortunate to work / in working with her." },
                { id: 21, jp: "友人があなたに、ロナルドは本当に外国語の勉強が好きだね、と言った。彼は言語の習得が速いんだと言いなさい。", en: "He is quick to learn / at learning languages." },
                { id: 22, jp: "ジミーがあなたに、マリアに貸したお金がなかなか返ってこない、とこぼした。彼女はいつも私にお金を返すのが遅いからねと言いなさい。", en: "She is always slow to pay / at paying back my money." },
                { id: 23, jp: "空港に出かける準備が整い、頼んでおいたタクシーも来た。モタモタしているキムに、タクシーに乗ってと言いなさい。", en: "Get in the taxi!" },
                { id: 24, jp: "タクシーの中で、キムがあなたに、搭乗までに時間があるか聞いた。飛行機に乗るまでたくさん時間はあるよと答えなさい。", en: "We have a lot of time before we get on the plane." },
                { id: 25, jp: "友人があなたに、どこでバスを降りたのかと聞いた。駅の前でバスを降りたと言いなさい。", en: "I got off the bus in front of the train station." },
                { id: 26, jp: "友人があなたに、どうしてそのドアの向こうが立入禁止だと分かるのか、と聞いた。それ(入ってはいけないこと)は掲示板に書いてあるよと言いなさい。", en: "It's on the sign." },
                { id: 27, jp: "あなたは友人の家のバルコニーにある植物を見ている。枯れているようにも見える。この木は枯れているのかいないのか聞きなさい。", en: "Is this tree alive or dead?" },
                { id: 28, jp: "サリーがあなたに、今着ている服はウールなのか? とあなたに聞いた。このドレスは綿製だよと答えなさい。", en: "This dress is made of cotton." },
                { id: 29, jp: "メリッサがあなたに、日本酒は何から作られるのか聞いた。日本酒はコメから作られるよと言いなさい。", en: "Sake is made from rice." }
            ],
            "Lesson 3-6": [
                { id: 1, jp: "友人が、あなたとボーイフレンドとの付き合いはもう5年も続いているのか、と言った。うなずいて、彼と初めて会った場所のことを覚えているよと言いなさい。", en: "I remember the place where I met him for the first time." },
                { id: 2, jp: "ジェイミーとジョンと3人で、クラスの共同プロジェクトに携わることになっている。ジェイミーに、ジョンは私たちがどこで会う予定なのか知っているのか、と聞きなさい。", en: "Does John know the place where we are meeting?" },
                { id: 3, jp: "ヨンがあなたに、何曜日が忙しいか聞いてきた。私は月曜日が一番忙しいと答えなさい。", en: "Monday is when I'm busiest." },
                { id: 4, jp: "ポールがあなたに、ジャネットが誰かに引っ越しを手伝ってもらいたがっている、と言った。だから私がここに来たんだと言いなさい。", en: "That's why I came here." },
                { id: 5, jp: "ベイプがまた授業を欠席した。クラスメートに、なぜ彼が授業を欠席し続けるのか分からないと言いなさい。", en: "I don't understand why he keeps skipping his classes." },
                { id: 6, jp: "友人があなたに、ジェリーははっきりものを言うね、と言った。それが彼のしゃべり方だよと言いなさい。", en: "That's how he talks." },
                { id: 7, jp: "友人があなたに、ジャネットは自分たち3人がスミスさんに会う時刻を知っているかな、と聞いた。ジャネットは私たちがスミスさんに会わなければならない時刻を知っているよと言いなさい。", en: "Janet knows the time when we should meet Mr. Smith." },
                { id: 8, jp: "友人があなたに、マイケルはなぜ自分たち3人が会おうとしているのか知っているのかな、と聞いた。マイケルは僕らが会おうとしている理由を知らないよと答えなさい。", en: "Michael doesn't know why we're meeting." },
                { id: 9, jp: "友人があなたに、ビビアンは誰かにアパートを借りているんだって、と言った。彼女がアパートを借りている女性は教師だよと言いなさい。", en: "The woman whose apartment she rents is a teacher." },
                { id: 10, jp: "友人があなたに、学校のフットボールの試合は雨天決行なのかな、と聞いた。もし雨が降れば、その試合は中止だよと答えなさい。", en: "If it rains, the game will be cancelled." },
                { id: 11, jp: "友人があなたに、ナオミに明日手伝ってもらいたい、と言った。もし彼女に十分な時間があれば、彼女は私を手伝うだろうけどね(可能性はなさそうだ)と言いなさい。", en: "If she had enough time, she would help me." },
                { id: 12, jp: "友人があなたに、ミナはアメリカに行くつもりなのかと聞いた。彼女にもし十分にお金があれば、彼女はアメリカに留学するよと言いなさい。", en: "If she has enough money, she will go to America to study." },
                { id: 13, jp: "友人があなたに、ミナはアメリカに行くつもりなのかと聞いた。もし彼女に十分にお金があれば、アメリカに留学するだろうけど(その可能性はあまりなさそうだ)と言いなさい。", en: "If she had money, she would go to America to study." },
                { id: 14, jp: "友人があなたに、あの学校に行くべきだろうか、と聞いてきた。もし私があなたなら行くだろうけど、と言いなさい。", en: "If I were you, I would go." }
            ]
        };

        const availableLessons = Object.keys(lessonData);
        
        // --- Web Speech API Setup ---
        const synth = window.speechSynthesis;

        const App = () => {
            const [selectedLesson, setSelectedLesson] = useState(availableLessons[0]);
            const [isAutoMode, setIsAutoMode] = useState(false);
            const [waitTime, setWaitTime] = useState(5);
            const [playbackSpeed, setPlaybackSpeed] = useState(1.0);
            const [availableVoices, setAvailableVoices] = useState([]);
            const [selectedVoiceURI, setSelectedVoiceURI] = useState("");
            
            const [currentQuestionIndex, setCurrentQuestionIndex] = useState(0);
            const [showAnswer, setShowAnswer] = useState(false);
            const [isPlayingAudio, setIsPlayingAudio] = useState(false);
            
            // Refs for auto mode timers and settings
            const timerRef = useRef(null);
            const settingsRef = useRef({ waitTime, playbackSpeed, selectedVoiceURI });
            
            const currentQuestions = useMemo(() => lessonData[selectedLesson] || [], [selectedLesson]);
            const currentQ = currentQuestions[currentQuestionIndex];
            const isCompleted = currentQuestionIndex >= currentQuestions.length;

            useEffect(() => {
                const loadVoices = () => {
                    let allVoices = synth.getVoices();
                    if (allVoices.length === 0) return;

                    let engVoices = allVoices.filter(v => v.lang.startsWith('en-'));
                    
                    const getScore = (voice) => {
                        const name = voice.name.toLowerCase();
                        if (name.includes('google us english') && name.includes('female')) return 100;
                        if (name.includes('google us english')) return 90;
                        if (name.includes('google uk english female')) return 85;
                        if (name.includes('google uk english male')) return 80;
                        if (name.includes('samantha')) return 75; 
                        if (name.includes('daniel')) return 70; 
                        if (name.includes('karen')) return 65; 
                        if (name.includes('zira')) return 60; 
                        if (name.includes('george')) return 55; 
                        if (name.includes('hazel')) return 50; 
                        if (name.includes('natural')) return 40; 
                        if (name.includes('female')) return 30;
                        if (name.includes('male')) return 20;
                        return 0;
                    };

                    engVoices.sort((a, b) => getScore(b) - getScore(a));
                    const topVoices = engVoices.slice(0, 15);
                    setAvailableVoices(topVoices);
                    
                    if (topVoices.length > 0) {
                        setSelectedVoiceURI(prev => prev || topVoices[0].voiceURI);
                    }
                };

                loadVoices();
                if (speechSynthesis.onvoiceschanged !== undefined) {
                    speechSynthesis.onvoiceschanged = loadVoices;
                }
            }, []);

            // Update settings ref for auto-mode closure
            useEffect(() => {
                settingsRef.current = { waitTime, playbackSpeed, selectedVoiceURI };
