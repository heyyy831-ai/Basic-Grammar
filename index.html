            }, [waitTime, playbackSpeed, selectedVoiceURI]);

            // Cleanup timers on unmount
            useEffect(() => {
                return () => {
                    clearTimeout(timerRef.current);
                };
            }, []);

            // Handle lesson change
            useEffect(() => {
                stopAudio();
                clearTimeout(timerRef.current);
                setCurrentQuestionIndex(0);
                setShowAnswer(false);
                if (isAutoMode) {
                    startAutoModeSequence(0);
                }
            }, [selectedLesson]);

            // Handle Auto Mode toggle
            useEffect(() => {
                if (isAutoMode && !isCompleted && !showAnswer) {
                     startAutoModeSequence(currentQuestionIndex);
                } else if (!isAutoMode) {
                     clearTimeout(timerRef.current);
                }
            }, [isAutoMode]);

            const playAudio = (text, speed, callback) => {
                if (synth.speaking) {
                    synth.cancel();
                }
                const utterance = new SpeechSynthesisUtterance(text);
                const preferredVoice = availableVoices.find(v => v.voiceURI === settingsRef.current.selectedVoiceURI);
                if (preferredVoice) {
                    utterance.voice = preferredVoice;
                }
                
                utterance.rate = speed;
                utterance.lang = 'en-US';
                
                setIsPlayingAudio(true);
                
                utterance.onend = () => {
                    setIsPlayingAudio(false);
                    if (callback) callback();
                };
                utterance.onerror = () => {
                    setIsPlayingAudio(false);
                    if (callback) callback();
                };

                synth.speak(utterance);
            };

            const stopAudio = () => {
                if (synth.speaking) {
                    synth.cancel();
                }
                setIsPlayingAudio(false);
            };

            const handleShowAnswerAndPlay = () => {
                setShowAnswer(true);
                playAudio(currentQ.en, playbackSpeed);
            };

            const handleNext = () => {
                stopAudio();
                clearTimeout(timerRef.current);
                
                if (currentQuestionIndex < currentQuestions.length - 1) {
                    setCurrentQuestionIndex(prev => prev + 1);
                    setShowAnswer(false);
                    if (isAutoMode) {
                        startAutoModeSequence(currentQuestionIndex + 1);
                    }
                } else {
                    setCurrentQuestionIndex(currentQuestions.length); // Trigger complete
                }
            };

            const handlePrev = () => {
                stopAudio();
                clearTimeout(timerRef.current);
                
                if (currentQuestionIndex > 0) {
                    setCurrentQuestionIndex(prev => prev - 1);
                    setShowAnswer(false);
                    if (isAutoMode) {
                        startAutoModeSequence(currentQuestionIndex - 1);
                    }
                }
            };

            const handleStop = () => {
                stopAudio();
                clearTimeout(timerRef.current);
                if (isAutoMode) {
                    setIsAutoMode(false);
                }
            };
            
            const restartLesson = () => {
                setCurrentQuestionIndex(0);
                setShowAnswer(false);
                if (isAutoMode) {
                    startAutoModeSequence(0);
                }
            };

            const startAutoModeSequence = (index) => {
                const question = currentQuestions[index];
                if (!question) return;

                clearTimeout(timerRef.current);

                // 1. Show Japanese, wait for `waitTime` seconds
                timerRef.current = setTimeout(() => {
                    // 2. Show English and play audio
                    setShowAnswer(true);
                    playAudio(question.en, settingsRef.current.playbackSpeed, () => {
                        // 3. Audio finished, wait a bit, then go to next
                        timerRef.current = setTimeout(() => {
                            if (index < currentQuestions.length - 1) {
                                setCurrentQuestionIndex(prev => prev + 1);
                                setShowAnswer(false);
                                startAutoModeSequence(index + 1);
                            } else {
                                setCurrentQuestionIndex(currentQuestions.length);
                            }
                        }, 1500); // Wait 1.5s after audio ends before next question
                    });
                }, settingsRef.current.waitTime * 1000);
            };

            return (
                <div className="min-h-screen py-10 px-4">
                    <div className="max-w-4xl mx-auto space-y-8">
                        
                        {/* Header Section */}
                        <div className="text-center space-y-4">
                            <h1 className="text-3xl md:text-4xl font-bold text-gray-800 tracking-tight">英会話のための基本英文法完全マスター</h1>
                            <h2 className="text-2xl font-bold text-blue-500">瞬間英作練習アプリ</h2>
                        </div>

                        {/* Config Panel Section */}
                        <div className="glass-panel p-6 md:p-8">
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-8">
                                {/* Left Column */}
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className="block text-gray-700 font-bold text-lg">レッスン選択</label>
                                        <div className="relative">
                                            <select 
                                                value={selectedLesson} 
                                                onChange={(e) => setSelectedLesson(e.target.value)}
                                                className="block appearance-none w-full bg-white border border-gray-300 text-gray-700 py-3 px-4 pr-8 rounded-lg leading-tight focus:outline-none focus:bg-white focus:border-blue-500 text-lg shadow-sm"
                                            >
                                                {availableLessons.map(l => <option key={l} value={l}>{l}</option>)}
                                            </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-700">
                                                <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-2">
                                        <label className="block text-gray-700 font-bold text-lg">再生モード</label>
                                        <div className="flex gap-2">
                                            <button 
                                                onClick={() => setIsAutoMode(false)}
                                                className={`flex-1 py-3 px-4 rounded-lg font-bold flex items-center justify-center gap-2 transition-colors ${!isAutoMode ? 'bg-gray-200 text-gray-800 shadow-inner' : 'bg-white border border-gray-300 text-gray-500 hover:bg-gray-50'}`}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd" /></svg>
                                                一文ずつ (手動)
                                            </button>
                                            <button 
                                                onClick={() => setIsAutoMode(true)}
                                                className={`flex-1 py-3 px-4 rounded-lg font-bold flex items-center justify-center gap-2 transition-colors ${isAutoMode ? 'bg-blue-100 text-blue-700 border-blue-300 border shadow-inner' : 'bg-white border border-gray-300 text-gray-500 hover:bg-gray-50'}`}
                                            >
                                                <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd" /></svg>
                                                自動再生
                                            </button>
                                        </div>
                                    </div>
                                </div>

                                {/* Right Column */}
                                <div className="space-y-6">
                                    <div className="space-y-2">
                                        <label className={`block font-bold text-lg ${isAutoMode ? 'text-gray-700' : 'text-gray-400'}`}>表示待機時間 (自動継続時)</label>
                                        <div className="relative">
                                            <select 
                                                disabled={!isAutoMode}
                                                value={waitTime}
                                                onChange={(e) => setWaitTime(Number(e.target.value))}
                                                className={`block appearance-none w-full border border-gray-300 py-3 px-4 pr-8 rounded-lg leading-tight focus:outline-none text-lg shadow-sm ${isAutoMode ? 'bg-white text-gray-700 focus:border-blue-500' : 'bg-gray-50 text-gray-400 cursor-not-allowed'}`}
                                            >
                                                {[3, 4, 5, 6, 7, 8, 9, 10].map(time => (
                                                    <option key={time} value={time}>{time}秒</option>
                                                ))}
                                            </select>
                                            <div className={`pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 ${isAutoMode ? 'text-gray-700' : 'text-gray-400'}`}>
                                                <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                                            </div>
                                        </div>
                                    </div>

                                    <div className="space-y-4">
                                        <div className="flex justify-between items-center">
                                            <label className="block text-gray-700 font-bold text-lg">英語読み上げ速度</label>
                                            <span className="text-blue-600 font-bold text-xl">{playbackSpeed.toFixed(1)}x</span>
                                        </div>
                                        <input 
                                            type="range" 
                                            min="0.5" 
                                            max="1.0" 
                                            step="0.1" 
                                            value={playbackSpeed}
                                            onChange={(e) => setPlaybackSpeed(Number(e.target.value))}
                                            className="w-full h-2 bg-gray-200 rounded-lg appearance-none cursor-pointer accent-blue-600" 
                                        />
                                        <div className="flex justify-between text-sm text-gray-500">
                                            <span>0.5倍</span>
                                            <span>等倍(1.0)</span>
                                        </div>
                                    </div>
                                    
                                    <div className="space-y-2">
                                         <label className="block text-gray-700 font-bold text-lg">音声モデル</label>
                                         <div className="relative">
                                             <select 
                                                 value={selectedVoiceURI}
                                                 onChange={(e) => setSelectedVoiceURI(e.target.value)}
                                                 className="block appearance-none w-full border border-gray-300 rounded-lg bg-white shadow-sm py-3 px-4 pr-8 text-gray-700 leading-tight focus:outline-none focus:border-blue-500 text-base"
                                             >
                                                 {availableVoices.length > 0 ? (
                                                     availableVoices.map(voice => (
                                                         <option key={voice.voiceURI} value={voice.voiceURI}>
                                                             {voice.name}
                                                         </option>
                                                     ))
                                                 ) : (
                                                     <option value="">System Default (en-US)</option>
                                                 )}
                                             </select>
                                            <div className="pointer-events-none absolute inset-y-0 right-0 flex items-center px-2 text-gray-400">
                                                <svg className="fill-current h-4 w-4" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20"><path d="M9.293 12.95l.707.707L15.657 8l-1.414-1.414L10 10.828 5.757 6.586 4.343 8z"/></svg>
                                            </div>
                                         </div>
                                    </div>
                                </div>
                            </div>
                        </div>

                        {/* Control Buttons Section */}
                        {!isCompleted && (
                            <div className="flex flex-wrap justify-center items-center gap-2 md:gap-4 my-2 w-full max-w-3xl mx-auto">
                                <button 
                                    onClick={handlePrev}
                                    disabled={currentQuestionIndex === 0}
                                    className={`font-bold py-3 px-4 md:px-6 rounded-lg flex items-center gap-2 transition-colors shadow-sm ${currentQuestionIndex === 0 ? 'bg-gray-100 text-gray-400 cursor-not-allowed' : 'bg-white hover:bg-gray-50 text-gray-700 border border-gray-200'}`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M12.707 5.293a1 1 0 010 1.414L9.414 10l3.293 3.293a1 1 0 01-1.414 1.414l-4-4a1 1 0 010-1.414l4-4a1 1 0 011.414 0z" clipRule="evenodd" /></svg>
                                    戻る
                                </button>

                                <button 
                                    onClick={!showAnswer ? handleShowAnswerAndPlay : () => playAudio(currentQ.en, playbackSpeed)}
                                    className={`font-bold py-3 px-4 md:px-6 rounded-lg text-sm md:text-lg flex items-center gap-2 transition-colors shadow-sm ${!showAnswer ? 'bg-green-100 hover:bg-green-200 text-green-700' : 'bg-blue-100 hover:bg-blue-200 text-blue-700'}`}
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5 md:h-6 md:w-6" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clipRule="evenodd" /></svg>
                                    {!showAnswer ? '英語を表示＆再生' : 'もう一度'}
                                </button>

                                <button 
                                    onClick={handleStop}
                                    className="font-bold py-3 px-4 md:px-6 rounded-lg flex items-center gap-2 transition-colors shadow-sm bg-red-100 hover:bg-red-200 text-red-700"
                                >
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor">
                                        <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM8 7a1 1 0 00-1 1v4a1 1 0 001 1h4a1 1 0 001-1V8a1 1 0 00-1-1H8z" clipRule="evenodd" />
                                    </svg>
                                    停止
                                </button>

                                <button 
                                    onClick={handleNext}
                                    disabled={!showAnswer}
                                    className={`font-bold py-3 px-4 md:px-6 rounded-lg flex items-center gap-2 transition-colors shadow-sm ${(!showAnswer) ? 'bg-[#2A3441] text-gray-400 opacity-50 cursor-not-allowed' : 'bg-[#2A3441] hover:bg-[#1f2731] text-white'}`}
                                >
                                    {currentQuestionIndex === currentQuestions.length - 1 ? '完了' : '次へ'}
                                    <svg xmlns="http://www.w3.org/2000/svg" className="h-5 w-5" viewBox="0 0 20 20" fill="currentColor"><path fillRule="evenodd" d="M7.293 14.707a1 1 0 010-1.414L10.586 10 7.293 6.707a1 1 0 011.414-1.414l4 4a1 1 0 010 1.414l-4 4a1 1 0 01-1.414 0z" clipRule="evenodd" /></svg>
                                </button>
                            </div>
                        )}

                        {/* Playing & Result Section */}
                        {!isCompleted ? (
                            <div className="space-y-6">
                                <div className="glass-panel p-6 md:p-10 min-h-[300px] flex flex-col relative overflow-hidden">
                                    {/* Progress bar at the top edge */}
                                    {!showAnswer && isAutoMode && (
                                        <div className="absolute top-0 left-0 w-full h-1.5 bg-gray-100">
                                            <div 
                                                className="h-full bg-blue-500" 
                                                key={`progress-${currentQuestionIndex}`}
                                                style={{ animation: `progress ${waitTime}s linear forwards` }}
                                            ></div>
                                        </div>
                                    )}

                                    {/* Header row */}
                                    <div className="flex justify-between items-start mb-6">
                                        <span className="bg-blue-100 text-blue-700 text-xs font-bold px-3 py-1 rounded tracking-wider">JAPANESE</span>
                                        <span className="bg-gray-100 text-gray-500 text-lg font-bold px-4 py-1 rounded-full">
                                            {currentQuestionIndex + 1} / {currentQuestions.length}
                                        </span>
                                    </div>

                                    {/* Japanese Question */}
                                    <div className="flex-grow">
                                        <h2 className="text-3xl md:text-4xl font-bold text-gray-800 leading-tight">
                                            {currentQ?.jp}
                                        </h2>
                                    </div>

                                    {/* Divider & English Answer Section */}
                                    <div className="mt-8">
                                        {showAnswer && (
                                            <>
                                                <hr className="border-gray-200 mb-8" />
                                                <div className="space-y-6 animate-[fadeIn_0.3s_ease-out]">
                                                    <div>
                                                        <span className="bg-green-100 text-green-700 text-xs font-bold px-3 py-1 rounded tracking-wider inline-block mb-3">ENGLISH</span>
                                                        <p className="text-3xl md:text-4xl font-bold text-gray-800 leading-tight">
                                                            {currentQ?.en}
                                                        </p>
                                                    </div>
                                                </div>
                                            </>
                                        )}
                                    </div>
                                </div>
                            </div>
                        ) : (
                            <div className="glass-panel p-10 text-center space-y-6">
                                <div className="inline-flex items-center justify-center w-20 h-20 bg-green-100 rounded-full mb-4">
                                    <svg className="w-10 h-10 text-green-500" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M5 13l4 4L19 7"></path></svg>
                                </div>
                                <h2 className="text-3xl font-bold text-gray-800">レッスン完了！</h2>
                                <p className="text-xl text-gray-600">{selectedLesson} の全 {currentQuestions.length} 問を終了しました。</p>
                                
                                <div className="pt-8">
                                    <button 
                                        onClick={restartLesson}
                                        className="bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-10 rounded-full text-lg shadow-md transition-colors"
                                    >
                                        もう一度練習する
                                    </button>
                                </div>
                            </div>
                        )}
                        
                    </div>
                    
                    <style>{`
                        @keyframes fadeIn {
                            from { opacity: 0; transform: translateY(10px); }
                            to { opacity: 1; transform: translateY(0); }
                        }
                        @keyframes progress {
                            from { width: 0%; }
                            to { width: 100%; }
                        }
                    `}</style>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
