ct x=\"680\" y=\"60\" width=\"240\" height=\"280\" rx=\"16\" fill=\"#fff\" stroke=\"#9DB4CF\" stroke-width=\"4\"/><g><rect x=\"740\" y=\"110\" width=\"120\" height=\"80\" rx=\"6\" fill=\"#fff\" stroke=\"#C9C1B2\" stroke-width=\"3\"/><path d=\"M740 110 L800.0 154.0 L860 110\" fill=\"none\" stroke=\"#C9C1B2\" stroke-width=\"3\"/><path d=\"M792.0 159.6 q8 -10 16 0 q-8 10 -16 0\" fill=\"#E0605A\"/></g><text x=\"800\" y=\"240\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"24\" fill=\"#2B3F5C\">50+ emails</text><g transform=\"translate(800 300) scale(0.45) rotate(-8)\"><ellipse cx=\"0\" cy=\"0\" rx=\"90\" ry=\"16\" fill=\"#fff\" stroke=\"#9DB4CF\" stroke-width=\"3\"/><path d=\"M-10 0 L-50 -60 L-25 -60 L30 0 Z M-10 6 L-40 50 L-18 50 L24 6Z M-80 -2 L-96 -36 L-78 -36 L-60 -4Z\" fill=\"#9DB4CF\"/><circle cx=\"-40\" cy=\"-4\" r=\"4\" fill=\"#4C7BD9\"/><circle cx=\"-20\" cy=\"-4\" r=\"4\" fill=\"#4C7BD9\"/><circle cx=\"0\" cy=\"-4\" r=\"4\" fill=\"#4C7BD9\"/><circle cx=\"20\" cy=\"-4\" r=\"4\" fill=\"#4C7BD9\"/><circle cx=\"40\" cy=\"-4\" r=\"4\" fill=\"#4C7BD9\"/><circle cx=\"60\" cy=\"-4\" r=\"4\" fill=\"#4C7BD9\"/></g></svg>", "alt": "ニュージーランドの文通相手グレース。たくさんの羊がいる農場と、日本の私とのメール。", "passage": [{"who": "", "s": [["s1", "I have a pen pal in New Zealand."], ["s2", "Her name is Grace."], ["s3", "We have been friends for two years."], ["s4", "We have never met, but we have sent each other more than fifty emails."], ["s5", "Grace lives on a farm with many sheep."], ["s6", "She has sent me a lot of photos of them."], ["s7", "I have learned many things about her country from her."], ["s8", "For example, New Zealand has more sheep than people!"], ["s9", "Grace has been interested in Japanese culture since she was ten."], ["s10", "She has already read many Japanese comics."], ["s11", "Last week, she told me some great news."], ["s12", "Her family is going to visit Japan next spring."], ["s13", "I have just started to think about where to take her."]]}], "trans": ["私にはニュージーランドに文通相手がいます。名前はグレースです。私たちは2年間友達です。一度も会ったことはありませんが、お互いに50通以上のメールを送り合ってきました。グレースはたくさんのヒツジがいる農場に住んでいます。彼女はヒツジの写真をたくさん送ってくれました。私は彼女から彼女の国について多くのことを学びました。たとえば、ニュージーランドには人よりもヒツジのほうが多いのです！グレースは10歳のときから日本の文化に興味を持っています。もう日本のマンガをたくさん読んでいます。先週、彼女はすばらしい知らせを教えてくれました。来年の春、家族で日本を訪れるのです。私は彼女をどこに連れて行こうか考え始めたところです。"], "rq": [{"q": "How long have the writer and Grace been friends?", "qja": "筆者とグレースはどのくらいの間友達ですか。", "opts": ["For two years.", "For ten years.", "For fifty days.", "Since last spring."], "ans": 0, "ev": ["s3"]}, {"q": "What has Grace sent the writer?", "qja": "グレースは筆者に何を送ってきましたか。", "opts": ["Some Japanese comics.", "A plane ticket to New Zealand.", "A lot of photos of her sheep.", "A letter from her family."], "ans": 2, "ev": ["s6"]}, {"q": "What was Grace's great news?", "qja": "グレースのすばらしい知らせとは何でしたか。", "opts": ["She bought a new farm.", "Her family will visit Japan next spring.", "She will study in Japan for a year.", "She started to write Japanese comics."], "ans": 1, "ev": ["s12"]}]}, {"id": "3-02", "lv": "3", "rev": false, "title": "The Man Who Cleans the Beach", "ja": "浜辺をそうじする人", "book": "Lesson 3-1", "words": 118, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"毎朝浜辺をそうじする加藤さんと、いっしょにごみを拾う私たち。\"><defs><linearGradient id=\"g32\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g32)\"/><rect x=\"857\" y=\"14\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(0 860 70)\"/><rect x=\"857\" y=\"14\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(45 860 70)\"/><rect x=\"857\" y=\"14\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(90 860 70)\"/><rect x=\"857\" y=\"14\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(135 860 70)\"/><rect x=\"857\" y=\"14\" tiful.\""], ["s6", "His words moved me."], ["s7", "Since then, I have joined him every Saturday."], ["s8", "We pick up bottles and plastic bags which people left on the sand."], ["s9", "Some students who saw us have started to help, too."], ["s10", "Now about twenty people come every week, and the beach has become much cleaner."], ["s11", "Mr. Kato is a person who has taught me something important."]]}], "trans": ["私の町には、毎朝浜辺をそうじしている男の人がいます。名前はカトウさんで、75歳です。彼はこれを10年間続けています。ある日、私はなぜそうしているのかたずねました。カトウさんは「ここは私が子どものころに大好きだった浜辺なんだ。きれいなままにしておきたいんだよ」と言いました。その言葉に私は心を動かされました。それ以来、私は毎週土曜日に一緒にそうじをしています。人々が砂浜に残していったびんやビニール袋を拾います。私たちを見た生徒の中にも、手伝い始めた人がいます。今では毎週20人ほどが来て、浜辺はずっときれいになりました。カトウさんは、私に大切なことを教えてくれた人です。"], "rq": [{"q": "How long has Mr. Kato cleaned the beach?", "qja": "カトウさんはどのくらいの間浜辺をそうじしていますか。", "opts": ["For seventy-five years.", "For twenty years.", "Since last Saturday.", "For ten years."], "ans": 3, "ev": ["s3"]}, {"q": "Why does Mr. Kato clean the beach?", "qja": "カトウさんはなぜ浜辺をそうじするのですか。", "opts": ["He is paid by the town to do it.", "His doctor told him to walk every morning.", "He wants to keep the beach he loved as a child beautiful.", "He wants to find something valuable on the sand."], "ans": 2, "ev": ["s5"]}, {"q": "What has happened since the writer joined Mr. Kato?", "qja": "筆者がカトウさんと一緒にそうじを始めてから、何が起きましたか。", "opts": ["More people have come, and the beach has become cleaner.", "Mr. Kato has stopped cleaning the beach.", "The town has closed the beach.", "The students have stopped coming to the beach."], "ans": 0, "ev": ["s9", "s10"]}]}, {"id": "3-03", "lv": "3", "rev": false, "title": "The Book That Changed Me", "ja": "私を変えた本", "book": "Lesson 3-1", "words": 119, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"アフリカの小さな村で、拾ったもので風車を作った少年。風車が村に電気をもたらす。\"><defs><linearGradient id=\"g33\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F7D9A6\"/><stop offset=\"1\" stop-color=\"#FCEEDB\"/></line e": [{"who": "", "s": [["s1", "Do you have a book that changed your life?"], ["s2", "I do."], ["s3", "It is a book which my uncle gave me when I was in elementary school."], ["s4", "It is about a boy who lives in a small village in Africa."], ["s5", "He wants to study, but his family is too poor to send him to school."], ["s6", "So he goes to the library and reads science books by himself."], ["s7", "Then he makes a windmill from old things which he finds."], ["s8", "The windmill brings electricity to his village."], ["s9", "I have read the book five times."], ["s10", "Every time I read it, I feel that I can do anything if I try."], ["s11", "Someday I want to be an engineer who helps people in poor countries."]]}], "trans": ["あなたには人生を変えた本がありますか。私にはあります。それは小学生のときにおじがくれた本です。アフリカの小さな村に住む男の子の話です。彼は勉強したいのですが、家が貧しすぎて学校に行かせてもらえません。そこで彼は図書館に行き、ひとりで理科の本を読みます。そして、見つけた古い物から風車を作ります。その風車は村に電気をもたらします。私はその本を5回読みました。読むたびに、努力すれば何でもできると感じます。いつか私は、貧しい国の人々を助ける技術者になりたいと思っています。"], "rq": [{"q": "Who gave the writer the book?", "qja": "だれが筆者にその本をあげましたか。", "opts": ["The writer's teacher.", "A boy in Africa.", "A librarian.", "The writer's uncle."], "ans": 3, "ev": ["s3"]}, {"q": "What did the boy in the book make?", "qja": "本の中の男の子は何を作りましたか。", "opts": ["A new school for his village.", "A windmill from old things.", "A library in his house.", "A science book."], "ans": 1, "ev": ["s7"]}, {"q": "What does the writer want to be in the future?", "qja": "筆者は将来何になりたいですか。", "opts": ["A writer of children's books.", "An engineer who helps people in poor countries.", "A teacher in Africa.", "A librarian at a school."], "ans": 1, "ev": ["s11"]}]}, {"id": "3-04", "lv": "3", "rev": false, "title": "My First Time Cooking", "ja": "はじめての料理", "book": "Lesson 3-2", "words": 120, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"初めての料理：電話で祖母に教わりながらカレーを作る私。\"><rect width=\"960\" height=\"310\" fill=\"#FFF4E0\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\ \"none\"/><circle cx=\"760\" cy=\"150\" r=\"110\" fill=\"#FFF8EC\" stroke=\"#E0A848\" stroke-width=\"5\"/><g><rect x=\"739.8\" y=\"173\" width=\"16\" height=\"67\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"764.2\" y=\"173\" width=\"16\" height=\"67\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"747.3\" cy=\"240\" rx=\"11.2\" ry=\"5.2\" fill=\"#3A3A3A\"/><ellipse cx=\"772.7\" cy=\"240\" rx=\"11.2\" ry=\"5.2\" fill=\"#3A3A3A\"/><line x1=\"739.4\" y1=\"136.5\" x2=\"727\" y2=\"190.5\" stroke=\"#9B6BC4\" stroke-width=\"11.2\" stroke-linecap=\"round\"/><circle cx=\"727\" cy=\"190.5\" r=\"7\" fill=\"#F6D3B8\"/><line x1=\"780.6\" y1=\"136.5\" x2=\"813.7\" y2=\"160.8\" stroke=\"#9B6BC4\" stroke-width=\"11.2\" stroke-linecap=\"round\"/><circle cx=\"813.7\" cy=\"160.8\" r=\"7\" fill=\"#F6D3B8\"/><path d=\"M 736 135 Q 736 129 744 129 L 776 129 Q 784 129 784 135 L 786 177 L 734 177 Z\" fill=\"#9B6BC4\"/><rect x=\"753.8\" y=\"123.2\" width=\"12.5\" height=\"11.7\" fill=\"#F6D3B8\"/><circle cx=\"760\" cy=\"109.5\" r=\"19.5\" fill=\"#F6D3B8\"/><path d=\"M 739.7 112.4 Q 737.6 86.1 760 88.4 Q 782.4 86.1 780.3 112.4 Q 773.6 99.8 762 100.7 Q 748.3 103.7 739.7 112.4 Z\" fill=\"#C9CCD3\"/><circle cx=\"752.6\" cy=\"111.8\" r=\"2\" fill=\"#2A2A2A\"/><circle cx=\"767.4\" cy=\"111.8\" r=\"2\" fill=\"#2A2A2A\"/><circle cx=\"749.7\" cy=\"117.7\" r=\"2.5\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"770.3\" cy=\"117.7\" r=\"2.5\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 755.1 118.3 Q 760 122.8 764.9 118.3\" stroke=\"#7A3B2E\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/></g><g transform=\"translate(815 165) scale(0.55)\"><rect x=\"-18\" y=\"-34\" width=\"36\" height=\"66\" rx=\"7\" fill=\"#2B3F5C\"/><rect x=\"-14\" y=\"-28\" width=\"28\" height=\"50\" rx=\"3\" fill=\"#BFDDF2\"/><circle cx=\"0\" cy=\"27\" r=\"2.5\" fill=\"#fff\"/></g><g><rect x=\"70\" y=\"50\" width=\"230\" height=\"60\" rx=\"16\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"2.5\"/><path d=\"M84 109 L80 130 L104 109\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"85\" y=\"106\" width=\"18\" height=\"6\" fill=\"#fff\"/><text x=\"185.0\" y=\"87.92\" text-anchor=\"middle\" font-family=\"Arial Rounded MT Bold,Verdana,sans-serif\" font-weight=\"700\" font-size=\"22\" fill=\"#2B3F5C\">Curry is easy!</text></g><path d=\"M140 270 l14 -20 l14 20z\" fill=\"#F08A3C\"/><circle cx=\"210\" cy=\"260\" r=\"14\" fill=\"#F6C343\"/></svg>", "alt": "初めての料理：電話で祖母に教わりながらカレーを作る私。", "passage": [{"who": "", "s": [["s1", "Last Sunday, my mother was sick in bed, so I decided to make dinner for my family."], ["s2", "I had no experience of cooking, and I didn't know how to start."], ["s3", "I called my grandmother and asked her what to make."], ["s4", "She said, \"Why don't you make curry? It's easy.\""], ["s5", "She told me how to cut the vegetables and how long to cook them."], ["s6", "It took two hours, but I finished it."], ["s7", "My father said, \"This is delicious!\""], ["s8", "My mother smiled and ate it all."], ["s9", "I was very proud."], ["s10", "Since then, I have cooked dinner three times."], ["s11", "Now I know how to make curry, fried rice, and miso soup."], ["s12", "Next, I want to learn how to make my mother's favorite dish."]]}], "trans": ["先週の日曜日、母が病気で寝ていたので、私は家族のために夕食を作ることにしました。料理をしたことがなく、何から始めればいいのかわかりませんでした。祖母に電話して、何を作ればいいかたずねました。祖母は「カレーを作ったら？簡単よ」と言いました。野菜の切り方と、どのくらい煮ればいいかを教えてくれました。2時間かかりましたが、完成させました。父は「これはおいしい！」と言いました。母はほほえんで、全部食べてくれました。私はとても誇らしく思いました。それ以来、3回夕食を作りました。今ではカレー、チャーハン、みそ汁の作り方がわかります。次は、母の好きな料理の作り方を覚えたいです。"], "rq": [{"q": "Why did the writer make dinner last Sunday?", "qja": "筆者はなぜ先週の日曜日に夕食を作ったのですか。", "opts": ["Because it was the mother's birthday.", "Because the writer's father asked.", "Because the grandmother visited.", "Because the writer's mother was sick."], "ans": 3, "ev": ["s1"]}, {"q": "Who did the writer call for help?", "qja": "筆者はだれに電話して助けを求めましたか。", "opts": ["The writer's grandmother.", "The writer's father.", " 9.6 261.7 Q 673.2 249.4 661.9 250.4 Q 648.7 253.2 640.4 261.7 Z\" fill=\"#2A2320\"/><circle cx=\"652.8\" cy=\"261.1\" r=\"1.9\" fill=\"#2A2A2A\"/><circle cx=\"667.2\" cy=\"261.1\" r=\"1.9\" fill=\"#2A2A2A\"/><circle cx=\"650\" cy=\"266.8\" r=\"2.5\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"670\" cy=\"266.8\" r=\"2.5\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 655.3 267.3 Q 660 271.7 664.7 267.3\" stroke=\"#7A3B2E\" stroke-width=\"1.7\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>", "alt": "東京で道に迷ったグループに、駅の近くで地図を見せて道を教えてくれたおじいさん。", "passage": [{"who": "", "s": [["s1", "During our school trip, my group got lost in Tokyo."], ["s2", "We wanted to go to the science museum, but we didn't know which train to take."], ["s3", "We didn't even know where we were."], ["s4", "Then I saw an old man near the station."], ["s5", "I asked him, \"Excuse me. Could you tell me how to get to the science museum?\""], ["s6", "He kindly showed us the way on a map."], ["s7", "\"Take the Blue Line and get off at the third station,\" he said."], ["s8", "\"Do you know how long it takes?\" Ken asked."], ["s9", "\"About fifteen minutes,\" the man answered."], ["s10", "Thanks to him, we arrived at the museum on time."], ["s11", "I don't know who he was, but I will never forget his kindness."]]}], "trans": ["修学旅行中、私のグループは東京で道に迷ってしまいました。科学博物館に行きたかったのですが、どの電車に乗ればいいのかわかりませんでした。自分たちがどこにいるのかさえわかりませんでした。そのとき、駅の近くにいるおじいさんを見かけました。私は「すみません。科学博物館への行き方を教えていただけませんか」とたずねました。おじいさんは親切に地図で道を教えてくれました。「ブルーラインに乗って、3つ目の駅で降りなさい」と言いました。「どのくらいかかるかわかりますか」とケンがたずねました。「15分くらいだよ」とおじいさんは答えました。おかげで、私たちは時間どおりに博物館に着きました。あの人がだれだったのかはわかりませんが、その親切は決して忘れません。"], "rq": [{"q": "What was the group's problem?", "qja": "グループの問題は何でしたか。", "opts": ["They didn't know which train to take.", "They lost their tickets.", "They missed the bus.", "The museum was closed."], "ans": 0, "ev": ["s2"]}, {"q": "Where did the man tell them to get off?", "qja": "おじいさんはどこで降りるように言いましたか。", "opts": ["At the first station.", "At the fifteenth station.", "At the third station.", "At the museum station on the Red Line."], "ans": 2, "ev": ["s7"]}, {"q": "How long did it take to get to the museum?", "qja": "博物館まではどのくらいかかりましたか。", "opts": ["About three minutes.", "About fifteen minutes.", "About an hour.", "About thirty minutes."], "ans": 1, "ev": ["s9"]}]}, {"id": "3-06", "lv": "3", "rev": false, "title": "At the Flea Market", "ja": "フリーマーケットで", "book": "Lesson 3-3", "words": 119, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"公園のフリーマーケット。青いバッグ、赤と白のTシャツ、手作りのイヤリング。\"><defs><linearGradient id=\"g36\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g36)\"/><g transform=\"translate(80 280) scale(0.9)\"><rect x=\"-9\" y=\"-70\" width=\"18\" height=\"70\" fill=\"#8B5E3C\"/><circle cx=\"0\" cy=\"-110\" r=\"46\" fill=\"#6DB36D\"/><circle cx=\"-34\" cy=\"-84\" r=\"32\" fill=\"#6DB36D\"/><circle cx=\"34\" cy=\"-84\" r=\"32\" fill=\"#6DB36D\"/></g><g transform=\"translate(880 280) scale(0.9)\"><rect x=\"-9\" y=\"-70\" width=\"18\" height=\"70\" fill=\"#8B5E3C\"/><circle cx=\"0\" cy=\"-110\" r=\"46\" fill=\"#6DB36D\"/><circle cx=\"-34\" cy=\"-84\" r=\"32\" fill=\"#6DB36D\"/><circle cx=\"34\" cy=\"-84\" r=\"32\" fill=\"#6DB36D\"/></g><rect x=\"0\" y=\"270\" width=\"960\" height=\"130\" fill=\"#A9D18E\"/><path d=\"M120 170 h340 l20 40 h-380z\" fill=\"#E07A5F\"/><path d=\"M500 170 h340 l20 40 h-380z\" fill=\"#5FB4E0\"/><g><rect x=\"110\" y=\"300\" width=\"360\" height=\"14\" rx=\"4\" fill=\"#C99A6B\"/><rect x=\"130\" y=\"314\" width=\"12\" height=\"70\" fill=\"#9C7450\"/><rect x=\"438\" y=\"314\" width=\"12\" height=\"70\" fill=\"#9C7450\"/></g><g><rect x=\"490\" y=\"300\" width=\"360\" height=\"14\" rx=\"4\" fill=\"#C99A6B\"/><rect x=\"510\" y=\"314\" width=\"12\" height=\"70\" fill=\"#9C7450\"/><rect x=\"818\" y=\"314\" width=\"12\ e\" stroke-linecap=\"round\"/></g></svg>", "alt": "公園のフリーマーケット。青いバッグ、赤と白のTシャツ、手作りのイヤリング。", "passage": [{"who": "", "s": [["s1", "Last Saturday, my sister and I went to a flea market in the park."], ["s2", "There were about fifty shops there."], ["s3", "At one shop, a woman was selling old bags."], ["s4", "I found a nice blue one, but it was too expensive."], ["s5", "Then I saw another one."], ["s6", "It was smaller, and it was only 500 yen."], ["s7", "I bought it."], ["s8", "My sister wanted a T-shirt."], ["s9", "One shop had two T-shirts in her size."], ["s10", "One was red, and the other was white."], ["s11", "She couldn't decide, so she bought both!"], ["s12", "Some people were selling things which they made themselves."], ["s13", "Someone was selling handmade earrings, and each pair was different."], ["s14", "I bought a pair for my mother."], ["s15", "We spent only 2,000 yen that day."]]}], "trans": ["先週の土曜日、姉と私は公園のフリーマーケットに行きました。お店が50ほどありました。あるお店では、女の人が古いかばんを売っていました。すてきな⻘いかばんを見つけましたが、高すぎました。そのとき、別のかばんが目に入りました。それはもっと小さくて、たった500円でした。私はそれを買いました。姉はTシャツがほしかったのです。あるお店に姉のサイズのTシャツが2枚ありました。1枚は赤で、もう1枚は白でした。姉は決められなかったので、両方とも買いました！自分で作った物を売っている人もいました。手作りのイヤリングを売っている人がいて、どの組もデザインが違っていました。私は母に1組買いました。その日、私たちは2,000円しか使いませんでした。"], "rq": [{"q": "Why didn't the writer buy the blue bag?", "qja": "筆者はなぜ⻘いかばんを買わなかったのですか。", "opts": ["Because it was too small.", "Because the sister didn't like it.", "Because it was old.", "Because it was too expensive."], "ans": 3, "ev": ["s4"]}, {"q": "Which T-shirt did the sister buy?", "qja": "姉はどのTシャツを買いましたか。", "opts": ["Only the red one.", "Only the white one.", "Both the red one and the white one.", "Neither of them."], "ans": 2, "ev": ["s11"]}, {"q": "What did the writer buy for the mother?", "qja": "筆者は母親に何を買いましたか。", "opts": ["A pair of earrings.", "A blue bag.", "A white T-shirt.", "A red T-shirt."], "ans": 0, "ev": ["s14"]}]}, {"id": "3-07", "lv": "3", "rev": false, "title": "The New Twins", "ja": "転校してきた双子", "book": "Lesson 3-3", "words": " fill=\"#2A2320\"/><circle cx=\"611.7\" cy=\"241.5\" r=\"2.2\" fill=\"#2A2A2A\"/><circle cx=\"628.3\" cy=\"241.5\" r=\"2.2\" fill=\"#2A2A2A\"/><circle cx=\"608.4\" cy=\"248\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"631.6\" cy=\"248\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 614.5 248.7 Q 620 253.7 625.5 248.7\" stroke=\"#7A3B2E\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><g transform=\"translate(600 245) rotate(-40)\"><ellipse cx=\"0\" cy=\"0\" rx=\"24\" ry=\"34\" fill=\"#B5651D\"/><ellipse cx=\"0\" cy=\"-30\" rx=\"18\" ry=\"20\" fill=\"#B5651D\"/><rect x=\"-3\" y=\"-90\" width=\"6\" height=\"64\" fill=\"#3A2A20\"/></g><line x1=\"640\" y1=\"200\" x2=\"720\" y2=\"290\" stroke=\"#7A4E2D\" stroke-width=\"4\"/><g transform=\"translate(760 150) scale(1.4)\" fill=\"#2B3F5C\"><ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"7\" transform=\"rotate(-20)\"/><rect x=\"7\" y=\"-34\" width=\"3.5\" height=\"34\"/><path d=\"M10 -34 q14 6 12 20 q-2 -10 -12 -12z\"/></g><g transform=\"translate(820 200) scale(1.1)\" fill=\"#E07A5F\"><ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"7\" transform=\"rotate(-20)\"/><rect x=\"7\" y=\"-34\" width=\"3.5\" height=\"34\"/><path d=\"M10 -34 q14 6 12 20 q-2 -10 -12 -12z\"/></g></svg>", "alt": "転校してきた双子のレンとリン。サッカーボールとバイオリン。", "passage": [{"who": "", "s": [["s1", "Two new students came to our class last month."], ["s2", "They are twins, Ren and Rin."], ["s3", "One is a boy, and the other is a girl."], ["s4", "They both love soccer, but Rin also plays the violin."], ["s5", "They often help each other with their homework."], ["s6", "Each of them has a different dream."], ["s7", "Ren wants to be a soccer player, and Rin wants to be a musician."], ["s8", "Everyone in our class likes them."], ["s9", "Some students ask them about their old school in Hokkaido."], ["s10", "Others ask them to play soccer after school."], ["s11", "Yesterday, Rin played the violin for us at lunchtime."], ["s12", "Nothing was more beautiful than her music."], ["s13", "Everyone clapped for a long time."], ["s14", "I'm glad that they joined our class."]]}], "trans": ["先月、2人の新しい生徒が私たちのクラスに来ました。レンとリンという双子です。1人は男の子で、もう1人は女の子です。2人ともサッカーが大好きですが、リンはバイオリンも弾きます。2人はよくお互いに宿題を手伝い合っています。それぞれに違う夢があります。レンはサッカー選手に、リンは音楽家になりたいと思っています。クラスのみんなが2人のことを好きです。北海道の前の学校についてたずねる生徒もいれば、放課後にサッカーをしようと誘う生徒もいます。昨日、リンは昼休みに私たちのためにバイオリンを弾いてくれました。彼女の音楽ほど美しいものはありませんでした。みんな⻑い間拍手をしました。2人が私たちのクラスに来てくれてうれしいです。"], "rq": [{"q": "What does Rin do besides soccer?", "qja": "リンはサッカーのほかに何をしますか。", "opts": ["She plays the piano.", "She teaches soccer.", "She writes songs.", "She plays the violin."], "ans": 3, "ev": ["s4"]}, {"q": "What does Ren want to be?", "qja": "レンは何になりたいですか。", "opts": ["A musician.", "A soccer player.", "A teacher.", "A doctor."], "ans": 1, "ev": ["s7"]}, {"q": "What happened yesterday?", "qja": "昨日何がありましたか。", "opts": ["Ren and Rin went back to Hokkaido.", "Rin played the violin at lunchtime.", "The class played soccer with the twins.", "Ren played the violin with Rin."], "ans": 1, "ev": ["s11"]}]}, {"id": "3-08", "lv": "3", "rev": false, "title": "Less Plastic at School", "ja": "学校のプラスチックを減らそう", "book": "Lesson 3-4", "words": 123, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"プラスチックを減らそう：マイボトルを持つ生徒と、廊下のリサイクルボックス。\"><rect width=\"960\" height=\"310\" fill=\"#EEF4F6\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#C9C1B2\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><rect x=\"60\" y=\"40\" width=\"300\" height=\"150\" rx=\"8\" fill=\"#fff\" stroke=\"#9DB4CF\" stroke-width=\"4\"/><text x=\"210\" y=\"105\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"26\" fill=\"#2B3F5C\">Bring your</text><text x=\"210\" y=\"150\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"26\" fill=\"#2B3F5C\">own bottle!</text><g><rect x=\"447.2\" y=\"309.6\" width=\"18\ 385\" rx=\"12.4\" ry=\"5.8\" fill=\"#3A3A3A\"/><line x1=\"597.3\" y1=\"271.1\" x2=\"583.7\" y2=\"330.5\" stroke=\"#2B3F5C\" stroke-width=\"12.4\" stroke-linecap=\"round\"/><circle cx=\"583.7\" cy=\"330.5\" r=\"7.7\" fill=\"#F6D3B8\"/><line x1=\"642.7\" y1=\"271.1\" x2=\"679.1\" y2=\"297.9\" stroke=\"#2B3F5C\" stroke-width=\"12.4\" stroke-linecap=\"round\"/><circle cx=\"679.1\" cy=\"297.9\" r=\"7.7\" fill=\"#F6D3B8\"/><path d=\"M 593.6 268.9 Q 593.6 262.9 601.6 262.9 L 638.4 262.9 Q 646.4 262.9 646.4 268.9 L 648.4 315.7 L 591.6 315.7 Z\" fill=\"#2B3F5C\"/><rect x=\"613.1\" y=\"256.5\" width=\"13.7\" height=\"12.9\" fill=\"#F6D3B8\"/><circle cx=\"620\" cy=\"241.4\" r=\"21.4\" fill=\"#F6D3B8\"/><path d=\"M 597.7 244.7 Q 595.3 215.7 620 218.3 Q 644.7 215.7 642.3 244.7 Q 635 230.7 622.1 231.8 Q 607.1 235 597.7 244.7 Z\" fill=\"#2A2320\"/><circle cx=\"620\" cy=\"217.9\" r=\"9\" fill=\"#2A2320\"/><circle cx=\"611.8\" cy=\"244\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"628.2\" cy=\"244\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"608.6\" cy=\"250.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"631.4\" cy=\"250.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 614.6 251.1 Q 620 256 625.4 251.1\" stroke=\"#7A3B2E\" stroke-width=\"1.9\" fill=\"none\" stroke-linecap=\"round\"/></g><g transform=\"translate(712 300) scale(1.1)\"><rect x=\"-12\" y=\"-50\" width=\"24\" height=\"50\" rx=\"6\" fill=\"#F7B7C8\" stroke=\"#7FB3D0\" stroke-width=\"2\"/><rect x=\"-6\" y=\"-62\" width=\"12\" height=\"13\" fill=\"#4C7BD9\"/></g><g><path d=\"M796 240 h68 l-6 90 h-56z\" fill=\"#3E8A6A\"/><rect x=\"792\" y=\"230\" width=\"76\" height=\"12\" rx=\"4\" fill=\"#3E8A6A\"/><text x=\"830\" y=\"294\" text-anchor=\"middle\" font-size=\"34\" fill=\"#fff\">♻</text></g></svg>", "alt": "プラスチックを減らそう：マイボトルを持つ生徒と、廊下のリサイクルボックス。", "passage": [{"who": "", "s": [["s1", "How much plastic do we use at our school?"], ["s2", "Last month, the student council checked the trash cans."], ["s3", "We found many plastic bottles and a lot of plastic bags."], ["s4", "Very few students brought their own water bottles."], ["s5", "We were surprised, so we decided to start a campaign."], ["s6", "We asked every student to bring a water bottle."], ["s7", "We also put some new recycling boxes in each hallway."], ["s8", "At first, a few students were not interested."], ["s9", "However, many students joined us after our teacher talked about plastic in the sea."], ["s10", "Now there is much less plastic in the trash cans than before."], ["s11", "There aren't any bottles on the school grounds, either."], ["s12", "It is not difficult for us to change."], ["s13", "We just need a little effort."]]}], "trans": ["私たちの学校ではどのくらいのプラスチックを使っているでしょうか。先月、生徒会がごみ箱を調べました。たくさんのペットボトルとビニール袋が見つかりました。自分の水筒を持ってきている生徒はほとんどいませんでした。私たちは驚いて、キャンペーンを始めることにしました。全生徒に水筒を持ってくるよう呼びかけました。各廊下に新しいリサイクルボックスもいくつか置きました。最初は、興味を示さない生徒も少しいました。しかし、先生が海のプラスチックについて話してくれたあと、多くの生徒が協力してくれました。今では、ごみ箱の中のプラスチックは以前よりずっと少なくなりました。校庭にもペットボトルは1本も落ちていません。私たちが変わるのは難しくありません。ほんの少しの努力が必要なだけです。"], "rq": [{"q": "What did the student council find in the trash cans?", "qja": "生徒会はごみ箱の中に何を見つけましたか。", "opts": ["A lot of paper.", "Many water bottles.", "Some recycling boxes.", "Many plastic bottles and bags."], "ans": 3, "ev": ["s3"]}, {"q": "What did the student council ask every student to do?", "qja": "生徒会は全生徒に何をするよう頼みましたか。", "opts": ["Bring a water bottle.", "Clean the beach.", "Buy a new bag.", "Talk about the sea."], "ans": 0, "ev": ["s6"]}, {"q": "What is the result of the campaign?", "qja": "キャンペーンの結果はどうなりましたか。", "opts": ["More students buy plastic bottles.", "The trash cans were taken away.", "There is much less plastic in the trash cans.", "Nobody joined the campaign."], "ans": 2, "ev": ["s10"]}]}, {"id": "3-09", "lv": "3", "rev": false, "title": "Volunteering at a Nursing Home", "ja": "老人ホームでのボランティア", "book": "Lesson 3-4", "words": 120, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-labe 424.9 258.3\" stroke=\"#7A3B2E\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/></g><g transform=\"translate(560 160) scale(1.3)\" fill=\"#2B3F5C\"><ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"7\" transform=\"rotate(-20)\"/><rect x=\"7\" y=\"-34\" width=\"3.5\" height=\"34\"/><path d=\"M10 -34 q14 6 12 20 q-2 -10 -12 -12z\"/></g><g transform=\"translate(620 200) scale(1.1)\" fill=\"#E07A5F\"><ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"7\" transform=\"rotate(-20)\"/><rect x=\"7\" y=\"-34\" width=\"3.5\" height=\"34\"/><path d=\"M10 -34 q14 6 12 20 q-2 -10 -12 -12z\"/></g><path transform=\"translate(320 160) scale(1.4)\" d=\"M0 8 C-20 -6 -14 -22 0 -12 C14 -22 20 -6 0 8Z\" fill=\"#E0605A\"/><rect x=\"700\" y=\"120\" width=\"200\" height=\"190\" fill=\"#B98556\"/><rect x=\"708\" y=\"128.0\" width=\"184\" height=\"80.0\" fill=\"#8F6340\"/><rect x=\"712\" y=\"134.0\" width=\"14\" height=\"74.0\" fill=\"#4C7BD9\"/><rect x=\"729\" y=\"139.0\" width=\"21\" height=\"69.0\" fill=\"#E07A5F\"/><rect x=\"753\" y=\"144.0\" width=\"16\" height=\"64.0\" fill=\"#F6C343\"/><rect x=\"772\" y=\"135.0\" width=\"23\" height=\"73.0\" fill=\"#6DB36D\"/><rect x=\"798\" y=\"140.0\" width=\"18\" height=\"68.0\" fill=\"#9B6BC4\"/><rect x=\"819\" y=\"145.0\" width=\"25\" height=\"63.0\" fill=\"#2B3F5C\"/><rect x=\"847\" y=\"136.0\" width=\"20\" height=\"72.0\" fill=\"#E89AB0\"/><rect x=\"708\" y=\"218.0\" width=\"184\" height=\"80.0\" fill=\"#8F6340\"/><rect x=\"712\" y=\"231.0\" width=\"15\" height=\"67.0\" fill=\"#4C7BD9\"/><rect x=\"730\" y=\"236.0\" width=\"22\" height=\"62.0\" fill=\"#E07A5F\"/><rect x=\"755\" y=\"227.0\" width=\"17\" height=\"71.0\" fill=\"#F6C343\"/><rect x=\"775\" y=\"232.0\" width=\"24\" height=\"66.0\" fill=\"#6DB36D\"/><rect x=\"802\" y=\"237.0\" width=\"19\" height=\"61.0\" fill=\"#9B6BC4\"/><rect x=\"824\" y=\"228.0\" width=\"14\" height=\"70.0\" fill=\"#2B3F5C\"/><rect x=\"841\" y=\"233.0\" width=\"21\" height=\"65.0\" fill=\"#E89AB0\"/><rect x=\"865\" y=\"224.0\" width=\"16\" height=\"74.0\" fill=\"#4C7BD9\"/></svg>", "alt": "老人ホームでのボランティア。上田さんの昔話を笑顔で聞く私。", "passage": [{"who": "", "s": [["s1", "Last summer, I did volunteer work at a nursing home near my house."], ["s2", "On the first day, it was hard for me to talk with the old people."], ["s3", "I was very nervous, and I didn't know what to say."], ["s4", "A staff member told me, \"It is important for you to smile and listen.\""], ["s5", "So I tried."], ["s6", "An old woman named Mrs. Ueda told me about her life when she was young."], ["s7", "It was very interesting for me to hear her stories."], ["s8", "She also taught me some old Japanese songs."], ["s9", "On my last day, she held my hand and said, \"Please come back again.\""], ["s10", "Since then, I have visited her once a month."], ["s11", "It is easy for anyone to start volunteering."]]}], "trans": ["去年の夏、私は家の近くの老人ホームでボランティアをしました。初日は、お年寄りと話すのが大変でした。とても緊張していて、何を言えばいいのかわかりませんでした。職員の方が「笑顔で話を聞くことが大切ですよ」と言ってくれました。それでやってみました。ウエダさんというおばあさんが、若いころの暮らしについて話してくれました。彼女の話を聞くのはとてもおもしろかったです。昔の日本の歌も教えてくれました。最後の日、ウエダさんは私の手をにぎって「また来てね」と言いました。それ以来、私は月に1回彼女を訪ねています。ボランティアはだれでも簡単に始められます。"], "rq": [{"q": "Why was the first day hard for the writer?", "qja": "初日はなぜ筆者にとって大変だったのですか。", "opts": ["The writer was nervous and didn't know what to say.", "The writer was sick.", "The old people didn't want to talk.", "The nursing home was far away."], "ans": 0, "ev": ["s3"]}, {"q": "What did Mrs. Ueda teach the writer?", "qja": "ウエダさんは筆者に何を教えてくれましたか。", "opts": ["How to cook.", "How to smile.", "Some old Japanese songs.", "Some English words."], "ans": 2, "ev": ["s8"]}, {"q": "How often does the writer visit Mrs. Ueda now?", "qja": "筆者は今、どのくらいの頻度でウエダさんを訪ねていますか。", "opts": ["Every day.", "Once a month.", "Once a year.", "Every summer."], "ans": 1, "ev": ["s10"]}]}, {"id": "3-10", "lv": "3", "rev": false, "title": "Work Experience at a Bakery", "ja": "パン屋さんでの職場体験", "book": "Lesson 3-5", "words": 115, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" ><circle cx=\"480\" cy=\"233.4\" r=\"11.7\" fill=\"#fff\"/><circle cx=\"472.6\" cy=\"271.8\" r=\"2\" fill=\"#2A2A2A\"/><circle cx=\"487.4\" cy=\"271.8\" r=\"2\" fill=\"#2A2A2A\"/><circle cx=\"469.7\" cy=\"277.7\" r=\"2.5\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"490.3\" cy=\"277.7\" r=\"2.5\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 475.1 278.3 Q 480 282.8 484.9 278.3\" stroke=\"#7A3B2E\" stroke-width=\"1.8\" fill=\"none\" stroke-linecap=\"round\"/></g><g transform=\"translate(250 330) scale(0.8)\"><path d=\"M-40 0 Q-46 -36 -20 -40 Q0 -54 20 -40 Q46 -36 40 0Z\" fill=\"#D9A866\"/><path d=\"M-20 -30 l8 10 M0 -36 l8 10 M20 -30 l8 10\" stroke=\"#B5803F\" stroke-width=\"4\" stroke-linecap=\"round\"/></g><g transform=\"translate(480 342) scale(0.65)\"><path d=\"M-40 0 Q-46 -36 -20 -40 Q0 -54 20 -40 Q46 -36 40 0Z\" fill=\"#D9A866\"/><path d=\"M-20 -30 l8 10 M0 -36 l8 10 M20 -30 l8 10\" stroke=\"#B5803F\" stroke-width=\"4\" stroke-linecap=\"round\"/></g><ellipse cx=\"370\" cy=\"295\" rx=\"40\" ry=\"10\" fill=\"#fff\"/><g><circle cx=\"90\" cy=\"70\" r=\"34\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"4\"/><line x1=\"90\" y1=\"70\" x2=\"104.7\" y2=\"78.5\" stroke=\"#2B3F5C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"90\" y1=\"70\" x2=\"90.0\" y2=\"43.5\" stroke=\"#2B3F5C\" stroke-width=\"3\" stroke-linecap=\"round\"/></g></svg>", "alt": "パン屋さんでの職場体験。林さんと一緒にパンを作る私。", "passage": [{"who": "", "s": [["s1", "I did my work experience at a bakery for three days."], ["s2", "The owner, Mr. Hayashi, gets up at four every morning."], ["s3", "On the first day, he let me watch him make bread."], ["s4", "I saw him mix flour, water, and salt very quickly."], ["s5", "On the second day, he had me clean the kitchen and carry heavy boxes."], ["s6", "It was hard work, and my arms hurt."], ["s7", "On the last day, he let me make my own bread."], ["s8", "It didn't look nice, but it tasted good."], ["s9", "Mr. Hayashi said, \"Bread makes people happy. That's why I love my job.\""], ["s10", "His words made me think about my future."], ["s11", "I want to find a job that makes people happy, too."]]}], "trans": ["私はパン屋さんで3日間の職場体験をしました。店主のハヤシさんは毎朝4時に起きます。1日目、ハヤシさんはパンを作るところを見せてくれました。小⻨粉と水と塩をとても手早く混ぜるのを見ました。2日目は、台所のそうじと重い箱の運搬をさせられました。大変な仕事で、腕が痛くなりました。最終日には、自分のパンを作らせてくれました。見た目はよくありませんでしたが、味はおいしかったです。ハヤシさんは「パンは人を幸せにする。だから私はこの仕事が大好きなんだ」と言いました。その言葉で、私は自分の将来について考えるようになりました。私も人を幸せにする仕事を見つけたいです。"], "rq": [{"q": "What time does Mr. Hayashi get up?", "qja": "ハヤシさんは何時に起きますか。", "opts": ["At three.", "At five.", "At six.", "At four."], "ans": 3, "ev": ["s2"]}, {"q": "What did the writer do on the second day?", "qja": "筆者は2日目に何をしましたか。", "opts": ["Made bread alone.", "Sold bread to customers.", "Cleaned the kitchen and carried heavy boxes.", "Watched Mr. Hayashi make bread."], "ans": 2, "ev": ["s5"]}, {"q": "What did Mr. Hayashi's words make the writer do?", "qja": "ハヤシさんの言葉は筆者に何をさせましたか。", "opts": ["Think about the future.", "Stop working at the bakery.", "Get up at four every morning.", "Buy more bread."], "ans": 0, "ev": ["s10"]}]}, {"id": "3-11", "lv": "3", "rev": false, "title": "Hana from the Shelter", "ja": "保護施設から来たハナ", "book": "Lesson 3-5", "words": 116, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"動物保護施設から家族になった茶色の犬ハナ。庭を走り回っている。\"><defs><linearGradient id=\"g311\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g311)\"/><g transform=\"translate(200 60) scale(1)\" fill=\"#fff\" opacity=\"1\"><ellipse cx=\"0\" cy=\"0\" rx=\"46\" ry=\"22\"/><ellipse cx=\"-30\" cy=\"6\" rx=\"30\" ry=\"18\"/><ellipse cx=\"34\" cy=\"6\" rx=\"32\" ry=\"18\"/><ellipse cx=\"6\" cy=\"-14\" rx=\"28\" ry=\"20\"/></g><g><rect x=\"560\" y=\"140\" width=\"260\" height=\"160\" fill=\"#F3E3C3\"/><path d=\"M540 144 L690.0 60 L840 144 Z\" fill=\"#C8693E\"/><rect x=\"664.0\" y=\"2 " fill=\"#9C6B3E\"/><rect x=\"22\" y=\"-12\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#9C6B3E\"/><ellipse cx=\"0\" cy=\"-30\" rx=\"44\" ry=\"24\" fill=\"#9C6B3E\"/><rect x=\"-22\" y=\"-12\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#8A5A30\"/><rect x=\"10\" y=\"-12\" width=\"10\" height=\"26\" rx=\"4\" fill=\"#8A5A30\"/><circle cx=\"-44\" cy=\"-58\" r=\"24\" fill=\"#9C6B3E\"/><ellipse cx=\"-60\" cy=\"-52\" rx=\"13\" ry=\"10\" fill=\"#8A5A30\" opacity=\".85\"/><ellipse cx=\"-30\" cy=\"-66\" rx=\"9\" ry=\"17\" fill=\"#8A5A30\" transform=\"rotate(25 -30 -66)\" opacity=\".9\"/><circle cx=\"-50\" cy=\"-63\" r=\"3.5\" fill=\"#222\"/><circle cx=\"-69\" cy=\"-55\" r=\"4.5\" fill=\"#222\"/></g><g><rect x=\"177.8\" y=\"311.7\" width=\"17.5\" height=\"73.3\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"204.7\" y=\"311.7\" width=\"17.5\" height=\"73.3\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"186.1\" cy=\"385\" rx=\"12.4\" ry=\"5.8\" fill=\"#3A3A3A\"/><ellipse cx=\"213.9\" cy=\"385\" rx=\"12.4\" ry=\"5.8\" fill=\"#3A3A3A\"/><line x1=\"177.3\" y1=\"271.1\" x2=\"126.1\" y2=\"297.9\" stroke=\"#E07A5F\" stroke-width=\"12.4\" stroke-linecap=\"round\"/><circle cx=\"126.1\" cy=\"297.9\" r=\"7.7\" fill=\"#EBC09E\"/><line x1=\"222.7\" y1=\"271.1\" x2=\"273.9\" y2=\"297.9\" stroke=\"#E07A5F\" stroke-width=\"12.4\" stroke-linecap=\"round\"/><circle cx=\"273.9\" cy=\"297.9\" r=\"7.7\" fill=\"#EBC09E\"/><path d=\"M 173.6 268.9 Q 173.6 262.9 181.6 262.9 L 218.4 262.9 Q 226.4 262.9 226.4 268.9 L 228.4 315.7 L 171.6 315.7 Z\" fill=\"#E07A5F\"/><rect x=\"193.1\" y=\"256.5\" width=\"13.7\" height=\"12.9\" fill=\"#EBC09E\"/><circle cx=\"200\" cy=\"241.4\" r=\"21.4\" fill=\"#EBC09E\"/><path d=\"M 177.7 244.7 Q 175.3 215.7 200 218.3 Q 224.7 215.7 222.3 244.7 Q 215 230.7 202.1 231.8 Q 187.1 235 177.7 244.7 Z\" fill=\"#2A2320\"/><circle cx=\"191.8\" cy=\"244\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"208.2\" cy=\"244\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"188.6\" cy=\"250.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"211.4\" cy=\"250.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 194.6 251.1 Q 200 256 205.4 251.1\" stroke=\"#7A3B2E\" stroke-width=\"1.9\" fill=\"none\" stroke-linecap=\"round\"/></g><path transform=\"translate(300 170) scale(1.4)\" d=\"M0 8 C-20 -6 -14 -22 0 -12 C14 -22 20 -6 0 8Z\" fill=\"#E0605A\"/><path transform=\"translate(480 230) scale(1)\" d=\"M0 8 C-20 -6 -14 -22 0 -12 C14 -22 20 -6 0 8Z\" fill=\"#E0605A\"/></svg>", "alt": "動物保護施設から家族になった茶色の犬ハナ。庭を走り回っている。", "passage": [{"who": "", "s": [["s1", "My family adopted a dog from an animal shelter last year."], ["s2", "Before that, I didn't know much about shelters."], ["s3", "A shelter is a place that takes care of animals which have no homes."], ["s4", "When we visited, a staff member helped us choose a dog."], ["s5", "We looked around and found a shy brown dog named Hana."], ["s6", "At first, she was too scared to come near us."], ["s7", "The staff member let me give her some food, and she slowly came up to me."], ["s8", "We decided to take her home."], ["s9", "Now Hana is a happy member of our family."], ["s10", "She runs around the garden and wakes me up every morning."], ["s11", "I want more people to know about animal shelters."]]}], "trans": ["私の家族は去年、動物の保護施設から犬を引き取りました。それまで私は保護施設のことをあまり知りませんでした。保護施設とは、家のない動物の世話をする場所です。訪ねたとき、職員の方が犬を選ぶのを手伝ってくれました。見て回るうちに、ハナという名前の恥ずかしがり屋の茶色い犬を見つけました。最初、ハナはこわがって私たちに近づくことができませんでした。職員の方が私にえさをあげさせてくれると、ハナはゆっくりと私のところに来ました。私たちはハナを家に連れて帰ることにしました。今ではハナは家族の幸せな一員です。庭を走り回り、毎朝私を起こしてくれます。もっと多くの人に動物の保護施設について知ってほしいと思います。"], "rq": [{"q": "What is an animal shelter?", "qja": "動物の保護施設とは何ですか。", "opts": ["A shop that sells pets.", "A hospital for sick people.", "A park where dogs can run.", "A place that takes care of animals with no homes."], "ans": 3, "ev": ["s3"]}, {"q": "Why didn't Hana come near the family at first?", "qja": "ハナは最初なぜ家族に近づかなかったのですか。", "opts": ["Because she was sick.", "Because she was too scared.", "Because she was eating.", "Because she didn't like the writer."], "ans": 1, "ev": ["s6"]}, {"q": "What does Hana do every morning?", "qja": "ハナは毎朝何をしますか。", "opts": ["She goes back to the shelter.", "She wakes the writer up.", "She eats with the staff.", "She sleeps in the garden."], "ans": 1, "ev": ["s10"]}]}, {"id": "3-12", "lv": "3", "rev": false, "title": "My Favorite Place", "ja": "私のお気に入りの場所", "book": "Lesson 3-6", "words": 120, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"祖父母の家の裏の小さな丘。夕方、オレンジ色の空と町と海が見える。\"><defs><linearGradient id=\"g312\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F3A35B\"/><stop offset=\"1\" stop-color=\"#FCD9A8\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g312)\"/><circle cx=\"760\" cy=\"230\" r=\"50\" fill=\"#F7E27A\" opacity=\".9\"/><rect y=\"240\" width=\"960\" height=\"160\" fill=\"#E79A63\"/><path d=\"M30 258 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M200 258 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M370 258 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M540 258 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M710 258 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M880 258 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M70 284 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M240 284 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M410 284 q15 -8 30 0 t30 0\" fill=\"none\" stroke=\"#F5C08E\" stroke-width=\"4\" stroke-linecap=\"round\"/><path d=\"M580 284 q15 -8 30 0 t \"8.2\" stroke-linecap=\"round\"/><circle cx=\"304.2\" cy=\"263.7\" r=\"5.1\" fill=\"#EBC09E\"/><path d=\"M 262.4 224.6 Q 262.4 218.6 270.4 218.6 L 289.6 218.6 Q 297.6 218.6 297.6 224.6 L 299.6 253.8 L 260.4 253.8 Z\" fill=\"#4C7BD9\"/><rect x=\"275.4\" y=\"214.3\" width=\"9.2\" height=\"8.6\" fill=\"#EBC09E\"/><circle cx=\"280\" cy=\"204.3\" r=\"14.3\" fill=\"#EBC09E\"/><path d=\"M 265.1 206.4 Q 263.6 187.1 280 188.9 Q 296.4 187.1 294.9 206.4 Q 290 197.2 281.4 197.9 Q 271.4 200 265.1 206.4 Z\" fill=\"#2A2320\"/><circle cx=\"274.6\" cy=\"206\" r=\"1.4\" fill=\"#2A2A2A\"/><circle cx=\"285.4\" cy=\"206\" r=\"1.4\" fill=\"#2A2A2A\"/><circle cx=\"272.4\" cy=\"210.3\" r=\"1.9\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"287.6\" cy=\"210.3\" r=\"1.9\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 276.4 210.7 Q 280 214 283.6 210.7\" stroke=\"#7A3B2E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/></g><path d=\"M290 230 q30 -10 60 0 q30 -10 60 0\" stroke=\"#fff\" stroke-width=\"2\" fill=\"none\" opacity=\".6\"/></svg>", "alt": "祖父母の家の裏の小さな丘。夕方、オレンジ色の空と町と海が見える。", "passage": [{"who": "", "s": [["s1", "Everyone has a place where they can relax."], ["s2", "My favorite place is a small hill behind my grandparents' house."], ["s3", "That is the place where I spent every summer when I was a child."], ["s4", "From the top, you can see the whole town and the sea."], ["s5", "I often went there in the evening."], ["s6", "That was the time when the sky turned orange."], ["s7", "I don't know the reason why I feel so calm there."], ["s8", "Maybe it is because of the wind and the quiet."], ["s9", "Last month, when I had a problem with my friend, I went to the hill again."], ["s10", "I sat there for an hour and thought about what I should do."], ["s11", "The next day, I said sorry to my friend."]]}], "trans": ["だれにでもくつろげる場所があります。私のお気に入りの場所は、祖父母の家の裏にある小さな丘です。そこは私が子どものころ、毎年夏を過ごした場所です。てっぺんからは町全体と海が見えます。私はよく夕方にそこへ行きました。それは空がオレンジ色に変わる時間でした。なぜそこではそんなに落ち着いた気持ちになるのか、理由はわかりません。風と静けさのせいかもしれません。先月、友達とうまくいかないことがあったとき、私はまたその丘に行きました。1時間そこに座って、どうすればいいか考えました。次の日、私は友達に謝りました。"], "rq": [{"q": "Where is the writer's favorite place?", "qja": "筆者のお気に入りの場所はどこですか。", "opts": ["On a beach near the town.", "In the writer's room.", "In a park near the school.", "On a hill behind the grandparents' house."], "ans": 3, "ev": ["s2"]}, {"q": "What can you see from the top of the hill?", "qja": "丘のてっぺんからは何が見えますか。", "opts": ["The whole town and the sea.", "Only the grandparents' house.", "The mountains and a river.", "The writer's school."], "ans": 0, "ev": ["s4"]}, {"q": "What did the writer do the day after visiting the hill?", "qja": "丘に行った次の日、筆者は何をしましたか。", "opts": ["Moved to the grandparents' house.", "Went to the hill with a friend.", "Said sorry to a friend.", "Watched the sky turn orange."], "ans": 2, "ev": ["s11"]}]}, {"id": "3-13", "lv": "3", "rev": false, "title": "What My Coach Taught Me", "ja": "コーチが教えてくれたこと", "book": "Lesson 3-6", "words": 118, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"バスケットボール部。木村コーチを囲んで円になって話し合う。\"><rect width=\"960\" height=\"400\" fill=\"#F3E6D0\"/><rect y=\"250\" width=\"960\" height=\"150\" fill=\"#D9A866\"/><g><rect x=\"836\" y=\"120\" width=\"8\" height=\"200\" fill=\"#888\"/><rect x=\"800\" y=\"60\" width=\"80\" height=\"56\" fill=\"#fff\" stroke=\"#888\" stroke-width=\"3\"/><ellipse cx=\"840\" cy=\"114\" rx=\"26\" ry=\"6\" fill=\"none\" stroke=\"#E0605A\" stroke-width=\"4\"/><path d=\"M816 116 l8 26 h32 l8 -26\" fill=\"none\" stroke=\"#ccc\" stroke-width=\"2\"/></g><ellipse cx=\"420\" cy=\"330\" rx=\"230\" ry=\"44\" fill=\"none\" stroke=\"#fff\" stroke-width=\"4\" opacity=\".7\"/><g><ellipse cx=\"443.2\" cy=\"163.2\" rx=\"8.4\" ry=\"17.7\" fill=\"#6B4226\"/><rect x=\"397.2\" y=\"224.6\" width=\"18\" height=\"75.4\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"424.8\" y=\"224.6\" width=\"18\" height=\"75.4\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"405.7\" cy=\"300\" rx=\"12.8\" ery game."], ["s2", "We were sad, and some members wanted to quit."], ["s3", "Then a new coach, Ms. Kimura, came to our school."], ["s4", "What she taught us first was not how to shoot."], ["s5", "It was how to talk to each other."], ["s6", "She said, \"What a team needs most is trust.\""], ["s7", "After every practice, we sat in a circle and shared our ideas."], ["s8", "At first, it felt strange."], ["s9", "But slowly, our team changed."], ["s10", "We started to pass the ball more and smile more."], ["s11", "This year, we won four games in a row."], ["s12", "What I learned from Ms. Kimura is that teamwork is more important than skill."], ["s13", "I will remember her words in high school, too."]]}], "trans": ["去年、私たちのバスケットボール部は全試合で負けました。私たちは落ちこみ、やめたいと思う部員もいました。そのとき、新しいコーチのキムラ先生が学校に来ました。先生が最初に教えてくれたのは、シュートのしかたではありませんでした。お互いに話し合う方法でした。先生は「チームに一番必要なのは信頼です」と言いました。毎回の練習のあと、私たちは輪になって座り、考えを話し合いました。最初は変な感じがしました。でも少しずつ、チームは変わっていきました。パスが増え、笑顔も増えました。今年は4連勝しました。私がキムラ先生から学んだことは、チームワークは技術よりも大切だということです。高校でも先生の言葉を忘れません。"], "rq": [{"q": "What happened to the team last year?", "qja": "去年、チームに何がありましたか。", "opts": ["They lost every game.", "They won four games in a row.", "They got a new gym.", "They stopped practicing."], "ans": 0, "ev": ["s1"]}, {"q": "What did Ms. Kimura say a team needs most?", "qja": "キムラ先生は、チームに一番必要なものは何だと言いましたか。", "opts": ["Skill.", "A good coach.", "Trust.", "Tall players."], "ans": 2, "ev": ["s6"]}, {"q": "What did the writer learn from Ms. Kimura?", "qja": "筆者はキムラ先生から何を学びましたか。", "opts": ["Shooting is the most important skill.", "Teamwork is more important than skill.", "It is better to quit when you lose.", "Practice is more important than talking."], "ans": 1, "ev": ["s12"]}]}, {"id": "3-14", "lv": "3", "rev": false, "title": "If I Could Talk with My Cat", "ja": "もしネコと話せたら", "book": "Lesson 3-6", "words": 123, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"窓辺で外を見る黒猫のクロ。「もしネコと話せたら…」\"><rect width=\"960\" hei =\"#F6C343\" stroke-width=\"12.8\" stroke-linecap=\"round\"/><circle cx=\"112.6\" cy=\"328.9\" r=\"7.9\" fill=\"#EBC09E\"/><line x1=\"173.4\" y1=\"267.7\" x2=\"187.4\" y2=\"328.9\" stroke=\"#F6C343\" stroke-width=\"12.8\" stroke-linecap=\"round\"/><circle cx=\"187.4\" cy=\"328.9\" r=\"7.9\" fill=\"#EBC09E\"/><path d=\"M 122.8 265.2 Q 122.8 259.2 130.8 259.2 L 169.2 259.2 Q 177.2 259.2 177.2 265.2 L 179.2 313.6 L 120.8 313.6 Z\" fill=\"#F6C343\"/><rect x=\"142.9\" y=\"252.6\" width=\"14.1\" height=\"13.3\" fill=\"#EBC09E\"/><circle cx=\"150\" cy=\"237.1\" r=\"22.1\" fill=\"#EBC09E\"/><path d=\"M 127 240.4 Q 124.6 210.6 150 213.2 Q 175.4 210.6 173 240.4 Q 165.5 226 152.2 227.2 Q 136.7 230.5 127 240.4 Z\" fill=\"#2A2320\"/><circle cx=\"141.6\" cy=\"239.8\" r=\"2.2\" fill=\"#2A2A2A\"/><circle cx=\"158.4\" cy=\"239.8\" r=\"2.2\" fill=\"#2A2A2A\"/><circle cx=\"138.3\" cy=\"246.4\" r=\"2.9\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"161.7\" cy=\"246.4\" r=\"2.9\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 144.5 247 Q 150 252.1 155.5 247\" stroke=\"#7A3B2E\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><g><rect x=\"30\" y=\"110\" width=\"230\" height=\"60\" rx=\"16\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"2.5\"/><path d=\"M44 169 L40 190 L64 169\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"45\" y=\"166\" width=\"18\" height=\"6\" fill=\"#fff\"/><text x=\"145.0\" y=\"145.76\" text-anchor=\"middle\" font-family=\"Arial Rounded MT Bold,Verdana,sans-serif\" font-weight=\"700\" font-size=\"16\" fill=\"#2B3F5C\">What are you thinking?</text></g></svg>", "alt": "窓辺で外を見る黒猫のクロ。「もしネコと話せたら…」", "passage": [{"who": "", "s": [["s1", "Have you ever wanted to talk with animals?"], ["s2", "I often do."], ["s3", "I have a cat named Kuro."], ["s4", "Sometimes he sits by the window and looks outside for a long time."], ["s5", "If I could talk with him, I would ask him what he is thinking."], ["s6", "I wish I knew his feelings."], ["s7", "If I were a cat, I would sleep in the sun all day!"], ["s8", "Of course, this is impossible."], ["s9", "But I have learned to understand Kuro in other ways."], ["s10", "When he is hungry, he cries loudly."], ["s11", "When he is happy, he closes his eyes slowly."], ["s12", "When he is angry, he moves his tail quickly."], ["s13", "Maybe we don't need words."], ["s14", "If you have a pet, watch it carefully."], ["s15", "You will understand more than you think."]]}], "trans": ["動物と話してみたいと思ったことはありますか。私はよく思います。私はクロという名前のネコを飼っています。クロはときどき窓のそばに座って、⻑い間外を見ています。もしクロと話せたら、何を考えているのか聞くのに。クロの気持ちがわかればいいのに。もし私がネコだったら、一日中ひなたで寝るのに！もちろん、そんなことは不可能です。でも私は、ほかの方法でクロのことを理解できるようになりました。おなかがすくと、大きな声で鳴きます。うれしいときは、ゆっくりと目を閉じます。怒っているときは、しっぽをすばやく動かします。言葉はいらないのかもしれません。ペットを飼っているなら、よく見てあげてください。思っている以上にわかるようになりますよ。"], "rq": [{"q": "What does Kuro sometimes do?", "qja": "クロはときどき何をしますか。", "opts": ["He sleeps in the sun all day.", "He talks with the writer.", "He goes out for a long walk.", "He sits by the window and looks outside."], "ans": 3, "ev": ["s4"]}, {"q": "What would the writer do if the writer were a cat?", "qja": "もし筆者がネコだったら、何をしますか。", "opts": ["Look outside all day.", "Talk with other cats.", "Sleep in the sun all day.", "Eat a lot of food."], "ans": 2, "ev": ["s7"]}, {"q": "What does Kuro do when he is happy?", "qja": "クロはうれしいとき何をしますか。", "opts": ["He closes his eyes slowly.", "He cries loudly.", "He moves his tail quickly.", "He sits by the window."], "ans": 0, "ev": ["s11"]}]}, {"id": "3-15", "lv": "3", "rev": false, "title": "My Graduation Speech", "ja": "卒業のスピーチ", "book": "Lesson 3-6", "words": 114, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"卒業式のスピーチ。吹奏楽部の金賞トロフィー。\"><rect width=\"960\" height=\"400\" fill=\"#F6EBDD\"/><rect y=\"0\" width=\"960\" height=\"40\" fill=\"#C0412F\"/><text x=\"480\" y=\"30\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"24\" fill= \" opacity=\".8\"/><circle cx=\"-8\" cy=\"-140\" r=\"5\" fill=\"#fff\" opacity=\".8\"/><circle cx=\"40\" cy=\"-70\" r=\"5\" fill=\"#fff\" opacity=\".8\"/></g><rect y=\"320\" width=\"960\" height=\"80\" fill=\"#B98556\"/><g><rect x=\"457.2\" y=\"254.6\" width=\"18\" height=\"75.4\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"484.8\" y=\"254.6\" width=\"18\" height=\"75.4\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"465.7\" cy=\"330\" rx=\"12.8\" ry=\"5.9\" fill=\"#3A3A3A\"/><ellipse cx=\"494.3\" cy=\"330\" rx=\"12.8\" ry=\"5.9\" fill=\"#3A3A3A\"/><line x1=\"456.6\" y1=\"212.7\" x2=\"442.6\" y2=\"273.9\" stroke=\"#2B3F5C\" stroke-width=\"12.8\" stroke-linecap=\"round\"/><circle cx=\"442.6\" cy=\"273.9\" r=\"7.9\" fill=\"#EBC09E\"/><line x1=\"503.4\" y1=\"212.7\" x2=\"517.4\" y2=\"273.9\" stroke=\"#2B3F5C\" stroke-width=\"12.8\" stroke-linecap=\"round\"/><circle cx=\"517.4\" cy=\"273.9\" r=\"7.9\" fill=\"#EBC09E\"/><path d=\"M 452.8 210.2 Q 452.8 204.2 460.8 204.2 L 499.2 204.2 Q 507.2 204.2 507.2 210.2 L 509.2 258.6 L 450.8 258.6 Z\" fill=\"#2B3F5C\"/><rect x=\"472.9\" y=\"197.6\" width=\"14.1\" height=\"13.3\" fill=\"#EBC09E\"/><circle cx=\"480\" cy=\"182.1\" r=\"22.1\" fill=\"#EBC09E\"/><path d=\"M 457 185.4 Q 454.6 155.6 480 158.2 Q 505.4 155.6 503 185.4 Q 495.5 171 482.2 172.2 Q 466.7 175.5 457 185.4 Z\" fill=\"#2A2320\"/><circle cx=\"471.6\" cy=\"184.8\" r=\"2.2\" fill=\"#2A2A2A\"/><circle cx=\"488.4\" cy=\"184.8\" r=\"2.2\" fill=\"#2A2A2A\"/><circle cx=\"468.3\" cy=\"191.4\" r=\"2.9\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"491.7\" cy=\"191.4\" r=\"2.9\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 474.5 192 Q 480 197.1 485.5 192\" stroke=\"#7A3B2E\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><g><path d=\"M420 400 L430 290 H530 L540 400 Z\" fill=\"#8B5E3C\"/><rect x=\"414\" y=\"278\" width=\"132\" height=\"14\" rx=\"3\" fill=\"#A87444\"/><circle cx=\"480\" cy=\"338\" r=\"18\" fill=\"#F6C343\"/></g><g transform=\"translate(680 300)\"><path d=\"M-30 -80 h60 q0 50 -30 60 q-30 -10 -30 -60z\" fill=\"#E5B53B\"/><rect x=\"-6\" y=\"-22\" width=\"12\" height=\"20\" fill=\"#E5B53B\"/><rect x=\"-24\" y=\"-4\" width=\"48\" height=\"10\" fill=\"#C99A2E\"/><path d=\"M-30 -70 q-20 0 -14 20 q4 10 16 8 M30 -70 q20 0 14 20 q-4 10 -16 8\" stroke=\"#E5B53B\" stroke-width=\"5\" fill=\"none\"/></g></svg>", "alt": "卒業式のスピーチ。吹奏楽部の金賞トロフィー。", "passage": [{"who": "", "s": [["s1", "Today, we are graduating from this school."], ["s2", "These three years have passed so quickly."], ["s3", "When I entered this school, I was shy and had few friends."], ["s4", "I didn't know what I wanted to do."], ["s5", "Then I joined the brass band."], ["s6", "It was the place where I found my best friends."], ["s7", "Our teacher, Mr. Ono, made us practice hard every day."], ["s8", "Sometimes I wanted to quit, but my friends always encouraged me."], ["s9", "Last summer, we won a gold prize at the contest."], ["s10", "I will never forget the moment when our school's name was called."], ["s11", "If I were a first-year student again, I would choose the same club."], ["s12", "Thank you, everyone, for these wonderful three years."]]}], "trans": ["今日、私たちはこの学校を卒業します。この3年間はあっという間に過ぎました。この学校に入学したとき、私は恥ずかしがり屋で、友達もほとんどいませんでした。自分が何をしたいのかもわかりませんでした。そのあと、私は吹奏楽部に入りました。そこは私が親友たちに出会った場所です。顧問のオノ先生は、毎日私たちにしっかり練習させました。ときどきやめたいと思いましたが、友達がいつも励ましてくれました。去年の夏、私たちはコンクールで金賞をとりました。私たちの学校の名前が呼ばれた瞬間は決して忘れません。もしもう一度1年生に戻れたとしても、私は同じ部を選ぶでしょう。みなさん、すばらしい3年間をありがとうございました。"], "rq": [{"q": "What was the writer like when entering the school?", "qja": "入学したとき、筆者はどんな様子でしたか。", "opts": ["Popular, with many friends.", "A member of the brass band.", "Sure about what to do.", "Shy, with few friends."], "ans": 3, "ev": ["s3"]}, {"q": "What happened last summer?", "qja": "去年の夏、何がありましたか。", "opts": ["The writer quit the brass band.", "The brass band won a gold prize.", "Mr. Ono left the school.", "The writer entered the school."], "ans": 1, "ev": ["s9"]}, {"q": "What would the writer do as a first-year student again?", "qja": "もう一度1年生に戻れたら、筆者はどうしますか。", "opts": ["Join a different club.", "Choose the same club.", "Study harder than before.", "Make more friends in class."], "ans": 1, "ev": ["s11"]}]}, {"id": "3-R1", "lv": "3", "rev": true, "title": "The Girl Who Planted Trees", "ja": "木を植えた少女", "book": "Lesson 3-1〜3-6（総復習）", "words": 200, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"乾いた村に木を植え続けたアマラ。今では緑の村に。\"><defs><linearGradient id=\"g3r1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g3r1)\"/><path d=\"M0 270 H480 V400 H0Z\" fill=\"#D9B07A\"/><path d=\"M480 270 H960 V400 H480Z\" fill=\"#8FC27A\"/><g transform=\"translate(160 330) scale(0.55)\"><rect x=\"-9\" y=\"-70\" width=\"18\" height=\"70\" fill=\"#8B5E3C\"/><circle cx=\"0\" cy=\"-110\" r=\"46\" fill=\"#6DB36D\"/><circle cx=\"-34\" cy=\"-84\" r=\"32\" fill=\"#6DB36D\"/><circle cx=\"34\" cy=\"-84\" r=\"32\" fill=\"#6DB36D\"/></g><g><rect x=\"299.8\" y=\"323\" width=\"16\" height=\"67\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"324.2\" y=\"323\" width=\"16\" height=\"67\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"307.3\" cy=\"390\" rx=\"11.2\" ry=\"5.2\" fill=\"#3A3A3A\"/><ellipse cx=\"332.7\" cy=\"390\" rx=\"11.2\" ry=\"5.2\" fill=\"#3A3A3A\"/><line x1=\"299.4\" y1=\"286.5\" x2=\"287\" y2=\"340.5\" stroke=\"#F6C343\" stroke-width=\"11.2\" stroke-linecap=\"round\"/><circle cx=\"287\" cy=\"340.5\" r=\"7\" fill=\"#8D5A3B\"/><line x1=\"340.6\" y1=\"286.5\" x2=\"373.7\" y2=\"310.8\" stroke=\"#F6C343\" stroke-width=\"11.2\" stroke-linecap=\"round\"/><circle cx=\"373.7\" cy=\"310.8\" r=\"7\" fill=\"#8D5A3B\"/><path d=\"M 296 285 Q 296 279 304 279 L 336 279 Q 344 279 344 285 L 346 327 L 294 327 Z\" fill=\"#F6C343\"/><rect x=\"313.8\" y=\"273.1\" width=\"12.5\" height=\"11.7\" fill=\"#8D5A3B\"/><circle cx=\"320\" cy=\"259.5\ \"><ellipse cx=\"0\" cy=\"0\" rx=\"16\" ry=\"12\" fill=\"#5FB4E0\"/><circle cx=\"12\" cy=\"-8\" r=\"8\" fill=\"#5FB4E0\"/><path d=\"M19 -9 l8 2 l-8 3z\" fill=\"#F6C343\"/><circle cx=\"14\" cy=\"-10\" r=\"1.8\" fill=\"#222\"/><path d=\"M-4 -4 q-10 -14 -20 -2 q8 4 20 2z\" fill=\"#fff\" opacity=\".5\"/></g><g transform=\"translate(760 120) scale(1)\"><ellipse cx=\"0\" cy=\"0\" rx=\"16\" ry=\"12\" fill=\"#E07A5F\"/><circle cx=\"12\" cy=\"-8\" r=\"8\" fill=\"#E07A5F\"/><path d=\"M19 -9 l8 2 l-8 3z\" fill=\"#F6C343\"/><circle cx=\"14\" cy=\"-10\" r=\"1.8\" fill=\"#222\"/><path d=\"M-4 -4 q-10 -14 -20 -2 q8 4 20 2z\" fill=\"#fff\" opacity=\".5\"/></g><line x1=\"480\" y1=\"0\" x2=\"480\" y2=\"400\" stroke=\"#fff\" stroke-width=\"5\" stroke-dasharray=\"12 10\"/><text x=\"240\" y=\"50\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"26\" fill=\"#2B3F5C\">10 years ago</text><text x=\"720\" y=\"50\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"26\" fill=\"#2B3F5C\">Now</text></svg>", "alt": "乾いた村に木を植え続けたアマラ。今では緑の村に。", "passage": [{"who": "", "s": [["s1", "Ten years ago, there was a small village where few trees grew."], ["s2", "The land was dry, and the people who lived there often had trouble getting water."], ["s3", "A girl named Amara wanted to change this."], ["s4", "When she was twelve, she planted her first tree near her house."], ["s5", "Many people laughed at her."], ["s6", "\"One tree won't change anything,\" they said."], ["s7", "But Amara didn't give up."], ["s8", "Every morning, she carried water from a river which was two kilometers away."], ["s9", "It was hard work."], ["s10", "Little by little, the tree grew bigger."], ["s11", "Then she asked her friends to help her, and they planted more trees together."], ["s12", "Even some of the people who laughed at her joined them."], ["s13", "Since then, more than five thousand trees have been planted in the village."], ["s14", "The trees have brought shade, birds, and even more rain."], ["s15", "Now the village is a green place that many visitors come to see."], ["s16", "Amara is twenty-two years old now, and she teaches children how to take care of trees."], ["s17", "She often says, \"Big changes start with small actions. If everyone planted one tree, the world would be much greener.\""], ["s18", "I have learned from her story that one person's effort can make a big difference."]]}], "trans": ["10年前、木がほとんど育たない小さな村がありました。土地は乾いていて、そこに住む人々はよく水を手に入れるのに苦労していました。アマラという少女はこれを変えたいと思いました。12歳のとき、彼女は家の近くに最初の木を植えました。多くの人が彼女を笑いました。「木を1本植えたって何も変わらないよ」と言いました。でもアマラはあきらめませんでした。毎朝、2キロ離れた川から水を運びました。大変な仕事でした。少しずつ、木は大きくなりました。それから彼女は友達に手伝いを頼み、一緒にさらに木を植えました。彼女を笑っていた人の中にも、加わる人がいました。それ以来、村には5,000本以上の木が植えられてきました。木は日かげや鳥、さらに多くの雨までもたらしました。今では村は多くの観光客が見に来る緑豊かな場所です。アマラは今22歳で、子どもたちに木の世話のしかたを教えています。彼女はよく「大きな変化は小さな行動から始まります。もしみんなが1本ずつ木を植えたら、世界はずっと緑になるでしょう」と言います。私は彼女の話から、1人の努力が大きな違いを生むことを学びました。"], "rq": [{"q": "Why did many people laugh at Amara?", "qja": "なぜ多くの人がアマラを笑ったのですか。", "opts": ["They thought one tree would not change anything.", "She planted the tree in the wrong place.", "She was too young to carry water.", "Her tree was very small and ugly."], "ans": 0, "ev": ["s6"]}, {"q": "How many trees have been planted in the village?", "qja": "村には何本の木が植えられてきましたか。", "opts": ["About two thousand.", "About five hundred.", "More than five thousand.", "Twenty-two."], "ans": 2, "ev": ["s13"]}, {"q": "What does Amara do now?", "qja": "アマラは今何をしていますか。", "opts": ["She sells trees to visitors.", "She teaches children how to take care of trees.", "She carries water for the village every day.", "She studies in a big city."], "ans": 1, "ev": ["s16"]}]}, {"id": "3-R2", "lv": "3", "rev": true, "title": "An Interview with Our ALT", "ja": "ALTの先生へのインタビュー", "book": "Lesson 3-1〜3-6（総復習）", "words": 205, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"学校新聞のインタビュー：オーストラリア出身のALT、カーター先生。\"> "#fff\" stroke=\"#ccc\"/><g><path d=\"M 745.4 232.8 Q 742.7 285.1 760.9 280.5 L 779.1 280.5 Q 797.3 285.1 794.6 232.8 Z\" fill=\"#E2B85C\"/><rect x=\"752.1\" y=\"311.5\" width=\"17.5\" height=\"73.5\" fill=\"#FBE0CB\"/><rect x=\"770.4\" y=\"311.5\" width=\"17.5\" height=\"73.5\" fill=\"#FBE0CB\"/><path d=\"M 742 305.5 L 798 305.5 L 808.1 341.2 L 731.9 341.2 Z\" fill=\"#2B3F5C\"/><ellipse cx=\"755.2\" cy=\"385\" rx=\"13.1\" ry=\"6.1\" fill=\"#3A3A3A\"/><ellipse cx=\"784.8\" cy=\"385\" rx=\"13.1\" ry=\"6.1\" fill=\"#3A3A3A\"/><line x1=\"745.9\" y1=\"264.2\" x2=\"731.5\" y2=\"327.2\" stroke=\"#6DB36D\" stroke-width=\"13.1\" stroke-linecap=\"round\"/><circle cx=\"731.5\" cy=\"327.2\" r=\"8.1\" fill=\"#FBE0CB\"/><line x1=\"794.1\" y1=\"264.2\" x2=\"833\" y2=\"217\" stroke=\"#6DB36D\" stroke-width=\"13.1\" stroke-linecap=\"round\"/><circle cx=\"833\" cy=\"217\" r=\"8.1\" fill=\"#FBE0CB\"/><path d=\"M 742 261.5 Q 742 255.5 750 255.5 L 790 255.5 Q 798 255.5 798 261.5 L 800 311.5 L 740 311.5 Z\" fill=\"#6DB36D\"/><rect x=\"762.7\" y=\"248.7\" width=\"14.6\" height=\"13.7\" fill=\"#FBE0CB\"/><circle cx=\"770\" cy=\"232.8\" r=\"22.8\" fill=\"#FBE0CB\"/><path d=\"M 746.3 236.2 Q 743.8 205.4 770 208.2 Q 796.2 205.4 793.7 236.2 Q 785.9 221.4 772.3 222.5 Q 756.4 225.9 746.3 236.2 Z\" fill=\"#E2B85C\"/><circle cx=\"761.4\" cy=\"235.5\" r=\"2.3\" fill=\"#2A2A2A\"/><circle cx=\"778.6\" cy=\"235.5\" r=\"2.3\" fill=\"#2A2A2A\"/><circle cx=\"757.9\" cy=\"242.3\" r=\"3\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"782.1\" cy=\"242.3\" r=\"3\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 764.3 243 Q 770 248.2 775.7 243\" stroke=\"#7A3B2E\" stroke-width=\"2\" fill=\"none\" stroke-linecap=\"round\"/></g><g><rect x=\"360\" y=\"40\" width=\"240\" height=\"70\" rx=\"16\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"2.5\"/><path d=\"M374 109 L370 130 L394 109\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"2.5\" stroke-linejoin=\"round\"/><rect x=\"375\" y=\"106\" width=\"18\" height=\"6\" fill=\"#fff\"/><text x=\"480.0\" y=\"85.8\" text-anchor=\"middle\" font-family=\"Arial Rounded MT Bold,Verdana,sans-serif\" font-weight=\"700\" font-size=\"30\" fill=\"#2B3F5C\">Q & A</text></g><g transform=\"translate(480 280)\"><circle r=\"40\" fill=\"#F5D4A0\"/><path d=\"M-30 -6 q30 -16 60 0\" stroke=\"#7A4E2D\" stroke-width=\"5\" fill=\"none\"/><path d=\"M-28 6 q28 -10 56 0\" stroke=\"#6DB36D\" stroke-width=\"4\" fill=\"none\"/></g><text x=\"480\" y=\"180\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"30\" fill=\"#C0412F\">漢字 500</text></svg>", "alt": "学校新聞のインタビュー：オーストラリア出身のALT、カーター先生。", "passage": [{"who": "", "s": [["s1", "Our school newspaper interviewed Ms. Olivia Carter, an ALT from Australia who has taught at our school for three years."]]}, {"who": "Q", "s": [["s2", "How long have you lived in Japan?"]]}, {"who": "A", "s": [["s3", "For five years."], ["s4", "Before I came to our school, I taught in Osaka for two years."]]}, {"who": "Q", "s": [["s5", "What surprised you when you came to Japan?"]]}, {"who": "A", "s": [["s6", "I was surprised that students clean their own classrooms."], ["s7", "In Australia, that is usually done by cleaning staff."], ["s8", "I think it's a great idea because it teaches students to take care of their school."]]}, {"who": "Q", "s": [["s9", "Was it difficult for you to learn Japanese?"]]}, {"who": "A", "s": [["s10", "Yes!"], ["s11", "At first, I didn't know how to read kanji at all."], ["s12", "I have studied them every day, and now I can read about five hundred."]]}, {"who": "Q", "s": [["s13", "What do you like the most about our town?"]]}, {"who": "A", "s": [["s14", "The people who live here are very friendly."], ["s15", "When I got lost on my first day, a woman I didn't know walked with me to the station."]]}, {"who": "Q", "s": [["s16", "What is your favorite Japanese food?"]]}, {"who": "A", "s": [["s17", "Okonomiyaki!"], ["s18", "I have made it at home many times."]]}, {"who": "Q", "s": [["s19", "Do you have a message for students?"]]}, {"who": "A", "s": [["s20", "Don't be afraid of making mistakes."], ["s21", "Mistakes are the best teachers that I have ever had!"]]}], "trans": ["学校新聞では、オーストラリア出身で、この学校で3年間教えているALTのオリビア・カーター先生にインタビューしました。問：日本に住んでどのくらいになりますか。答：5年です。この学校に来る前は、大阪で2年間教えていました。問：日本に来て何に驚きましたか。答：生徒が自分たちで教室をそうじすることに驚きました。オーストラリアでは、ふつうそれは清掃員の仕事です。生徒に学校を大切にすることを教えるので、すばらしい考えだと思います。問：日本語を学ぶのは難しかったですか。答：はい！最初は漢字がまったく読めませんでした。毎日勉強してきて、今では500字ほど読めます。問：私たちの町で一番好きなところは何ですか。答：ここに住んでいる人がとても親切なところです。最初の日に道に迷ったとき、知らない女の人が駅まで一緒に歩いてくれました。問：好きな日本の食べ物は何ですか。答：お好み焼きです！家で何度も作ったことがあります。問：生徒にメッセージはありますか。答：間違えることをおそれないでください。間違いは、私にとってこれまでで最高の先生なのです！"], "rq": [{"q": "How long has Ms. Carter lived in Japan?", "qja": "カーター先生は日本に住んでどのくらいになりますか。", "opts": ["For three years.", "For two years.", "For one year.", "For five years."], "ans": 3, "ev": ["s2", "s3"]}, {"q": "What surprised Ms. Carter when she came to Japan?", "qja": "カーター先生は日本に来て何に驚きましたか。", "opts": ["Students eat lunch in the classroom.", "Students wear uniforms.", "Students clean their own classrooms.", "Students study kanji every day."], "ans": 2, "ev": ["s6"]}, {"q": "How many kanji can Ms. Carter read now?", "qja": "カーター先生は今、漢字を何字くらい読めますか。", "opts": ["About five hundred.", "About fifty.", "About five thousand.", "None."], "ans": 0, "ev": ["s12"]}]}, {"id": "3-R3", "lv": "3", "rev": true, "title": "Smartphones: Good or Bad?", "ja": "スマートフォンは良いもの？悪いもの？", "book": "Lesson 3-1〜3-6（総復習）", "words": 201, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"スマートフォンは良いもの？悪いもの？ 便利な点と使いすぎの問題。\"><rect width=\"480\" height=\"400\" fill=\"#E3F1EA\"/><rect x=\"480\" width=\"480\" height=\"400\" fill=\"#F9E3DF\"/><text x=\"240\" y=\"50\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"34\" fill=\"#3E8A6A\">Good</text><text x=\"720\" y=\"50\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font erdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"28\" fill=\"#2B3F5C\">ABC</text><text x=\"370\" y=\"200\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"20\" fill=\"#2B3F5C\">app</text><rect x=\"540\" y=\"250\" width=\"280\" height=\"80\" rx=\"10\" fill=\"#9DB4CF\"/><circle cx=\"600\" cy=\"245\" r=\"26\" fill=\"#F6D3B8\"/><path d=\"M574 240 Q600 215 626 240\" fill=\"#2A2320\"/><g transform=\"translate(680 260) scale(0.6)\"><rect x=\"-18\" y=\"-34\" width=\"36\" height=\"66\" rx=\"7\" fill=\"#2B3F5C\"/><rect x=\"-14\" y=\"-28\" width=\"28\" height=\"50\" rx=\"3\" fill=\"#BFDDF2\"/><circle cx=\"0\" cy=\"27\" r=\"2.5\" fill=\"#fff\"/></g><circle cx=\"880\" cy=\"90\" r=\"30\" fill=\"#F7E7A6\"/><circle cx=\"894\" cy=\"82\" r=\"26\" fill=\"#22314F\"/><text x=\"860\" y=\"170\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"30\" fill=\"#7F8A9C\">Zzz</text><g><circle cx=\"760\" cy=\"140\" r=\"34\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"4\"/><line x1=\"760\" y1=\"140\" x2=\"764.4\" y2=\"123.6\" stroke=\"#2B3F5C\" stroke-width=\"4\" stroke-linecap=\"round\"/><line x1=\"760\" y1=\"140\" x2=\"760.0\" y2=\"166.5\" stroke=\"#2B3F5C\" stroke-width=\"3\" stroke-linecap=\"round\"/></g><line x1=\"480\" y1=\"0\" x2=\"480\" y2=\"400\" stroke=\"#fff\" stroke-width=\"6\"/></svg>", "alt": "スマートフォンは良いもの？悪いもの？ 便利な点と使いすぎの問題。", "passage": [{"who": "", "s": [["s1", "Many junior high school students in Japan have smartphones."], ["s2", "Some people say that smartphones are useful, but others think that they are bad for young people."], ["s3", "Which do you agree with?"], ["s4", "There are good points."], ["s5", "With a smartphone, we can contact our families anytime."], ["s6", "This is helpful when something happens."], ["s7", "We can also find information quickly and use apps that help us study."], ["s8", "For example, I have used an English app every day for a year, and I have learned many new words."], ["s9", "However, there are also bad points."], ["s10", "A survey says that many students use their smartphones for more than three hours a day."], ["s11", "If we spend too much time on them, we will have little time for sleeping and studying."], ["s12", "Some students are too tired to listen carefully in class."], ["s13", "Others find it hard to stop playing games at night."], ["s14", "In my opinion, smartphones themselves are not bad."], ["s15", "What is important is how we use them."], ["s16", "It is necessary for us to make our own rules."], ["s17", "In my family, nobody uses a phone during dinner, and I stop using mine at ten o'clock at night."], ["s18", "If we use smartphones wisely, they will be a great tool for our lives."]]}], "trans": ["日本の中学生の多くがスマートフォンを持っています。スマートフォンは役に立つと言う人もいれば、若い人にとって良くないと考える人もいます。あなたはどちらに賛成しますか。良い点があります。スマートフォンがあれば、いつでも家族と連絡がとれます。何かあったときに役に立ちます。また、すばやく情報を見つけたり、勉強に役立つアプリを使ったりすることもできます。たとえば、私は1年間毎日英語のアプリを使ってきて、新しい単語をたくさん覚えました。しかし、悪い点もあります。ある調査によると、多くの生徒が1日に3時間以上スマートフォンを使っています。スマートフォンに時間を使いすぎると、寝る時間や勉強する時間がほとんどなくなってしまいます。疲れすぎて授業をしっかり聞けない生徒もいます。夜にゲームをやめるのが難しいと感じる生徒もいます。私の意見では、スマートフォンそのものが悪いわけではありません。大切なのは、それをどう使うかです。私たちは自分でルールを作る必要があります。私の家では、夕食の間はだれもスマートフォンを使いませんし、私は夜10時になったら使うのをやめます。スマートフォンを賢く使えば、生活のためのすばらしい道具になるでしょう。"], "rq": [{"q": "What has the writer done every day for a year?", "qja": "筆者は1年間毎日何をしてきましたか。", "opts": ["Read the news on a smartphone.", "Called the writer's family.", "Made rules for the family.", "Used an English app."], "ans": 3, "ev": ["s8"]}, {"q": "What may happen if students spend too much time on smartphones?", "qja": "生徒がスマートフォンに時間を使いすぎると、何が起こるかもしれませんか。", "opts": ["They will learn more English words.", "They will have little time for sleeping and studying.", "They will contact their families more.", "They will get better grades."], "ans": 1, "ev": ["s11"]}, {"q": "What is the writer's opinion?", "qja": "筆者の意見はどれですか。", "opts": ["Junior high school students should not have smartphones.", " circle cx=\"560\" cy=\"313\" r=\"13\" fill=\"#F2C7A5\"/><path d=\"M 546.5 314.9 Q 545 297.4 560 299 Q 575 297.4 573.5 314.9 Q 569.1 306.5 561.3 307.1 Q 552.2 309.1 546.5 314.9 Z\" fill=\"#6B4226\"/><circle cx=\"555.1\" cy=\"314.6\" r=\"1.3\" fill=\"#2A2A2A\"/><circle cx=\"564.9\" cy=\"314.6\" r=\"1.3\" fill=\"#2A2A2A\"/><circle cx=\"553.1\" cy=\"318.5\" r=\"1.7\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"566.9\" cy=\"318.5\" r=\"1.7\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 556.8 318.9 Q 560 321.8 563.2 318.9\" stroke=\"#7A3B2E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/></g><g><rect x=\"627.2\" y=\"356.1\" width=\"10.5\" height=\"43.9\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"642.3\" y=\"356.1\" width=\"10.5\" height=\"43.9\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"632\" cy=\"400\" rx=\"7.1\" ry=\"3.3\" fill=\"#3A3A3A\"/><ellipse cx=\"648\" cy=\"400\" rx=\"7.1\" ry=\"3.3\" fill=\"#3A3A3A\"/><line x1=\"626.9\" y1=\"334.5\" x2=\"619.1\" y2=\"368.7\" stroke=\"#5FB4E0\" stroke-width=\"7.1\" stroke-linecap=\"round\"/><circle cx=\"619.1\" cy=\"368.7\" r=\"4.4\" fill=\"#F6D3B8\"/><line x1=\"653.1\" y1=\"334.5\" x2=\"660.9\" y2=\"368.7\" stroke=\"#5FB4E0\" stroke-width=\"7.1\" stroke-linecap=\"round\"/><circle cx=\"660.9\" cy=\"368.7\" r=\"4.4\" fill=\"#F6D3B8\"/><path d=\"M 624.8 335.7 Q 624.8 329.7 632.8 329.7 L 647.2 329.7 Q 655.2 329.7 655.2 335.7 L 657.2 360.1 L 622.8 360.1 Z\" fill=\"#5FB4E0\"/><rect x=\"636\" y=\"326\" width=\"7.9\" height=\"7.4\" fill=\"#F6D3B8\"/><circle cx=\"640\" cy=\"317.4\" r=\"12.3\" fill=\"#F6D3B8\"/><path d=\"M 627.2 319.2 Q 625.8 302.5 640 304 Q 654.2 302.5 652.8 319.2 Q 648.6 311.2 641.2 311.8 Q 632.6 313.6 627.2 319.2 Z\" fill=\"#2A2320\"/><circle cx=\"640\" cy=\"303.8\" r=\"5.2\" fill=\"#2A2320\"/><circle cx=\"635.3\" cy=\"318.8\" r=\"1.2\" fill=\"#2A2A2A\"/><circle cx=\"644.7\" cy=\"318.8\" r=\"1.2\" fill=\"#2A2A2A\"/><circle cx=\"633.5\" cy=\"322.5\" r=\"1.6\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"646.5\" cy=\"322.5\" r=\"1.6\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 636.9 322.9 Q 640 325.7 643.1 322.9\" stroke=\"#7A3B2E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>", "alt": "祖父の本屋さん。日曜日の子ども向け読み聞かせ会。", "passage": [{"who": "", "s": [["s1", "My grandfather runs a small bookstore in the town where he was born."], ["s2", "He has worked there for fifty years."], ["s3", "When I was little, the store was the place where I spent every Saturday afternoon."], ["s4", "He let me read any book I liked, and he often told me stories about the writers."], ["s5", "These days, fewer people come to his store."], ["s6", "Many people buy books on the Internet, and some people read them on their phones."], ["s7", "Last year, my grandfather told me that he was thinking of closing the store."], ["s8", "I was shocked, and I wanted to do something to help him."], ["s9", "So my friends and I made a website for the store and started a reading event for children every Sunday."], ["s10", "We asked my grandfather to read picture books to them."], ["s11", "At first, only three children came."], ["s12", "Now more than twenty children come every week, and their parents often buy books."], ["s13", "My grandfather looks happier than before."], ["s14", "He said to me, \"You have given my store a new life.\""], ["s15", "I don't know what will happen in the future, but I want to keep this place where people can meet books."]]}], "trans": ["祖父は、自分が生まれた町で小さな本屋を営んでいます。そこで50年間働いてきました。私が小さかったころ、その店は私が毎週土曜日の午後を過ごす場所でした。祖父は好きな本を何でも読ませてくれて、よく作家たちの話をしてくれました。最近、祖父の店に来る人は減ってきています。多くの人がインターネットで本を買い、スマートフォンで本を読む人もいます。去年、祖父は店を閉めようかと考えていると私に話しました。私はショックを受け、祖父を助けるために何かしたいと思いました。そこで友達と一緒に店のウェブサイトを作り、毎週日曜日に子ども向けの読み聞かせ会を始めました。祖父に子どもたちへ絵本を読んでくれるよう頼みました。最初は3人しか来ませんでした。今では毎週20人以上の子どもが来て、その親たちもよく本を買ってくれます。祖父は以前より幸せそうに見えます。祖父は私に「おまえたちが店に新しい命をくれたよ」と言いました。将来どうなるかはわかりませんが、人々が本と出会えるこの場所を守りたいと思います。"], "rq": [{"q": "How long has the grandfather worked at the bookstore?", "qja": "祖父はどのくらいの間本屋で働いてきましたか。", "opts": ["For fifteen years.", "For twenty years.", "Since last year.", "For fifty years."], "ans": 3, "ev": ["s2"]}, {"q": "Why do fewer people come to the store these days?", "qja": "最近、店に来る人が減っているのはなぜですか。", "opts": ["Many people buy books on the Internet or read on their phones.", "The store is too far from the station.", "The grandfather closes the store on Sundays.", "The books in the store are too expensive."], "ans": 0, "ev": ["s6"]}, {"q": "What did the writer and friends start?", "qja": "筆者と友達は何を始めましたか。", "opts": ["A new bookstore near the station.", "A book club for their parents.", "A reading event for children every Sunday.", "A school library."], "ans": 2, "ev": ["s9"]}]}, {"id": "3-R5", "lv": "3", "rev": true, "title": "A Letter to My Future Self", "ja": "10年後の自分への手紙", "book": "Lesson 3-1〜3-6（総復習）", "words": 202, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"10年後の自分への手紙。看護師になる夢。\"><rect width=\"960\" height=\"310\" fill=\"#FDF4EA\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#C9A77E\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><rect x=\"80\" y=\"40\" width=\"200\" height=\"140\" rx=\"6\" fill=\"#fff\"/><rect x=\"88\" y=\"48\" width=\"184\" height=\"124\" fill=\"#2C3E66\"/><rect x=\"177.0\" y=\"48\" width=\"6\" height=\"124\" fill=\"#fff\"/><rect x=\"88\" y=\"107.0\" width=\"184\" height=\"6\" fill=\"#fff\"/><circle cx=\"200\" cy=\"90\" r=\"30\" fill=\"#F7E7A6\"/><circle cx=\"214\" cy=\"82\" r=\"26\" fill=\"#22314F\"/><g><rect x=\"330\" y=\"300\" width=\"320\" height=\"16\" rx=\"3\" fill=\"#C99A6B\"/><rect x=\"340\" y=\"316\" width=\"12\" height=\"84\" fill=\"#9C7450\"/><rect x=\"628\" y=\"316\" width=\"12\" height=\"84\" fill=\"#9C7450\"/></g><g><path d=\"M 466.8 236.4 Q 464.3 285.8 481.4 281.5 L 498.6 281.5 Q 515.7 285.8 513.2 236.4 Z\" fill=\"#2A2320\"/><rect x=\"467.8\" y=\"306.7\" width=\"17.5\" height=\"73.3\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=
