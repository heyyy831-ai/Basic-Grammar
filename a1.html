other was in the hospital three years ago."], ["s6", "The nurses who took care of her were always kind, and they made her smile even when she was in pain."], ["s7", "I want to be a person like them."], ["s8", "I hope you have become a nurse who makes people smile."], ["s9", "Right now, I am studying hard for my high school entrance exam."], ["s10", "Sometimes I feel tired, and I wish I had more time to play."], ["s11", "If I were a bird, I would fly away from my desk!"], ["s12", "But I know that this effort will help you in the future."], ["s13", "Please remember the friends who supported me in junior high school."], ["s14", "We laughed and cried together."], ["s15", "I hope you are still close to Yuna and Mio."], ["s16", "Also, please don't forget to call Grandma often."], ["s17", "Finally, I want to ask you one thing."], ["s18", "Are you happy?"], ["s19", "If you are, I will be proud of you."], ["s20", "Love, Me at Fifteen"]]}], "trans": ["10年後の私へ。元気ですか。私は今15歳で、卒業式の前日にこの手紙を書いています。あなたがどこに住んで、何をしているのかなと思っています。看護師として働いていますか。それは3年前に祖母が入院してからの私の夢です。祖母の世話をしてくれた看護師さんたちはいつも優しく、祖母が痛みに苦しんでいるときでも笑顔にしてくれました。私も彼女たちのような人になりたいです。人を笑顔にする看護師になっているといいな。今、私は高校入試に向けて一生懸命勉強しています。ときどき疲れて、もっと遊ぶ時間があればいいのにと思います。もし私が鳥だったら、机から飛んで逃げるのに！でも、この努力が将来のあなたの役に立つことはわかっています。中学校で私を支えてくれた友達のことを覚えていてください。一緒に笑って、泣いたね。今もユナやミオと仲良くしているといいな。それから、おばあちゃんにはよく電話するのを忘れないでね。最後に、1つだけ聞きたいことがあります。あなたは幸せですか。もしそうなら、私はあなたを誇りに思います。15歳の私より"], "rq": [{"q": "When is the writer writing this letter?", "qja": "筆者はいつこの手紙を書いていますか。", "opts": ["On the day before graduation.", "On the day of the entrance exam.", "On the writer's birthday.", "Three years after graduation."], "ans": 0, "ev": ["s2"]}, {"q": "Why does the writer want to be a nurse?", "qja": "筆者はなぜ看護師になりたいのですか。", "opts": ["Because the writer's mother is a nurse.", "Because the writer was in the hospital.", "Because the nurses who took care of the grandmother were kind.", "Because Yuna and Mio want to be nurses."], "ans": 2, "ev": ["s6"]}, {"q": "What does the writer ask the future self at the end?", "qja": "筆者は最後に未来の自分に何をたずねていますか。", "opts": ["Where the future self lives.", "Whether the future self is happy.", "Whether the future self passed the exam.", "What the future self ate for dinner."], "ans": 1, "ev": ["s17", "s18"]}]}];

const KEYS = ["A", "B", "C", "D"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/"/g, "&quot;");
const STATE = {};
let L = null, LV = null;

/* ===== レッスンのタブ ===== */
let barKey = null;
function drawBar(){
  const key = L.lv + (L.rev ? "R" : "N");
  if (barKey === key) return; barKey = key;
  const inLv = LESSONS.filter(l => l.lv === L.lv), hasRev = inLv.some(l => l.rev);
  $("chapbar").innerHTML = hasRev ? '<span class="lbl2">PART</span>' +
    [[false, "本編 15本"], [true, "総復習 5本"]].map(([r, t]) => '<button class="ctab" type="button" data-rev="' + r + '" aria-pressed="' + (r === L.rev) + '">' + t + '</button>').join("") : "";
  $("chapbar").hidden = !hasRev;
  $("partbar").innerHTML = inLv.filter(l => l.rev === L.rev).map(l =>
    '<button class="ptab" type="button" role="tab" data-id="' + l.id + '" aria-selected="false"><b>' + l.id + '</b><span>' + esc(l.title) + '</span></button>').join("");
}
$("chapbar").addEventListener("click", e => {
  const b = e.target.closest(".ctab"); if (!b) return;
  const r = b.dataset.rev === "true"; if (r === L.rev) return;
  show(LESSONS.find(l => l.lv === L.lv && l.rev === r).id, true);
});
$("partbar").addEventListener("click", e => { const b = e.target.closest(".ptab"); if (b) show(b.dataset.id, true); });

/* ===== 画面の組み立て ===== */
function paraHTML(pi, prefix){
  const p = L.passage[pi];
  return '<div class="' + (prefix ? "rp-para" : "para") + (p.who ? " dl" : "") + '" data-p="' + pi + '">' +
    (p.who ? '<span class="who">' + p.who + '</span>' : (L.passage.length > 1 && !L.passage.some(x => x.who) ? '<span class="pno">' + (pi + 1) + '</span>' : "")) +
    '<p>' + p.s.map(([id, t]) => '<span class="s" id="' + prefix + id + '">' + t + '</span>').join(" ") + '</p></div>';
}
const passHTML = prefix => L.passage.map((_, i) => paraHTML(i, prefix)).join("");
function render(){
  const V = LVINFO[L.lv];
  $("lvGrade").textContent = V.grade; $("lvEiken").textContent = V.eiken + "レベル";
  $("mastSub").textContent = V.grade + "（" + V.eiken + "レベル）・" + V.words + (L.rev ? "　総復習は長めの文章です" : "");
  $("main").innerHTML = `
<header>
  <div class="kicker">
    <span class="badge"><small>${L.rev ? "REVIEW" : "LESSON"}</small><b>${L.id}</b></span>
    <span class="tag t1">本の対応：${L.book}</span>
    <span class="tag t2">${L.words}語</span>
  </div>
  <h1>${L.title}</h1>
  <p class="sub">${L.ja}</p>
</header>
<div class="illus-wrap" role="img" aria-label="${esc(L.alt)}">${L.svg}</div>

<section id="reading">
  <div class="sec-h"><span class="ic" style="background:var(--navy)">R</span><h2>Reading</h2></div>
  <div class="card">
    <p class="lead" style="margin:0 0 4px">まず辞書を使わずに最後まで読み、だいたいの内容をつかみましょう。</p>
    <div id="passage">${passHTML("")}</div>
  </div>
</section>

<section id="trans">
  <div class="sec-h"><span class="ic" style="background:var(--green)">訳</span><h2>全訳</h2><span class="note">まず自分で読んでから開きましょう</span></div>
  <details class="tr">
    <summary>${L.ja}</summary>
    <div class="tr-body">${L.trans.map(p => "<p>" + p + "</p>").join("")}</div>
  </details>
</section>

<section id="rquiz" class="wide">
  <div class="sec-h"><span class="ic" style="background:var(--green)">RQ</span><h2>読解クイズ</h2><span class="note">${V.eiken}レベル・4択</span></div>
  <div class="card">
    <div class="toggle-row">
      <span class="lead" style="margin:0">本文を読みながら、最も適切なものを選んでください。答えると、根拠になる文が本文の中で黄色く光ります。</span>
      <button class="switch" id="jaSwitch" type="button" aria-pressed="true"><span class="knob"></span>問題文の日本語訳</button>
    </div>
    <div class="rq-grid">
      <aside class="rq-pass" id="rqPass" aria-label="本文"><p class="rp-h">PASSAGE</p>${passHTML("p-")}</aside>
      <div class="rq-main">
        <div id="rqlist"></div>
        <div class="rscore"><span class="score">正解 <b id="rScore">0</b> / ${L.rq.length}</span><button class="btn" id="rReset" type="button">やり直す</button></div>
      </div>
    </div>
  </div>
</section>
${nextHTML()}`;
  $("foot").textContent = L.id + " — " + L.title;
  document.title = "A1 " + L.id + "｜" + L.title;
  renderRQ(); restore(); onScroll();
}
function nextHTML(){
  const i = LESSONS.indexOf(L), n = LESSONS[i + 1];
  return n && n.lv === L.lv ? '<div class="nextpart"><button class="btn primary" type="button" data-goto="' + n.id + '">次へ：' + n.id + ' ' + esc(n.title) + ' →</button></div>' : "";
}

/* ===== 読解クイズ ===== */
let curQ = -1, jaOn = true;
function renderRQ(){
  $("rqlist").innerHTML = L.rq.map((q, i) =>
    '<div class="rq" id="rq' + i + '" data-q="' + i + '"><div class="qh"><span class="qn">Q' + (i + 1) + '</span><div><p class="qtext">' + q.q + '</p><p class="qja">' + q.qja + '</p></div></div>' +
    '<details class="rq-ctx"><summary>本文を見る</summary>' + passHTML("m" + i + "-") + '</details>' +
    '<ul class="opts">' + q.opts.map((o, j) => '<li><button type="button" class="opt" data-q="' + i + '" data-j="' + j + '"><span class="k">' + KEYS[j] + '</span><span>' + o + '</span></button></li>').join("") + '</ul>' +
    '<div class="fb" id="fb' + i + '" hidden></div></div>').join("");
  if (!jaOn) $("rqlist").classList.add("hide-ja");
  $("jaSwitch").setAttribute("aria-pressed", String(jaOn));
  curQ = -1;
}
function showEvidence(i, scroll){
  const q = L.rq[i], pass = $("rqPass");
  document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev"));
  q.ev.forEach(id => ["p-", "m" + i + "-", ""].forEach(pre => {
    const e = $(pre + id); if (e) { void e.offsetWidth; e.classList.add("ev"); }
  }));
  if (!scroll || !q.ev.length) return;
  const side = $("p-" + q.ev[0]);
  if (side && getComputedStyle(pass).display !== "none") pass.scrollTo({ top: side.offsetTop - pass.offsetTop - 60, behavior: "smooth" });
  else { const ctx = document.querySelector("#rq" + i + " .rq-ctx"); if (ctx) ctx.open = true; }
}
function answerR(i, j, scroll){
  const q = L.rq[i];
  STATE[L.id][i] = j;
  $("rq" + i).querySelectorAll(".opt").forEach((x, k) => {
    x.disabled = true;
    if (k === q.ans) x.classList.add("correct");
    else if (k === j) x.classList.add("wrong");
  });
  const ok = j === q.ans;
  const evText = q.ev.map(id => $(id).textContent).join(" ");
  const fb = $("fb" + i);
  fb.innerHTML = '<p class="v ' + (ok ? "ok" : "ng") + '">' + (ok ? "◎ 正解！" : "× 不正解　正解は " + KEYS[q.ans]) + '</p>' +
    (q.ev.length ? '<div class="evid"><span class="en">' + evText + '</span></div><button type="button" class="golink toev" data-q="' + i + '">本文で根拠の文をもう一度光らせる</button>'
      : '<p class="glob">文章全体の内容から考える問題です。全訳で流れを確かめてみましょう。</p>');
  fb.hidden = false;
  if (scroll) showEvidence(i, true);
  $("rScore").textContent = Object.entries(STATE[L.id]).filter(([k, v]) => L.rq[k].ans === v).length;
}
function restore(){
  Object.entries(STATE[L.id]).forEach(([i, j]) => answerR(Number(i), j, false));
  $("rScore").textContent = Object.entries(STATE[L.id]).filter(([k, v]) => L.rq[k].ans === v).length;
}

/* ===== クリック ===== */
document.addEventListener("click", e => {
  const t = e.target;
  let b;
  if ((b = t.closest(".nav a"))) { e.preventDefault(); const s = document.querySelector(b.getAttribute("href")); if (s) s.scrollIntoView({ behavior: "smooth", block: "start" }); return; }
  if ((b = t.closest(".lvbtn"))) { try { localStorage.setItem("rd-level", b.dataset.lv); } catch (x) {} return; }
  if ((b = t.closest("[data-goto]"))) { show(b.dataset.goto, true); return; }
  if ((b = t.closest(".toev"))) { showEvidence(Number(b.dataset.q), true); return; }
  if ((b = t.closest(".opt"))) { if (!b.disabled) answerR(Number(b.dataset.q), Number(b.dataset.j), true); return; }
  if (t.closest("#jaSwitch")) { jaOn = !jaOn; $("jaSwitch").setAttribute("aria-pressed", String(jaOn)); $("rqlist").classList.toggle("hide-ja", !jaOn); return; }
  if (t.closest("#rReset")) { STATE[L.id] = {}; renderRQ(); $("rScore").textContent = 0; document.querySelectorAll(".s.ev").forEach(e => e.classList.remove("ev")); return; }
});

/* ===== 表示 ===== */
function show(id, scrollTop){
  L = LESSONS.find(l => l.id === id) || LESSONS[0];
  STATE[L.id] = STATE[L.id] || {};
  document.querySelectorAll(".lvbtn").forEach(a => a.toggleAttribute("aria-current", a.dataset.lv === L.lv));
  document.querySelectorAll(".lvbtn[aria-current]").forEach(a => a.setAttribute("aria-current", "page"));
  drawBar();
  document.querySelectorAll(".ctab").forEach(b => b.setAttribute("aria-pressed", String((b.dataset.rev === "true") === L.rev)));
  document.querySelectorAll(".ptab").forEach(b => b.setAttribute("aria-selected", String(b.dataset.id === L.id)));
  render();
  try { history.replaceState(null, "", "#" + L.id); } catch (e) {}
  try { localStorage.setItem("rd-level", L.lv); } catch (e) {}
  if (scrollTop) scrollTo({ top: 0, behavior: "instant" in window ? "instant" : "auto" });
}
function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1));
  if (LESSONS.some(l => l.id === h)) return h;
  const lv = /^[123]$/.test(h) ? h : "1";
  return LESSONS.find(l => l.lv === lv).id;
}
addEventListener("hashchange", () => { const id = fromHash(); if (!L || id !== L.id) show(id, true); });

/* ===== ナビの現在地 ===== */
function onScroll(){
  const links = [...document.querySelectorAll(".nav a")];
  let cur = 0;
  links.forEach((a, i) => { const s = document.querySelector(a.getAttribute("href")); if (s && s.getBoundingClientRect().top < 120) cur = i; });
  links.forEach((a, i) => a.classList.toggle("on", i === cur));
}
addEventListener("scroll", onScroll, { passive: true });

/* ===== テーマ（親アプリから setTheme が呼ばれる） ===== */
const themeBtn = $("themeBtn");
function setTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t === "dark" ? "ライト" : "ダーク";
  themeBtn.setAttribute("aria-pressed", String(t === "dark"));
  try { localStorage.setItem("rd-theme", t); } catch (e) {}
}
let saved = null; try { saved = localStorage.getItem("rd-theme"); } catch (e) {}
setTheme(saved || "light");
themeBtn.addEventListener("click", () => setTheme(document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark"));

show(fromHash(), false);

</script>
</body>
</html>
