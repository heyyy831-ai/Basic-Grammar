<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>文法理解ベースのリーディング A1</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400;0,600;0,700;1,400&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>

  :root{
    color-scheme:light;
    --bg:#F4F1EA; --paper:#FFFFFF; --soft:#F8F5EE; --ink:#1E2A3A; --ink-2:#4A5568; --ink-3:#8A93A3;
    --rule:#E2DCCF; --navy:#2B3F5C; --orange:#C8693E; --orange-soft:#F7E6DC; --green:#3E8A6A; --green-soft:#E3F1EA;
    --red:#C0412F; --red-soft:#F9E3DF; --gold:#E9C46A; --hl:#FFF0B8; --hl-line:#E9C46A;
    --en:"Crimson Pro","Georgia","Times New Roman",serif;
    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --bg:#13171E; --paper:#1B212B; --soft:#202733; --ink:#E9EDF3; --ink-2:#B8C1CF; --ink-3:#7F8A9C;
    --rule:#2F3846; --navy:#9CB8E0; --orange:#E89A72; --orange-soft:#3A2A22; --green:#6CC49E; --green-soft:#1C3229;
    --red:#F08A78; --red-soft:#3A2220; --gold:#E9C46A; --hl:#4A3F17; --hl-line:#C9A443;
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  @media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--jp);font-size:15.5px;line-height:1.85;-webkit-font-smoothing:antialiased}
  .wrap{max-width:860px;margin:0 auto;padding:0 18px 80px}
  button{font:inherit;cursor:pointer}
  :focus-visible{outline:2px solid var(--orange);outline-offset:2px}

  /* nav */
  .nav{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(6px);border-bottom:1px solid var(--rule)}
  .nav-in{max-width:860px;margin:0 auto;padding:8px 18px;display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none}
  .nav-in::-webkit-scrollbar{display:none}
  .nav a{flex:none;text-decoration:none;color:var(--ink-2);font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;white-space:nowrap}
  .nav a:hover{color:var(--ink);background:var(--soft)}
  .nav a.on{background:var(--navy);color:var(--paper)}
  .theme{margin-left:auto;flex:none;border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:4px 12px;font-size:12.5px}

  /* header */
  header{padding:30px 0 14px}
  .kicker{display:flex;align-items:center;gap:10px;flex-wrap:wrap;color:var(--ink-3);font-size:12.5px;letter-spacing:.04em}
  .badge{background:var(--navy);color:#fff;border-radius:6px;padding:6px 12px;line-height:1.1;text-align:center;font-weight:700}
  :root[data-theme="dark"] .badge{color:#13171E}
  .badge small{display:block;font-size:9.5px;letter-spacing:.12em;opacity:.85}
  .badge b{font-size:22px;font-family:var(--en)}
  .tag{border-radius:99px;padding:2px 10px;font-size:12px;font-weight:700}
  .tag.t1{background:var(--orange);color:#fff}
  .tag.t2{background:var(--soft);color:var(--ink-2);border:1px solid var(--rule)}
  h1{font-family:var(--en);font-weight:700;color:var(--navy);font-size:clamp(28px,5vw,38px);line-height:1.18;margin:14px 0 4px}
  .sub{color:var(--ink-2);font-size:14px;margin:0}

  .card{background:var(--paper);border:1px solid var(--rule);border-radius:16px;padding:22px clamp(16px,4vw,30px);margin-top:18px}
  .illus{display:block;width:100%;height:auto;border-radius:12px}
  :root[data-theme="dark"] .illus{filter:brightness(.92)}
  section{scroll-margin-top:60px}
  .sec-h{display:flex;align-items:center;gap:10px;margin:34px 0 6px}
  .sec-h .ic{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:#fff;font-weight:700;font-size:14px;flex:none}
  .sec-h h2{margin:0;font-size:18px}
  .sec-h .note{margin-left:auto;color:var(--ink-3);font-size:12px}
  .lead{color:var(--ink-2);font-size:13.5px;margin:4px 0 0}

  /* reading */
  .toggle-row{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
  .switch{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink-2);background:none;border:0;padding:0}
  .switch .knob{width:34px;height:20px;border-radius:99px;background:var(--rule);position:relative;transition:background .2s}
  .switch .knob::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .2s}
  .switch[aria-pressed="true"] .knob{background:var(--navy)}
  .switch[aria-pressed="true"] .knob::after{left:16px}
  .para{display:flex;gap:12px;margin:14px 0}
  .pno{flex:none;width:22px;height:22px;border-radius:50%;background:var(--green);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:6px}
  .para p{margin:0;font-family:var(--en);font-size:clamp(17px,2.4vw,19.5px);line-height:1.75;text-align:justify;hyphens:auto}
  .gp{font-weight:700}
  .show-gp .gp{color:var(--navy);background:linear-gradient(var(--gold),var(--gold)) 0 100%/100% 2.5px no-repeat;padding-bottom:1px;-webkit-box-decoration-break:clone;box-decoration-break:clone}
  .s{transition:background .3s;border-radius:3px}
  .s.ev{background:var(--hl);box-shadow:0 0 0 2px var(--hl);animation:pulse 1.4s ease 1}
  @keyframes pulse{0%{box-shadow:0 0 0 6px var(--hl-line)}100%{box-shadow:0 0 0 2px var(--hl)}}

  /* media */
  .media{display:grid;grid-template-columns:1fr;gap:16px}
  .media h3{margin:0 0 8px;font-size:14px;color:var(--ink-2);display:flex;align-items:center;gap:6px}
  audio{width:100%}
  .player{background:var(--soft);border:1px solid var(--rule);border-radius:14px;padding:10px 12px}
  .pl-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .pl-play{width:44px;height:44px;border-radius:50%;border:0;background:var(--navy);color:var(--paper);font-size:17px;display:grid;place-items:center;flex:none}
  .pl-skip{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:700;flex:none}
  .pl-skip:hover{color:var(--ink);border-color:var(--ink-3)}
  .pl-time{margin-left:auto;font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums}
  .pl-seek{width:100%;margin:10px 0 2px;accent-color:var(--navy)}
  .rate{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
  .rate button{border:1px solid var(--rule);background:var(--soft);color:var(--ink-2);border-radius:99px;padding:3px 9px;font-size:12.5px}
  .rate button[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .video{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000}
  .video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .ytlink{display:inline-block;margin-top:6px;font-size:12.5px;color:var(--orange)}

  /* translation */
  details.tr{background:var(--soft);border-left:4px solid var(--green);border-radius:0 12px 12px 0;padding:0}
  details.tr summary{list-style:none;cursor:pointer;padding:14px 18px;font-weight:700;display:flex;align-items:center;gap:8px}
  details.tr summary::-webkit-details-marker{display:none}
  details.tr summary::after{content:"＋ 開く";margin-left:auto;font-size:12px;color:var(--ink-3);font-weight:500}
  details.tr[open] summary::after{content:"－ 閉じる"}
  .tr-body{padding:0 18px 16px}
  figure.va{margin:16px 0 0;background:var(--paper);border:1px solid var(--rule);border-radius:14px;padding:10px;overflow:hidden}
  figure.va figcaption{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);margin:2px 4px 8px}
  figure.va img{display:block;width:100%;height:auto;border-radius:8px;cursor:zoom-in}
  figure.va.zoom{position:fixed;inset:0;z-index:99;margin:0;border-radius:0;background:rgba(0,0,0,.88);display:grid;place-items:center;padding:12px;overflow:auto}
  figure.va.zoom figcaption{display:none}
  figure.va.zoom img{width:auto;max-width:none;height:auto;min-width:100%;cursor:zoom-out}
  @media (min-width:900px){figure.va.zoom img{min-width:0;max-width:100%;max-height:100vh;width:auto}}
  .vnote{margin:0 0 10px;font-size:13px;color:var(--ink-3)}
  .tr-body p{margin:0 0 10px;text-indent:1em;font-size:14.5px;color:var(--ink-2)}

  /* grammar items */
  .gi{border-top:1px solid var(--rule);padding:18px 0 6px;scroll-margin-top:70px;transition:background .4s}
  .gi:first-child{border-top:0;padding-top:4px}
  .gi.flash{background:var(--orange-soft);border-radius:10px}
  .gi h3{display:flex;align-items:center;gap:10px;margin:0 0 8px;font-size:16px;color:var(--navy)}
  .gi h3 .n{width:24px;height:24px;border:1.5px solid var(--navy);border-radius:50%;display:grid;place-items:center;font-size:12px;flex:none}
  .gi .lbl{color:var(--orange);font-weight:700;font-size:13px}
  .gi p{margin:4px 0;font-size:14.5px}
  .gi .en{font-family:var(--en);font-size:16px}
  .ex{background:var(--soft);border-left:3px solid #A8BBD6;border-radius:0 8px 8px 0;padding:6px 12px;margin:6px 0;font-size:14px}
  .ex .en{font-size:16.5px}

  /* grammar check */
  .gq{font-family:var(--en);font-size:clamp(17px,2.4vw,19px);line-height:2.4}
  .gq p{margin:0 0 12px;text-indent:1.2em}
  .blank{display:inline-flex;align-items:center;gap:3px;vertical-align:middle;line-height:1;background:var(--soft);border:1px solid var(--rule);border-radius:99px;padding:2px 3px 2px 8px;margin:0 2px;font-family:var(--jp)}
  .blank .no{font-size:11px;color:var(--orange);font-weight:700;margin-right:2px}
  .blank button{border:0;background:transparent;color:var(--ink-2);border-radius:99px;padding:3px 8px;font-size:13px;font-family:var(--en);font-weight:600}
  .blank button:hover{background:var(--paper);color:var(--ink)}
  .blank button.pick{background:var(--navy);color:var(--paper)}
  .blank.ok{border-color:var(--green);background:var(--green-soft)}
  .blank.ok button.pick{background:var(--green)}
  .blank.ng{border-color:var(--red);background:var(--red-soft)}
  .blank.ng button.pick{background:var(--red)}
  .blank .mark{font-size:13px;font-weight:700;padding:0 4px}
  .blank.ok .mark{color:var(--green)} .blank.ng .mark{color:var(--red)}
  .gbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 14px}
  .score{font-weight:700;font-size:14px}
  .score b{color:var(--orange);font-size:18px;font-family:var(--en)}
  .btn{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:99px;padding:6px 14px;font-size:13px;font-weight:700}
  .btn:hover{color:var(--ink);border-color:var(--ink-3)}
  .btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
  .alist{margin:6px 0 0;padding:0;list-style:none}
  .alist li{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:10px 0;border-top:1px dashed var(--rule)}
  .alist .num{width:26px;height:22px;border-radius:5px;background:var(--gold);color:#3b2f10;font-size:12px;font-weight:700;display:grid;place-items:center;margin-top:2px}
  .alist .ans{font-weight:700;color:var(--navy)}
  .alist .ans .res{font-size:12px;margin-left:8px;font-weight:700}
  .alist .res.ok{color:var(--green)} .alist .res.ng{color:var(--red)}
  .alist .exp{grid-column:2;font-size:13.5px;color:var(--ink-2);margin:0}
  .alist li[hidden]{display:none}
  .golink{border:0;background:none;color:var(--orange);font-weight:700;padding:0;text-decoration:underline;text-underline-offset:2px;font-size:13.5px}
  .jt{margin-top:14px;font-size:14px;color:var(--ink-2)}
  .jt p{margin:0 0 8px;text-indent:1em}

  /* reading quiz */
  .rq{border-top:1px solid var(--rule);padding:20px 0 6px}
  .rq:first-of-type{border-top:0;padding-top:4px}
  .rq .qh{display:flex;gap:10px;align-items:flex-start}
  .rq .qn{flex:none;background:var(--navy);color:var(--paper);border-radius:6px;font-weight:700;font-size:13px;padding:2px 9px;margin-top:4px}
  .rq .qtext{font-family:var(--en);font-size:clamp(17px,2.3vw,18.5px);line-height:1.6;margin:0}
  .rq .qja{font-size:12.5px;color:var(--ink-3);margin:2px 0 0}
  .opts{display:grid;gap:8px;margin:12px 0 0;padding:0;list-style:none}
  .opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1.5px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:12px;padding:10px 14px;font-family:var(--en);font-size:clamp(16px,2.2vw,17.5px);line-height:1.5;transition:border-color .15s,background .15s}
  .opt:hover:not([disabled]){border-color:var(--ink-3)}
  .opt .k{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--ink-3);display:grid;place-items:center;font-size:12px;font-family:var(--jp);font-weight:700;margin-top:2px}
  .opt[disabled]{cursor:default}
  .opt.correct{border-color:var(--green);background:var(--green-soft)}
  .opt.correct .k{background:var(--green);border-color:var(--green);color:#fff}
  .opt.wrong{border-color:var(--red);background:var(--red-soft)}
  .opt.wrong .k{background:var(--red);border-color:var(--red);color:#fff}
  .fb{margin-top:12px;border-radius:12px;padding:14px 16px;background:var(--soft);font-size:14px}
  .fb[hidden]{display:none}
  .fb .v{font-weight:700;font-size:15px;margin:0 0 6px}
  .fb .v.ok{color:var(--green)} .fb .v.ng{color:var(--red)}
  .fb .evid{border-left:3px solid var(--gold);padding:4px 0 4px 12px;margin:8px 0}
  .fb .evid .en{font-family:var(--en);font-size:16.5px;line-height:1.55}
  .fb .evid .ja{font-size:13px;color:var(--ink-2);display:block;margin-top:2px}
  .fb ul{margin:8px 0 0;padding-left:0;list-style:none}
  .fb li{margin:5px 0;padding-left:28px;position:relative}
  .fb li .k{position:absolute;left:0;top:2px;width:20px;height:20px;border-radius:50%;background:var(--paper);border:1px solid var(--rule);display:grid;place-items:center;font-size:11px;font-weight:700}
  .fb li.right .k{background:var(--green);border-color:var(--green);color:#fff}
  .tobody{margin-top:8px}
  .rscore{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:16px 0 0;padding-top:14px;border-top:1px solid var(--rule)}

  /* 読解クイズ：本文を横に並べる */
  .wide{width:min(1180px,calc(100vw - 36px));margin-left:calc((100% - min(1180px,calc(100vw - 36px))) / 2)}
  .rq-grid{display:grid;grid-template-columns:1fr;gap:24px;margin-top:10px}
  .rq-pass{display:none}
  .rp-h{margin:0 0 6px;font-size:12px;font-weight:700;letter-spacing:.12em;color:var(--ink-3)}
  .rp-para{display:flex;gap:10px;margin:0 0 14px;border-radius:10px;padding:6px 8px;transition:opacity .25s,background .25s}
  .rp-para p{margin:0;font-family:var(--en);font-size:16.5px;line-height:1.65}
  .rp-para .pno{margin-top:3px}
  .rq-pass.focus .rp-para{opacity:.38}
  .rq-pass.focus .rp-para.cur{opacity:1;background:var(--paper);box-shadow:0 0 0 1px var(--rule)}
  .rq-ctx{margin:12px 0 0;background:var(--soft);border-radius:12px;border:1px solid var(--rule)}
  .rq-ctx summary{list-style:none;cursor:pointer;padding:9px 14px;font-size:12.5px;font-weight:700;color:var(--ink-2);display:flex;gap:6px}
  .rq-ctx summary::-webkit-details-marker{display:none}
  .rq-ctx summary::after{content:"閉じる";margin-left:auto;font-weight:500;color:var(--ink-3)}
  .rq-ctx:not([open]) summary::after{content:"開く"}
  .rq-ctx .rp-para{padding:0 12px;margin:0 0 12px}
  .hide-ja .qja{display:none}
  @media (min-width:1000px){
    .rq-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px;align-items:start}
    .rq-pass{display:block;position:sticky;top:64px;max-height:calc(100vh - 84px);overflow:auto;background:var(--soft);border-radius:14px;padding:14px 14px 4px;border:1px solid var(--rule)}
    .rq-ctx{display:none}
  }
  footer{margin-top:40px;color:var(--ink-3);font-size:12px;text-align:center}
  @media (max-width:560px){ .para{gap:8px} .card{border-radius:12px} }

  /* masthead */
  .mast{background:var(--paper);border-bottom:3px solid #2E5DA8}
  .mast-in{max-width:860px;margin:0 auto;padding:22px 18px 20px;display:flex;align-items:center;gap:24px}
  .mast-t{flex:1;min-width:0}
  .mast-en{margin:0 0 8px;font-family:var(--en);font-weight:700;font-size:15px;letter-spacing:.04em;color:#D9604B}
  .mast-h{margin:0;font-family:var(--jp);font-weight:700;line-height:1.15;letter-spacing:.04em;color:#2E5DA8}
  :root[data-theme="dark"] .mast-h{color:var(--navy)}
  .mast-h span{display:block}
  .mast-h .l1{font-size:clamp(22px,3.8vw,32px)}
  .mast-h .l2{font-size:clamp(32px,6vw,50px)}
  .mast-h small{margin-left:.4em;font-family:var(--en);font-size:.55em;color:#D9604B}
  .mast-sub{margin:12px 0 0;font-size:13.5px;font-weight:700;color:var(--ink-2);letter-spacing:.04em}
  .mast-sub2{margin:12px 0 0;font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.04em}
  .cover{flex:none;width:300px;max-width:42%;height:auto;border-radius:4px;box-shadow:0 6px 18px -8px rgba(0,0,0,.45);border:1px solid var(--rule);background:#fff}
  @media (max-width:600px){
    .mast-in{padding:14px 14px 14px;gap:12px}
    .cover{width:150px}
    .mast-en{font-size:11.5px;margin-bottom:4px}
    .mast-h .l1{font-size:17px}
    .mast-h .l2{font-size:26px}
    .mast-sub{font-size:11px;margin-top:8px}
    .mast-sub2{font-size:10.5px;margin-top:8px}
  }
  /* Part 切り替え */
  .chapbar{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:18px 0 0}
  .ctab{border:1px solid var(--rule);background:var(--paper);color:var(--ink);border-radius:999px;min-width:38px;height:34px;padding:0 12px;font-weight:700;font-size:14px;cursor:pointer}
  .ctab[aria-pressed="true"]{background:var(--orange);border-color:var(--orange);color:#fff}
  .ctab:hover:not([aria-pressed="true"]){border-color:var(--ink-3)}
  .chapbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .partbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:10px 0 0}
  @media (max-width:640px){
    .partbar .lbl2{display:none}
    .partbar{gap:6px}
    .ptab{padding:6px 10px}
    .partbar .ptab span{display:none}
    .partbar .ptab{min-width:0;flex:0 0 auto}
  }
  .partbar .lbl2{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--ink-3);margin-right:4px}
  .ptab{border:1px solid var(--rule);background:var(--paper);color:var(--ink-2);border-radius:10px;padding:6px 12px;text-align:left;line-height:1.3;min-width:0}
  .ptab b{display:block;font-size:13px;color:var(--ink)}
  .ptab span{display:block;font-size:11.5px;font-family:var(--en);max-width:210px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .ptab[aria-selected="true"]{background:var(--navy);border-color:var(--navy);color:var(--paper)}
  .ptab[aria-selected="true"] b{color:var(--paper)}
  .ptab:hover:not([aria-selected="true"]){border-color:var(--ink-3)}
  .alist .exp .golink{margin-right:4px}
  #gq p{margin:0 0 12px;line-height:2.1;text-indent:0}
  .blank .sl{color:var(--ink-3);font-size:12px}
  .nextpart{display:flex;justify-content:flex-end;margin-top:26px}

rella at the door of the classroom."], ["s3", "\"Whose umbrella is this?\" he asks."], ["s4", "\"Is it yours, Aki?\""], ["s5", "\"No, it isn't mine. Mine is red,\" says Aki."], ["s6", "\"Oh! It's mine!\" says Tom."], ["s7", "\"Thank you, Mr. Sato.\""], ["s8", "Then Aki looks in her bag."], ["s9", "\"Oh, no! My umbrella is at home!\""], ["s10", "Tom walks home with Aki under his umbrella."], ["s11", "They talk about their favorite movie."]]}], "trans": ["放課後、雨が降っています。サトウ先生が教室のドアのところで⻘いかさを見つけます。「これはだれのかさかな？」と先生はたずねます。「アキ、君のかい？」「いいえ、私のではありません。私のは赤です」とアキは言います。「あっ！ぼくのです！」とトムが言います。「ありがとうございます、サトウ先生」。それからアキはかばんの中を見ます。「ああ、どうしよう！私のかさは家にある！」トムは自分のかさにアキを入れて一緒に歩いて帰ります。2人は好きな映画について話します。"], "rq": [{"q": "What color is Aki's umbrella?", "qja": "アキのかさは何色ですか。", "opts": ["Blue.", "Black.", "White.", "Red."], "ans": 3, "ev": ["s5"]}, {"q": "Whose umbrella is the blue one?", "qja": "⻘いかさはだれのものですか。", "opts": ["Tom's.", "Aki's.", "Mr. Sato's.", "Nobody knows."], "ans": 0, "ev": ["s6"]}, {"q": "How does Aki go home?", "qja": "アキはどうやって家に帰りますか。", "opts": ["She goes home by bus.", "She uses Mr. Sato's umbrella.", "She walks under Tom's umbrella.", "She waits at school."], "ans": 2, "ev": ["s10"]}]}, {"id": "1-09", "lv": "1", "rev": false, "title": "An Email from the Park", "ja": "公園からのメール", "book": "Lesson 1-9", "words": 74, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"日曜の公園：湖の周りを走る父、ベンチで本を読む母、犬と遊ぶ妹、アイスを食べる私。\"><defs><linearGradient id=\"g9\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#BFE2F7\"/><stop offset=\"1\" stop-color=\"#EAF6FC\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g9)\"/><rect x=\"877\" y=\"8\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(0 880 60)\"/><rect x=\"877\" y=\"8\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(45 880 60)\"/><rect x=\"877\" y=\"8\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\ owy.", "Cloudy and warm.", "Rainy and cold."], "ans": 3, "ev": ["s4"]}, {"q": "Where were the animals in the morning?", "qja": "午前中、動物たちはどこにいましたか。", "opts": ["Out in the sun.", "In their houses.", "With the students.", "Near the lake."], "ans": 1, "ev": ["s6"]}, {"q": "How did the writer feel at the end of the day?", "qja": "その日の終わりに、筆者はどんな気持ちでしたか。", "opts": ["Sad.", "Happy.", "Cold.", "Angry."], "ans": 1, "ev": ["s12"]}]}, {"id": "1-12", "lv": "1", "rev": false, "title": "My Old School", "ja": "私が通った小学校", "book": "Lesson 1-10", "words": 67, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"山の中の小さな小学校。今は博物館になっている。\"><defs><linearGradient id=\"g12\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g12)\"/><path d=\"M-20 300 L180 130 L380 300 Z M260 300 L480 90 L700 300 Z M600 300 L800 150 L1000 300 Z\" fill=\"#9DB4CF\"/><path d=\"M480 90 L440 135 L465 128 L480 142 L500 126 L522 135 Z\" fill=\"#fff\"/><g transform=\"translate(160 70) scale(1)\" fill=\"#fff\" opacity=\"1\"><ellipse cx=\"0\" cy=\"0\" rx=\"46\" ry=\"22\"/><ellipse cx=\"-30\" cy=\"6\" rx=\"30\" ry=\"18\"/><ellipse cx=\"34\" cy=\"6\" rx=\"32\" ry=\"18\"/><ellipse cx=\"6\" cy=\"-14\" rx=\"28\" ry=\"20\"/></g><rect x=\"0\" y=\"300\" width=\"960\" height=\"100\" fill=\"#A9D18E\"/><g><rect x=\"300\" y=\"170\" width=\"360\" height=\"150\" fill=\"#F2EDE4\" stroke=\"#D8CFC0\" stroke-width=\"3\"/><rect x=\"446.0\" y=\"110\" width=\"68\" height=\"64\" fill=\"#F2EDE4\" stroke=\"#D8CFC0\" stroke-width=\"3\"/><circle cx=\"480.0\" cy=\"142\" r=\"20\" fill=\"#fff\" stroke=\"#2B3F5C\" stroke-width=\"3\"/><line x1=\"480.0\" y1=\"142\" x2=\"480.0\" y2=\"128\" stroke=\"#2B3F5C\" stroke-width=\"3\"/><line x1=\"480.0\" y1=\"142\" x2=\"490.0\" y2=\"142\" stroke=\"#2B3F5C\" stroke-width=\"3\"/><rect x=\"326.0\" y=\"186\" width=\"41.33333  we will look at the stars."], ["s10", "You will love it!"], ["s11", "Please ask your parents and call me tomorrow."], ["s12", "Your friend, Daichi"]]}], "trans": ["マイクへ。ぼくの家族は今週末、ヒカリ湖へキャンプに行く予定なんだ。一緒に来ない？土曜日の朝に出発して、日曜日の夕方に帰ってくるよ。運転はお父さんがする。湖の近くにすてきな浜辺があって、そこで泳げるよ。土曜日の夜は雨が降るかもしれないから、レインコートを持ってきてね。夕食は自分たちで作るんだ。お母さんが特製カレーを作るかもしれない。夜は星を見るよ。きっと気に入るよ！ご両親に聞いて、明日電話してね。君の友達、ダイチより"], "rq": [{"q": "When will Daichi's family come back?", "qja": "ダイチの家族はいつ帰ってきますか。", "opts": ["On Sunday evening.", "On Saturday morning.", "On Saturday night.", "On Monday morning."], "ans": 0, "ev": ["s3"]}, {"q": "Why should Mike bring a raincoat?", "qja": "マイクはなぜレインコートを持っていくべきなのですか。", "opts": ["Because they will swim in the lake.", "Because it will be very cold at night.", "Because it may rain on Saturday night.", "Because Daichi's father will not drive."], "ans": 2, "ev": ["s6"]}, {"q": "What is Daichi asking Mike to do?", "qja": "ダイチはマイクに何をするように頼んでいますか。", "opts": ["To cook curry for dinner.", "To go camping with his family.", "To drive to the lake.", "To buy a new raincoat."], "ans": 1, "ev": ["s2"]}]}, {"id": "2-02", "lv": "2", "rev": false, "title": "My Summer Plan", "ja": "私の夏休みの計画", "book": "Lesson 2-1", "words": 94, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"沖縄のおばの家へ。海、レストラン、カメラ。\"><defs><linearGradient id=\"g22\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#9FD8F2\"/><stop offset=\"1\" stop-color=\"#E6F6FD\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g22)\"/><rect x=\"857\" y=\"8\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(0 860 60)\"/><rect x=\"857\" y=\"8\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(45 860 60)\"/><rect x=\"857\" y=\"8\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(90 860 60)\"/><rect x=\"857\" y=\"8\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(135 860 n the phone, she said to me, \"Help yourself to anything in the fridge!\""], ["s7", "She is very kind."], ["s8", "I will take a lot of pictures and send them to my friends."], ["s9", "I will also try to make Okinawan food by myself."], ["s10", "I'm sure we will enjoy ourselves."], ["s11", "I can't wait!"]]}], "trans": ["この夏、私は沖縄のおばを訪ねる予定です。1週間おばの家に泊まります。おばは海の近くに住んでいるので、毎日泳ぐつもりです。おばは小さなレストランをやっています。私はそこで手伝いをしたいと思っています。電話でおばは「冷蔵庫の中のものは何でも自由に食べてね！」と言ってくれました。とても優しい人です。写真をたくさんとって、友達に送るつもりです。自分で沖縄料理を作ることにも挑戦します。きっと楽しく過ごせると思います。待ちきれません！"], "rq": [{"q": "How long will the writer stay at the aunt's house?", "qja": "筆者はおばの家にどのくらい泊まりますか。", "opts": ["For a month.", "For three days.", "For two weeks.", "For a week."], "ans": 3, "ev": ["s2"]}, {"q": "What does the writer's aunt have?", "qja": "筆者のおばは何を持っていますか。", "opts": ["A big hotel.", "A boat.", "A small restaurant.", "A farm."], "ans": 2, "ev": ["s4"]}, {"q": "What will the writer try to do?", "qja": "筆者は何に挑戦するつもりですか。", "opts": ["Make Okinawan food by himself or herself.", "Open a restaurant in Okinawa.", "Teach swimming to friends.", "Buy a new fridge for the aunt."], "ans": 0, "ev": ["s9"]}]}, {"id": "2-03", "lv": "2", "rev": false, "title": "A Present for Ms. Ito", "ja": "イトウ先生へのプレゼント", "book": "Lesson 2-2", "words": 94, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"イトウ先生へのプレゼント：クラスのみんなでメッセージを書いた写真アルバム。\"><rect width=\"960\" height=\"310\" fill=\"#F3EAD9\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#D9B48C\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><rect x=\"292\" y=\"22\" width=\"376\" height=\"136\" rx=\"4\" fill=\"#9C7450\"/><rect x=\"300\" y=\"30\" width=\"360\" height=\"120\" fill=\"#2F5D4A\"/><text x=\"480.0\" y=\"72\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-size=\"28\" font-weight=\"700\" fill=\"#F4F1EA\">Thank you,</text><text x=\"480.0\" y=\"112\" text-anchor=\"middle\" font-family=\"Verdana, le cx=\"-6.5\" cy=\"-25.3\" r=\"6\" fill=\"#F28AA6\"/><circle cx=\"-6.5\" cy=\"-34.7\" r=\"6\" fill=\"#F28AA6\"/><circle cx=\"2.5\" cy=\"-37.6\" r=\"6\" fill=\"#F28AA6\"/><circle cx=\"0\" cy=\"-30\" r=\"5\" fill=\"#F6C343\"/></g><g transform=\"translate(870 380) scale(1.4)\"><line x1=\"0\" y1=\"0\" x2=\"0\" y2=\"-28\" stroke=\"#5C9E4F\" stroke-width=\"3\"/><circle cx=\"8.0\" cy=\"-30.0\" r=\"6\" fill=\"#F6C343\"/><circle cx=\"2.5\" cy=\"-22.4\" r=\"6\" fill=\"#F6C343\"/><circle cx=\"-6.5\" cy=\"-25.3\" r=\"6\" fill=\"#F6C343\"/><circle cx=\"-6.5\" cy=\"-34.7\" r=\"6\" fill=\"#F6C343\"/><circle cx=\"2.5\" cy=\"-37.6\" r=\"6\" fill=\"#F6C343\"/><circle cx=\"0\" cy=\"-30\" r=\"5\" fill=\"#F6C343\"/></g><path transform=\"translate(330 200) scale(1.5)\" d=\"M0 8 C-20 -6 -14 -22 0 -12 C14 -22 20 -6 0 8Z\" fill=\"#E0605A\"/><path transform=\"translate(640 210) scale(1.2)\" d=\"M0 8 C-20 -6 -14 -22 0 -12 C14 -22 20 -6 0 8Z\" fill=\"#E0605A\"/></svg>", "alt": "イトウ先生へのプレゼント：クラスのみんなでメッセージを書いた写真アルバム。", "passage": [{"who": "", "s": [["s1", "Ms. Ito is our English teacher."], ["s2", "She will leave our school next month because she is going to have a baby."], ["s3", "Last Friday, our class talked about a present for her."], ["s4", "\"Shall we give her flowers?\" Yuta asked."], ["s5", "\"Flowers are nice, but they don't last long,\" said Mai."], ["s6", "\"We should make her something special.\""], ["s7", "Finally, we decided to give her a photo album."], ["s8", "Each student has to write a message to her in English."], ["s9", "We must finish it by the end of this month."], ["s10", "We will give it to her at the last class."]]}], "trans": ["イトウ先生は私たちの英語の先生です。赤ちゃんが生まれる予定なので、来月学校を離れます。先週の金曜日、クラスで先生へのプレゼントについて話し合いました。「花をあげようか？」とユウタがたずねました。「花はすてきだけど、⻑くはもたないよ」とマイが言いました。「何か特別なものを作ってあげるべきだよ」。最後に、私たちは先生に写真のアルバムを贈ることに決めました。生徒は1人ずつ英語で先生へのメッセージを書かなければなりません。今月末までに仕上げなければなりません。最後の授業でそれを先生に渡します。"], "rq": [{"q": "Why will Ms. Ito leave the school?", "qja": "イトウ先生はなぜ学校を離れるのですか。", "opts": ["Because she will move to another city.", "Because she will teach at a new school.", "Because she is sick.", "Because she is going to have a baby."], "ans": 3, "ev": ["s2"]}, {"q": "What did the class decide to give Ms. Ito?", "qja": "クラスはイトウ先生に何を贈ることに決めましたか。", "opts": ["Some flowers.", "A photo album.", "A cake.", "A letter from Yuta."], "ans": 1, "ev": ["s7"]}, {"q": "What does each student have to do?", "qja": "生徒は1人ずつ何をしなければなりませんか。", "opts": ["Take a photo of Ms. Ito.", "Write a message in English.", "Buy some flowers.", "Talk with Ms. Ito's baby."], "ans": 1, "ev": ["s8"]}]}, {"id": "2-04", "lv": "2", "rev": false, "title": "Rules for the School Trip", "ja": "修学旅行のきまり", "book": "Lesson 2-2", "words": 90, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"京都への修学旅行のきまりを説明する先生。駅に7:30集合。\"><rect width=\"960\" height=\"310\" fill=\"#F3EAD9\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#D9B48C\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><rect x=\"182\" y=\"22\" width=\"576\" height=\"226\" rx=\"4\" fill=\"#9C7450\"/><rect x=\"190\" y=\"30\" width=\"560\" height=\"210\" fill=\"#2F5D4A\"/><text x=\"470.0\" y=\"72\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-size=\"28\" font-weight=\"700\" fill=\"#F4F1EA\">School Trip Rules</text><text x=\"470.0\" y=\"112\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-size=\"28\" font-weight=\"700\" fill=\"#F4F1EA\">7:30 a.m.  Station</text><text x=\"470.0\" y=\"152\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-size=\"28\" font-weight=\"700\" fill=\"#F4F1EA\">¥5,000</text><text x=\"470.0\" y=\"192\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-size=\"28\" font-weight=\"700\" fill=\"#F4F1EA\">No phone on the bus</text><g><rect x=\"805.8\" y=\"300.4\" width=\"19\" height=\"79.6\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"835.2\" y=\"300.4\" width=\"19\" height=\"79.6 \"450\" cy=\"304.3\" r=\"14.3\" fill=\"#D9A882\"/><path d=\"M 435.1 306.4 Q 433.6 287.1 450 288.9 Q 466.4 287.1 464.9 306.4 Q 460 297.2 451.4 297.9 Q 441.4 300 435.1 306.4 Z\" fill=\"#2A2320\"/><circle cx=\"444.6\" cy=\"306\" r=\"1.4\" fill=\"#2A2A2A\"/><circle cx=\"455.4\" cy=\"306\" r=\"1.4\" fill=\"#2A2A2A\"/><circle cx=\"442.4\" cy=\"310.3\" r=\"1.9\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"457.6\" cy=\"310.3\" r=\"1.9\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 446.4 310.7 Q 450 314 453.6 310.7\" stroke=\"#7A3B2E\" stroke-width=\"1.5\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>", "alt": "京都への修学旅行のきまりを説明する先生。駅に7:30集合。", "passage": [{"who": "", "s": [["s1", "Listen, everyone."], ["s2", "Our school trip to Kyoto is next week."], ["s3", "Here are some rules."], ["s4", "First, you must come to the station by 7:30 a.m."], ["s5", "Don't be late."], ["s6", "Second, you have to wear your school uniform on the first day."], ["s7", "On the second day, you don't have to wear it."], ["s8", "Third, you should bring some money for lunch, but you must not bring more than 5,000 yen."], ["s9", "Also, you shouldn't use your phone on the bus."], ["s10", "Please give me your group plan by Friday."], ["s11", "Shall I answer your questions now?"]]}], "trans": ["みなさん、聞いてください。来週は京都への修学旅行です。いくつかきまりがあります。第一に、午前7時30分までに駅に来なければなりません。遅れないように。第二に、1日目は制服を着なければなりません。2日目は着なくてもかまいません。第三に、昼食代を少し持ってくるべきですが、5,000円より多く持ってきてはいけません。また、バスの中では携帯電話を使うべきではありません。金曜日までにグループの計画を私に提出してください。では、質問に答えましょうか？"], "rq": [{"q": "By what time must the students come to the station?", "qja": "生徒は何時までに駅に来なければなりませんか。", "opts": ["By 7:00 a.m.", "By 8:30 a.m.", "By 5:00 p.m.", "By 7:30 a.m."], "ans": 3, "ev": ["s4"]}, {"q": "When don't the students have to wear their uniforms?", "qja": "生徒が制服を着なくてもよいのはいつですか。", "opts": ["On the second day.", "On the first day.", "On both days.", "Only on the bus."], "ans": 0, "ev": ["s7"]}, {"q": "What must the students NOT do?", "qja": "生徒がしてはいけないことは何ですか。", "opts": ["Bring money for lunch.", "Wear their uniforms.", "Bring more than 5,000 yen.", "Ask the teacher questions."], "ans": 2, "ev": ["s8"]}]}, {"id": "2-05", "lv": "2", "rev": false, "title": "My Dream", "ja": "私の夢", "book": "Lesson 2-3", "words": 98, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"獣医になる夢。白衣の私と、元気になった猫のモモ。\"><rect width=\"960\" height=\"310\" fill=\"#EAF4F0\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#BFD3C8\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><rect x=\"680\" y=\"60\" width=\"200\" height=\"140\" rx=\"10\" fill=\"#fff\" stroke=\"#B9C2CF\" stroke-width=\"3\"/><path d=\"M780 90 v80 M740 130 h80\" stroke=\"#6CC49E\" stroke-width=\"20\"/><g><ellipse cx=\"355.3\" cy=\"231.1\" rx=\"9.1\" ry=\"19.2\" fill=\"#2A2320\"/><rect x=\"305.1\" y=\"298.3\" width=\"19.5\" height=\"81.7\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"335.4\" y=\"298.3\" width=\"19.5\" height=\"81.7\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"314.4\" cy=\"380\" rx=\"13.9\" ry=\"6.5\" fill=\"#3A3A3A\"/><ellipse cx=\"345.6\" cy=\"380\" rx=\"13.9\" ry=\"6.5\" fill=\"#3A3A3A\"/><line x1=\"304.6\" y1=\"252.4\" x2=\"320.8\" y2=\"293.6\" stroke=\"#fff\" stroke-width=\"13.9\" stroke-linecap=\"round\"/><circle cx=\"320.8\" cy=\"293.6\" r=\"8.6\" fill=\"#F6D3B8\"/><line x1=\"355.4\" y1=\"252.4\" x2=\"339.2\" y2=\"293.6\" stroke=\"#fff\" stroke-width=\"13.9\" stroke-linecap=\"round\"/><circle cx=\"339.2\" cy=\"293.6\" r=\"8.6\" fill=\"#F6D3B8\"/><path d=\"M 300.4 249.1 Q 300.4 243.1 308.4 243.1 L 351.6 243.1 Q 359.6 243.1 359.6 249.1 L 361.6 302.3 L 298.4 302.3 Z\" fill=\"#fff\"/><rect x=\"322.9\" y=\"243.1\" width=\"14.2\" height=\"59.2\" fill=\"#8EC3E6\"/><rect x=\"322.3\" y=\"235.9\" width=\"15.4\" height=\"14.4\" fill=\"#F6D3B8\"/><circle cx=\"330\" cy=\"219.1\" r=\"24.1\" fill=\"#F6D3B8\"/><path d=\"M 305 222.7 Q 302.3 190.2 330 193.1 Q 357.7 190.2 355 222.7 Q 346.8 207 332.4 208.2 Q 315.6 211.8 305 222.7 Z\" ity=\".7\"/></g><g transform=\"translate(150 270) rotate(0)\"><rect x=\"0\" y=\"0\" width=\"60\" height=\"80\" rx=\"4\" fill=\"#6DB36D\"/><rect x=\"50\" y=\"4\" width=\"6\" height=\"72\" fill=\"#fff\" opacity=\".6\"/><rect x=\"8\" y=\"14\" width=\"34\" height=\"10\" fill=\"#fff\" opacity=\".7\"/></g></svg>", "alt": "獣医になる夢。白衣の私と、元気になった猫のモモ。", "passage": [{"who": "", "s": [["s1", "What do you want to be in the future?"], ["s2", "I want to be a vet."], ["s3", "A vet is a doctor for animals."], ["s4", "I have two cats at home."], ["s5", "Last year, one of them, Momo, was very sick."], ["s6", "A kind vet saved her."], ["s7", "I was so happy."], ["s8", "After that, I decided to become a vet."], ["s9", "To become a vet, I need to study hard, especially science."], ["s10", "I go to the library every day to study."], ["s11", "My dream is to help sick animals and their families."], ["s12", "It won't be easy, but I will do my best."], ["s13", "Thank you for listening."]]}], "trans": ["みなさんは将来何になりたいですか。私は獣医になりたいです。獣医とは動物のお医者さんです。家にはネコが2匹います。去年、そのうちの1匹のモモが重い病気になりました。優しい獣医さんがモモを救ってくれました。私はとてもうれしかったです。そのあと、私は獣医になろうと決めました。獣医になるためには、一生懸命勉強する必要があります。特に理科です。私は勉強するために毎日図書館に行きます。私の夢は、病気の動物たちとその家族を助けることです。簡単ではないでしょうが、全力を尽くします。聞いてくれてありがとうございました。"], "rq": [{"q": "What is a vet?", "qja": "獣医とは何ですか。", "opts": ["A doctor for animals.", "A science teacher.", "A person who sells cats.", "A library worker."], "ans": 0, "ev": ["s3"]}, {"q": "Why did the writer decide to become a vet?", "qja": "筆者はなぜ獣医になろうと決めたのですか。", "opts": ["Because the writer's parents are vets.", "Because the writer is good at science.", "Because a kind vet saved Momo.", "Because a teacher told the writer to be one."], "ans": 2, "ev": ["s6", "s8"]}, {"q": "Why does the writer go to the library every day?", "qja": "筆者はなぜ毎日図書館に行くのですか。", "opts": ["To read about cats.", "To study.", "To meet friends.", "To work there."], "ans": 1, "ev": ["s10"]}]}, {"id": "2-06", "lv": "2", "rev": false, "title": "A New Café", "ja": "町の新しいカフェ", " 0 -50 h80 v6 q-10 8 -20 0 q-10 8 -20 0 q-10 8 -20 0 q-10 8 -20 0Z\" fill=\"#fff\"/><circle cx=\"0\" cy=\"-58\" r=\"8\" fill=\"#E0605A\"/><ellipse cx=\"0\" cy=\"2\" rx=\"52\" ry=\"7\" fill=\"#fff\" stroke=\"#ddd\"/></g><g transform=\"translate(770 275) scale(1)\"><rect x=\"-40\" y=\"-50\" width=\"80\" height=\"50\" rx=\"6\" fill=\"#F7E1C8\"/><rect x=\"-40\" y=\"-30\" width=\"80\" height=\"8\" fill=\"#E89AB0\"/><path d=\"M-40 -50 h80 v6 q-10 8 -20 0 q-10 8 -20 0 q-10 8 -20 0 q-10 8 -20 0Z\" fill=\"#fff\"/><circle cx=\"0\" cy=\"-58\" r=\"8\" fill=\"#E0605A\"/><ellipse cx=\"0\" cy=\"2\" rx=\"52\" ry=\"7\" fill=\"#fff\" stroke=\"#ddd\"/></g><g transform=\"translate(200 220)\"><rect x=\"-40\" y=\"-50\" width=\"80\" height=\"50\" fill=\"#6B4226\" opacity=\"0\"/></g></svg>", "alt": "町の新しいカフェ。フランス出身のケーキの女王クレア。", "passage": [{"who": "", "s": [["s1", "There is a new café near my house."], ["s2", "It opened last month."], ["s3", "The café looks small, but there are many kinds of cakes."], ["s4", "The owner is a young woman from France."], ["s5", "Her name is Claire."], ["s6", "Everyone calls her the \"Cake Queen.\""], ["s7", "Her cakes are beautiful and delicious."], ["s8", "They always make me happy."], ["s9", "Last Sunday, I went there with my sister."], ["s10", "There were a lot of people in the café, so we waited for thirty minutes."], ["s11", "I ate a chocolate cake, and my sister had a strawberry cake."], ["s12", "I think the café will become famous soon."]]}], "trans": ["私の家の近くに新しいカフェがあります。先月オープンしました。カフェは小さく見えますが、ケーキの種類がたくさんあります。店主はフランス出身の若い女性です。名前はクレアです。みんなは彼女を「ケーキの女王」と呼んでいます。彼女のケーキはきれいで、とてもおいしいです。いつも私を幸せな気持ちにしてくれます。先週の日曜日、私は姉とそこへ行きました。店内には人がたくさんいたので、30分待ちました。私はチョコレートケーキを、姉はイチゴのケーキを食べました。このカフェはすぐに有名になると思います。"], "rq": [{"q": "Where is Claire from?", "qja": "クレアはどこの出身ですか。", "opts": ["Italy.", "Japan.", "America.", "France."], "ans": 3, "ev": ["s4"]}, {"q": "What does everyone call Claire?", "qja": "みんなはクレアを何と呼んでいますか。", "opts": ["The \"Café Princess.\"", "The \"Chocolate Woman.\"", "The \"Cake Queen.\"", "The \"Strawberry Girl.\""], "ans": 2, "ev": ["s6"]}, {"q": "Why did the writer and the sister wait for thirty minutes?", "qja": "筆者と姉はなぜ30分待ったのですか。", "opts": ["Because there were a lot of people in the café.", "Because the café was closed.", "Because the sister was late.", "Because the cakes were not ready."], "ans": 0, "ev": ["s10"]}]}, {"id": "2-07", "lv": "2", "rev": false, "title": "Grandpa's Smartphone", "ja": "祖父のスマートフォン", "book": "Lesson 2-3", "words": 94, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"スマートフォンの使い方を祖父に教える私。祖父は庭のトマトの写真を送ってくれた。\"><rect width=\"960\" height=\"310\" fill=\"#F6EBDD\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#C99A6B\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><rect x=\"60\" y=\"40\" width=\"220\" height=\"150\" rx=\"6\" fill=\"#fff\"/><rect x=\"68\" y=\"48\" width=\"204\" height=\"134\" fill=\"#CFE6F5\"/><rect x=\"167.0\" y=\"48\" width=\"6\" height=\"134\" fill=\"#fff\"/><rect x=\"68\" y=\"112.0\" width=\"204\" height=\"6\" fill=\"#fff\"/><g transform=\"translate(170 115)\"><circle cx=\"-50\" cy=\"10\" r=\"10\" fill=\"#E0605A\"/><circle cx=\"-20\" cy=\"-20\" r=\"10\" fill=\"#E0605A\"/><circle cx=\"20\" cy=\"0\" r=\"10\" fill=\"#E0605A\"/><circle cx=\"50\" cy=\"-26\" r=\"10\" fill=\"#E0605A\"/><circle cx=\"-10\" cy=\"26\" r=\"10\" fill=\"#E0605A\"/></g><g><rect x=\"330\" y=\"290\" width=\"420\" height=\"14\" rx=\"4\" fill=\"#C99A6B\"/><rect x=\"350\" y=\"304\" width=\"12\" height=\"70\" fill=\"#9C7450\"/><rect x=\"718\" y=\"304\" width=\"12\" height=\"70\" fill=\"#9C7450\"/></g><g><rect x=\"437.2\" y=\"304.6\" width=\"18\" height=\"75.4\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"464.8\" y=\"304.6\" width=\"18\" height=\"75.4\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"445.7\" cy=\"380\" rx=\"12.8\" ry=\"5.9\" fill=\"#3A3A3A\"/><ellipse cx=\"474.3\" cy=\"380\" rx=\"12.8\" ry=\"5.9\" fill=\"#3A3A3A\"/><line x1=\ age": [{"who": "", "s": [["s1", "My grandfather bought a smartphone last month."], ["s2", "At first, he wasn't able to use it well."], ["s3", "He couldn't even send a message."], ["s4", "So I taught him every evening."], ["s5", "He wrote the steps in his notebook and practiced very hard."], ["s6", "Now he is able to send messages and take pictures."], ["s7", "Yesterday he sent me a photo of his garden."], ["s8", "There were many red tomatoes in it."], ["s9", "He wrote, \"Thank you, my teacher!\""], ["s10", "Next, he wants to learn video calls."], ["s11", "Then he will be able to talk with my cousin in Canada."], ["s12", "I'm proud of him."]]}], "trans": ["祖父は先月スマートフォンを買いました。最初はうまく使うことができませんでした。メッセージを送ることさえできませんでした。そこで私が毎晩教えました。祖父はやり方をノートに書いて、一生懸命練習しました。今ではメッセージを送ったり、写真をとったりすることができます。昨日、祖父は庭の写真を送ってくれました。赤いトマトがたくさん写っていました。祖父は「ありがとう、先生！」と書いてきました。次はビデオ通話を覚えたいそうです。そうすればカナダにいるいとこと話せるようになります。私は祖父を誇りに思います。"], "rq": [{"q": "What couldn't the grandfather do at first?", "qja": "祖父が最初にできなかったことは何ですか。", "opts": ["Write in his notebook.", "Grow tomatoes.", "Talk with the writer.", "Send a message."], "ans": 3, "ev": ["s3"]}, {"q": "What did the grandfather send yesterday?", "qja": "祖父は昨日何を送りましたか。", "opts": ["Some red tomatoes.", "A photo of his garden.", "A video of the writer's cousin.", "His notebook."], "ans": 1, "ev": ["s7"]}, {"q": "Why does the grandfather want to learn video calls?", "qja": "祖父はなぜビデオ通話を覚えたいのですか。", "opts": ["To teach the writer.", "To talk with the writer's cousin in Canada.", "To show his garden on TV.", "To buy a new smartphone."], "ans": 1, "ev": ["s11"]}]}, {"id": "2-08", "lv": "2", "rev": false, "title": "My Hobby", "ja": "私の趣味", "book": "Lesson 2-4", "words": 94, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"写真が趣味の私。雪の中の小鳥を撮影。\"><defs><linearGradient id=\"g28\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#DCE6EF\"/><stop offset=\"1\" stop-color=\"#F5F8FB\"/></linearGradient>< fill=\"#2B3F5C\"/></svg>", "alt": "市民プールでナオと一緒に泳ぐ練習。25メートル泳げた！", "passage": [{"who": "", "s": [["s1", "I couldn't swim when I was little."], ["s2", "I was afraid of the water, so I stopped going to the pool."], ["s3", "Last summer, my friend Nao said, \"Let's practice together.\""], ["s4", "I didn't want to go at first, but she didn't give up."], ["s5", "We practiced at the city pool every Saturday."], ["s6", "Nao showed me a good way of breathing in the water."], ["s7", "Little by little, I stopped being afraid."], ["s8", "In August, I finally swam twenty-five meters."], ["s9", "Nao and I were very happy."], ["s10", "Now I enjoy swimming, and I want to try fifty meters next summer."]]}], "trans": ["私は小さいころ泳げませんでした。水がこわかったので、プールに行くのをやめてしまいました。去年の夏、友達のナオが「一緒に練習しよう」と言ってくれました。最初は行きたくありませんでしたが、ナオはあきらめませんでした。私たちは毎週土曜日に市⺠プールで練習しました。ナオは水の中での上手な息つぎのしかたを見せてくれました。少しずつ、私はこわがらなくなりました。8月、ついに25メートル泳ぎました。ナオも私もとてもうれしかったです。今では泳ぐのが楽しく、来年の夏は50メートルに挑戦したいと思っています。"], "rq": [{"q": "Why did the writer stop going to the pool?", "qja": "筆者はなぜプールに行くのをやめたのですか。", "opts": ["Because the writer was afraid of the water.", "Because the pool was far away.", "Because Nao didn't go.", "Because the writer was sick."], "ans": 0, "ev": ["s2"]}, {"q": "How often did the writer and Nao practice?", "qja": "筆者とナオはどのくらいの頻度で練習しましたか。", "opts": ["Every day.", "Every Sunday.", "Every Saturday.", "Once a month."], "ans": 2, "ev": ["s5"]}, {"q": "What did the writer do in August?", "qja": "筆者は8月に何をしましたか。", "opts": ["Swam fifty meters.", "Swam twenty-five meters.", "Taught Nao how to swim.", "Stopped swimming."], "ans": 1, "ev": ["s8"]}]}, {"id": "2-10", "lv": "2", "rev": false, "title": "Kendama", "ja": "けん玉", "book": "Lesson 2-5", "words": 102, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"日本の伝統的なおもちゃ、けん玉。\"><rect width=\"960\" height=\"400\" fill=\"#F7EEDF\"/><circle cx=\"480\" cy=\"220\" r=\"170\" fill=\"#F3E2C4\"/><g transform=\"translate(420 360) scale(1.2)\ urday, I went to the summer festival in my town with my friend Emi."], ["s2", "There were many people wearing yukata."], ["s3", "We bought some fried chicken and ate it under the trees."], ["s4", "On the stage, a boy playing the taiko drum was very cool."], ["s5", "He was our classmate, Shun!"], ["s6", "The sound was really exciting."], ["s7", "After that, we watched the fireworks."], ["s8", "A picture taken by Emi was very beautiful."], ["s9", "She put it on our class website."], ["s10", "Many students said that it was the best picture of the festival."], ["s11", "I'm going to go again next year."]]}], "trans": ["先週の土曜日、友達のエミと町の夏祭りに行きました。浴衣を着ている人がたくさんいました。私たちはからあげを買って、木の下で食べました。ステージで太鼓をたたいている男の子がとてもかっこよかったです。それはクラスメートのシュンでした！その音は本当にわくわくするものでした。そのあと、花火を見ました。エミがとった写真はとてもきれいでした。彼女はそれをクラスのウェブサイトにのせました。多くの生徒が、それはお祭りで一番の写真だと言いました。来年もまた行くつもりです。"], "rq": [{"q": "What did the writer and Emi eat?", "qja": "筆者とエミは何を食べましたか。", "opts": ["Ice cream.", "Yakisoba.", "Cotton candy.", "Fried chicken."], "ans": 3, "ev": ["s3"]}, {"q": "Who was the boy playing the taiko drum?", "qja": "太鼓をたたいていた男の子はだれでしたか。", "opts": ["Emi's brother.", "Shun, a classmate.", "The writer's brother.", "A famous drummer."], "ans": 1, "ev": ["s4", "s5"]}, {"q": "Who took the beautiful picture?", "qja": "きれいな写真をとったのはだれですか。", "opts": ["The writer.", "Emi.", "Shun.", "A teacher."], "ans": 1, "ev": ["s8"]}]}, {"id": "2-12", "lv": "2", "rev": false, "title": "Eat Breakfast!", "ja": "朝ごはんを食べよう！", "book": "Lesson 2-6", "words": 98, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"朝ごはんを食べよう。バナナと牛乳の簡単な朝食。\"><rect width=\"960\" height=\"310\" fill=\"#FFF6E2\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#D9B48C\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><rect x=\"380\" y=\"30\" width=\"200\" height=\"130\" rx=\"6\" fill=\"#fff\"/><rect x=\"388\" y=\"38\" width=\"184\" height=\"114\" fill=\"#CFE6F5\"/><rect x=\"477.0\" y=\"38\" w s out of thirty don't eat breakfast."], ["s4", "Many of them said that they didn't have time."], ["s5", "Some said that they weren't hungry in the morning."], ["s6", "Our teacher told us that breakfast gives us energy for the day."], ["s7", "It is important to eat something before school."], ["s8", "It is not difficult to make a simple breakfast."], ["s9", "For example, you can eat a banana and drink a glass of milk."], ["s10", "If you get up ten minutes earlier, you will have time for breakfast."], ["s11", "Why don't you try it tomorrow?"]]}], "trans": ["毎朝、朝ごはんを食べていますか。私たちのクラスでアンケートをとりました。30人中10人が朝ごはんを食べていません。その多くは、時間がないと答えました。朝はおなかがすいていないと答えた人もいました。先生は、朝ごはんはその日のエネルギーになると教えてくれました。学校へ行く前に何か食べることが大切です。簡単な朝ごはんを作るのは難しくありません。たとえば、バナナを1本食べて、牛乳を1杯飲めばよいのです。10分早く起きれば、朝ごはんの時間ができます。明日からやってみませんか。"], "rq": [{"q": "How many students in the class don't eat breakfast?", "qja": "クラスで朝ごはんを食べていない生徒は何人ですか。", "opts": ["Thirty.", "Twenty.", "Three.", "Ten."], "ans": 3, "ev": ["s3"]}, {"q": "Why don't many of them eat breakfast?", "qja": "その多くはなぜ朝ごはんを食べないのですか。", "opts": ["Because they don't have time.", "Because they don't like bananas.", "Because their teacher told them not to.", "Because they eat lunch early."], "ans": 0, "ev": ["s4"]}, {"q": "What does the writer suggest?", "qja": "筆者は何を提案していますか。", "opts": ["Eating a big lunch at school.", "Drinking milk at night.", "Getting up earlier and eating a simple breakfast.", "Doing another survey."], "ans": 2, "ev": ["s8", "s10"]}]}, {"id": "2-13", "lv": "2", "rev": false, "title": "Our Favorite Seasons", "ja": "クラスの好きな季節", "book": "Lesson 2-6", "words": 93, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"クラスの好きな季節：夏12人、春9人、秋6人、冬3人。\"><rect width=\"960\" height=\"400\" fill=\"#FAF7F0\"/><rect x=\"90\" y=\"76\" width=\"120\" height=\"264\" rx=\"6\" fill=\"#5FB4E0\"/><text x=\"150\" y=\"66\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"26\" se it."], ["s4", "They like summer because they can swim in the sea."], ["s5", "Spring was the second."], ["s6", "Nine students said that spring is better than fall because of the cherry blossoms."], ["s7", "Fall was chosen by six students."], ["s8", "They said that fall food is the most delicious of all."], ["s9", "Only three students chose winter."], ["s10", "Winter was not as popular as the other seasons."], ["s11", "But winter is my favorite."], ["s12", "I think that snow is more beautiful than flowers!"]]}], "trans": ["私たちはクラスメートに「どの季節が一番好きですか」とたずねました。夏が一番人気でした。12人が夏を選びました。海で泳げるので夏が好きなのです。2番目は春でした。9人が、桜があるので春は秋より良いと答えました。秋は6人に選ばれました。秋の食べ物が一番おいしいと答えました。冬を選んだのは3人だけでした。冬はほかの季節ほど人気がありませんでした。でも、冬は私の一番好きな季節です。雪は花よりも美しいと思います！"], "rq": [{"q": "Which season was the most popular?", "qja": "一番人気だった季節はどれですか。", "opts": ["Summer.", "Spring.", "Fall.", "Winter."], "ans": 0, "ev": ["s2"]}, {"q": "How many students chose fall?", "qja": "秋を選んだ生徒は何人ですか。", "opts": ["Twelve.", "Nine.", "Six.", "Three."], "ans": 2, "ev": ["s7"]}, {"q": "What is the writer's favorite season?", "qja": "筆者の一番好きな季節はどれですか。", "opts": ["Summer.", "Winter.", "Spring.", "Fall."], "ans": 1, "ev": ["s11"]}]}, {"id": "2-14", "lv": "2", "rev": false, "title": "The Lost Dog", "ja": "迷子の犬", "book": "Lesson 2-7", "words": 95, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"公園で迷子の白い犬ココを見つけた。飼い主の女性が走ってくる。\"><defs><linearGradient id=\"g214\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g214)\"/><g transform=\"translate(140 60) scale(1)\" fill=\"#fff\" opacity=\"1\"><ellipse cx=\"0\" cy=\"0\" rx=\"46\" ry=\"22\"/><ellipse cx=\"-30\" cy=\"6\" rx=\"30\" ry=\"18\"/><ellipse cx=\"34\" cy=\"6\" rx=\"32\" ry=\"18\"/><ellipse cx=\"6\" cy=\"-14\" rx=\"28\" ry=\"20\"/></g><g transform=\"translate(90 320) scale(1)\"><rect x=\"-9\" y  cy=\"299.9\" r=\"7.4\" fill=\"#F6D3B8\"/><line x1=\"742\" y1=\"259.6\" x2=\"777.3\" y2=\"248.1\" stroke=\"#E07A5F\" stroke-width=\"12\" stroke-linecap=\"round\"/><circle cx=\"777.3\" cy=\"248.1\" r=\"7.4\" fill=\"#F6D3B8\"/><path d=\"M 694.4 257.6 Q 694.4 251.6 702.4 251.6 L 737.6 251.6 Q 745.6 251.6 745.6 257.6 L 747.6 302.8 L 692.4 302.8 Z\" fill=\"#E07A5F\"/><rect x=\"713.3\" y=\"245.4\" width=\"13.3\" height=\"12.5\" fill=\"#F6D3B8\"/><circle cx=\"720\" cy=\"230.8\" r=\"20.8\" fill=\"#F6D3B8\"/><path d=\"M 698.4 233.9 Q 696.1 205.8 720 208.3 Q 743.9 205.8 741.6 233.9 Q 734.6 220.4 722.1 221.4 Q 707.5 224.6 698.4 233.9 Z\" fill=\"#6B4226\"/><circle cx=\"712.1\" cy=\"233.3\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"727.9\" cy=\"233.3\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"709\" cy=\"239.5\" r=\"2.7\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"731\" cy=\"239.5\" r=\"2.7\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 714.8 240.2 Q 720 244.9 725.2 240.2\" stroke=\"#7A3B2E\" stroke-width=\"1.9\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>", "alt": "公園で迷子の白い犬ココを見つけた。飼い主の女性が走ってくる。", "passage": [{"who": "", "s": [["s1", "Last Sunday, when I was walking in the park, I saw a small white dog."], ["s2", "It was alone and looked scared."], ["s3", "Because it had a name tag, I could read its name, \"Coco,\" and a phone number."], ["s4", "I called the number at once."], ["s5", "A woman answered."], ["s6", "She sounded very worried."], ["s7", "\"If you wait there, I'll come soon,\" she said."], ["s8", "While I was waiting with Coco, I gave her some water."], ["s9", "Ten minutes later, the woman ran into the park."], ["s10", "When Coco saw her, she jumped into her arms."], ["s11", "The woman thanked me again and again."]]}], "trans": ["先週の日曜日、公園を歩いていると、小さな白い犬を見かけました。ひとりぼっちで、おびえているように見えました。名札がついていたので、「ココ」という名前と電話番号を読むことができました。私はすぐにその番号に電話しました。女の人が出ました。とても心配しているような声でした。「そこで待っていてくれたら、すぐに行きます」と彼女は言いました。ココと待っている間、私はココに水をあげました。10分後、その女の人が公園に走ってきました。ココは彼女を見ると、その腕の中に飛びこみました。女の人は何度も何度も私にお礼を言いました。"], "rq": [{"q": "How did the writer know the dog's name?", "qja": "筆者はどうやって犬の名前を知りましたか。", "opts": ["From the woman on the phone.", "From a poster in the park.", "From a friend.", "From its name tag."], "ans": 3, "ev": ["s3"]}, {"q": "What did the writer do while waiting?", "qja": "筆者は待っている間に何をしましたか。", "opts": ["Took Coco home.", "Called the police.", "Gave Coco some water.", "Bought some dog food."], "ans": 2, "ev": ["s8"]}, {"q": "What happened when Coco saw the woman?", "qja": "ココが女の人を見たとき、何が起きましたか。", "opts": ["Coco jumped into her arms.", "Coco ran away.", "Coco started to cry.", "Coco went to sleep."], "ans": 0, "ev": ["s10"]}]}, {"id": "2-15", "lv": "2", "rev": false, "title": "A Letter to My Host Family", "ja": "ホストファミリーへの手紙", "book": "Lesson 2-7", "words": 99, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"オーストラリアのホストファミリーとのバーベキュー。\"><defs><linearGradient id=\"g215\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#F6C38A\"/><stop offset=\"1\" stop-color=\"#FCE6CC\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g215)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(0 860 80)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(45 860 80)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(90 860 80)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(135 860 80)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(180 860 80)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(225 860 80)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" fill=\"#F6C343\" transform=\"rotate(270 860 80)\"/><rect x=\"857\" y=\"24\" width=\"6\" height=\"14\" rx=\"3\" ight=\"58.8\" fill=\"#EBC09E\"/><path d=\"M 697.6 315.2 L 742.4 315.2 L 750.5 345 L 689.5 345 Z\" fill=\"#E07A5F\"/><ellipse cx=\"708.2\" cy=\"380\" rx=\"10.5\" ry=\"4.9\" fill=\"#3A3A3A\"/><ellipse cx=\"731.8\" cy=\"380\" rx=\"10.5\" ry=\"4.9\" fill=\"#3A3A3A\"/><line x1=\"700.8\" y1=\"283.4\" x2=\"669.6\" y2=\"245.6\" stroke=\"#E89AB0\" stroke-width=\"10.5\" stroke-linecap=\"round\"/><circle cx=\"669.6\" cy=\"245.6\" r=\"6.5\" fill=\"#EBC09E\"/><line x1=\"739.2\" y1=\"283.4\" x2=\"770.4\" y2=\"245.6\" stroke=\"#E89AB0\" stroke-width=\"10.5\" stroke-linecap=\"round\"/><circle cx=\"770.4\" cy=\"245.6\" r=\"6.5\" fill=\"#EBC09E\"/><path d=\"M 697.6 282.4 Q 697.6 276.4 705.6 276.4 L 734.4 276.4 Q 742.4 276.4 742.4 282.4 L 744.4 321.2 L 695.6 321.2 Z\" fill=\"#E89AB0\"/><rect x=\"714.2\" y=\"270.9\" width=\"11.6\" height=\"10.9\" fill=\"#EBC09E\"/><circle cx=\"720\" cy=\"258.2\" r=\"18.2\" fill=\"#EBC09E\"/><path d=\"M 701.1 260.9 Q 699.1 236.4 720 238.5 Q 740.9 236.4 738.9 260.9 Q 732.7 249.1 721.8 250 Q 709.1 252.7 701.1 260.9 Z\" fill=\"#2A2320\"/><circle cx=\"713.1\" cy=\"260.4\" r=\"1.8\" fill=\"#2A2A2A\"/><circle cx=\"726.9\" cy=\"260.4\" r=\"1.8\" fill=\"#2A2A2A\"/><circle cx=\"710.4\" cy=\"265.8\" r=\"2.4\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"729.6\" cy=\"265.8\" r=\"2.4\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 715.5 266.4 Q 720 270.6 724.5 266.4\" stroke=\"#7A3B2E\" stroke-width=\"1.6\" fill=\"none\" stroke-linecap=\"round\"/></g><path transform=\"translate(720 150) scale(1.6)\" d=\"M0 8 C-20 -6 -14 -22 0 -12 C14 -22 20 -6 0 8Z\" fill=\"#E0605A\"/></svg>", "alt": "オーストラリアのホストファミリーとのバーベキュー。", "passage": [{"who": "", "s": [["s1", "Dear Mr. and Mrs. Smith, Thank you for everything."], ["s2", "Before I went to Australia, I was nervous because my English wasn't very good."], ["s3", "When I arrived at your house, you smiled at me and said, \"Welcome home.\""], ["s4", "I felt happy then."], ["s5", "After school, we often went to the beach together."], ["s6", "I will never forget the barbecue on my last night."], ["s7", "I was so sad when I said goodbye at the airport."], ["s8", "I will study English harder, so I can talk with you more next time."], ["s9", "If you come to Japan, I will show you around my town."], ["s10", "Love, Yui"]]}], "trans": ["スミスさんご夫妻へ。いろいろとありがとうございました。オーストラリアに行く前、私は英語があまり得意ではなかったので不安でした。お宅に着いたとき、お二人は私にほほえんで「おかえりなさい」と言ってくれました。そのとき私はうれしくなりました。放課後はよく一緒に浜辺へ行きましたね。最後の夜のバーベキューは決して忘れません。空港でさよならを言ったときは、とても悲しかったです。次はもっとお話しできるように、英語をもっと一生懸命勉強します。日本に来たら、私の町を案内します。ユイより"], "rq": [{"q": "Why was Yui nervous before she went to Australia?", "qja": "ユイはオーストラリアに行く前、なぜ不安だったのですか。", "opts": ["Because she didn't like the beach.", "Because she was afraid of airplanes.", "Because the Smiths didn't smile.", "Because her English wasn't very good."], "ans": 3, "ev": ["s2"]}, {"q": "What did Yui and the Smiths often do after school?", "qja": "ユイとスミス夫妻は放課後によく何をしましたか。", "opts": ["They had a barbecue.", "They went to the beach.", "They studied Japanese.", "They went to the airport."], "ans": 1, "ev": ["s5"]}, {"q": "What will Yui do if the Smiths come to Japan?", "qja": "スミス夫妻が日本に来たら、ユイは何をしますか。", "opts": ["Take them to a beach in Australia.", "Show them around her town.", "Teach them English.", "Have a barbecue at the airport."], "ans": 1, "ev": ["s9"]}]}, {"id": "2-R1", "lv": "2", "rev": true, "title": "A Trip to Kyoto", "ja": "京都への修学旅行", "book": "Lesson 2-1〜2-7（総復習）", "words": 151, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"京都への修学旅行：金閣寺と、自転車で古い町並みを走る生徒たち。\"><defs><linearGradient id=\"g2r1\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g2r1)\"/><path d=\"M0 230 Q160 140 330 230 T660 230 T960 220 V400 H0Z\" fill=\"#9CCB85\"/><path d=\"M0 250 Q240 190 480 250 T960 240 V400 H0Z\" fill=\"#7FB06E\"/><ellipse cx=\"300\" c "s5", "Our guide told us that the temple is visited by millions of people every year."], ["s6", "On the second day, my group decided to rent bicycles."], ["s7", "Riding a bike along the old streets was a lot of fun."], ["s8", "We stopped at a small shop to buy some Japanese sweets for our families."], ["s9", "The owner gave us some green tea, too."], ["s10", "In the evening, we were very tired because we rode for five hours."], ["s11", "But when we saw the lights of the city from a hill, we forgot about it."], ["s12", "I want to visit Kyoto again with my family."], ["s13", "Next time, I will take them to Kinkakuji first, and we will eat sweets at that shop together."]]}], "trans": ["先月、私たちのクラスは京都へ修学旅行に行きました。1日目は金閣寺を訪れました。金閣寺は約600年前に建てられました。教科書の写真よりも美しかったです。ガイドさんは、この寺には毎年何百万人もの人が訪れると教えてくれました。2日目、私のグループは自転車を借りることにしました。古い町並みを自転車で走るのはとても楽しかったです。家族に和菓子を買うために、小さなお店に立ち寄りました。店主はお茶も出してくれました。夕方には、5時間も自転車に乗ったのでとても疲れていました。でも、丘の上から町の明かりを見たとき、疲れを忘れました。今度は家族と一緒にまた京都を訪れたいです。次はまず家族を金閣寺に連れて行き、あのお店で一緒に和菓子を食べるつもりです。"], "rq": [{"q": "When was Kinkakuji built?", "qja": "金閣寺はいつ建てられましたか。", "opts": ["About six hundred years ago.", "About one hundred years ago.", "About sixty years ago.", "About six thousand years ago."], "ans": 0, "ev": ["s3"]}, {"q": "Why did the group stop at a small shop?", "qja": "グループはなぜ小さなお店に立ち寄ったのですか。", "opts": ["To rent bicycles.", "To ask the way to Kinkakuji.", "To buy Japanese sweets for their families.", "To meet their guide."], "ans": 2, "ev": ["s8"]}, {"q": "Why were the students tired in the evening?", "qja": "生徒たちは夕方なぜ疲れていたのですか。", "opts": ["Because they walked up a high mountain.", "Because they rode bicycles for five hours.", "Because they got up very early.", "Because they visited many temples."], "ans": 1, "ev": ["s10"]}]}, {"id": "2-R2", "lv": "2", "rev": true, "title": "Our School Festival", "ja": "学校祭のお知らせ", "book": "Lesson 2-1〜2-7（総復習）", "words": 152, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"学 none\" stroke-linecap=\"round\"/></g><g transform=\"translate(570 160) scale(1.5)\" fill=\"#2B3F5C\"><ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"7\" transform=\"rotate(-20)\"/><rect x=\"7\" y=\"-34\" width=\"3.5\" height=\"34\"/><path d=\"M10 -34 q14 6 12 20 q-2 -10 -12 -12z\"/></g><g transform=\"translate(880 150) scale(1.3)\" fill=\"#2B3F5C\"><ellipse cx=\"0\" cy=\"0\" rx=\"9\" ry=\"7\" transform=\"rotate(-20)\"/><rect x=\"7\" y=\"-34\" width=\"3.5\" height=\"34\"/><path d=\"M10 -34 q14 6 12 20 q-2 -10 -12 -12z\"/></g></svg>", "alt": "学校祭：クラスのカフェ（クッキーと紅茶）と体育館での吹奏楽コンサート。", "passage": [{"who": "", "s": [["s1", "Our school festival will be held on Saturday, October 18."], ["s2", "There will be many events, such as a chorus contest, a drama, and food stands."], ["s3", "Each class has to prepare something special."], ["s4", "Our class is going to open a café."], ["s5", "We will sell cookies and tea."], ["s6", "The cookies will be made by our class, and the tea will be served in pretty cups."], ["s7", "Making cookies for two hundred people is not easy, so we must start practicing next week."], ["s8", "If you want to help, please come to the cooking room after school on Monday."], ["s9", "You don't have to bring anything."], ["s10", "Everyone is welcome."], ["s11", "Also, the brass band will give a concert in the gym at 1:00 p.m."], ["s12", "It will be the most exciting event of the day, so don't miss it."], ["s13", "Please tell your families and friends about the festival."], ["s14", "We hope that many people will come and enjoy it."], ["s15", "Thank you."]]}], "trans": ["私たちの学校祭は10月18日土曜日に開かれます。合唱コンクール、劇、食べ物の屋台など、たくさんの催しがあります。各クラスは何か特別なものを準備しなければなりません。私たちのクラスはカフェを開く予定です。クッキーと紅茶を売ります。クッキーはクラスで作り、紅茶はかわいいカップで出します。200人分のクッキーを作るのは簡単ではないので、来週から練習を始めなければなりません。手伝いたい人は、月曜日の放課後に調理室に来てください。何も持ってくる必要はありません。だれでも歓迎です。また、午後1時から体育館で吹奏楽部がコンサートを行います。その日一番わくわくする催しになるので、お見逃しなく。家族や友達に学校祭のことを伝えてください。たくさんの人に来て楽しんでもらえるといいと思っています。よろしくお願いします。"], "rq": [{"q": "What is the writer's class going to do at the festival?", "qja": "筆者のクラスは学校祭で何をする予定ですか。", "opts": ["Give a concert.", "Do a drama.", "Join the chorus contest.", "Open a café."], "ans": 3, "ev": ["s4"]}, {"q": "What should students do if they want to help?", "qja": "手伝いたい生徒はどうすればよいですか。", "opts": ["Bring cookies to school on Monday.", "Go to the gym at 1:00 p.m.", "Come to the cooking room after school on Monday.", "Tell their families about the café."], "ans": 2, "ev": ["s8"]}, {"q": "Where will the brass band give a concert?", "qja": "吹奏楽部はどこでコンサートを行いますか。", "opts": ["In the gym.", "In the cooking room.", "In the café.", "In the music room."], "ans": 0, "ev": ["s11"]}]}, {"id": "2-R3", "lv": "2", "rev": true, "title": "The Relay Race", "ja": "リレーのアンカー", "book": "Lesson 2-1〜2-7（総復習）", "words": 146, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"運動会のリレー。アンカーの私がバトンを持って1位でゴールへ。\"><defs><linearGradient id=\"g2r3\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g2r3)\"/><g transform=\"translate(160 60) scale(1)\" fill=\"#fff\" opacity=\"1\"><ellipse cx=\"0\" cy=\"0\" rx=\"46\" ry=\"22\"/><ellipse cx=\"-30\" cy=\"6\" rx=\"30\" ry=\"18\"/><ellipse cx=\"34\" cy=\"6\" rx=\"32\" ry=\"18\"/><ellipse cx=\"6\" cy=\"-14\" rx=\"28\" ry=\"20\"/></g><rect y=\"230\" width=\"960\" height=\"170\" fill=\"#D98C5F\"/><line x1=\"0\" y1=\"260\" x2=\"960\" y2=\"260\" stroke=\"#fff\" stroke-width=\"4\"/><line x1=\"0\" y1=\"310\" x2=\"960\" y2=\"310\" stroke=\"#fff\" stroke-width=\"4\"/><line x1=\"0\" y1=\"360\" x2=\"960\" y2=\"360\" stroke=\"#fff\" stroke-width=\"4\"/><rect x=\"800\" y=\"140\" width=\"10\" height=\"230\" fill=\"#fff\"/><rect x=\"800\" y=\"140\" width=\"10\" height=\"230\" fill=\"#fff\"/><line x1=\"805\" y1=\"250\" x2=\"805\" y2=\"380\" stroke=\"#fff\" stroke-width=\"10\"/><path d=\"M810 150 H900 V200 H810\" fill=\"none\ 8\" y=\"296.7\" width=\"17.5\" height=\"73.3\" rx=\"3\" fill=\"#2B3F5C\"/><rect x=\"384.7\" y=\"296.7\" width=\"17.5\" height=\"73.3\" rx=\"3\" fill=\"#2B3F5C\"/><ellipse cx=\"366.1\" cy=\"370\" rx=\"12.4\" ry=\"5.8\" fill=\"#3A3A3A\"/><ellipse cx=\"393.9\" cy=\"370\" rx=\"12.4\" ry=\"5.8\" fill=\"#3A3A3A\"/><line x1=\"357.3\" y1=\"256.1\" x2=\"318\" y2=\"297.7\" stroke=\"#fff\" stroke-width=\"12.4\" stroke-linecap=\"round\"/><circle cx=\"318\" cy=\"297.7\" r=\"7.7\" fill=\"#F2C7A5\"/><line x1=\"402.7\" y1=\"256.1\" x2=\"439.1\" y2=\"244.3\" stroke=\"#fff\" stroke-width=\"12.4\" stroke-linecap=\"round\"/><circle cx=\"439.1\" cy=\"244.3\" r=\"7.7\" fill=\"#F2C7A5\"/><path d=\"M 353.6 253.9 Q 353.6 247.9 361.6 247.9 L 398.4 247.9 Q 406.4 247.9 406.4 253.9 L 408.4 300.7 L 351.6 300.7 Z\" fill=\"#fff\"/><rect x=\"373.1\" y=\"241.5\" width=\"13.7\" height=\"12.9\" fill=\"#F2C7A5\"/><circle cx=\"380\" cy=\"226.4\" r=\"21.4\" fill=\"#F2C7A5\"/><path d=\"M 357.7 229.7 Q 355.3 200.7 380 203.3 Q 404.7 200.7 402.3 229.7 Q 395 215.7 382.1 216.8 Q 367.1 220 357.7 229.7 Z\" fill=\"#6B4226\"/><path d=\"M 357.5 222.2 Q 380 192.1 402.5 222.2 Z\" fill=\"#4C7BD9\"/><rect x=\"375.7\" y=\"218.3\" width=\"34.3\" height=\"4.7\" rx=\"3\" fill=\"#4C7BD9\"/><circle cx=\"371.8\" cy=\"229\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"388.2\" cy=\"229\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"368.6\" cy=\"235.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"391.4\" cy=\"235.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 374.6 236.1 Q 380 241 385.4 236.1\" stroke=\"#7A3B2E\" stroke-width=\"1.9\" fill=\"none\" stroke-linecap=\"round\"/></g></svg>", "alt": "運動会のリレー。アンカーの私がバトンを持って1位でゴールへ。", "passage": [{"who": "", "s": [["s1", "Sports Day was held last Friday."], ["s2", "Our class was in the relay race, and I was the last runner, so I was very nervous."], ["s3", "Before the race, our teacher said to me, \"Don't worry. Just enjoy running.\""], ["s4", "When the race started, our team was in third place."], ["s5", "I was standing at the line, and my heart was beating fast."], ["s6", "Then Kaito, the fastest runner in our class, passed two runners."], ["s7", "When I got the baton, we were in first place."], ["s8", "But a runner from Class 2 was faster than me."], ["s9", "He was getting closer and closer."], ["s10", "I ran as hard as I could."], ["s11", "Finally, I crossed the finish line first!"], ["s12", "Everyone in our class shouted with joy."], ["s13", "I think that we won because we all tried our best."], ["s14", "That day became the best day of my school life."], ["s15", "The victory made all of us very happy."]]}], "trans": ["先週の金曜日に体育祭が開かれました。私たちのクラスはリレーに出場し、私はアンカーだったので、とても緊張していました。レースの前、先生は私に「心配しないで。ただ走ることを楽しんで」と言ってくれました。レースが始まったとき、私たちのチームは3位でした。私はラインに立っていて、胸がどきどきしていました。そのあと、クラスで一番足の速いカイトが2人を追い抜きました。私がバトンを受け取ったとき、私たちは1位でした。でも、2組の走者は私より速かったのです。彼はどんどん近づいてきました。私は全力で走りました。ついに、私が1位でゴールしました！クラスのみんなが喜びの声を上げました。私たちが勝ったのは、全員がベストを尽くしたからだと思います。その日は私の学校生活で最高の日になりました。その勝利は私たちみんなをとても幸せにしてくれました。"], "rq": [{"q": "Why was the writer nervous?", "qja": "筆者はなぜ緊張していたのですか。", "opts": ["Because the writer was sick.", "Because the teacher was angry.", "Because the writer was the slowest runner.", "Because the writer was the last runner."], "ans": 3, "ev": ["s2"]}, {"q": "Who passed two runners?", "qja": "2人を追い抜いたのはだれですか。", "opts": ["The writer.", "Kaito.", "A runner from Class 2.", "The teacher."], "ans": 1, "ev": ["s6"]}, {"q": "Why does the writer think the class won?", "qja": "筆者はなぜクラスが勝ったと考えていますか。", "opts": ["Because Class 2 fell down.", "Because everyone tried their best.", "Because the writer practiced every day.", "Because the teacher ran with them."], "ans": 1, "ev": ["s13"]}]}, {"id": "2-R4", "lv": "2", "rev": true, "title": "An Email from Vancouver", "ja": "バンクーバーからのメール", "book": "Lesson 2-1〜2-7（総復習）", "words": 152, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"バンクーバーから家族へのメール。ホストマザーとのパンケーキ、アイ 7\" height=\"12.9\" fill=\"#FBE0CB\"/><circle cx=\"560\" cy=\"241.4\" r=\"21.4\" fill=\"#FBE0CB\"/><path d=\"M 537.7 244.7 Q 535.3 215.7 560 218.3 Q 584.7 215.7 582.3 244.7 Q 575 230.7 562.1 231.8 Q 547.1 235 537.7 244.7 Z\" fill=\"#E2B85C\"/><circle cx=\"551.8\" cy=\"244\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"568.2\" cy=\"244\" r=\"2.1\" fill=\"#2A2A2A\"/><circle cx=\"548.6\" cy=\"250.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><circle cx=\"571.4\" cy=\"250.5\" r=\"2.8\" fill=\"#F29B9B\" opacity=\".55\"/><path d=\"M 554.6 251.1 Q 560 256 565.4 251.1\" stroke=\"#7A3B2E\" stroke-width=\"1.9\" fill=\"none\" stroke-linecap=\"round\"/></g><rect x=\"670\" y=\"300\" width=\"260\" height=\"90\" rx=\"40\" fill=\"#E9F4FA\" stroke=\"#9DB4CF\" stroke-width=\"4\"/><line x1=\"800\" y1=\"300\" x2=\"800\" y2=\"390\" stroke=\"#E0605A\" stroke-width=\"4\"/><circle cx=\"800\" cy=\"345\" r=\"16\" fill=\"none\" stroke=\"#4C7BD9\" stroke-width=\"3\"/><path d=\"M720 380 l20 -60\" stroke=\"#333\" stroke-width=\"5\"/><path d=\"M740 320 h20\" stroke=\"#333\" stroke-width=\"7\"/><ellipse cx=\"820\" cy=\"370\" rx=\"8\" ry=\"4\" fill=\"#111\"/><g><rect x=\"40\" y=\"30\" width=\"110\" height=\"74\" rx=\"6\" fill=\"#fff\" stroke=\"#C9C1B2\" stroke-width=\"3\"/><path d=\"M40 30 L95.0 70.7 L150 30\" fill=\"none\" stroke=\"#C9C1B2\" stroke-width=\"3\"/><path d=\"M87.0 75.88 q8 -10 16 0 q-8 10 -16 0\" fill=\"#E0605A\"/></g></svg>", "alt": "バンクーバーから家族へのメール。ホストマザーとのパンケーキ、アイスホッケーの試合。", "passage": [{"who": "", "s": [["s1", "Dear Mom and Dad, This is my third week in Vancouver."], ["s2", "Everything here is different from Japan."], ["s3", "School starts at 8:30 and finishes at 3:00."], ["s4", "Students don't have to wear uniforms, and they can choose some of their own classes."], ["s5", "I was surprised that students eat lunch in only twenty minutes!"], ["s6", "My host family is very kind to me."], ["s7", "My host mother cooks dinner every night, and she taught me to make pancakes."], ["s8", "They are bigger and softer than the pancakes in Japan."], ["s9", "It is easy for me to talk with my host brother, Liam, because he is interested in Japanese anime."], ["s10", "Last weekend, he took me to an ice hockey game."], ["s11", "Ice hockey is more popular than soccer here."], ["s12", "The game was very exciting."], ["s13", "I want to watch another game soon."], ["s14", "I think that my English is getting better little by little."], ["s15", "I will send you more pictures soon."], ["s16", "Love, Haruto"]]}], "trans": ["お父さん、お母さんへ。バンクーバーに来て3週目になりました。ここでは何もかもが日本と違います。学校は8時30分に始まり、3時に終わります。生徒は制服を着なくてもよく、授業の一部を自分で選ぶことができます。生徒がたった20分で昼食を食べることに驚きました！ホストファミリーはとても親切にしてくれます。ホストマザーは毎晩夕食を作ってくれて、パンケーキの作り方も教えてくれました。日本のパンケーキより大きくてふわふわです。ホストブラザーのリアムは日本のアニメに興味があるので、彼とは話しやすいです。先週末、リアムはアイスホッケーの試合に連れて行ってくれました。ここではアイスホッケーはサッカーより人気があります。試合はとても興奮しました。またすぐに試合を見たいです。英語が少しずつ上達していると思います。また写真を送ります。ハルトより"], "rq": [{"q": "What surprised Haruto at school?", "qja": "ハルトは学校で何に驚きましたか。", "opts": ["Students have to wear uniforms.", "School starts at 7:00.", "There are no classes on Friday.", "Students eat lunch in only twenty minutes."], "ans": 3, "ev": ["s5"]}, {"q": "Why is it easy for Haruto to talk with Liam?", "qja": "ハルトはなぜリアムと話しやすいのですか。", "opts": ["Because Liam is interested in Japanese anime.", "Because Liam speaks Japanese well.", "Because Liam is in Haruto's class.", "Because Liam likes pancakes."], "ans": 0, "ev": ["s9"]}, {"q": "Which sport is more popular than soccer in Vancouver?", "qja": "バンクーバーでサッカーより人気のあるスポーツはどれですか。", "opts": ["Baseball.", "Basketball.", "Ice hockey.", "Tennis."], "ans": 2, "ev": ["s11"]}]}, {"id": "2-R5", "lv": "2", "rev": true, "title": "Saving Energy at Home", "ja": "家でできる省エネ", "book": "Lesson 2-1〜2-7（総復習）", "words": 149, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"家でできる省エネ：電気を消す、冷蔵庫をあまり開けない、扇風機を使う。\"><rect width=\"960\" height=\"310\" fill=\"#EEF6EF\"/><rect y=\"310\" width=\"960\" height=\"90\" fill=\"#C9B596\"/><rect y=\"302\" width=\"960\" height=\"8\" fill=\"#fff\" opacity=\".7\"/><g transform=\"translate(170 160) scale(1.4)\"><circle cx=\"0\" cy=\"-30\" r=\"26\" fill=\"#ddd\"/><rect x=\"-11\" y=\"-6\" width=\"22\" height=\"18\" rx=\"3\" fill=\"#999\"/></g><line x1=\"170\" y1=\"0\" x2=\"170\" y2=\"82\" stroke=\"#999\" stroke-width=\"3\"/><rect x=\"120\" y=\"230\" width=\"100\" height=\"44\" rx=\"6\" fill=\"#fff\" stroke=\"#B9C2CF\" stroke-width=\"3\"/><path d=\"M152 262 v-20 h16\" stroke=\"#2B3F5C\" stroke-width=\"5\" fill=\"none\"/><text x=\"170\" y=\"310\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"26\" fill=\"#2B3F5C\">OFF</text><g><rect x=\"400\" y=\"110\" width=\"110\" height=\"230\" rx=\"10\" fill=\"#E9EEF5\" stroke=\"#B9C2CF\" stroke-width=\"3\"/><line x1=\"400\" y1=\"197.4\" x2=\"510\" y2=\"197.4\" stroke=\"#B9C2CF\" stroke-width=\"3\"/><rect x=\"490\" y=\"130\" width=\"7\" height=\"36\" rx=\"3\" fill=\"#9DA8B8\"/><rect x=\"490\" y=\"213.5\" width=\"7\" height=\"46\" rx=\"3\" fill=\"#9DA8B8\"/></g><text x=\"455\" y=\"360\" text-anchor=\"middle\" font-family=\"Verdana,Arial,sans-serif\" font-weight=\"700\" font-size=\"22\" fill=\"#2B3F5C\">close</text><g transform=\"translate(720 340)\"><rect x=\"-6\" y=\"-120\" width=\"12\" height=\"120\" fill=\"#B9C2CF\"/><ellipse cx=\"0\" cy=\"0\" rx=\"50\" ry=\"10\" fill=\"#B9C2CF\"/><circle cx=\"0\" cy=\"-160\" r=\"56\" fill=\"#fff\" stroke=\"#9DB4CF\" stroke-width=\"5\"/><ellipse cx=\"0\" cy=\"-186\" rx=\"14\" ry=\"24\" fill=\"#8FC9E6\" transform=\"rotate(0 0 -160)\"/><ellipse cx=\"0\" cy=\"-186\" rx=\"14\" ry=\"24\" fill=\"#8FC9E6\" transform=\"rotate(120 0 -160)\"/><ellipse cx=\"0\" cy=\"-186\" rx=\"14\" ry=\"24\" fill=\"#8FC9E6\" transform=\"rotate(240 0 -160)\"/><circle cx=\"0\" cy=\"-160\" r=\"8\" fill=\"#9DB4CF\"/></g><g transform=\"translate(860 80)\"><circle r=\"44\" fill=\"#6CC49E\"/><path d=\"M-30 -8 q30 -30 60 0 q-30 50 -60 0\" fill=\"#4E9A6B\"/><path d=\"M-14 20 q14 10 28 0\" stroke=\"#fff\" stroke-width=\"3\" fill=\"none\"/></g></svg>", "alt": "家でできる省エネ：電気を消す、冷蔵庫をあまり開けない、扇風機を使う。", "passage": [{"who": "", "s": [["s1", "Many families in Japan use a lot of electricity every day."], ["s2", "Electricity is made mainly by burning oil, coal, and gas."], ["s3", "If we use too much of it, the earth will become warmer."], ["s4", "So we should try saving energy at home."], ["s5", "Here are some easy ideas."], ["s6", "First, turn off the lights when you leave a room."], ["s7", "Second, don't open the fridge door too often."], ["s8", "Cold air goes out every time you open it."], ["s9", "Third, use a fan instead of an air conditioner when it is not so hot."], ["s10", "A fan uses much less electricity than an air conditioner."], ["s11", "My family started doing these things last year."], ["s12", "As a result, our electricity bill became about ten percent cheaper."], ["s13", "It is not difficult to save energy."], ["s14", "If everyone does a little, it will make a big difference."], ["s15", "Saving energy is good for both our families and the earth."], ["s16", "Let's start today!"]]}], "trans": ["日本の多くの家庭は毎日たくさんの電気を使っています。電気は主に石油や石炭、ガスを燃やして作られています。電気を使いすぎると、地球はもっと暖かくなってしまいます。だから、家でエネルギーを節約するようにすべきです。簡単なアイデアをいくつか紹介します。第一に、部屋を出るときは電気を消しましょう。第二に、冷蔵庫のドアを何度も開けないようにしましょう。開けるたびに冷たい空気が外に出てしまいます。第三に、それほど暑くないときは、エアコンの代わりに扇風機を使いましょう。扇風機はエアコンよりずっと少ない電気しか使いません。私の家族は去年からこうしたことを始めました。その結果、電気代が約10パーセント安くなりました。エネルギーを節約するのは難しくありません。みんなが少しずつ行えば、大きな違いが生まれます。エネルギーの節約は、家族にとっても地球にとっても良いことです。今日から始めましょう！"], "rq": [{"q": "What will happen if we use too much electricity?", "qja": "電気を使いすぎると何が起こりますか。", "opts": ["The earth will become warmer.", "The lights will turn off.", "The fridge will break.", "Oil will become cheaper."], "ans": 0, "ev": ["s3"]}, {"q": "Which uses less electricity?", "qja": "少ない電気しか使わないのはどれですか。", "opts": ["An air conditioner.", "A fridge with its door open.", "A fan.", "A light in an empty room."], "ans": 2, "ev": ["s10"]}, {"q": "What happened to the writer's family's electricity bill?", "qja": "筆者の家の電気代はどうなりましたか。", "opts": ["It became about ten percent more expensive.", "It became about ten percent cheaper.", "It did not change.", "It became half."], "ans": 1, "ev": ["s12"]}]}, {"id": "3-01", "lv": "3", "rev": false, "title": "My Pen Pal in New Zealand", "ja": "ニュージーランドの文通相手", "book": "Lesson 3-1", "words": 116, "svg": "<svg xmlns=\"http://www.w3.org/2000/svg\" viewBox=\"0 0 960 400\" role=\"img\" aria-label=\"ニュージーランドの文通相手グレース。たくさんの羊がいる農場と、日本の私とのメール。\"><defs><linearGradient id=\"g31\" x1=\"0\" y1=\"0\" x2=\"0\" y2=\"1\"><stop offset=\"0\" stop-color=\"#CFE6F5\"/><stop offset=\"1\" stop-color=\"#EEF6FB\"/></linearGradient></defs><rect width=\"960\" height=\"400\" fill=\"url(#g31)\"/><path d=\"M0 260 Q160 170 330 260 T660 260 T960 250 V400 H0Z\" fill=\"#B9DFA0\"/><path d=\"M0 280 Q240 220 480 280 T960 270 V400 H0Z\" fill=\"#9CCB85\"/><g transform=\"translate(150 70) scale(1)\" fill=\"#fff\" opacity=\"1\"><ellipse cx=\"0\" cy=\"0\" rx=\"46\" ry=\"22\"/><ellipse cx=\"-30\" cy=\"6\" rx=\"30\" ry=\"18\"/><ellipse cx=\"34\" cy=\"6\" rx=\"32\" ry=\"18\"/><ellipse cx=\"6\" cy=\"-14\" rx=\"28\" ry=\"20\"/></g><g transform=\"translate(420 50) scale(0.7)\" fill=\"#fff\" opacity=\"1\"><ellipse cx=\"0\" cy=\"0\" rx=\"46\" ry=\"22\"/><ellipse cx=\"-30\" cy=\"6\" rx=\"30\" ry=\"18\"/><ellipse cx=\"34\" cy=\"6\" rx=\"32\" ry=\"18\"/><ellipse cx=\"6\" cy=\"-14\" rx=\"28\" ry=\"20\"/></g><g transform=\"translate(140 360) scale(1)\"><rect x=\"-22\" y=\"-12\" width=\"7\" height=\"14\" fill=\"#444\"/><rect x=\"14\" y=\"-12\" width=\"7\" height=\"14\" fill=\"#444\"/><circle cx=\"-26\" cy=\"-30\" r=\"15\" fill=\"#fff\"/><circle cx=\"-8\" cy=\"-40\" r=\"15\" fill=\"#fff\"/><circle cx=\"12\" cy=\"-38\" r=\"15\" fill=\"#fff\"/><circle cx=\"28\" cy=\"-28\" r=\"15\" fill=\"#fff\"/><circle cx=\"-16\" cy=\"-18\" r=\"15\" fill=\"#fff\"/><circle cx=\"8\" cy=\"-16\" r=\"15\" fill=\"#fff\"/><circle cx=\"26\" cy=\"-14\" r=\"15\"
