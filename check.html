<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{color-scheme:light} body{margin:0;font:14px system-ui,sans-serif;background:#F2F5FA}
img{max-width:100%} [hidden]{display:none!important}</style></head><body>
<title>英会話のための基本英文法完全マスター（解答入力版）</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">
<style>
  :root{
    color-scheme:light;
    --paper:#F2F5FA;
    --panel:#FFFFFF;
    --panel-2:#F7F9FC;
    --ink:#1A2233;
    --ink-2:#4B5872;
    --ink-3:#7D8AA4;
    --rule:#D2DAE7;
    --rule-soft:#E3E9F2;
    --red:#BE3527;
    --red-ink:#A82D20;
    --red-soft:#FAEAE7;
    --on-red:#FFFFFF;
    --pos-n:#215FA6;
    --pos-v:#136B52;
    --pos-adj:#9A6115;
    --pos-adv:#6F46A0;
    --shadow:0 1px 0 rgba(26,34,51,.04), 0 8px 24px -16px rgba(26,34,51,.35);

    --jp:"Zen Kaku Gothic New","Hiragino Kaku Gothic ProN","Yu Gothic",system-ui,sans-serif;
    --mincho:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
    --en:"Source Serif 4",Georgia,"Times New Roman",serif;
  }
  :root[data-app-theme="dark"]{
    color-scheme:dark;
    --paper:#0F151E;
    --panel:#18212F;
    --panel-2:#141C28;
    --ink:#E8EDF5;
    --ink-2:#AFBCD1;
    --ink-3:#7E8DA6;
    --rule:#2C3A4D;
    --rule-soft:#232F3F;
    --red:#F0897B;
    --red-ink:#F5A69A;
    --red-soft:#37211E;
    --on-red:#170D0B;
    --pos-n:#74ADEC;
    --pos-v:#5DC7A3;
    --pos-adj:#E3B066;
    --pos-adv:#B993E4;
    --shadow:0 1px 0 rgba(0,0,0,.2), 0 10px 26px -18px rgba(0,0,0,.9);
  }

  *{box-sizing:border-box}
  [hidden]{display:none !important}
  .en{font-family:var(--en)}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:var(--jp);
    font-size:15px;
    line-height:1.85;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{
    max-width:1120px;
    margin:0 auto;
    padding-inline:20px;
    padding-block:0 64px;
  }

  /* ---------- masthead ---------- */
  header.masthead{padding-block:44px 0}
  h1{
    font-family:var(--mincho);
    font-weight:600;
    font-size:clamp(15px,2vw,18px);
    line-height:1.5;
    margin:0 0 16px;
    letter-spacing:.12em;
    color:var(--ink-2);
  }
  .sub{
    margin:0 auto;
    display:flex;align-items:center;justify-content:center;gap:18px;
    max-width:900px;
  }
  .sub::before,.sub::after{
    content:"";flex:1 1 0;min-width:10px;height:1px;
    background:linear-gradient(to right,transparent,var(--rule),transparent);
  }
  .sub b{
    font-family:var(--mincho);
    font-weight:600;
    font-size:clamp(25px,4.4vw,40px);
    line-height:1.25;
    letter-spacing:.04em;
    color:var(--red);
    text-align:center;
    padding-bottom:10px;
    border-bottom:2px solid var(--red);
    text-wrap:balance;
  }
  @media (max-width: 640px){
    .sub{gap:10px}
    .sub b{letter-spacing:.02em}
  }

  /* ---------- theme toggle ---------- */
  .theme-toggle{display:inline-flex;align-items:center;gap:6px}
  .theme-toggle svg{width:14px;height:14px;flex:none}
  .theme-toggle .ic-sun{display:none}
  :root[data-app-theme="dark"] .theme-toggle .ic-sun{display:block}
  :root[data-app-theme="dark"] .theme-toggle .ic-moon{display:none}

  /* ---------- chapter / lesson selector ---------- */
  .chapters{
    display:flex;gap:4px;flex-wrap:wrap;
    margin-top:30px;
    border-bottom:1px solid var(--rule);
  }
  .chap{
    background:none;border:0;padding:9px 14px 10px;
    font-family:var(--jp);font-size:13.5px;color:var(--ink-3);
    border-bottom:2px solid transparent;margin-bottom:-1px;
    display:flex;align-items:baseline;gap:9px;
  }
  .chap b{font-weight:700;letter-spacing:.04em}
  .chap i{font-style:normal;font-family:var(--en);font-size:11.5px;opacity:.75;font-variant-numeric:tabular-nums}
  .chap:hover{color:var(--ink-2)}
  .chap[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
  .chap[aria-selected="true"] b{color:var(--red)}

  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:14px}
  .chip-l{
    font-family:var(--en);font-size:13px;font-weight:600;
    font-variant-numeric:tabular-nums;
    padding:5px 11px 6px;
    border:1px solid var(--rule);
    background:var(--panel);
    color:var(--ink-2);
    display:inline-flex;align-items:center;gap:6px;
  }
  .chip-l:hover{border-color:var(--ink-3);color:var(--ink)}
  .chip-l[aria-selected="true"]{
    background:var(--red);border-color:var(--red);color:var(--on-red);
  }
  .chip-l .dot{
    width:5px;height:5px;border-radius:99px;background:var(--red);
    display:none;
  }
  .chip-l.seen .dot{display:block}
  .chip-l[aria-selected="true"] .dot{background:var(--on-red)}

  .lesson-head{
    display:flex;align-items:baseline;gap:14px;flex-wrap:wrap;
    margin-top:22px;padding-bottom:10px;
    border-bottom:1px solid var(--rule);
  }
  .lesson-head .no{
    font-family:var(--en);font-weight:600;font-size:13px;
    letter-spacing:.1em;color:var(--red);text-transform:uppercase;
    font-variant-numeric:tabular-nums;
  }
  .lesson-head .name{
    font-family:var(--mincho);font-weight:600;
    font-size:clamp(18px,2.6vw,24px);letter-spacing:.03em;
  }

  /* ---------- lesson tabs ---------- */
  .tabs{
    display:flex;gap:26px;flex-wrap:wrap;
    margin-top:30px;
    border-bottom:1px solid var(--rule);
  }
  .tab{
    background:none;border:0;padding:0 0 10px;
    font-family:var(--jp);font-size:14px;color:var(--ink-3);
    border-bottom:2px solid transparent;
    margin-bottom:-1px;
    display:flex;align-items:baseline;gap:9px;
  }
  .tab .no{font-family:var(--en);font-weight:600;font-size:15px;font-variant-numeric:tabular-nums}
  .tab:hover{color:var(--ink-2)}
  .tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--red)}
  .tab[aria-selected="true"] .no{color:var(--red)}

  /* ---------- contents ---------- */
  .contents{margin-top:26px}
  .contents h2, .legend h2{
    font-size:11.5px;letter-spacing:.18em;font-weight:700;
    color:var(--ink-3);margin:0 0 10px;
  }
  .topics{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(215px,1fr));
    gap:1px;
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:3px;
    overflow:hidden;
  }
  .topic{
    background:var(--panel);
    outline:1px solid var(--rule);
    padding:11px 14px;
    display:flex;align-items:baseline;gap:10px;
    font-size:13.5px;
  }
  .topic b{
    font-family:var(--en);font-weight:600;color:var(--ink-3);
    font-size:12px;font-variant-numeric:tabular-nums;
  }
  .topic i{
    font-style:normal;color:var(--ink-3);font-family:var(--en);font-size:12.5px;
    display:block;
  }

  /* ---------- toolbar ---------- */
  .toolbar{
    position:sticky;
    top:env(safe-area-inset-top, 0px);
    z-index:5;
    margin-top:26px;
    display:flex;align-items:center;gap:14px;flex-wrap:wrap;
    padding:12px 0;
    background:var(--paper);
    border-bottom:1px solid var(--rule);
  }
  .count{font-size:13px;color:var(--ink-2);font-variant-numeric:tabular-nums;letter-spacing:.03em}
  .count b{color:var(--red);font-family:var(--en);font-size:17px;font-weight:600}
  .track{flex:1 1 140px;min-width:120px;height:4px;border-radius:99px;background:var(--rule-soft);overflow:hidden}
  .track span{display:block;height:100%;width:0;background:var(--red);transition:width .25s ease}
  .tools{display:flex;gap:8px;margin-left:auto}
  button{
    font-family:var(--jp);font-size:13px;cursor:pointer;border-radius:3px;
    transition:background .15s ease,border-color .15s ease,color .15s ease;
  }
  .ghost{background:transparent;border:1px solid var(--rule);color:var(--ink-2);padding:6px 12px}
  .ghost:hover{border-color:var(--ink-3);color:var(--ink)}
  :focus-visible{outline:2px solid var(--red);outline-offset:2px}

  /* ---------- items ---------- */
  .items{display:flex;flex-direction:column;gap:14px;margin-top:22px}
  .items .items{margin-top:0}
  .lesson{display:contents}
  .item{
    display:grid;
    grid-template-columns:minmax(0,1.08fr) minmax(0,.92fr);
    background:var(--panel);
    border:1px solid var(--rule);
    border-radius:4px;
    box-shadow:var(--shadow);
    overflow:hidden;
  }
  .q{padding:20px 22px 18px;display:flex;flex-direction:column;gap:14px}
  .q-head{display:flex;align-items:center;gap:10px}
  .num{
    font-family:var(--en);font-weight:600;font-size:13px;
    font-variant-numeric:tabular-nums;
    width:24px;height:24px;flex:none;
    display:grid;place-items:center;
    border:1px solid var(--rule);border-radius:99px;
    color:var(--ink-2);
  }
  .item.done .num{border-color:var(--red);color:var(--red)}
  .sec{font-size:11.5px;letter-spacing:.1em;color:var(--ink-3)}
  .prompt{margin:0;font-size:14.5px;line-height:1.95}
  .blank{
    display:inline-block;min-width:4.6em;
    border-bottom:1px solid var(--ink-3);
    margin:0 .25em;vertical-align:baseline;
  }
  .blank.ref{min-width:2.4em}
  .ex .blank{min-width:6.5em;border-bottom-color:var(--ink-2);margin-left:0}
  .prompt .pick{
    color:var(--ink);background:var(--panel-2);
    border:1px solid var(--rule-soft);border-radius:2px;
    padding:1px 6px;font-size:13.5px;white-space:nowrap;
  }
  .ex{
    margin:0;padding:12px 14px;
    background:var(--panel-2);
    border-left:2px solid var(--rule);
    display:flex;flex-direction:column;gap:5px;
  }
  .ex p{margin:0;font-family:var(--en);font-size:16px;line-height:1.6}
  .ex .tag{font-family:var(--jp);font-size:12px;color:var(--ink-3);margin-right:.5em}
  .ex .jp{font-family:var(--jp);font-size:13px;color:var(--ink-2)}
  .reveal{
    align-self:flex-start;margin-top:auto;
    background:var(--red);border:1px solid var(--red);color:var(--on-red);
    padding:8px 18px;font-weight:600;letter-spacing:.06em;
  }
  .reveal:hover{filter:brightness(1.06)}
  .item.done .reveal{background:transparent;color:var(--red);border-color:var(--rule)}

  /* ---------- answer ---------- */
  .a{
    border-left:1px solid var(--rule);
    background:var(--panel-2);
    padding:20px 22px;
    display:flex;flex-direction:column;
  }
  .placeholder{
    flex:1;display:grid;place-items:center;
    border:1px dashed var(--rule);border-radius:3px;
    min-height:104px;
    color:var(--ink-3);font-size:12.5px;letter-spacing:.08em;
    background:repeating-linear-gradient(135deg, transparent 0 9px, var(--rule-soft) 9px 10px);
  }
  .answer{animation:rise .22s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  @media (prefers-reduced-motion: reduce){
    .answer{animation:none}
    .track span{transition:none}
  }
  .a-label{
    display:flex;align-items:center;gap:8px;
    font-size:11.5px;letter-spacing:.2em;font-weight:700;
    color:var(--red);margin:0 0 12px;font-family:var(--en);
  }
  .a-label::after{content:"";flex:1;height:1px;background:var(--red);opacity:.3}
  .rows{display:flex;flex-direction:column;gap:9px;margin:0}
  .row{display:grid;grid-template-columns:minmax(0,auto) minmax(0,1fr);gap:4px 14px;align-items:baseline}
  .row dt{font-size:12.5px;color:var(--ink-3)}
  .row dd{margin:0;font-size:15px;color:var(--red-ink);font-weight:500}
  .row dd .en{font-family:var(--en);font-size:16.5px;font-weight:600}
  .note{
    margin:14px 0 0;padding-top:12px;
    border-top:1px solid var(--rule);
    font-size:12.5px;line-height:1.8;color:var(--ink-2);
  }
  .pos{border-bottom:2px solid currentColor;padding-bottom:1px;font-family:var(--en);font-weight:600}
  .n{color:var(--pos-n)} .v{color:var(--pos-v)}
  .adj{color:var(--pos-adj)} .adv{color:var(--pos-adv)}
  .chip{
    display:inline-block;font-family:var(--jp);font-size:11px;font-weight:700;
    letter-spacing:.06em;padding:1px 7px;border-radius:2px;
    border:1px solid currentColor;margin-left:8px;vertical-align:2px;
  }

  /* ---------- 解答入力 ---------- */
  :root{--ok:#1F7A4D;--ok-soft:#E3F3EA}
  :root[data-app-theme="dark"]{--ok:#62CF98;--ok-soft:#173326}
  .bk{
    font:inherit;color:var(--ink);background:var(--panel);
    border:0;border-bottom:1.5px solid var(--ink-3);border-radius:2px 2px 0 0;
    min-width:5.5em;width:6.5em;max-width:100%;padding:1px 6px;margin:0 .2em;
    vertical-align:baseline;outline:none;transition:background .15s,border-color .15s;
  }
  .ex .bk{font-family:var(--en);font-size:16px}
  .jp-bk{font-family:var(--jp);font-size:14px}
  .bk:focus{border-bottom-color:var(--red);background:var(--red-soft)}
  .bk.ok{border-bottom-color:var(--ok);background:var(--ok-soft);color:var(--ok)}
  .bk.ng{border-bottom-color:var(--red);background:var(--red-soft);color:var(--red-ink)}
  .pk{display:inline-flex;align-items:center;gap:4px;margin:0 .25em;vertical-align:baseline;flex-wrap:wrap}
  .pk-s{color:var(--ink-3);font-size:12px}
  .pk-o{font-family:var(--jp);font-size:13px;padding:2px 9px;border:1px solid var(--rule);background:var(--panel-2);color:var(--ink-2);border-radius:99px}
  .pk-o:hover{border-color:var(--ink-3);color:var(--ink)}
  .pk-o[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--panel)}
  .pk-o.ok{background:var(--ok);border-color:var(--ok);color:#fff}
  .pk-o.ng{background:var(--red);border-color:var(--red);color:var(--on-red)}
  .free{font:inherit;font-size:14px;width:100%;padding:8px 10px;border:1px solid var(--rule);border-radius:3px;background:var(--panel);color:var(--ink);resize:vertical}
  .free:focus{outline:none;border-color:var(--red)}
  .actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:auto}
  .check{background:var(--red);border:1px solid var(--red);color:var(--on-red);padding:8px 18px;font-weight:600;letter-spacing:.06em}
  .check:hover{filter:brightness(1.06)}
  .model{background:transparent;border:1px solid var(--rule);color:var(--ink-2);padding:8px 16px;font-weight:600}
  .model:hover{border-color:var(--ink-3);color:var(--ink)}
  .verdict{display:flex;align-items:center;gap:8px 10px;flex-wrap:wrap;font-size:13px;min-height:0}
  .verdict:empty{display:none}
  .v-ok{color:var(--ok);font-weight:700}
  .v-ng{color:var(--red);font-weight:700}
  .v-msg{color:var(--ink-2);font-size:12.5px}
  .self{padding:4px 12px;font-size:12.5px;border:1px solid var(--rule);background:var(--panel);color:var(--ink-2)}
  .self.ok:hover{border-color:var(--ok);color:var(--ok)}
  .self.ng:hover{border-color:var(--red);color:var(--red)}
  .item.ok{border-color:var(--ok)}
  .item.ok .num{border-color:var(--ok);color:var(--ok)}
  .item.ng .num{border-color:var(--red);color:var(--red)}
  .count .graded{color:var(--ink-3);font-size:12px;margin-left:4px}
  .placeholder{text-align:center;line-height:1.7}
  @media (max-width:760px){ .actions button{flex:1} .tools{flex-wrap:wrap} }

  /* ---------- legend ---------- */
  .legend{margin-top:34px;padding-top:22px;border-top:1px solid var(--rule)}
  .keys{display:flex;flex-wrap:wrap;gap:8px 20px;margin:0;padding:0;list-style:none;font-size:13px}
  .keys li{display:flex;align-items:baseline;gap:8px;color:var(--ink-2)}
  .keys .sw{width:16px;height:3px;border-radius:99px;display:inline-block;flex:none}
  footer{margin-top:26px;font-size:12px;color:var(--ink-3);letter-spacing:.04em}

  @media (max-width: 760px){
    .item{grid-template-columns:1fr}
    .a{border-left:0;border-top:1px solid var(--rule)}
    .reveal{width:100%;text-align:center}
    .placeholder{min-height:70px}
    .tabs{gap:18px}
  }
</style>

<div class="wrap">
  <header class="masthead">
    <h1>文法理解度チェックアプリ</h1>
    <p class="sub"><b>英会話のための基本英文法完全マスター</b></p>
    <nav class="chapters" id="chapters" role="tablist" aria-label="章"></nav>
    <div class="chips" id="chips" role="tablist" aria-label="レッスン"></div>
  </header>

  <div class="lesson-head">
    <span class="no" id="lessonNo"></span>
    <span class="name" id="lessonName"></span>
  </div>

  <div class="contents">
    <h2>このレッスンで確認する働き</h2>
    <div class="topics" id="topics"></div>
  </div>

  <div class="toolbar">
    <span class="count">正解 <b id="done">0</b> / <span id="total">0</span> 問<span class="graded">（採点済み <span id="graded">0</span>）</span></span>
    <span class="track"><span id="bar"></span></span>
    <span class="tools">
      <button class="ghost theme-toggle" id="themeToggle" type="button" aria-pressed="false" aria-label="ダークモードに切り替え">
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2v2.2M12 19.8V22M4.9 4.9l1.6 1.6M17.5 17.5l1.6 1.6M2 12h2.2M19.8 12H22M4.9 19.1l1.6-1.6M17.5 6.5l1.6-1.6"/></svg>
        <span id="themeLabel">ダーク</span>
      </button>
      <button class="ghost" id="checkAll" type="button">まとめて採点</button>
      <button class="ghost" id="showAll" type="button">答えをすべて表示</button>
      <button class="ghost" id="hideAll" type="button">答えを隠す</button>
      <button class="ghost" id="resetAll" type="button">リセット</button>
    </span>
  </div>

  <main class="items" id="items"></main>

  <section class="legend">
    <h2>答えの下線の色</h2>
    <ul class="keys">
      <li><span class="sw" style="background:var(--pos-n)"></span>名詞・代名詞（主語になる語）</li>
      <li><span class="sw" style="background:var(--pos-v)"></span>動詞（述部の中心）</li>
      <li><span class="sw" style="background:var(--pos-adj)"></span>形容詞（名詞を修飾）</li>
      <li><span class="sw" style="background:var(--pos-adv)"></span>副詞・副詞句（動詞や形容詞を修飾）</li>
    </ul>
    <footer>空欄に答えを入力（Enter で次の欄へ、最後の欄で答え合わせ）。選択肢はタップで選びます。「答え合わせ」で正誤、「モデルアンサー」で正解が右側に表示されます。訳・説明など自由記述の設問は、モデルアンサーを見て自己採点してください。</footer>
  </section>
</div>

<script>
const LESSONS = [

/* ===== 入力・採点ロジック ===== */
const stripTags = h => String(h).replace(/<[^>]+>/g, " ");
function norm(s){
  return String(s).normalize("NFKC").toLowerCase()
    .replace(/[’‘`´]/g, "'")
    .replace(/[.,!?;:"“”「」『』。、・…()（）\[\]［］→＝=＋+\/|]/g, " ")
    .replace(/[-–—~〜]/g, " ")
    .replace(/\s+/g, " ").trim();
}
const isJa = s => /[^\x00-\x7f]/.test(s);
const squash = s => s.replace(/\s/g, "");

// 設問ごとのモデルアンサーの文字列プール
const POOL = LESSONS.map(L => L.items.map(it => {
  const parts = [];
  it.rows.forEach(r => {
    parts.push(stripTags(r[1]));
    const dt = stripTags(r[0]).trim();
    if (dt.length < 10 && /\d/.test(dt) && !/[a-z]/i.test(dt)) parts.push(dt);
  });
  const p = norm(parts.join(" | "));
  return { sp: " " + p + " ", sq: squash(p) };
}));

function textMatch(ans, pool){
  const a = norm(ans);
  if (!a) return false;
  if (isJa(a)) return pool.sq.includes(squash(a));
  return pool.sp.includes(" " + a + " ");
}

// 自動判定が難しい選択肢の正解（null は自己採点）
const PICK_FIX = { "1-5#1": [0, 1, null], "1-9#8": [0] };
// 選択肢（A / B）の正解をモデルアンサーから順番に割り出す
function solvePicks(li, i){
  const it = LESSONS[li].items[i];
  const html = it.prompt + it.ex.map(e => (e.s || "") + (e.j || "")).join("");
  const groups = [...html.matchAll(/<span class="pick">([\s\S]*?)<\/span>/g)].map(m => stripTags(m[1]).split("/").map(s => s.trim()));
  const fix = PICK_FIX[LESSONS[li].id + "#" + (i + 1)];
  if (fix) return fix;
  const pool = POOL[li][i].sq;
  let cur = 0;
  return groups.map(opts => {
    const hits = opts.map((o, oi) => ({ oi, at: pool.indexOf(squash(norm(o)), cur), len: squash(norm(o)).length }))
      .filter(h => h.at >= 0)
      .sort((a, b) => a.at - b.at || b.len - a.len);
    if (!hits.length) return null;
    // 選択肢が1組だけで、両方の語が別々に答えに出る場合は自動採点しない
    if (groups.length === 1 && hits.length > 1) {
      const a = hits[0], b = hits[1];
      const overlap = b.at < a.at + a.len;
      if (!overlap || pool.indexOf(squash(norm(opts[b.oi])), a.at + a.len) >= 0) return null;
    }
    cur = hits[0].at + hits[0].len;
    return hits[0].oi;
  });
}

let bkSeq = 0;
function inputs(html, cls){
  return String(html)
    .replace(/<span class="blank"><\/span>|（　　）/g, () =>
      '<input class="bk' + (cls ? " " + cls : "") + '" type="text" autocomplete="off" autocapitalize="off" spellcheck="false" aria-label="解答欄" data-b="' + (bkSeq++) + '">')
    .replace(/<span class="pick">([\s\S]*?)<\/span>/g, (m, inner) =>
      '<span class="pk" role="group">' + stripTags(inner).split("/").map((o, oi) =>
        '<button type="button" class="pk-o" aria-pressed="false" data-o="' + oi + '">' + o.trim() + '</button>').join('<span class="pk-s">/</span>') + '</span>');
}

function setModel(k, open){
  const item = document.getElementById("item-" + k);
  const btn = item.querySelector('[data-act="model"]');
  const ans = document.getElementById("ans-" + k);
  document.getElementById("ph-" + k).hidden = open;
  ans.hidden = !open;
  btn.textContent = open ? "モデルアンサーを隠す" : "モデルアンサー";
  btn.setAttribute("aria-expanded", String(open));
  if (open) { ans.style.animation = "none"; void ans.offsetWidth; ans.style.animation = ""; }
  // 自動採点できない設問は、モデルアンサーを見てから自己採点
  if (open && isSelfOnly(k) && !STATE[k]) showSelf(k);
}

function isSelfOnly(k){
  const item = document.getElementById("item-" + k);
  const gradablePicks = (PICKS[k] || []).some(v => v !== null);
  return !item.querySelector(".bk") && !gradablePicks;
}

function setState(k, s){
  STATE[k] = s;
  const item = document.getElementById("item-" + k);
  item.classList.toggle("done", !!s);
  item.classList.toggle("ok", s === "ok");
  item.classList.toggle("ng", s === "ng");
  tally();
}

function showSelf(k, lead){
  document.getElementById("vd-" + k).innerHTML =
    (lead ? '<span class="v-msg">' + lead + '</span>' : '<span class="v-msg">モデルアンサーと比べて自己採点：</span>') +
    '<button type="button" class="self ok" data-act="selfok">○ できた</button>' +
    '<button type="button" class="self ng" data-act="selfng">✕ まだ</button>';
}

function check(k){
  const item = document.getElementById("item-" + k);
  const [li, i] = k.split("-").map(Number);
  const pool = POOL[li][i];
  if (isSelfOnly(k)) {
    setModel(k, true);
    showSelf(k);
    return;
  }
  let total = 0, right = 0, empty = 0;
  item.querySelectorAll(".bk").forEach(inp => {
    total++;
    const v = inp.value.trim();
    if (!v) empty++;
    const ok = textMatch(v, pool);
    inp.classList.toggle("ok", ok);
    inp.classList.toggle("ng", !ok);
    if (ok) right++;
  });
  item.querySelectorAll(".pk").forEach((g, gi) => {
    const ans = PICKS[k][gi];
    const opts = g.querySelectorAll(".pk-o");
    opts.forEach(o => o.classList.remove("ok", "ng", "is-ans"));
    if (ans === null || ans === undefined) return;
    total++;
    const sel = g.querySelector('.pk-o[aria-pressed="true"]');
    if (!sel) empty++;
    if (sel && Number(sel.dataset.o) === ans) { right++; sel.classList.add("ok"); }
    else if (sel) sel.classList.add("ng");
  });
  const vd = document.getElementById("vd-" + k);
  if (right === total) {
    vd.innerHTML = '<span class="v-ok">◎ 正解！</span>';
    setState(k, "ok");
  } else {
    vd.innerHTML = '<span class="v-ng">△ ' + right + ' / ' + total + ' 正解</span>' +
      '<span class="v-msg">' + (empty ? '空欄があります。' : '') + '赤い欄を見直すか「モデルアンサー」で確認。言い方が違うだけなら →</span>' +
      '<button type="button" class="self ok" data-act="selfok">正解にする</button>';
    setState(k, "ng");
  }
}

function clearItem(k){
  const item = document.getElementById("item-" + k);
  item.querySelectorAll(".bk").forEach(inp => { inp.value = ""; inp.classList.remove("ok", "ng"); grow(inp); });
  item.querySelectorAll(".pk-o").forEach(o => { o.setAttribute("aria-pressed", "false"); o.classList.remove("ok", "ng"); });
  const f = item.querySelector(".free"); if (f) f.value = "";
  document.getElementById("vd-" + k).innerHTML = "";
  setModel(k, false);
  setState(k, undefined);
}

function grow(inp){
  const n = Math.max(inp.value.length, 0);
  const ja = isJa(inp.value);
  inp.style.width = n ? "calc(" + (ja ? n * 1.05 : n * 0.58) + "em + 22px)" : "";
}

function tally(){
  const total = LESSONS[active].items.length;
  let ok = 0, done = 0;
  for (let i = 0; i < total; i++) {
    const s = STATE[active + "-" + i];
    if (s) done++;
    if (s === "ok") ok++;
  }
  doneEl.textContent = ok;
  totalEl.textContent = total;
  document.getElementById("graded").textContent = done;
  barEl.style.width = (ok / total * 100) + "%";
  const chip = document.getElementById("chip-" + active);
  if (chip) chip.classList.toggle("seen", ok === total);
}

function lessonDone(li){
  return LESSONS[li].items.every((_, i) => STATE[li + "-" + i] === "ok");
}

function renderChips(){
  chipsEl.innerHTML = LESSONS.map((L, li) => {
    if (chapterOf(L.id) !== activeCh) return "";
    return '<button class="chip-l' + (lessonDone(li) ? " seen" : "") + '" type="button" role="tab"' +
      ' id="chip-' + li + '" data-l="' + li + '" aria-selected="' + (li === active) + '"' +
      ' title="' + L.label + '"><span class="dot"></span>' + L.id + '</button>';
  }).join("");
}

function selectLesson(li){
  active = li;
  activeCh = chapterOf(LESSONS[li].id);
  LESSONS.forEach((L, i) => {
    document.getElementById("lesson-" + i).hidden = (i !== li);
  });
  CHAPTERS.forEach(c =>
    document.getElementById("chap-" + c.no).setAttribute("aria-selected", String(c.no === activeCh))
  );
  renderChips();
  lessonNoEl.textContent = "Lesson " + LESSONS[li].id;
  lessonNameEl.textContent = LESSONS[li].label;
  topicsEl.innerHTML = LESSONS[li].topics.map((t, i) =>
    '<div class="topic"><b>' + (i + 1) + '</b><span>' + t + '</span></div>'
  ).join("");
  tally();
}

chaptersEl.addEventListener("click", e => {
  const c = e.target.closest(".chap");
  if (!c) return;
  const first = LESSONS.findIndex(L => chapterOf(L.id) === c.dataset.ch);
  if (first >= 0) selectLesson(first);
});

chipsEl.addEventListener("click", e => {
  const t = e.target.closest(".chip-l");
  if (t) selectLesson(Number(t.dataset.l));
});

list.addEventListener("click", e => {
  const pk = e.target.closest(".pk-o");
  if (pk) {
    pk.closest(".pk").querySelectorAll(".pk-o").forEach(o => {
      o.setAttribute("aria-pressed", String(o === pk));
      o.classList.remove("ok", "ng");
    });
    return;
  }
  const b = e.target.closest("[data-act]");
  if (!b) return;
  const k = b.closest(".item").dataset.k;
  const act = b.dataset.act;
  if (act === "check") check(k);
  else if (act === "model") setModel(k, document.getElementById("ans-" + k).hidden);
  else if (act === "selfok") { setState(k, "ok"); document.getElementById("vd-" + k).innerHTML = '<span class="v-ok">◎ 正解として記録しました</span>'; }
  else if (act === "selfng") { setState(k, "ng"); document.getElementById("vd-" + k).innerHTML = '<span class="v-ng">✕ もう一度チャレンジしよう</span>'; }
});

list.addEventListener("input", e => {
  if (e.target.classList.contains("bk")) {
    e.target.classList.remove("ok", "ng");
    grow(e.target);
  }
});

// Enter で答え合わせ（日本語変換中の Enter は無視）
list.addEventListener("keydown", e => {
  if (e.key !== "Enter" || e.isComposing || e.keyCode === 229) return;
  if (!e.target.classList.contains("bk")) return;
  e.preventDefault();
  const item = e.target.closest(".item");
  const all = [...item.querySelectorAll(".bk")];
  const next = all[all.indexOf(e.target) + 1];
  if (next) next.focus(); else check(item.dataset.k);
});

document.getElementById("showAll").addEventListener("click", () => {
  LESSONS[active].items.forEach((_, i) => setModel(active + "-" + i, true));
});
document.getElementById("hideAll").addEventListener("click", () => {
  LESSONS[active].items.forEach((_, i) => setModel(active + "-" + i, false));
});
document.getElementById("checkAll").addEventListener("click", () => {
  LESSONS[active].items.forEach((_, i) => { const k = active + "-" + i; if (!isSelfOnly(k)) check(k); });
});
document.getElementById("resetAll").addEventListener("click", () => {
  { const rb = document.getElementById("resetAll"); if (!rb.dataset.armed) { rb.dataset.armed = "1"; const t = rb.textContent; rb.textContent = "もう一度押すと消去"; setTimeout(() => { delete rb.dataset.armed; rb.textContent = t; }, 3000); return; } delete rb.dataset.armed; rb.textContent = "リセット"; }
  LESSONS[active].items.forEach((_, i) => clearItem(active + "-" + i));
});

selectLesson(0);

/* ---------- theme toggle (初期表示はライト) ---------- */
(function(){
  const root=document.documentElement, btn=document.getElementById('themeToggle'), label=document.getElementById('themeLabel');
  function apply(dark){
    if(dark) root.setAttribute('data-app-theme','dark'); else root.removeAttribute('data-app-theme');
    btn.setAttribute('aria-pressed', dark?'true':'false');
    btn.setAttribute('aria-label', dark?'ライトモードに切り替え':'ダークモードに切り替え');
    label.textContent = dark?'ライト':'ダーク';
  }
  apply(false);
  btn.addEventListener('click',()=>apply(root.getAttribute('data-app-theme')!=='dark'));
})();
</script>
